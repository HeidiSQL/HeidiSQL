category=Metadata Functions
description=Returns: int\n\nReturns the schema ID associated with a schema name.\n\nDatabase schemas act as namespaces or containers for objects, such as tables,\nviews, procedures, and functions, that can be found in the sys.objects catalog\nview.\n\nEach schema has an owner. The owner is a security principal.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/schema-id-transact-sql
[SCHEMA_NAME]
