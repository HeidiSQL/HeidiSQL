category=Security Functions
description=Returns: varbinary\n\nThis function returns the public portion of a certificate in binary format. This\nfunction takes a certificate ID as an argument, and returns the encoded\ncertificate. To create a new certificate, pass the binary result to CREATE\nCERTIFICATE ... WITH BINARY.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/certencoded-transact-sql
[CERTPRIVATEKEY]
declaration=cert_ID , ' encryption_password ' [ , ' decryption_password ' ]
category=Security Functions
description=Returns: varbinary\n\nThis function returns the private key of a certificate in binary format. This\nfunction takes three arguments. - A certificate ID. - An encryption password,\nused to encrypt the private key bits returned by the function. This approach\ndoes not expose the keys as clear text to users. - An optional decryption\npassword. A specified decryption password is used to decrypt the private key of\nthe certificate. Otherwise, the database master key is used.\n\nOnly users with access to the certificate private key can use this function.\nThis function returns the private key in PVK format.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/certprivatekey-transact-sql
