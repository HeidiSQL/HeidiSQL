[SCOPE_IDENTITY]
declaration=
category=Metadata Functions
description=Returns: numeric(38,0)\n\nReturns the last identity value inserted into an identity column in the same\nscope. A scope is a module: a stored procedure, trigger, function, or batch.\nTherefore, if two statements are in the same stored procedure, function, or\nbatch, they are in the same scope.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/scope-identity-transact-sql
[SERVERPROPERTY]
