description=The returned data type for DATETRUNC is dynamic. DATETRUNC returns a truncated\ndate of the same data type (and, if applicable, the same fractional time scale)\nas the input date. For example, if DATETRUNC was given a datetimeoffset(3) input\ndate, it would return a datetimeoffset(3). If it was given a string literal that\ncould resolve to a datetime2(7), DATETRUNC would return a datetime2(7).\n\nThe DATETRUNC function returns an input date truncated to a specified datepart.\n\nDATETRUNC was introduced in .\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/datetrunc-transact-sql
[DATE_BUCKET]
