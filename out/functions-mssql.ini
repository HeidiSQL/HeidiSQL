[DATEADD]
declaration=datepart , number , date
category=Date and Time Functions
description=The return value data type for this method is dynamic. The return type depends\non the argument supplied for date. If the value for date is a string literal\ndate, DATEADD returns a datetime value. If another valid input data type is\nsupplied for date, DATEADD returns the same data type. DATEADD raises an error\nif the string literal seconds scale exceeds three decimal place positions (.nnn)\nor if the string literal contains the time zone offset part.\n\nThis function adds a number (a signed integer) to a datepart of an input date,\nand returns a modified date/time value. For example, you can use this function\nto find the date that is 7,000 minutes from today: number = 7000, datepart =\nminute, date = today.\n\nThis function adds a number (a signed bigint) to a datepart of an input date,\nand returns a modified date/time value. For example, you can use this function\nto find the date that is 7,000 minutes from today: number = 7000, datepart =\nminute, date = today.\n\nSee Date and time data types and functions for an overview of all date and time\ndata types and functions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/dateadd-transact-sql
[DATEDIFF]
