category=Aggregate Functions
description=Returns: - Returns int NOT NULL when ANSI_WARNINGS is ON. However, SQL Server\nalways treats COUNT expressions as int NULL in metadata, unless wrapped in\nISNULL.\n\nThis function returns the number of items found in a group. COUNT operates like\nthe COUNT_BIG function. These functions differ only in the data types of their\nreturn values. COUNT always returns an int data type value. COUNT_BIG always\nreturns a bigint data type value.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/count-transact-sql
