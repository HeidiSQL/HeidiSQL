[UNISTR]
declaration='character_expression' [ , 'unicode_escape_character' ]
category=String Functions
since=17
description=Returns: A string value whose length and type depend on the input types.\n\nUNISTR provides support for Unicode string literals by letting you specify the\nUnicode encoding value of characters in the string. UNISTR returns the Unicode\ncharacters corresponding to the input expression, as defined by the Unicode\nstandard.\n\nThe escape sequence for a Unicode character can be specified in the form of\n\xxxx or \+xxxxxx, where xxxx is a valid UTF-16 codepoint value, and xxxxxx is a\nvalid Unicode codepoint value. You can look up Unicode codepoint values in the\nUnicode Code Charts.\n\nCompared to functions like NCHAR, UNISTR provides a more flexible and\ncomprehensive way to handle Unicode characters. For example, while NCHAR can\nconvert a single Unicode value to a character, UNISTR handles multiple Unicode\nvalues and escape sequences, making it easier to work with complex strings that\ninclude various Unicode characters.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/unistr-transact-sql
