category=Metadata Functions
description=Returns: sysname\n\nReturns the database object name for schema-scoped objects. For a list of\nschema-scoped objects, see sys.objects (Transact-SQL).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/object-name-transact-sql
[OBJECT_SCHEMA_NAME]
