description=Returns the following data types.\n\nReturns a numeric value, rounded to the specified length or precision.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/round-transact-sql
[ROWCOUNT_BIG]
declaration=
category=System Functions
description=Returns: bigint\n\nReturns the number of rows affected by the last statement executed. This\nfunction operates like @@ROWCOUNT, except the return type of ROWCOUNT_BIG is\nbigint.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/rowcount-big-transact-sql
[ROW_NUMBER]
declaration=
category=Ranking Functions
description=Returns: bigint\n\nNumbers the output of a result set. More specifically, returns the sequential\nnumber of a row within a partition of a result set, starting at 1 for the first\nrow in each partition.\n\nROW_NUMBER and RANK are similar. ROW_NUMBER numbers all rows sequentially (for\nexample 1, 2, 3, 4, 5). RANK provides the same numeric value for ties (for\nexample 1, 2, 2, 4, 5).\n\nROW_NUMBER is a temporary value calculated when the query is run. To persist\nnumbers in a table, see IDENTITY Property and SEQUENCE.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/row-number-transact-sql
[RTRIM1]
name=RTRIM
declaration=character_expression
category=String Functions
description=Returns a character expression with a type of string argument where the space\ncharacter char(32) or other specified characters are removed from the end of a\ncharacter_expression. Returns NULL if input string is NULL.\n\nReturns a character string after truncating all trailing spaces.\n\nRemoves space character char(32) or other specified characters from the end of a\nstring.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/rtrim-transact-sql
[RTRIM2]
