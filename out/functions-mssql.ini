category=Security Functions
description=Returns information about login policy settings.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/loginproperty-transact-sql
[LOWER]
declaration=character_expression
category=String Functions
description=Returns: varchar or nvarchar\n\nReturns a character expression after converting uppercase character data to\nlowercase.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/lower-transact-sql
[LTRIM1]
name=LTRIM
declaration=character_expression
category=String Functions
description=Returns a character expression with a type of string argument where the space\ncharacter char(32) or other specified characters are removed from the beginning\nof a character_expression. Returns NULL if input string is NULL.\n\nReturns a character string after truncating all leading spaces.\n\nRemoves space character char(32) or other specified characters from the start of\na string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ltrim-transact-sql
[LTRIM2]
name=LTRIM
declaration=character_expression , [ characters ]
category=String Functions
description=Returns a character expression with a type of string argument where the space\ncharacter char(32) or other specified characters are removed from the beginning\nof a character_expression. Returns NULL if input string is NULL.\n\nReturns a character string after truncating all leading spaces.\n\nRemoves space character char(32) or other specified characters from the start of\na string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ltrim-transact-sql
[MAX1]
name=MAX
declaration=[ ALL ] expression
category=Aggregate Functions
description=Returns a value same as expression.\n\nReturns the maximum of all values of the specified expression in a group. Can be\nfollowed by the OVER clause.\n\nTo get the maximum of all values of multiple expressions inline, see Logical\nfunctions - GREATEST.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/max-transact-sql
[MAX2]
name=MAX
declaration=[ ALL | DISTINCT ] expression
category=Aggregate Functions
description=Returns a value same as expression.\n\nReturns the maximum of all values of the specified expression in a group. Can be\nfollowed by the OVER clause.\n\nTo get the maximum of all values of multiple expressions inline, see Logical\nfunctions - GREATEST.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/max-transact-sql
[MIN1]
