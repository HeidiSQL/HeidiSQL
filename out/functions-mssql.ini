[IDENTITY2]
name=IDENTITY
declaration=data_type [ , seed , increment ]
category=Other Functions
description=Returns the same as data_type.\n\nUse IDENTITY only in a SELECT statement with an INTO table clause to add an\nidentity column to a new table. Although similar, the IDENTITY function isn't\nthe same as the IDENTITY property that you use with CREATE TABLE and ALTER\nTABLE.\n\nTo create an automatically incrementing number that you can use in multiple\ntables or call from applications without referencing any table, see Sequence\nNumbers.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/identity-function-transact-sql
[IDENT_CURRENT]
declaration='table_or_view'
category=Data Type Functions
description=Returns: numeric(@@MAXPRECISION,0))\n\nThe IDENT_CURRENT system function returns the last identity value generated for\na specified table or view. The last identity value generated can be for any\nsession and any scope.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ident-current-transact-sql
[IDENT_INCR]
declaration='table_or_view'
category=Data Type Functions
description=Returns: numeric(@@MAXPRECISION,0))\n\nThe IDENT_INCR system function returns the increment value specified when\ncreating a table or view's identity column.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ident-incr-transact-sql
[IDENT_SEED]
declaration='table_or_view'
category=Data Type Functions
description=Returns: numeric(@@MAXPRECISION,0))\n\nThe IDENT_SEED system function returns the original seed value specified when\ncreating an identity column in a table or a view. Changing the current value of\nan identity column by using DBCC CHECKIDENT doesn't change the value returned by\nthis function.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ident-seed-transact-sql
[IIF]
declaration=boolean_expression, true_value, false_value
category=Logical Functions
description=Returns the data type with the highest precedence from the types in true_value\nand false_value. For more information, see Data Type Precedence (Transact-SQL).\n\nReturns one of two values, depending on whether the Boolean expression evaluates\nto true or false in .\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/logical-functions-iif-transact-sql
[INDEXKEY_PROPERTY]
declaration=object_ID ,index_ID ,key_ID ,property
category=Metadata Functions
description=Returns: int\n\nReturns information about the index key. Returns NULL for XML indexes.\n\nInstead, use sys.index_columns (Transact-SQL).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/indexkey-property-transact-sql
[INDEXPROPERTY]
declaration=object_ID , index_or_statistics_name , property
category=Metadata Functions
description=Returns: int\n\nReturns the named index or statistics property value of a specified table\nidentification number, index or statistics name, and property name. Returns NULL\nfor XML indexes.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/indexproperty-transact-sql
[INDEX_COL]
declaration='[ database_name . [ schema_name ] .| schema_name ] table_or_view_name', index_id , key_id
category=Metadata Functions
description=Returns: nvarchar (128 )\n\nReturns the indexed column name. Returns NULL for XML indexes.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/index-col-transact-sql
[ISDATE]
declaration=expression
category=Date and Time Functions
description=Returns: int\n\nReturns 1 if the expression is a valid datetime value; otherwise, 0.\n\nISDATE returns 0 if the expression is a datetime2 value.\n\nFor an overview of all date and time data types and functions, see Date and Time\nData Types and Functions (Transact-SQL). Note that the range for datetime data\nis 1753-01-01 through 9999-12-31, while the range for date data is 0001-01-01\nthrough 9999-12-31.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/isdate-transact-sql
[ISJSON]
declaration=expression [, json_type_constraint]
category=JSON Functions
description=The ISJSON syntax tests whether a string contains valid JSON.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/isjson-transact-sql
[ISNULL]
declaration=check_expression , replacement_value
category=System Functions
description=Returns the same type as check_expression. If a literal NULL is provided as\ncheck_expression, ISNULL returns the data type of the replacement_value. If a\nliteral NULL is provided as check_expression and no replacement_value is\nprovided, ISNULL returns an int.\n\nReplaces NULL with the specified replacement value.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/isnull-transact-sql
[ISNUMERIC]
declaration=expression
category=System Functions
description=Returns: int\n\nDetermines whether an expression is a valid numeric type.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/isnumeric-transact-sql
[IS_MEMBER]
declaration={ 'group' | 'role' }
category=Security Functions
description=Returns: int\n\nIndicates whether the current user is a member of the specified Windows group,\nMicrosoft Entra group, or database role.\n\nThe IS_MEMBER function is supported for Microsoft Entra groups. The one case\nwhere IS_MEMBER doesn't work is if the group is the Microsoft Entra\nadministrator for the SQL instance.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/is-member-transact-sql
[IS_OBJECTSIGNED]
declaration='OBJECT', @object_id, @class, @thumbprint
category=Cryptographic Functions
description=Indicates whether an object is signed by a specified certificate or asymmetric\nkey.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/is-objectsigned-transact-sql
[IS_ROLEMEMBER]
declaration='role' [ , 'database_principal' ]
category=Security Functions
description=Returns: int\n\nIndicates whether a specified database principal is a member of the specified\ndatabase role.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/is-rolemember-transact-sql
[IS_SRVROLEMEMBER]
declaration='role' [ , 'login' ]
category=Security Functions
description=Returns: int\n\nIndicates whether a login is a member of the specified server role.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/is-srvrolemember-transact-sql
[JARO_WINKLER_DISTANCE]
declaration=character_expression , character_expression
category=String Functions
description=Calculates the edit distance between two strings giving preference to strings\nthat match from the beginning for a set prefix length.\n\n- JARO_WINKLER_DISTANCE is currently in preview in . - JARO_WINKLER_DISTANCE is\navailable in Azure SQL Managed Instance with the SQL Server 2025 or\nAlways-up-to-date update policy.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/jaro-winkler-distance-transact-sql
[JARO_WINKLER_SIMILARITY]
declaration=character_expression , character_expression
category=String Functions
description=Calculates a similarity value ranging from 0 (indicating no match) to 100\n(indicating full match).\n\n- JARO_WINKLER_SIMILARITY is currently in preview in . - JARO_WINKLER_SIMILARITY\nis available in Azure SQL Managed Instance with the SQL Server 2025 or\nAlways-up-to-date update policy.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/jaro-winkler-similarity-transact-sql
[JSON_ARRAY]
declaration=[ <json_array_value> [ , ...n ] ] [ <json_null_clause> ] [ RETURNING json ]
category=JSON Functions
since=16
description=Constructs JSON array text from zero or more expressions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-array-transact-sql
[JSON_ARRAYAGG]
declaration=value_expression [ order_by_clause ] [ json_null_clause ] [ RETURNING json ]
category=JSON Functions
since=17
description=Constructs a JSON array from an aggregation of SQL data or columns.\nJSON_ARRAYAGG can also be used in a SELECT statement with GROUP BY GROUPING SETS\nclause.\n\nTo create a JSON object from an aggregate instead, use JSON_OBJECTAGG.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-arrayagg-transact-sql
[JSON_CONTAINS]
declaration=target_expression , search_value_expression [ , path_expression ] [ , search_mode ]
category=JSON Functions
since=17
description=Searches for a SQL value in a path in a JSON document.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-contains-transact-sql
[JSON_MODIFY]
declaration=expression , path , newValue
category=JSON Functions
description=The JSON_MODIFY syntax updates the value of a property in a JSON string and\nreturns the updated JSON string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-modify-transact-sql
[JSON_OBJECT]
declaration=[ <json_key_value> [ , ...n ] ] [ json_null_clause ] [ RETURNING json ]
category=JSON Functions
since=16
description=The JSON_OBJECT syntax constructs JSON object text from zero or more\nexpressions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-object-transact-sql
[JSON_OBJECTAGG]
declaration=json_key_value [ json_null_clause ] [ RETURNING JSON ]
category=JSON Functions
since=17
description=The JSON_OBJECTAGG syntax constructs a JSON object from an aggregation of SQL\ndata or columns. JSON_OBJECTAGG can also be used in a SELECT statement with\nGROUP BY GROUPING SETS clause.\n\nThe key/value pairs can be specified as input values, column, variable\nreferences.\n\nTo create a JSON array from an aggregate instead, use JSON_ARRAYAGG.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-objectagg-transact-sql
[JSON_PATH_EXISTS]
declaration=value_expression , sql_json_path
category=JSON Functions
since=16
description=The JSON_PATH_EXISTS syntax tests whether a specified SQL/JSON path exists in\nthe input JSON string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-path-exists-transact-sql
[JSON_QUERY]
declaration=expression [ , path ] [ WITH ARRAY WRAPPER ]
category=JSON Functions
description=The JSON_QUERY syntax extracts an object or an array from a JSON string.\n\nTo extract a scalar value from a JSON string instead of an object or an array,\nsee JSON_VALUE. For info about the differences between JSON_VALUE and\nJSON_QUERY, see Compare JSON_VALUE and JSON_QUERY.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-query-transact-sql
[JSON_VALUE1]
name=JSON_VALUE
declaration=expression , path
category=JSON Functions
description=Use the JSON_VALUE syntax to extract a scalar value from a JSON string.\n\nTo extract an object or an array from a JSON string instead of a scalar value,\nsee JSON_QUERY. For info about the differences between JSON_VALUE and\nJSON_QUERY, see Compare JSON_VALUE and JSON_QUERY.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-value-transact-sql
[JSON_VALUE2]
name=JSON_VALUE
declaration=expression , path [ RETURNING data_type ]
category=JSON Functions
description=Use the JSON_VALUE syntax to extract a scalar value from a JSON string.\n\nTo extract an object or an array from a JSON string instead of a scalar value,\nsee JSON_QUERY. For info about the differences between JSON_VALUE and\nJSON_QUERY, see Compare JSON_VALUE and JSON_QUERY.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/json-value-transact-sql
[KEY_GUID]
declaration='Key_Name'
category=Cryptographic Functions
description=Returns: uniqueidentifier\n\nReturns the GUID of a symmetric key in the database.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/key-guid-transact-sql
[KEY_ID]
declaration='Key_Name'
category=Cryptographic Functions
description=Returns: int\n\nReturns the ID of a symmetric key in the current database.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/key-id-transact-sql
[KEY_NAME]
declaration=ciphertext | key_guid
category=Cryptographic Functions
description=Returns the name of the symmetric key from either a symmetric key GUID or cipher\ntext.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/key-name-transact-sql
[LAG]
declaration=scalar_expression [ , offset ] [ , default ]
category=Analytic Functions
description=Returns: The data type of the specified scalar_expression. NULL is returned if\nscalar_expression is nullable or default is set to NULL.\n\nAccesses data from a previous row in the same result set without the use of a\nself-join starting with . LAG provides access to a row at a given physical\noffset that comes before the current row. Use this analytic function in a SELECT\nstatement to compare values in the current row with values in a previous row.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/lag-transact-sql
[LAST_VALUE]
declaration=[ scalar_expression ]
category=Analytic Functions
description=Returns: The same type as scalar_expression.\n\nReturns the last value in an ordered set of values.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/last-value-transact-sql
[LEAD]
declaration=scalar_expression [ , offset ] [ , default ]
category=Analytic Functions
description=Returns: The data type of the specified scalar_expression. NULL is returned if\nscalar_expression is nullable or default is set to NULL.\n\nAccesses data from a subsequent row in the same result set without the use of a\nself-join starting with . LEAD provides access to a row at a given physical\noffset that follows the current row. Use this analytic function in a SELECT\nstatement to compare values in the current row with values in a following row.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/lead-transact-sql
[LEAST]
declaration=expression1 [ , ...expressionN ]
category=Logical Functions
since=16
description=Returns the data type with the highest precedence from the set of types passed\nto the function. For more information, see Data Type Precedence (Transact-SQL).\n\nThis function returns the minimum value from a list of one or more expressions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/logical-functions-least-transact-sql
[LEFT]
declaration=character_expression , integer_expression
category=String Functions
description=Returns varchar when character_expression is a non-Unicode character data type.\n\nReturns the left part of a character string with the specified number of\ncharacters.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/left-transact-sql
[LEFT_SHIFT]
declaration=expression_value , shift_amount
category=Bit Manipulation Functions
since=16
description=Returns the same type as expression_value.\n\nLEFT_SHIFT takes two parameters, and returns the first parameter bit-shifted\nleft by the number of bits specified in the second parameter.\n\nThe LEFT_SHIFT function is also accessible through the << operator.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/left-shift-transact-sql
[LEN]
declaration=string_expression
category=String Functions
description=Returns: bigint if expression is of the varchar(max), nvarchar(max), or\nvarbinary(max) data types; otherwise, int.\n\nReturns the number of characters of the specified string expression, excluding\ntrailing spaces.\n\nTo return the number of bytes used to represent an expression, use the\nDATALENGTH function.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/len-transact-sql
[LOG1]
name=LOG
declaration=float_expression
category=Mathematical Functions
description=Returns: float\n\nReturns the natural logarithm of the specified float expression in .\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/log-transact-sql
[LOG2]
name=LOG
declaration=float_expression [, base ]
category=Mathematical Functions
description=Returns: float\n\nReturns the natural logarithm of the specified float expression in .\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/log-transact-sql
[LOG10]
declaration=float_expression
category=Mathematical Functions
description=Returns: float\n\nReturns the base-10 logarithm of the specified float expression.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/log10-transact-sql
[LOGINPROPERTY]
