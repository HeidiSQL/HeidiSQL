description=Returns: varbinary, with a maximum size of 8,000 bytes.\n\nThis function decrypts encrypted data. It first decrypts a symmetric key with a\nseparate asymmetric key, and then decrypts the encrypted data with the symmetric\nkey extracted in the first step.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/decryptbykeyautoasymkey-transact-sql
