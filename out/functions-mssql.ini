[AI_GENERATE_CHUNKS]
declaration=SOURCE = text_expression , CHUNK_TYPE = FIXED [ , CHUNK_SIZE = numeric_expression ] [ , OVERLAP = numeric_expression ] [ , ENABLE_CHUNK_SET_ID = numeric_expression ]
category=AI Functions
since=17
description=Returns: AI_GENERATE_CHUNKS returns a table with the following columns:\n\nAI_GENERATE_CHUNKS is a table-valued function that creates chunks, or fragments\nof text based on a type, size, and source expression.\n\nAI_GENERATE_CHUNKS is available in with the SQL Server 2025 or Always-up-to-date\nupdate policy.\n\nAI_GENERATE_CHUNKS requires the compatibility level to be at least 170. When the\nlevel is less than 170, the is unable to find the AI_GENERATE_CHUNKS function.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-chunks-transact-sql
[AI_GENERATE_EMBEDDINGS]
