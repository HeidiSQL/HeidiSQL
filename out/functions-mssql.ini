category=AI Functions
since=17
description=Returns: AI_GENERATE_EMBEDDINGS returns a single-column table whose rows are the\ngenerated embedding vector arrays returned as JSON.\n\nThe AI_GENERATE_EMBEDDINGS function creates embeddings (vector arrays) by using\na precreated AI model definition stored in the database.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ai-generate-embeddings-transact-sql
[APPLOCK_MODE]
declaration='database_principal' , 'resource_name' , 'lock_owner'
category=Metadata Functions
description=Returns: nvarchar(32)\n\nThis function returns the lock mode held by the lock owner on a particular\napplication resource. As an application lock function, APPLOCK_MODE operates on\nthe current database. The database is the scope of the application locks.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/applock-mode-transact-sql
[APPLOCK_TEST]
declaration='database_principal' , 'resource_name' , 'lock_mode' , 'lock_owner'
category=Metadata Functions
description=Returns: smallint\n\nThis function returns information as to whether or not a lock can be granted on\na particular application resource, for a specified lock owner, without\nacquisition of the lock. As an application lock function, APPLOCK_TEST operates\non the current database. The database is the scope of the application locks.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/applock-test-transact-sql
[APPROX_COUNT_DISTINCT]
declaration=expression
category=Aggregate Functions
description=Returns: bigint\n\nThis function returns the approximate number of unique non-null values in a\ngroup.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/approx-count-distinct-transact-sql
[APPROX_PERCENTILE_CONT]
declaration=numeric_literal
category=Aggregate Functions
description=Returns: float(53)\n\nThis function returns an approximate interpolated value from the set of values\nin a group based on percentile value and sort specification. Since this is an\napproximate function, the output would be within rank based error bound with\ncertain confidence. The percentile value returned by this function is based on a\ncontinuous distribution of the column values and the result would be\ninterpolated. Due to this, the output might not be one of values in the data\nset. One of the common use cases for this function is to avoid the data\noutliers. This function can be used as an alternative to PERCENTILE_CONT for\nlarge datasets where negligible error with faster response is acceptable as\ncompared to accurate percentile value with slow response time.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/approx-percentile-cont-transact-sql
[APPROX_PERCENTILE_DISC]
declaration=numeric_literal
category=Aggregate Functions
description=The return type is determined by the order_by_expression type.\n\nThis function returns the value from the set of values in a group based on the\nprovided percentile and sort specification. Since this is an approximate\nfunction, the output would be within rank based error bound with certain\nconfidence. As this approximate percentile is based on a discrete distribution\nof the column values, the output value would be equal to one of the specific\nvalues in the column. This function can be used as an alternative to\nPERCENTILE_DISC for large datasets where negligible error with faster response\nis acceptable as compared to accurate percentile value with slow response time.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/approx-percentile-disc-transact-sql
[APP_NAME]
declaration=
category=Metadata Functions
description=Returns: nvarchar(128)\n\nThis function returns the application name for the current session, if the\napplication sets that name value.\n\nThe client provides the application name, and APP_NAME does not verify the\napplication name value in any way. Do not use APP_NAME as part of a security\ncheck.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/app-name-transact-sql
