[SYSDATETIME]
declaration=
category=Date and Time Functions
description=Returns: datetime2(7)\n\nThe SYSDATETIME Transact-SQL (T-SQL) function returns a datetime2(7) value that\ncontains the date and time of the computer on which the instance of is running.\n\nSYSDATETIME and SYSUTCDATETIME have more fractional seconds precision than\nGETDATE and GETUTCDATE. SYSDATETIMEOFFSET includes the system time zone offset.\nSYSDATETIME, SYSUTCDATETIME, and SYSDATETIMEOFFSET can be assigned to a variable\nof any of the date and time types.\n\nAzure Synapse Analytics follows UTC. Use AT TIME ZONE in Azure Synapse Analytics\nif you need to interpret date and time information in a non-UTC time zone.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/sysdatetime-transact-sql
[SYSDATETIMEOFFSET]
declaration=
category=Date and Time Functions
description=Returns: datetimeoffset(7)\n\nThe SYSDATETIMEOFFSET Transact-SQL (T-SQL) function returns a datetimeoffset(7)\nvalue that contains the date and time of the computer on which the instance of\nis running. The time zone offset is included.\n\nFor an overview of all date and time data types and functions, see Date and time\ndata types and functions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/sysdatetimeoffset-transact-sql
[SYSUTCDATETIME]
declaration=
category=Date and Time Functions
description=Returns: datetime2\n\nThe SYSUTCDATETIME Transact-SQL (T-SQL) function returns a datetime2 value that\ncontains the date and time of the computer on which the instance of is running.\nThe date and time is returned as UTC time (Coordinated Universal Time). The\nfractional second precision specification has a range from 1 to 7 digits. The\ndefault precision is 7 digits.\n\nConsider:\n\n- SYSDATETIME and SYSUTCDATETIME have more fractional seconds precision than\nGETDATE and GETUTCDATE.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/sysutcdatetime-transact-sql
