category=Other Functions
description=Returns: varchar\n\nThe CURRENT_TIMEZONE Transact-SQL (T-SQL) function returns the name of the time\nzone observed by a server or an instance. For SQL Managed Instance, the function\nreturns the time zone of the instance itself assigned during instance creation,\nnot the time zone of the underlying operating system.\n\nSee Date and time data types and functions for an overview of all the date and\ntime data types and functions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/current-timezone-transact-sql
[CURRENT_TIMEZONE_ID]
