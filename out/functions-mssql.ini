category=Metadata Functions
description=Returns: sysname\n\nReturns the database schema name for schema-scoped objects. For a list of\nschema-scoped objects, see sys.objects (Transact-SQL).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/object-schema-name-transact-sql
[OPENDATASOURCE]
declaration='provider_name', 'init_string'
category=Rowset Functions
description=Provides ad hoc connection information as part of a four-part object name\nwithout using a linked server name.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/opendatasource-transact-sql
[OPENJSON]
declaration=jsonExpression [ , path ]
category=JSON Functions
description=The OPENJSON table-valued function parses JSON text and returns objects and\nproperties from the JSON input as rows and columns. In other words, OPENJSON\nprovides a rowset view over a JSON document. You can explicitly specify the\ncolumns in the rowset and the JSON property paths used to populate the columns.\nSince OPENJSON returns a set of rows, you can use OPENJSON in the FROM clause of\na statement just as you can use any other table, view, or table-valued function.\n\nUse OPENJSON to import JSON data into , or to convert JSON data to relational\nformat for an app or service that can't consume JSON directly.\n\nThe OPENJSON function is available only under compatibility level 130 or higher.\nIf your database compatibility level is lower than 130, SQL Server can't find\nand run the OPENJSON function. Other JSON functions are available at all\ncompatibility levels. You can check compatibility level in the sys.databases\nview or in database properties. You can change the compatibility level of a\ndatabase with the following command: ALTER DATABASE DatabaseName SET\nCOMPATIBILITY_LEVEL = 130 The compatibility level requirement doesn't apply if\nthe ALLOW_BUILTIN_TVF_IN_ALL_COMPAT_LEVELS database-scoped configuration is\nenabled.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/openjson-transact-sql
[OPENQUERY]
declaration=linked_server ,'query'
category=Rowset Functions
description=Executes the specified pass-through query on the specified linked server. This\nserver is an OLE DB data source. OPENQUERY can be referenced in the FROM clause\nof a query as if it were a table name. OPENQUERY can also be referenced as the\ntarget table of an INSERT, UPDATE, or DELETE statement. This is subject to the\ncapabilities of the OLE DB provider. Although the query may return multiple\nresult sets, OPENQUERY returns only the first one.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/openquery-transact-sql
[OPENROWSET1]
name=OPENROWSET
declaration='provider_name' , { 'datasource' ; 'user_id' ; 'password' | 'provider_string' } , { [ catalog. ] [ schema. ] object | 'query' }
category=Rowset Functions
description=OPENROWSET is an alternative to accessing tables in a linked server and is a\none-time, ad hoc method of connecting and accessing remote data. An OPENROWSET\nT-SQL command includes all connection information that is required to access\nremote data from an external data source.\n\nThe OPENROWSET function can be referenced in the FROM clause of a query as if it\nwere a table name. The OPENROWSET function can also be referenced as the target\ntable of an INSERT, UPDATE, or DELETE statement, subject to the capabilities of\nthe data provider. Although the query might return multiple result sets,\nOPENROWSET returns only the first one.\n\nFor more frequent references to external data sources, use linked servers\ninstead. For more information, see Linked Servers (Database Engine).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/openrowset-transact-sql
[OPENROWSET2]
name=OPENROWSET
declaration=BULK 'data_file_path', <bulk_option> (, <bulk_option>)*
category=Rowset Functions
description=The OPENROWSET function reads data from one or many files and returns the\ncontent as a rowset. Depending on the service, the file might be stored in Azure\nBlob Storage, Azure Data Lake storage, on-premises disk, network shares, and\nmore. You can read various file formats such as text/CSV, Parquet, or\nJSON-lines.\n\nYou can reference the OPENROWSET function in the FROM clause of a query as if it\nwere a table name. Use it to read data in a SELECT statement, or to update\ntarget data in the UPDATE, INSERT, DELETE, MERGE, CTAS, or CETAS statements.\n\n- Use OPENROWSET(BULK) to read data from external data files. - Use OPENROWSET\nwithout BULK to read from another database engine. For more information, see\nOPENROWSET (Transact-SQL).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/openrowset-bulk-transact-sql
[OPENXML]
declaration=idoc int [ in ] , rowpattern nvarchar [ in ] , [ flags byte [ in ] ]
category=Rowset Functions
description=OPENXML provides a rowset view over an XML document. Because OPENXML is a rowset\nprovider, OPENXML can be used in statements in which rowset providers such as a\ntable, view, or the OPENROWSET function can appear.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/openxml-transact-sql
[ORIGINAL_DB_NAME]
declaration=
category=Metadata Functions
description=Returns the database name specified by the user in the database connection\nstring. This database is specified by using the sqlcmd-d option (USE database).\nIt can also be specified with the Open Database Connectivity (ODBC) data source\nexpression (initial catalog =databasename).\n\nThis database is different from the default user database.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/original-db-name-transact-sql
[ORIGINAL_LOGIN]
declaration=
category=Security Functions
description=Returns: sysname\n\nReturns the name of the login that connected to the instance of . You can use\nthis function to return the identity of the original login in sessions in which\nthere are many explicit or implicit context switches.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/original-login-transact-sql
[PARSE]
declaration=string_value AS data_type [ USING culture ]
category=Conversion Functions
description=Returns the result of the expression, translated to the requested data type.\n\nReturns the result of an expression, translated to the requested data type in .\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/parse-transact-sql
[PARSENAME]
declaration='object_name' , object_piece
category=Metadata Functions
description=Returns: sysname\n\nReturns the specified part of an object name. The parts of an object that can be\nretrieved are the object name, schema name, database name, and server name.\n\nPARSENAME doesn't indicate whether an object by the specified name exists.\nPARSENAME just returns the specified part of the specified object name.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/parsename-transact-sql
[PATINDEX]
declaration='%pattern%' , expression
category=String Functions
description=Returns: bigint if expression is of the varchar(max) or nvarchar(max) data\ntypes; otherwise int.\n\nReturns the starting position of the first occurrence of a pattern in a\nspecified expression, or zero if the pattern isn't found, on all valid text and\ncharacter data types.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/patindex-transact-sql
[PERCENTILE_CONT]
declaration=numeric_literal
category=Aggregate Functions
description=Returns: float(53)\n\nThe PERCENTILE_CONT function calculates a percentile based on a continuous\ndistribution of the column value in the . The result is interpolated, and might\nnot equal any of the specific values in the column.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/percentile-cont-transact-sql
[PERCENTILE_DISC]
declaration=numeric_literal
category=Aggregate Functions
description=The return type is determined by the order_by_expression type.\n\nThe PERCENTILE_DISC function computes a specific percentile for sorted values in\nan entire rowset or within a rowset's distinct partitions. For a given\npercentile value P, PERCENTILE_DISC sorts the expression values in the ORDER BY\nclause. It then returns the value with the smallest CUME_DIST value given (with\nrespect to the same sort specification) that's greater than or equal to P. For\nexample, PERCENTILE_DISC (0.5) computes the 50th percentile (that is, the\nmedian) of an expression. PERCENTILE_DISC calculates the percentile based on a\ndiscrete distribution of the column values. The result is equal to a specific\ncolumn value.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/percentile-disc-transact-sql
[PERCENT_RANK]
declaration=
category=Analytic Functions
description=Returns: float(53)\n\nCalculates the relative rank of a row within a group of rows in . Use\nPERCENT_RANK to evaluate the relative standing of a value within a query result\nset or partition. PERCENT_RANK is similar to the CUME_DIST function.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/percent-rank-transact-sql
[PERMISSIONS]
declaration=[ objectid [ , 'column' ] ]
category=Security Functions
description=Returns: int\n\nReturns a value containing a bitmap that indicates the statement, object, or\ncolumn permissions of the current user.\n\nUse fn_my_permissions and Has_Perms_By_Name instead. Continued use of the\nPERMISSIONS function may result in slower performance.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/permissions-transact-sql
[PI]
declaration=
category=Mathematical Functions
description=Returns: float\n\nReturns the constant value of PI.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/pi-transact-sql
[POWER]
declaration=float_expression , y
category=Mathematical Functions
description=The return type depends on the input type of float_expression:\n\nReturns the value of the specified expression to the specified power.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/power-transact-sql
[PRODUCT1]
name=PRODUCT
declaration=[ ALL ] expression
category=Aggregate Functions
since=17
description=Returns the product of all expression values in the most precise expression data\ntype.\n\nThe PRODUCT function returns the product of all the values, or only the DISTINCT\nvalues, in an expression. Use with numeric columns only. Null values are\nignored.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/product-aggregate-transact-sql
[PRODUCT2]
name=PRODUCT
declaration=[ ALL | DISTINCT ] expression
category=Aggregate Functions
since=17
description=Returns the product of all expression values in the most precise expression data\ntype.\n\nThe PRODUCT function returns the product of all the values, or only the DISTINCT\nvalues, in an expression. Use with numeric columns only. Null values are\nignored.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/product-aggregate-transact-sql
[PUBLISHINGSERVERNAME]
declaration=
category=Replication Functions
description=Returns: nvarchar\n\nReturns the name of the originating Publisher for a published database\nparticipating in a database mirroring session. This function is executed at a\nPublisher instance of on the publication database. Use it to determine the\noriginal Publisher of the published database.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/replication-functions-publishingservername
[PWDCOMPARE]
declaration='clear_text_password' , password_hash [ , version ]
category=Security Functions
description=Returns: int\n\nHashes a password and compares the hash to the hash of an existing password.\nPWDCOMPARE can be used to search for blank login passwords or common weak\npasswords.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/pwdcompare-transact-sql
[PWDENCRYPT]
declaration='password'
category=Security Functions
description=Returns: varbinary(128)\n\nReturns the password hash of the input value that uses the current version of\nthe password hashing algorithm.\n\nPWDENCRYPT is an older function and might not be supported in a future release\nof . Use HASHBYTES instead. HASHBYTES provides more hashing algorithms.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/pwdencrypt-transact-sql
[QUOTENAME]
declaration='character_string' [ , 'quote_character' ]
category=String Functions
description=Returns: nvarchar(258)\n\nReturns a Unicode string with the delimiters added to make the input string a\nvalid delimited identifier.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/quotename-transact-sql
[RADIANS]
declaration=numeric_expression
category=Mathematical Functions
description=The return type depends on the input type of numeric_expression:\n\nReturns radians when a numeric expression, in degrees, is entered.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/radians-transact-sql
[RAND]
declaration=[ seed ]
category=Mathematical Functions
description=Returns: float\n\nReturns a pseudo-random float value from 0 through 1, exclusive.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/rand-transact-sql
[RANK]
declaration=
category=Ranking Functions
description=Returns: bigint\n\nReturns the rank of each row within the partition of a result set. The rank of a\nrow is one plus the number of ranks that come before the row in question.\n\nROW_NUMBER and RANK are similar. ROW_NUMBER numbers all rows sequentially (for\nexample 1, 2, 3, 4, 5). RANK provides the same numeric value for ties (for\nexample 1, 2, 2, 4, 5).\n\nRANK is a temporary value calculated when the query is run. To persist numbers\nin a table, see IDENTITY (Property) and CREATE SEQUENCE.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/rank-transact-sql
[REGEXP_COUNT]
declaration=string_expression, pattern_expression [ , start [ , flags ] ]
category=String Functions
since=17
description=The REGEXP_COUNT scalar regular expression function counts the number of times\nthat a regular expression pattern is matched in a string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-count-transact-sql
[REGEXP_INSTR]
declaration=string_expression, pattern_expression [ , start [ , occurrence [ , return_option [ , flags [ , group ] ] ] ] ]
category=String Functions
since=17
description=The REGEXP_INSTR scalar regular expression function returns the starting or\nending position of the matched substring, depending on the value of the\nreturn_option argument.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-instr-transact-sql
[REGEXP_LIKE]
declaration=string_expression, pattern_expression [ , flags ]
category=String Functions
since=17
description=The REGEXP_LIKE scalar regular expression function indicates if the regular\nexpression pattern matches in a string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-like-transact-sql
[REGEXP_MATCHES]
declaration=string_expression, pattern_expression [ , flags ]
category=String Functions
since=17
description=The REGEXP_MATCHES table-valued regular expression function returns a table of\ncaptured substrings that match a regular expression pattern to a string. If no\nmatch is found, the function returns no row.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-matches-transact-sql
[REGEXP_REPLACE]
declaration=string_expression, pattern_expression [ , string_replacement [ , start [ , occurrence [ , flags ] ] ] ]
category=String Functions
since=17
description=The REGEXP_REPLACE scalar regular expression function returns a modified source\nstring replaced by a replacement string, where the occurrence of the regular\nexpression pattern found. If no matches are found, the function returns the\noriginal string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-replace-transact-sql
[REGEXP_SPLIT_TO_TABLE]
declaration=string_expression, pattern_expression [ , flags ]
category=String Functions
since=17
description=The REGEXP_SPLIT_TO_TABLE table-valued regular expression function returns a\ntable of strings split, delimited by the regex pattern. If there's no match to\nthe pattern, the function returns the string.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-split-to-table-transact-sql
[REGEXP_SUBSTR]
declaration=string_expression, pattern_expression [ , start [ , occurrence [ , flags [ , group ] ] ] ]
category=String Functions
since=17
description=The REGEXP_SUBSTR scalar regular expression function returns one occurrence of a\nsubstring of a string that matches the regular expression pattern. If no match\nis found, it returns NULL.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/regexp-substr-transact-sql
[REPLACE]
declaration=string_expression , string_pattern , string_replacement
category=String Functions
description=Returns nvarchar if one of the input arguments is of the nvarchar data type;\notherwise, REPLACE returns varchar.\n\nReplaces all occurrences of a specified string value with another string value.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/replace-transact-sql
[REPLICATE]
declaration=string_expression , integer_expression
category=String Functions
description=Returns the same type as string_expression.\n\nRepeats a string value a specified number of times.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/replicate-transact-sql
[REVERSE]
declaration=string_expression
category=String Functions
description=Returns: varchar or nvarchar\n\nReturns the reverse order of a string value.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/reverse-transact-sql
[RIGHT]
declaration=character_expression , integer_expression
category=String Functions
description=Returns varchar when character_expression is a non-Unicode character data type.\n\nReturns the right part of a character string with the specified number of\ncharacters.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/right-transact-sql
[RIGHT_SHIFT]
declaration=expression_value , shift_amount
category=Bit Manipulation Functions
since=16
description=Returns the same type as expression_value.\n\nRIGHT_SHIFT takes two parameters, and returns the first parameter bit-shifted\nright by the number of bits specified in the second parameter.\n\nThe RIGHT_SHIFT function is also accessible through the >> operator.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/right-shift-transact-sql
[ROUND]
declaration=numeric_expression , length [ , function ]
