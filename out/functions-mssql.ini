description=The return value data type for this method is dynamic. The return type depends\non the argument supplied for date. If a valid input data type is supplied for\ndate, DATE_BUCKET returns the same data type. DATE_BUCKET raises an error if a\nstring literal is specified for the date parameter.\n\nThis function returns the date-time value corresponding to the start of each\ndate-time bucket from the timestamp defined by the origin parameter, or the\ndefault origin value of 1900-01-01 00:00:00.000 if the origin parameter isn't\nspecified.\n\nSee Date and time data types and functions for an overview of all Transact-SQL\ndate and time data types and functions.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/date-bucket-transact-sql
