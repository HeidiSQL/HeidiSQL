[CUME_DIST]
declaration=
category=Analytic Functions
description=Returns: float(53)\n\nFor , this function calculates the cumulative distribution of a value within a\ngroup of values. In other words, CUME_DIST calculates the relative position of a\nspecified value in a group of values. Assuming ascending ordering, the CUME_DIST\nof a value in row r is defined as the number of rows with values less than or\nequal to that value in row r, divided by the number of rows evaluated in the\npartition or query result set. CUME_DIST is similar to the PERCENT_RANK\nfunction.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/cume-dist-transact-sql
[CURRENT_REQUEST_ID]
