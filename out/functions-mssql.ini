[GETDATE]
declaration=
category=Date and Time Functions
description=Returns: datetime\n\nReturns the current database system timestamp as a datetime value without the\ndatabase time zone offset. This value is derived from the operating system of\nthe computer on which the instance of is running.\n\nSYSDATETIME and SYSUTCDATETIME have more fractional seconds precision than\nGETDATE and GETUTCDATE. SYSDATETIMEOFFSET includes the system time zone offset.\nSYSDATETIME, SYSUTCDATETIME, and SYSDATETIMEOFFSET can be assigned to a variable\nof any of the date and time types.\n\nAzure SQL Database (with the exception of Azure SQL Managed Instance) and Azure\nSynapse Analytics follow UTC. Use AT TIME ZONE in Azure SQL Database or Azure\nSynapse Analytics if you need to interpret date and time information in a\nnon-UTC time zone.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/getdate-transact-sql
[GETUTCDATE]
declaration=
category=Date and Time Functions
description=Returns: datetime\n\nReturns the current database system timestamp as a datetime value. The database\ntime zone offset is not included. This value represents the current UTC time\n(Coordinated Universal Time). This value is derived from the operating system of\nthe computer on which the instance of is running.\n\nSYSDATETIME and SYSUTCDATETIME have more fractional seconds precision than\nGETDATE and GETUTCDATE. SYSDATETIMEOFFSET includes the system time zone offset.\nSYSDATETIME, SYSUTCDATETIME, and SYSDATETIMEOFFSET can be assigned to a variable\nof any of the date and time types.\n\nFor an overview of all date and time data types and functions, see Date and Time\nData Types and Functions (Transact-SQL).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/getutcdate-transact-sql
