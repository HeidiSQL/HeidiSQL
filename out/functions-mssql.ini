declaration=[ ALL ] expression
category=Aggregate Functions
description=Returns a value same as expression.\n\nReturns the minimum of all values of the specified expression in a group. Can be\nfollowed by the OVER clause.\n\nTo get the minimum of all values of multiple expressions inline, see Logical\nfunctions - LEAST.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/min-transact-sql
[MIN2]
name=MIN
declaration=[ ALL | DISTINCT ] expression
category=Aggregate Functions
description=Returns a value same as expression.\n\nReturns the minimum of all values of the specified expression in a group. Can be\nfollowed by the OVER clause.\n\nTo get the minimum of all values of multiple expressions inline, see Logical\nfunctions - LEAST.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/min-transact-sql
[MIN_ACTIVE_ROWVERSION]
declaration=
category=System Functions
description=Returns a binary(8) value.\n\nReturns the lowest active rowversion value in the current database. A rowversion\nvalue is active if it is used in a transaction that has not yet been committed.\nFor more information, see rowversion (Transact-SQL).\n\nThe rowversion data type is also known as timestamp.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/min-active-rowversion-transact-sql
[MONTH]
declaration=date
category=Date and Time Functions
description=Returns: int\n\nReturns an integer that represents the month of the specified date.\n\nFor an overview of all date and time data types and functions, see Date and Time\nData Types and Functions (Transact-SQL).\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/month-transact-sql
[NCHAR]
declaration=integer_expression
category=String Functions
description=Returns: nchar(1) when the default database collation does not support\nsupplementary characters.\n\nReturns the Unicode character with the specified integer code, as defined by the\nUnicode standard.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/nchar-transact-sql
[NEWID]
declaration=
category=System Functions
description=Returns: uniqueidentifier\n\nCreates a unique value of type uniqueidentifier.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/newid-transact-sql
[NEWSEQUENTIALID]
declaration=
category=System Functions
description=Returns: uniqueidentifier\n\nCreates a GUID that is greater than any GUID previously generated by this\nfunction on a specified computer since Windows was started. After Windows\nrestarts, the GUID can start again from a lower range, but is still globally\nunique. When a GUID column is used as a row identifier, using NEWSEQUENTIALID\ncan be faster than using the NEWID function. This is because the NEWID function\ncauses random activity and uses fewer cached data pages. Using NEWSEQUENTIALID\nalso helps to completely fill the data and index pages.\n\nIf privacy is a concern, don't use this function. It's possible to guess the\nvalue of the next generated GUID and, therefore, access data associated with\nthat GUID.\n\nNEWSEQUENTIALID is a wrapper over the Windows UuidCreateSequential function,\nwith some byte shuffling applied.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/newsequentialid-transact-sql
[NODE_ID_FROM_PARTS]
declaration=object_id, graph_id
category=Other Functions
description=In SQL Graph tables, the NODE_ID_FROM_PARTS function returns the character\nrepresentation (JSON) of the node ID for a given object ID and graph ID.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/node-id-from-parts-transact-sql
[NTILE]
declaration=integer_expression
category=Ranking Functions
description=Returns: bigint\n\nDistributes the rows in an ordered partition into a specified number of groups.\nThe groups are numbered, starting at one. For each row, NTILE returns the number\nof the group to which the row belongs.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/ntile-transact-sql
[OBJECTPROPERTY]
declaration=ID , property
category=Metadata Functions
description=Returns: int\n\nReturns information about schema-scoped objects in the current database. For a\nlist of schema-scoped objects, see sys.objects (Transact-SQL). This function\ncannot be used for objects that are not schema-scoped, such as data definition\nlanguage (DDL) triggers and event notifications.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/objectproperty-transact-sql
[OBJECTPROPERTYEX]
declaration=id , property
category=Metadata Functions
description=Returns: sql_variant\n\nThe OBJECTPROPERTYEX function returns information about schema-scoped objects in\nthe current database.\n\nFor a list of these objects, see sys.objects (Transact-SQL). OBJECTPROPERTYEX\ncannot be used for objects that are not schema-scoped, such as data definition\nlanguage (DDL) triggers and event notifications.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/objectpropertyex-transact-sql
[OBJECT_DEFINITION]
declaration=object_id
category=Metadata Functions
description=Returns: nvarchar(max)\n\nReturns the source text of the definition of a specified object.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/object-definition-transact-sql
[OBJECT_ID]
declaration=' [ database_name . [ schema_name ] . | schema_name . ] object_name' [ , 'object_type' ]
category=Metadata Functions
description=Returns: int\n\nReturns the database object identification number of a schema-scoped object.\n\nObjects that aren't schema-scoped, such as Data Definition Language (DDL)\ntriggers, can't be queried by using OBJECT_ID. For objects that aren't found in\nthe sys.objects catalog view, obtain the object identification numbers by\nquerying the appropriate catalog view. For example, to return the object\nidentification number of a DDL trigger, use SELECT OBJECT_ID FROM sys.triggers\nWHERE name = 'DatabaseTriggerLog'.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/object-id-transact-sql
[OBJECT_ID_FROM_EDGE_ID]
declaration=edge_id
category=Other Functions
description=In SQL Graph tables, the OBJECT_ID_FROM_EDGE_ID function returns the object ID\nfor a given graph edge ID.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/object-id-from-edge-id-transact-sql
[OBJECT_ID_FROM_NODE_ID]
declaration=node_id
category=Other Functions
description=In SQL Graph tables, the OBJECT_ID_FROM_NODE_ID function returns the object ID\nfor a given graph node ID.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/object-id-from-node-id-transact-sql
[OBJECT_NAME]
