[VECTORPROPERTY]
declaration=vector , property
category=Vector Functions
since=17
description=The VECTORPROPERTY function returns specific properties of a given vector. The\nfunction requires two arguments: the vector itself and the property to be\nretrieved.\n\nVECTORPROPERTY is available in Azure SQL Managed Instance with the SQL Server\n2025 or Always-up-to-date update policy.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/vectorproperty-transact-sql
[VECTOR_DISTANCE]
declaration=distance_metric , vector1 , vector2
category=Vector Functions
since=17
description=The VECTOR_DISTANCE function calculates the distance between two vectors using a\nspecified distance metric. Vector distance is always exact and doesn't use any\nvector index, even if available. In order to use a vector index and thus perform\nan approximate vector search, you must use the VECTOR_SEARCH function. To learn\nmore about how vector indexing and vector search works, and the differences\nbetween exact and approximate search, refer to Vector search and vector indexes\nin the SQL Database Engine.\n\nVECTOR_DISTANCE is available in Azure SQL Managed Instance with the SQL Server\n2025 or Always-up-to-date update policy.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-distance-transact-sql
[VECTOR_NORM]
declaration=vector , norm_type
category=Vector Functions
since=17
description=Use VECTOR_NORM to take a vector as an input and return the norm of the vector\n(which is a measure of its length or magnitude) in a given norm type.\n\nFor example, if you want to calculate the Euclidean norm (which is the most\ncommon norm type), you can use:\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-norm-transact-sql
[VECTOR_NORMALIZE]
declaration=vector , norm_type
category=Vector Functions
since=17
description=Use VECTOR_NORMALIZE to take a vector as an input and return the normalized\nvector, which is a vector scaled to have a length of 1 in a given norm type.\n\nThis standardization is crucial in various artificial intelligence applications\nwhere vectors represent different forms of data, such as visual content, textual\ninformation, or audio signals. By normalizing vectors, we ensure uniformity in\ntheir scale, which is particularly useful for operations that rely on measuring\nvector distances or for grouping and distinguishing data points.\n\nWhile Azure OpenAI's models provide normalized vectors, there are other models\nand frameworks where vectors aren't automatically normalized. For example, in\nthe Gensim library, which is commonly used for natural language processing\ntasks, vectors aren't always normalized by default.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-normalize-transact-sql
[VECTOR_SEARCH1]
name=VECTOR_SEARCH
declaration=TABLE = object [ AS source_table_alias ] , COLUMN = vector_column , SIMILAR_TO = query_vector , METRIC = { 'cosine' | 'dot' | 'euclidean' }
category=Vector Functions
since=17
description=Search for vectors similar to a given query vectors using an approximate nearest\nneighbors vector search algorithm. To learn more about how vector indexing and\nvector search works, and the differences between exact and approximate search,\nrefer to Vector search and vector indexes in the SQL Database Engine.\n\nFor optimal performance and to access the latest vector search capabilities, use\nvector indexes created with the latest version. For more information about\nupgrading existing indexes and comparing versions, see CREATE VECTOR INDEX -\nUpgrade vector indexes to the latest version.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
[VECTOR_SEARCH2]
name=VECTOR_SEARCH
declaration=TABLE = object [ AS source_table_alias ] , COLUMN = vector_column , SIMILAR_TO = query_vector , METRIC = { 'cosine' | 'dot' | 'euclidean' } , TOP_N = k
category=Vector Functions
since=17
description=Search for vectors similar to a given query vectors using an approximate nearest\nneighbors vector search algorithm. To learn more about how vector indexing and\nvector search works, and the differences between exact and approximate search,\nrefer to Vector search and vector indexes in the SQL Database Engine.\n\nFor optimal performance and to access the latest vector search capabilities, use\nvector indexes created with the latest version. For more information about\nupgrading existing indexes and comparing versions, see CREATE VECTOR INDEX -\nUpgrade vector indexes to the latest version.\n\nURL: https://learn.microsoft.com/en-us/sql/t-sql/functions/vector-search-transact-sql
