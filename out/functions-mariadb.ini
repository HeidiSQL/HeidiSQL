[ABS]
declaration=X
category=Numeric Functions
description=Returns the absolute (non-negative) value of X. If X is not a number, it is\nconverted to a numeric type.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/abs
[ACOS]
declaration=X
category=Numeric Functions
description=Returns the arc cosine of X, that is, the value whose cosine is X. Returns NULL\nif X is not in the range -1 to 1.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/acos
[ADDDATE1]
name=ADDDATE
declaration=date,INTERVAL expr unit
category=Date and Time Functions
description=When invoked with the INTERVAL form of the second argument, ADDDATE() is a\nsynonym for DATE_ADD(). The related function SUBDATE() is a synonym for\nDATE_SUB(). For information on the INTERVAL unit argument, see the discussion\nfor DATE_ADD().\n\nWhen invoked with the days form of the second argument, MariaDB treats it as an\ninteger number of days to be added to expr.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/adddate
[ADDDATE2]
name=ADDDATE
declaration=expr,days
category=Date and Time Functions
description=When invoked with the INTERVAL form of the second argument, ADDDATE() is a\nsynonym for DATE_ADD(). The related function SUBDATE() is a synonym for\nDATE_SUB(). For information on the INTERVAL unit argument, see the discussion\nfor DATE_ADD().\n\nWhen invoked with the days form of the second argument, MariaDB treats it as an\ninteger number of days to be added to expr.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/adddate
[ADDTIME]
declaration=expr1,expr2
category=Date and Time Functions
description=ADDTIME() adds expr2 to expr1 and returns the result. expr1 is a time or\ndatetime expression, and expr2 is a time expression.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/addtime
[ADD_MONTHS]
declaration=date, months
category=Date and Time Functions
since=10.6.1
description=ADD_MONTHS adds an integer months to a given date (DATE, DATETIME or TIMESTAMP),\nreturning the resulting date.\n\nmonths can be positive or negative. If months is not a whole number, it is\nrounded to the nearest whole number (not truncated).\n\nThe resulting day component will remain the same as that specified in date,\nunless the resulting month has fewer days than the day component of the given\ndate, in which case the day will be the last day of the resulting month.\n\nReturns NULL if given an invalid date or a NULL argument.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/add_months
[AES_DECRYPT]
declaration=crypt_str, key_str [, iv [, mode]]
category=Encryption, Hashing and Compression Functions
description=This function allows decryption of data using the official AES (Advanced\nEncryption Standard) algorithm. For more information, see the description of\nAES_ENCRYPT().\n\nFrom MariaDB 11.2:\n\nThe function supports an initialization vector, and control of the block\nencryption mode. The default mode is specified by the block_encryption_mode\nsystem variable, which can be changed when calling the function with a mode.\nmode is aes-{128,192,256}-{ecb,cbc,ctr} for example: "AES-128-cbc".\n\nFor modes that require it, the initialization_vector iv should be 16 bytes (it\ncan be longer, but the extra bytes are ignored). A shorter iv, where one is\nrequired, results in the function returning NULL. Calling RANDOM_BYTES(16) will\ngenerate a random series of bytes that can be used for the iv.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/aes_decrypt
[AES_ENCRYPT]
declaration=str, key [, iv [, mode]]
category=Encryption, Hashing and Compression Functions
description=AES_ENCRYPT() and AES_DECRYPT() allow encryption and decryption of data using\nthe official AES (Advanced Encryption Standard) algorithm, previously known as\n"Rijndael." Encoding with a 128-bit key length is used (from MariaDB 11.2.0,\nthis is the default, and can be changed). 128 bits is much faster and is secure\nenough for most purposes.\n\nAES_ENCRYPT() encrypts a string str using the key _key_str_, and returns a\nbinary string.\n\nAES_DECRYPT() decrypts the encrypted string and returns the original string.\n\nThe input arguments may be any length. If either argument is NULL, the result of\nthis function is also NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/aes_encrypt
[AREA]
declaration=poly
category=Polygon Properties
description=Returns as a double-precision number the area of the Polygon value poly, as\nmeasured in its spatial reference system.\n\nST_Area() and Area() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_area
[ASBINARY]
declaration=g
category=WKB
description=Converts a value in internal geometry format to its WKB representation and\nreturns the binary result.\n\nST_AsBinary(), AsBinary(), ST_AsWKB() and AsWKB() are synonyms,\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_asbinary
[ASCII]
declaration=str
category=String Functions
description=Returns the numeric ASCII value of the leftmost character of the string\nargument. Returns 0 if the given string is empty and NULL if it is NULL.\n\nASCII() works for 8-bit characters.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/ascii
[ASIN]
declaration=X
category=Numeric Functions
description=Returns the arc sine of X, that is, the value whose sine is X. Returns NULL if X\nis not in the range -1 to 1.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/asin
[ASTEXT]
declaration=g
category=WKT
description=Converts a value in internal geometry format to its WKT representation and\nreturns the string result.\n\nST_AsText(), AsText(), ST_AsWKT() and AsWKT() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_astext
[ASWKB]
declaration=g
category=WKB
description=Converts a value in internal geometry format to its WKB representation and\nreturns the binary result.\n\nST_AsBinary(), AsBinary(), ST_AsWKB() and AsWKB() are synonyms,\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_asbinary
[ASWKT]
declaration=g
category=WKT
description=Converts a value in internal geometry format to its WKT representation and\nreturns the string result.\n\nST_AsText(), AsText(), ST_AsWKT() and AsWKT() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_astext
[ATAN1]
name=ATAN
declaration=X
category=Numeric Functions
description=Returns the arc tangent of X, that is, the value whose tangent is X.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/atan
[ATAN2]
name=ATAN
declaration=Y,X
category=Numeric Functions
description=Returns the arc tangent of the two variables X and Y. It is similar to\ncalculating the arc tangent of Y / X, except that the signs of both arguments\nare used to determine the quadrant of the result.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/atan2
[ATAN2]
declaration=Y,X
category=Numeric Functions
description=Returns the arc tangent of the two variables X and Y. It is similar to\ncalculating the arc tangent of Y / X, except that the signs of both arguments\nare used to determine the quadrant of the result.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/atan2
[AVG]
declaration=[DISTINCT] expr
category=Aggregate Functions
description=Returns the average value of expr. The DISTINCT option can be used to return the\naverage of the distinct values of expr. NULL values are ignored. It is an\naggregate function, and so can be used with the GROUP BY clause.\n\nAVG() returns NULL if there were no matching rows.\n\nAVG() can be used as a window function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/avg
[BENCHMARK]
declaration=count,expr
category=Information Functions
description=The BENCHMARK() function executes the expression expr repeatedly count times. It\nmay be used to time how quickly MariaDB processes the expression. The result\nvalue is always 0. The intended use is from within the mariadb client, which\nreports query execution times.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/benchmark
[BIN]
declaration=N
category=String Functions
description=Returns a string representation of the binary value of the given longlong (that\nis, BIGINT) number. This is equivalent to CONV(N,10,2). The argument should be\npositive. If it is a FLOAT, it will be truncated. Returns NULL if the argument\nis NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/bin
[BINLOG_GTID_POS]
declaration=binlog_filename,binlog_offset
category=Information Functions
description=The BINLOG_GTID_POS() function takes as input an old-style binary log position\nin the form of a file name and a file offset. It looks up the position in the\ncurrent binlog, and returns a string representation of the corresponding GTID\nposition. If the position is not found in the current binlog, NULL is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/binlog_gtid_pos
[BIT_AND]
declaration=expr
category=Aggregate Functions
description=Returns the bitwise AND of all bits in expr. The calculation is performed with\n64-bit (BIGINT) precision. It is an aggregate function, and so can be used with\nthe GROUP BY clause.\n\nIf no rows match, BIT_AND will return a value with all bits set to 1. NULL\nvalues have no effect on the result unless all results are NULL, which is\ntreated as no match.\n\nBIT_AND can be used as a window function with the addition of the _over_clause_.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/bit_and
[BIT_COUNT]
declaration=N
category=Bit Functions and Operators
description=Returns the number of bits that are set in the argument N.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/bit-functions-and-operators/bit_count
[BIT_LENGTH]
declaration=str
category=String Functions
description=Returns the length of the given string argument in bits. If the argument is not\na string, it will be converted to string. If the argument is NULL, it returns\nNULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/bit_length
[BIT_OR]
declaration=expr
category=Aggregate Functions
description=Returns the bitwise OR of all bits in expr. The calculation is performed with\n64-bit (BIGINT) precision. It is an aggregate function, and so can be used with\nthe GROUP BY clause.\n\nIf no rows match, BIT_OR will return a value with all bits set to 0. NULL values\nhave no effect on the result unless all results are NULL, which is treated as no\nmatch.\n\nBIT_OR can be used as a window function with the addition of the _over_clause_.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/bit_or
[BIT_XOR]
declaration=expr
category=Aggregate Functions
description=Returns the bitwise XOR of all bits in expr. The calculation is performed with\n64-bit (BIGINT) precision. It is an aggregate function, and so can be used with\nthe GROUP BY clause.\n\nIf no rows match, BIT_XOR will return a value with all bits set to 0. NULL\nvalues have no effect on the result unless all results are NULL, which is\ntreated as no match.\n\nBIT_XOR can be used as a window function with the addition of the _over_clause_.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/bit_xor
[BOUNDARY]
declaration=g
category=Geometry Properties
since=10.1.2
description=Returns a geometry that is the closure of the combinatorial boundary of the\ngeometry value g.\n\nBOUNDARY() is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_boundary
[BUFFER]
declaration=g1,r
category=Geometry Constructors
description=Returns a geometry that represents all points whose distance from geometry g1 is\nless than or equal to distance, or radius, r.\n\nUses for this function could include creating for example a new geometry\nrepresenting a buffer zone around an island.\n\nBUFFER() is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_buffer
[CAST]
declaration=expr AS type
category=String Functions
description=The CAST() function takes a value of one data type and produces a value of\nanother data type, similar to the CONVERT() function.\n\nThe type can be one of the following values:\n\n- BINARY\n- CHAR\n- DATE\n- DATETIME\n- DECIMAL\n- DOUBLE\n- FLOAT\n- INTEGER (short for SIGNED INTEGER )\n- [SIGNED [INTEGER]](../../data-types/numeric-data-types/integer.md)\n- [UNSIGNED [INTEGER]](../../data-types/numeric-data-types/integer.md)\n- TIME\n- VARCHAR\n- XMLTYPE (Available starting with MariaDB 12.3)\n\nThe main difference between CAST and CONVERT() is that CONVERT(expr,type) is\nODBC syntax, while CAST(expr as type) and CONVERT(... USING ...) are SQL92\nsyntax.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/cast
[CEIL]
declaration=X
category=Numeric Functions
description=CEIL() is a synonym for CEILING().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/ceil
[CEILING]
declaration=X
category=Numeric Functions
description=Returns the smallest integer value not less than X.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/ceiling
[CENTROID]
declaration=mpoly
category=Polygon Properties
description=Returns a point reflecting the mathematical centroid (geometric center) for the\nMultiPolygon mpoly. The resulting point will not necessarily be on the\nMultiPolygon.\n\nST_Centroid() and Centroid() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_centroid
[CHAR]
declaration=N,... [USING charset_name]
category=String Functions
description=CHAR() interprets each argument as an INT and returns a string consisting of the\ncharacters given by the code values of those integers. NULL values are skipped.\nBy default, CHAR() returns a binary string. To produce a string in a given\ncharacter set, use the optional USING clause:\n\nIf USING is given and the result string is illegal for the given character set,\na warning is issued. Also, if strict SQL mode is enabled, the result from CHAR()\nbecomes NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/char-function
[CHARACTER_LENGTH]
declaration=str
category=String Functions
description=CHARACTER_LENGTH() is a synonym for CHAR_LENGTH().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/character_length
[CHARSET]
declaration=str
category=Information Functions
description=Returns the character set of the string argument. If str is not a string, it is\nconsidered as a binary string (so the function returns 'binary'). This applies\nto NULL, too. The return value is a string in the utf8 character set.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/charset
[CHAR_LENGTH]
declaration=str
category=String Functions
description=Returns the length of the given string argument, measured in characters. A\nmulti-byte character counts as a single character. This means that for a string\ncontaining five two-byte characters, LENGTH() (or OCTET_LENGTH() in Oracle mode)\nreturns 10, whereas CHAR_LENGTH() returns 5. If the argument is NULL, it returns\nNULL.\n\nIf the argument is not a string value, it is converted into a string.\n\nIt is synonymous with the CHARACTER_LENGTH() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/char_length
[CHR]
declaration=N
category=String Functions
since=10.3.1
description=CHR() interprets each argument N as an integer and returns a VARCHAR(1) string\nconsisting of the character given by the code values of the integer. The\ncharacter set and collation of the string are set according to the values of the\ncharacter_set_database and collation_database system variables.\n\nCHR() is similar to the CHAR() function, but only accepts a single argument.\n\nCHR() is available in all sql_modes.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/chr
[COALESCE]
declaration=value,...
category=Comparison Operators
description=Returns the first non-NULL value in the list, or NULL if there are no non-NULL\nvalues. At least one parameter must be passed.\n\nThe function is useful when substituting a default value for null values when\ndisplaying data.\n\nSee also NULL Values in MariaDB.\n\nURL: https://mariadb.com/docs/server/reference/sql-structure/operators/comparison-operators/coalesce
[COERCIBILITY]
declaration=str
category=Information Functions
description=Returns the collation coercibility value of the string argument. Coercibility\ndefines what will be converted to what in case of collation conflict, with an\nexpression with higher coercibility being converted to the collation of an\nexpression with lower coercibility.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/coercibility
[COLLATION]
declaration=str
category=Information Functions
description=Returns the collation of the string argument. If str is not a string, it is\nconsidered as a binary string (so the function returns 'binary'). This applies\nto NULL, too. The return value is a string in the utf8 character set.\n\nSee Character Sets and Collations.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/collation
[COLUMN_ADD1]
name=COLUMN_ADD
declaration=dyncol_blob, column_name, value [as type], [column_name, value [as type]]...
category=Dynamic Columns Functions
description=Adds or updates dynamic columns.\n\n- dyncol_blob must be either a valid dynamic columns blob (for example,\n  COLUMN_CREATE returns such blob), or an empty string.\n- column_name specifies the name of the column to be added. If dyncol_blob\n  already has a column with this name, it will be overwritten.\n- value specifies the new value for the column. Passing a NULL value will cause\n  the column to be deleted.\n- as type is optional. See Datatypes section for a discussion about types.\n\nThe return value is a dynamic column blob after the modifications.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_add
[COLUMN_ADD2]
name=COLUMN_ADD
declaration=dyncol_blob, column_nr, value [as type], [column_nr, value [as type]]...
category=Dynamic Columns Functions
description=Adds or updates dynamic columns.\n\n- dyncol_blob must be either a valid dynamic columns blob (for example,\n  COLUMN_CREATE returns such blob), or an empty string.\n- column_name specifies the name of the column to be added. If dyncol_blob\n  already has a column with this name, it will be overwritten.\n- value specifies the new value for the column. Passing a NULL value will cause\n  the column to be deleted.\n- as type is optional. See Datatypes section for a discussion about types.\n\nThe return value is a dynamic column blob after the modifications.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_add
[COLUMN_CHECK]
declaration=dyncol_blob
category=Dynamic Columns Functions
description=Check if dyncol_blob is a valid packed dynamic columns blob. Return value of 1\nmeans the blob is valid, return value of 0 means it is not.\n\nRationale: Normally, one works with valid dynamic column blobs. Functions like\nCOLUMN_CREATE, COLUMN_ADD, COLUMN_DELETE always return valid dynamic column\nblobs. However, if a dynamic column blob is accidentally truncated, or\ntranscoded from one character set to another, it will be corrupted. This\nfunction can be used to check if a value in a blob field is a valid dynamic\ncolumn blob.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_check
[COLUMN_CREATE1]
name=COLUMN_CREATE
declaration=column_name, value [as type], [column_name, value [as type]]...
category=Dynamic Columns Functions
description=Returns a dynamic columns blob that stores the specified columns with values.\n\nThe return value is suitable for\n\n- storing in a table;\n- further modification with other dynamic columns functions.\n\nThe as type part allows one to specify the value type. In most cases, this is\nredundant because MariaDB will be able to deduce the type of the value. Explicit\ntype specification may be needed when the type of the value is not apparent. For\nexample, a literal '2012-12-01' has a CHAR type by default, one will need to\nspecify '2012-12-01' AS DATE to have it stored as a date. See Dynamic\nColumns:Datatypes for further details.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_create
[COLUMN_CREATE2]
name=COLUMN_CREATE
declaration=column_nr, value [as type], [column_nr, value [as type]]...
category=Dynamic Columns Functions
description=Returns a dynamic columns blob that stores the specified columns with values.\n\nThe return value is suitable for\n\n- storing in a table;\n- further modification with other dynamic columns functions.\n\nThe as type part allows one to specify the value type. In most cases, this is\nredundant because MariaDB will be able to deduce the type of the value. Explicit\ntype specification may be needed when the type of the value is not apparent. For\nexample, a literal '2012-12-01' has a CHAR type by default, one will need to\nspecify '2012-12-01' AS DATE to have it stored as a date. See Dynamic\nColumns:Datatypes for further details.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_create
[COLUMN_DELETE1]
name=COLUMN_DELETE
declaration=dyncol_blob, column_name, column_name...
category=Dynamic Columns Functions
description=Deletes a dynamic column with the specified name. Multiple names can be given.\nThe return value is a dynamic column blob after the modification.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_delete
[COLUMN_DELETE2]
name=COLUMN_DELETE
declaration=dyncol_blob, column_nr, column_nr...
category=Dynamic Columns Functions
description=Deletes a dynamic column with the specified name. Multiple names can be given.\nThe return value is a dynamic column blob after the modification.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_delete
[COLUMN_EXISTS1]
name=COLUMN_EXISTS
declaration=dyncol_blob, column_name
category=Dynamic Columns Functions
description=Checks if a column with name column_name exists in dyncol_blob. If yes, return\n1, otherwise return 0. See dynamic columns for more information.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_exists
[COLUMN_EXISTS2]
name=COLUMN_EXISTS
declaration=dyncol_blob, column_nr
category=Dynamic Columns Functions
description=Checks if a column with name column_name exists in dyncol_blob. If yes, return\n1, otherwise return 0. See dynamic columns for more information.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_exists
[COLUMN_GET1]
name=COLUMN_GET
declaration=dyncol_blob, column_name as type
category=Dynamic Columns Functions
description=Gets the value of a dynamic column by its name. If no column with the given name\nexists, NULL will be returned.\n\ncolumn_name as type requires that one specify the datatype of the dynamic column\nthey are reading.\n\nThis may seem counter-intuitive: why would one need to specify which datatype\nthey're retrieving? Can't the dynamic columns system figure the datatype from\nthe data being stored?\n\nThe answer is: SQL is a statically-typed language. The SQL interpreter needs to\nknow the datatypes of all expressions before the query is run (for example, when\none is using prepared statements and runs "select COLUMN_GET(...)", the prepared\nstatement API requires the server to inform the client about the datatype of the\ncolumn being read before the query is executed and the server can see what\ndatatype the column actually has).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_get
[COLUMN_GET2]
name=COLUMN_GET
declaration=dyncol_blob, column_nr as type
category=Dynamic Columns Functions
description=Gets the value of a dynamic column by its name. If no column with the given name\nexists, NULL will be returned.\n\ncolumn_name as type requires that one specify the datatype of the dynamic column\nthey are reading.\n\nThis may seem counter-intuitive: why would one need to specify which datatype\nthey're retrieving? Can't the dynamic columns system figure the datatype from\nthe data being stored?\n\nThe answer is: SQL is a statically-typed language. The SQL interpreter needs to\nknow the datatypes of all expressions before the query is run (for example, when\none is using prepared statements and runs "select COLUMN_GET(...)", the prepared\nstatement API requires the server to inform the client about the datatype of the\ncolumn being read before the query is executed and the server can see what\ndatatype the column actually has).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_get
[COLUMN_JSON]
declaration=dyncol_blob
category=Dynamic Columns Functions
description=Returns a JSON representation of data in dyncol_blob. Can also be used to\ndisplay nested columns. See dynamic columns for more information.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_json
[COLUMN_LIST]
declaration=dyncol_blob
category=Dynamic Columns Functions
description=Returns a comma-separated list of column names. The names are quoted with\nbackticks.\n\nSee dynamic columns for more information.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/dynamic-columns-functions/column_list
[COMPRESS]
declaration=string_to_compress
category=Encryption, Hashing and Compression Functions
description=Compresses a string and returns the result as a binary string. This function\nrequires MariaDB to have been compiled with a compression library such as zlib.\nOtherwise, the return value is always NULL. The compressed string can be\nuncompressed with UNCOMPRESS().\n\nThe have_compress server system variable indicates whether a compression library\nis present.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/compress
[CONCAT]
declaration=str1,str2,...
category=String Functions
description=Returns the string that results from concatenating the arguments. May have one\nor more arguments. If all arguments are non-binary strings, the result is a\nnon-binary string. If the arguments include any binary strings, the result is a\nbinary string. A numeric argument is converted to its equivalent binary string\nform; if you want to avoid that, you can use an explicit type cast, as in this\nexample:\n\nCONCAT() returns NULL if any argument is NULL.\n\nA NULL parameter hides all information contained in other parameters from the\nresult. Sometimes this is not desirable; to avoid this, you can:\n\n- Use the CONCAT_WS() function with an empty separator, because that function is\n  NULL-safe.\n- Use IFNULL() to turn NULLs into empty strings.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/concat
[CONCAT_WS]
declaration=separator,str1,str2,...
category=String Functions
description=CONCAT_WS() stands for Concatenate With Separator and is a special form of\nCONCAT(). The first argument is the separator for the rest of the arguments. The\nseparator is added between the strings to be concatenated. The separator can be\na string, as can the rest of the arguments.\n\nIf the separator is NULL, the result is NULL; all other NULL values are skipped.\nThis makes CONCAT_WS() suitable when you want to concatenate some values and\navoid losing all information if one of them is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/concat_ws
[CONNECTION_ID]
declaration=
category=Information Functions
description=Returns the connection ID for the connection. Every connection (including\nevents) has an ID that is unique among the set of currently connected clients.\n\nReturns MYSQL_TYPE_LONG, or int(10).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/connection_id
[CONTAINS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether a geometry g1 completely contains geometry\ng2. CONTAINS() is based on the original MySQL implementation and uses object\nbounding rectangles, while ST_CONTAINS() uses object shapes.\n\nThis tests the opposite relationship to Within().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/contains
[CONV]
declaration=N,from_base,to_base
category=Numeric Functions
description=Converts numbers between different number bases. Returns a string representation\nof the number N, converted from base _from_base_ to base _to_base_.\n\nReturns NULL if any argument is NULL, or if the second or third argument are not\nin the allowed range.\n\nFrom Community Server (CS) 11.4 / Enterprise Server (ES) 10.6.19-15:\n\nThe argument N is interpreted as an integer, but may be specified as an integer\nor a string. The minimum base is 2 and the maximum base is 62. If _to_base_ is a\nnegative number, N is regarded as a signed number. Otherwise, N is treated as\nunsigned. CONV() works with 64-bit precision.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/conv
[CONVERT1]
name=CONVERT
declaration=expr USING transcoding_name
category=String Functions
description=The CONVERT() and CAST() functions take a value of one type and produce a value\nof another type.\n\nThe type can be one of the following values:\n\n- BINARY\n- CHAR\n- DATE\n- DATETIME\n- [DECIMAL [(M[,D])](../../data-types/numeric-data-types/decimal.md)]\n- DOUBLE\n- FLOAT\n- INTEGER\n- Short for SIGNED INTEGER\n- SIGNED [INTEGER]\n- UNSIGNED [INTEGER]\n- TIME\n- VARCHAR (in Oracle mode)\n\nNote that in MariaDB, INT and INTEGER are the same thing.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/convert
[CONVERT2]
name=CONVERT
declaration=expr,type
category=String Functions
description=The CONVERT() and CAST() functions take a value of one type and produce a value\nof another type.\n\nThe type can be one of the following values:\n\n- BINARY\n- CHAR\n- DATE\n- DATETIME\n- [DECIMAL [(M[,D])](../../data-types/numeric-data-types/decimal.md)]\n- DOUBLE\n- FLOAT\n- INTEGER\n- Short for SIGNED INTEGER\n- SIGNED [INTEGER]\n- UNSIGNED [INTEGER]\n- TIME\n- VARCHAR (in Oracle mode)\n\nNote that in MariaDB, INT and INTEGER are the same thing.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/convert
[CONVERT_TZ]
declaration=dt,from_tz,to_tz
category=Date and Time Functions
description=CONVERT_TZ() converts a datetime value dt from the time zone given by _from_tz_\nto the time zone given by _to_tz_ and returns the resulting value.\n\nIn order to use named time zones, such as GMT, MET or Africa/Johannesburg, the\ntime_zone tables must be loaded (see mysql_tzinfo_to_sql).\n\nNo conversion takes place if the value falls outside of the supported TIMESTAMP\nrange when converted from _from_tz_ to UTC.\n\nFrom MariaDB 11.5:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/convert_tz
[CONVEXHULL]
declaration=g
category=Geometry Constructors
since=10.1.2
description=Given a geometry, returns a geometry that is the minimum convex geometry\nenclosing all geometries within the set. Returns NULL if the geometry value is\nNULL or an empty value.\n\nST_ConvexHull() and ConvexHull() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_convexhull
[COS]
declaration=X
category=Numeric Functions
description=Returns the cosine of X, where X is given in radians.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/cos
[COT]
declaration=X
category=Numeric Functions
description=Returns the cotangent of X.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/cot
[COUNT1]
name=COUNT
declaration=DISTINCT expr,[expr...]
category=Aggregate Functions
description=Returns a count of the number of different non-NULL values.\n\nCOUNT(DISTINCT) returns 0 if there were no matching rows.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/count-distinct
[COUNT2]
name=COUNT
declaration=expr
category=Aggregate Functions
description=Returns a count of the number of non-NULL values of expr in the rows retrieved\nby a SELECT statement. The result is a BIGINT value. It is an aggregate\nfunction, and so can be used with the GROUP BY clause.\n\nCOUNT(*) counts the total number of rows in a table.\n\nCOUNT() returns 0 if there were no matching rows.\n\nCOUNT() can be used as a window function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/count
[CRC32]
declaration=[par,]expr
category=Numeric Functions
description=Computes a cyclic redundancy check (CRC) value and returns a 32-bit unsigned\nvalue. The result is NULL if the argument is NULL. The argument is expected to\nbe a string and (if possible) is treated as one if it is not.\n\nFrom MariaDB 10.8:\n\nUses the alternate Castagnoli polynomia.\n\nOften, CRC is computed in pieces. To facilitate this, there's an optional\nparameter: CRC32('MariaDB')=CRC32(CRC32('Maria'),'DB').\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/crc32
[CRC32C]
declaration=[par,]expr
category=Numeric Functions
since=10.8.1
description=MariaDB has always included a native unary function CRC32() that computes the\nCRC-32 of a string using the ISO 3309 polynomial that used by zlib and many\nothers.\n\nInnoDB and MyRocks use a different polynomial, which was implemented in SSE4.2\ninstructions that were introduced in the Intel Nehalem microarchitecture. This\nis commonly called CRC-32C (Castagnoli).\n\nThe CRC32C function uses the Castagnoli polynomial.\n\nThis allows SELECT...INTO DUMPFILE to be used for the creation of files with\nvalid checksums, such as a logically empty InnoDB redo log fileib_logfile0\ncorresponding to a particular log sequence number.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/crc32c
[CROSSES]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 if g1 spatially crosses g2. Returns NULL if g1 is a Polygon or a\nMultiPolygon, or if g2 is a Point or a MultiPoint. Otherwise, returns 0.\n\nThe term spatially crosses denotes a spatial relation between two given\ngeometries that has the following properties:\n\n- The two geometries intersect.\n- Their intersection results in a geometry that has a dimension that is one less\n  than the maximum dimension of the two given geometries.\n- Their intersection is not equal to either of the two given geometries.\n\nCROSSES() is based on the original MySQL implementation, and uses object\nbounding rectangles, while ST_CROSSES() uses object shapes.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/crosses
[CUME_DIST]
declaration=
category=Window Functions
since=10.2.0
description=CUME_DIST() is a window function that returns the cumulative distribution of a\ngiven row. The following formula is used to calculate the value:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/cume_dist
[CURDATE]
declaration=
category=Date and Time Functions
description=CURDATE returns the current date as a value in YYYY-MM-DD or YYYYMMDD format,\ndepending on whether the function is used in a string or numeric context.\n\nCURRENT_DATE and CURRENT_DATE() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/curdate
[CURRENT_DATE]
declaration=
category=Date and Time Functions
description=CURDATE returns the current date as a value in YYYY-MM-DD or YYYYMMDD format,\ndepending on whether the function is used in a string or numeric context.\n\nCURRENT_DATE and CURRENT_DATE() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/curdate
[CURRENT_ROLE]
declaration=
category=Information Functions
description=Returns the current role name. The return value is a string in the utf8\ncharacter set.\n\nIf there is no current role, NULL is returned.\n\nUSER() returns the combination of user and host used to login. CURRENT_USER()\nreturns the account used to determine current connection's privileges.\n\nStatements using the CURRENT_ROLE function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/current_role
[CURRENT_TIME]
declaration=[precision]
category=Date and Time Functions
description=CURRENT_TIME and CURRENT_TIME() are synonyms for CURTIME().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/current_time
[CURRENT_TIMESTAMP]
declaration=[precision]
category=Date and Time Functions
description=CURRENT_TIMESTAMP and CURRENT_TIMESTAMP() are synonyms for NOW().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/current_timestamp
[CURRENT_USER]
declaration=
category=Information Functions
description=Returns the user name and host name combination for the MariaDB account that the\nserver used to authenticate the current client. This account determines your\naccess privileges. The return value is a string in the utf8 character set.\n\nThe value of CURRENT_USER() can differ from the value of USER(). CURRENT_ROLE()\nreturns the current active role.\n\nStatements using the CURRENT_USER function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/current_user
[CURTIME]
declaration=[precision]
category=Date and Time Functions
description=Returns the current time as a value in HH:MM:SS or HHMMSS.uuuuuu format,\ndepending on whether the function is used in a string or numeric context. The\nvalue is expressed in the current time zone.\n\nThe optional precision determines the microsecond precision. See Microseconds in\nMariaDB.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/curtime
[DATABASE]
declaration=
category=Information Functions
description=Returns the default (current) database name as a string in the utf8 character\nset. If there is no default database, DATABASE() returns NULL. Within a stored\nroutine, the default database is the database that the routine is associated\nwith, which is not necessarily the same as the database that is the default in\nthe calling context.\n\nSCHEMA() is a synonym for DATABASE().\n\nTo select a default database, the USE statement can be run. Another way to set\nthe default database is specifying its name at mariadb command line client\nstartup.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/database
[DATE]
declaration=expr
category=Date and Time Functions
description=Extracts the date part of the date or datetime expression expr. Returns NULL and\nthrows a warning when passed an invalid date.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/date-function
[DATEDIFF]
declaration=expr1,expr2
category=Date and Time Functions
description=DATEDIFF() returns (expr1 - expr2) expressed as a value in days from one date to\nthe other. expr1 and expr2 are date or date-and-time expressions. Only the date\nparts of the values are used in the calculation.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/datediff
[DATE_ADD]
declaration=date,INTERVAL expr unit
category=Date and Time Functions
description=Performs date arithmetic. The date argument specifies the starting date or\ndatetime value. expr is an expression specifying the interval value to be added\nto the starting date. expr is a string; it may start with a "-" for negative\nintervals. For composite interval units (such as DAY_HOUR, MINUTE_SECOND, and\nSECOND_MICROSECOND), expr can contain multiple components separated by spaces or\npunctuation. For example:\n\n- '1 10' DAY_HOUR represents 1 day and 10 hours\n- '1:1' MINUTE_SECOND represents 1 minute and 1 second\n- '1.999999' SECOND_MICROSECOND represents seconds and microseconds\n\nThe exact format of expr depends on the unit specified.\n\nunit is a keyword indicating the units in which the expression should be\ninterpreted. See Date and Time Units for a complete list of permitted units.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/date_add
[DATE_FORMAT]
declaration=date, format[, locale]
category=Date and Time Functions
description=Formats the date value according to the format string.\n\nThe language used for the names is controlled by the value of the lc_time_names\nsystem variable. See server locale for more on the supported locales.\n\nThe options that can be used by DATE_FORMAT(), as well as its inverse\nSTR_TO_DATE() and the FROM_UNIXTIME() function, are:\n\nTo get a date in one of the standard formats, GET_FORMAT() can be used.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/date_format
[DATE_SUB]
declaration=date,INTERVAL expr unit
category=Date and Time Functions
description=Performs date arithmetic. The date argument specifies the starting date or\ndatetime value. expr is an expression specifying the interval value to be\nsubtracted from the starting date. expr is a string; it may start with a "-" for\nnegative intervals. unit is a keyword indicating the units in which the\nexpression should be interpreted. See Date and Time Units for a complete list of\npermitted units.\n\nSee also DATE_ADD().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/date_sub
[DAY]
declaration=date
category=Date and Time Functions
description=DAY() is a synonym for DAYOFMONTH().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/day
[DAYNAME]
declaration=date
category=Date and Time Functions
description=Returns the name of the weekday for date. The language used for the name is\ncontrolled by the value of the lc_time_names system variable. See server locale\nfor more on the supported locales.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/dayname
[DAYOFMONTH]
declaration=date
category=Date and Time Functions
description=Returns the day of the month for date, in the range 1 to 31, or 0 for dates such\nas '0000-00-00' or '2008-00-00' which have a zero day part.\n\nDAY() is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/dayofmonth
[DAYOFWEEK]
declaration=date
category=Date and Time Functions
description=Returns the day of the week index for the date (1 = Sunday, 2 = Monday, ..., 7 =\nSaturday). These index values correspond to the ODBC standard.\n\nThis contrasts with WEEKDAY() which follows a different index numbering (0 =\nMonday, 1 = Tuesday, ... 6 = Sunday).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/dayofweek
[DAYOFYEAR]
declaration=date
category=Date and Time Functions
description=Returns the day of the year for date, in the range 1 to 366.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/dayofyear
[DECODE]
declaration=crypt_str,pass_str
category=Encryption, Hashing and Compression Functions
description=In the default mode, DECODE decrypts the encrypted string _crypt_str_ using\n_pass_str_ as the password. _crypt_str_ should be a string returned from\nENCODE(). The resulting string will be the original string only if _pass_str_ is\nthe same.\n\nIn Oracle mode, DECODE compares expr to the search expressions, in order. If it\nfinds a match, the corresponding result expression is returned. If no matches\nare found, the default expression is returned, or NULL if no default is\nprovided.\n\nNULL values are treated as equivalent.\n\nDECODE_ORACLE is a synonym for the Oracle-mode version of the function, and is\navailable in all modes.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/decode
[DECODE_HISTOGRAM]
declaration=hist_type,histogram
category=Information Functions
description=Returns a string of comma separated numeric values corresponding to a\nprobability distribution represented by the histogram of type hist_type\n(SINGLE_PREC_HB or DOUBLE_PREC_HB). The hist_type and histogram would be\ncommonly used from the mysql.column_stats table.\n\nSee Histogram Based Statistics for details.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/decode_histogram
[DEFAULT]
declaration=col_name
category=Information Functions
description=Returns the default value for a table column. If the column has no default value\n(and is not NULLABLE - NULLABLE fields have a NULL default), an error is\nreturned.\n\nFor integer columns using AUTO_INCREMENT, 0 is returned.\n\nWhen using DEFAULT as a value to set in an INSERT or UPDATE statement, you can\nuse the bare keyword DEFAULT without the parentheses and argument to refer to\nthe column in context. You can only use DEFAULT as a bare keyword if you are\nusing it alone without a surrounding expression or function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/default
[DEGREES]
declaration=X
category=Numeric Functions
description=Returns the argument X, converted from radians to degrees.\n\nThis is the converse of the RADIANS() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/degrees
[DENSE_RANK]
declaration=
category=Window Functions
since=10.2.0
description=DENSE_RANK() is a window function that displays the number of a given row,\nstarting at one and following the ORDER BY sequence of the window function, with\nidentical values receiving the same result. Unlike the RANK() function, there\nare no skipped values if the preceding results are identical. It is also similar\nto the ROW_NUMBER() function except that in that function, identical values will\nreceive a different row number for each result.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/dense_rank
[DES_DECRYPT]
declaration=crypt_str[,key_str]
category=Encryption, Hashing and Compression Functions
until=13.0.1
description=Decrypts a string encrypted with DES_ENCRYPT(). If an error occurs, this\nfunction returns NULL.\n\nThis function works only if MariaDB has been configured with TLS support.\n\nIf no key_str argument is given, DES_DECRYPT() examines the first byte of the\nencrypted string to determine the DES key number that was used to encrypt the\noriginal string, and then reads the key from the DES key file to decrypt the\nmessage. For this to work, the user must have the SUPER privilege. The key file\ncan be specified with the--des-key-file server option.\n\nIf you pass this function a key_str argument, that string is used as the key for\ndecrypting the message.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/des_decrypt
[DES_ENCRYPT]
declaration=str[,{key_num|key_str}]
category=Encryption, Hashing and Compression Functions
until=13.0.1
description=Encrypts the string with the given key using the Triple-DES algorithm.\n\nThis function works only if MariaDB has been configured with TLS support.\n\nThe encryption key to use is chosen based on the second argument\ntoDES_ENCRYPT(), if one was given. With no argument, the first key from the DES\nkey file is used. With a _key_num_ argument, the given key number (0-9) from the\nDES key file is used. With a _key_str_ argument, the given key string is used to\nencrypt str.\n\nThe key file can be specified with the --des-key-file server option.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/des_encrypt
[DIMENSION]
declaration=g
category=Geometry Properties
description=Returns the inherent dimension of the geometry value g. The result can be\n\nST_Dimension() and Dimension() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_dimension
[DISJOINT]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether g1 is spatially disjoint from (does not\nintersect) g2.\n\nDISJOINT() tests the opposite relationship to INTERSECTS().\n\nDISJOINT() is based on the original MySQL implementation and uses object\nbounding rectangles, while ST_DISJOINT() uses object shapes.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/disjoint
[ELT]
declaration=N, str1[, str2, str3,...]
category=String Functions
description=Takes a numeric argument and a series of string arguments. Returns the string\nthat corresponds to the given numeric position. For instance, it returns str1 if\nN is 1, str2 if N is 2, and so on. If the numeric argument is a FLOAT, MariaDB\nrounds it to the nearest INTEGER. If the numeric argument is less than 1,\ngreater than the total number of arguments, or not a number, ELT() returns NULL.\nIt must have at least two arguments.\n\nIt is complementary to the FIELD() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/elt
[ENCODE]
declaration=str,pass_str
category=Encryption, Hashing and Compression Functions
description=ENCODE is not considered cryptographically secure, and should not be used for\npassword encryption.\n\nEncrypt str using pass_str as the password. To decrypt the result, use DECODE().\n\nThe result is a binary string of the same length as str.\n\nThe strength of the encryption is based on how good the random generator is.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/encode
[ENCRYPT]
declaration=str[,salt]
category=Encryption, Hashing and Compression Functions
description=Encrypts a string using the Unix crypt() system call, returning an encrypted\nbinary string. The salt argument should be a string with at least two characters\nor the returned result will be NULL. If no salt argument is given, a random\nvalue of sufficient length is used.\n\nIt is not recommended to use ENCRYPT() with utf16, utf32 or ucs2 multi-byte\ncharacter sets because the crypt() system call expects a string terminated with\na zero byte.\n\nNote that the underlying crypt() system call may have some limitations, such as\nignoring all but the first eight characters.\n\nIf the have_crypt system variable is set to NO (because the crypt() system call\nis not available), the ENCRYPT function will always return NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/encrypt
[ENDPOINT]
declaration=ls
category=LineString Properties
description=Returns the Point that is the endpoint of the LineString value ls.\n\nST_EndPoint() and EndPoint() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_endpoint
[ENVELOPE]
declaration=g
category=Geometry Properties
description=Returns the Minimum Bounding Rectangle (MBR) for the geometry value g. The\nresult is returned as a Polygon value.\n\nThe polygon is defined by the corner points of the bounding box:\n\nST_ENVELOPE() and ENVELOPE() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_envelope
[EXP]
declaration=X
category=Numeric Functions
description=Returns the value of e (the base of natural logarithms) raised to the power of\nX. The inverse of this function is LOG() (using a single argument only) or LN().\n\nIf X is NULL, this function returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/exp
[EXPORT_SET]
declaration=bits, on, off[, separator[, number_of_bits]]
category=String Functions
description=Takes a minimum of three arguments. Returns a string where each bit in the given\nbits argument is returned, with the string values given for on and off.\n\nBits are examined from right to left, (from low-order to high-order bits).\nStrings are added to the result from left to right, separated by a separator\nstring (defaults as ','). You can optionally limit the number of bits the\nEXPORT_SET() function examines using the number_of_bits option.\n\nIf any of the arguments are set as NULL, the function returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/export_set
[EXTERIORRING]
declaration=poly
category=Polygon Properties
description=Returns the exterior ring of the Polygon value poly as a LineString.\n\nST_ExteriorRing() and ExteriorRing() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_exteriorring
[EXTRACT]
declaration=unit FROM date
category=Date and Time Functions
description=The EXTRACT() function extracts the required unit from the date. See Date and\nTime Units for a complete list of permitted units.\n\nHOUR() is not a standard SQL function, so continues to adhere to the old\nbehavior inherited from MySQL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/extract
[EXTRACTVALUE]
declaration=xml_frag, xpath_expr
category=XML Functions
description=The EXTRACTVALUE() function takes two string arguments: a fragment of XML markup\nand an XPath expression, (also known as a locator). It returns the text (That\nis, CDDATA), of the first text node which is a child of the element or elements\nmatching the XPath expression.\n\nIn cases where a valid XPath expression does not match any text nodes in a valid\nXML fragment, (including the implicit /text() expression), the EXTRACTVALUE()\nfunction returns an empty string.\n\nWhen either the XML fragment or the XPath expression is NULL, the EXTRACTVALUE()\nfunction returns NULL. When the XML fragment is invalid, it raises a warning\nCode 1525:\n\nWhen the XPath value is invalid, it generates an Error 1105:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/xml-functions/extractvalue
[FIELD]
declaration=pattern, str1[,str2,...]
category=String Functions
description=Returns the index position of the string or number matching the given pattern.\nReturns 0 in the event that none of the arguments match the pattern. Raises an\nError 1582 if not given at least two arguments.\n\nWhen all arguments given to the FIELD() function are strings, they are treated\nas case-insensitive. When all the arguments are numbers, they are treated as\nnumbers. Otherwise, they are treated as doubles.\n\nIf the given pattern occurs more than once, the FIELD() function only returns\nthe index of the first instance. If the given pattern is NULL, the function\nreturns 0, as a NULL pattern always fails to match.\n\nThis function is complementary to the ELT() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/field
[FIND_IN_SET]
declaration=pattern, strlist
category=String Functions
description=Returns the index position where the given pattern occurs in a string list. The\nfirst argument is the pattern you want to search for. The second argument is a\nstring containing comma-separated variables. If the second argument is of the\nSET data-type, the function is optimized to use bit arithmetic.\n\nIf the pattern does not occur in the string list or if the string list is an\nempty string, the function returns 0. If either argument is NULL, the function\nreturns NULL. The function does not return the correct result if the pattern\ncontains a comma (",") character.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/find_in_set
[FIRST_VALUE]
declaration=expr
category=Window Functions
since=10.2.2
description=FIRST_VALUE returns the first result from an ordered set, or NULL if no such\nresult exists.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/first_value
[FLOOR]
declaration=X
category=Numeric Functions
description=Returns the largest integer value not greater than X.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/floor
[FORMAT]
declaration=num, decimal_position[, locale]
category=String Functions
description=Formats the given number for display as a string, adding separators to\nappropriate position and rounding the results to the given decimal position. For\ninstance, it would format 15233.345 to 15,233.35.\n\nIf the given decimal position is 0, it rounds to return no decimal point or\nfractional part. You can optionally specify a locale value to format numbers to\nthe pattern appropriate for the given region.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/format
[FORMAT_BYTES]
declaration=double
category=Miscellaneous Functions
since=11.8.0
description=Given a byte count, returns a string consisting of a value and the units in a\nhuman-readable format. The units will be in bytes, KiB (kibibytes), MiB\n(mebibytes), GiB (gibibytes), TiB (tebibytes), PiB (pebibytes) or EiB\n(exbibytes).\n\nThe binary prefixes (kibi, mebi, gibi, tebi, pebi and exbi) were created in\nDecember 1998 by the International Electrotechnical Commission to avoid possible\nambiguity, as the widely-used prefixes kilo, mega, giga, tera, peta and exa can\nbe used to refer to both the power-of-10 decimal system multipliers and the\npower-of-two binary system multipliers.\n\nThis function is similar to the Sys Schema format_bytes function, except that\nfunction does not display exbibytes.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/miscellaneous-functions-format_bytes
[FORMAT_PICO_TIME]
declaration=time_val
category=Date and Time Functions
since=11.0.2
description=Given a time in picoseconds, returns a human-readable time value and unit\nindicator. Resulting unit is dependent on the length of the argument, and can\nbe:\n\n- ps - picoseconds\n- ns - nanoseconds\n- us - microseconds\n- ms - milliseconds\n- s - seconds\n- min - minutes\n- h - hours\n- d - days\n\nWith the exception of results under one nanosecond, which are not rounded and\nare represented as whole numbers, the result is rounded to 2 decimal places,\nwith a minimum of 3 significant digits.\n\nReturns NULL if the argument is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/format_pico_time
[FOUND_ROWS]
declaration=
category=Information Functions
description=A SELECT statement may include a LIMIT clause to restrict the number of rows the\nserver returns to the client. In some cases, it is desirable to know how many\nrows the statement would have returned without the LIMIT, but without running\nthe statement again. To obtain this row count, include an SQL_CALC_FOUND_ROWS\noption in the SELECT statement, and then invoke FOUND_ROWS() afterwards.\n\nYou can also use FOUND_ROWS() to obtain the number of rows returned by a SELECT\nwhich does not contain a LIMIT clause. In this case you don't need to use the\nSQL_CALC_FOUND_ROWS option. This can be useful for example in a stored\nprocedure.\n\nAlso, this function works with some other statements which return a result set,\nincluding SHOW, DESC and HELP. For DELETE ... RETURNING you should use\nROW_COUNT(). It also works as a prepared statement, or after executing a\nprepared statement.\n\nStatements which don't return any results don't affect FOUND_ROWS() - the\nprevious value will still be returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/found_rows
[FROM_BASE64]
declaration=str
category=String Functions
description=Decodes the given base-64 encode string, returning the result as a binary\nstring. Returns NULL if the given string is NULL or if it's invalid.\n\nIt is the reverse of the TO_BASE64 function.\n\nThere are numerous methods to base-64 encode a string. MariaDB uses the\nfollowing:\n\n- It encodes alphabet value 64 as '+'.\n- It encodes alphabet value 63 as '/'.\n- It codes output in groups of four printable characters. Each three byte of\n  data encoded uses four characters. If the final group is incomplete, it pads\n  the difference with the '=' character.\n- It divides long output, adding a new line very 76 characters.\n- In decoding, it recognizes and ignores newlines, carriage returns, tabs and\n  space whitespace characters.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/from_base64
[FROM_DAYS]
declaration=N
category=Date and Time Functions
description=Given a day number N, returns a DATE value. The day count is based on the number\nof days from the start of the standard calendar (0000-00-00).\n\nThe function is not designed for use with dates before the advent of the\nGregorian calendar in October 1582. Results will not be reliable since it\ndoesn't account for the lost days when the calendar changed from the Julian\ncalendar.\n\nThis is the converse of the TO_DAYS() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/from_days
[FROM_UNIXTIME1]
name=FROM_UNIXTIME
declaration=unix_timestamp
category=Date and Time Functions
description=Converts the number of seconds from the epoch (1970-01-01 00:00:00 UTC) to\naTIMESTAMP value, the opposite of what UNIX_TIMESTAMP() is doing. Returns NULL\nif the result would be outside of the valid range of TIMESTAMP values.\n\nIf format is given, the result is exactly equivalent to\n\nFrom MariaDB 11.7:\n\nTimestamps in MariaDB have a maximum value of 4294967295, equivalent to\n2106-02-07 06:28:15. This is due to the underlying 32-bit limitation. Using the\nfunction on a timestamp beyond this will result in NULL being returned. Use\nDATETIME as a storage type if you require dates beyond this.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/from_unixtime
[FROM_UNIXTIME2]
name=FROM_UNIXTIME
declaration=unix_timestamp,format
category=Date and Time Functions
description=Converts the number of seconds from the epoch (1970-01-01 00:00:00 UTC) to\naTIMESTAMP value, the opposite of what UNIX_TIMESTAMP() is doing. Returns NULL\nif the result would be outside of the valid range of TIMESTAMP values.\n\nIf format is given, the result is exactly equivalent to\n\nFrom MariaDB 11.7:\n\nTimestamps in MariaDB have a maximum value of 4294967295, equivalent to\n2106-02-07 06:28:15. This is due to the underlying 32-bit limitation. Using the\nfunction on a timestamp beyond this will result in NULL being returned. Use\nDATETIME as a storage type if you require dates beyond this.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/from_unixtime
[GEOMCOLLFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a GEOMETRYCOLLECTION value using its WKT representation and SRID.\n\nST_GeomCollFromText(), ST_GeometryCollectionFromText(), GeomCollFromText() and\nGeometryCollectionFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomcollfromtext
[GEOMCOLLFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a GEOMETRYCOLLECTION value using its WKB representation and SRID.\n\nST_GeomCollFromWKB(), ST_GeometryCollectionFromWKB(), GeomCollFromWKB() and\nGeometryCollectionFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomcollfromwkb
[GEOMETRYCOLLECTION]
declaration=g1,g2,...
category=Geometry Constructors
description=Constructs a WKB GeometryCollection. If any argument is not a well-formed WKB\nrepresentation of a geometry, the return value is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/geometrycollection
[GEOMETRYCOLLECTIONFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a GEOMETRYCOLLECTION value using its WKT representation and SRID.\n\nST_GeomCollFromText(), ST_GeometryCollectionFromText(), GeomCollFromText() and\nGeometryCollectionFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomcollfromtext
[GEOMETRYCOLLECTIONFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a GEOMETRYCOLLECTION value using its WKB representation and SRID.\n\nST_GeomCollFromWKB(), ST_GeometryCollectionFromWKB(), GeomCollFromWKB() and\nGeometryCollectionFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomcollfromwkb
[GEOMETRYFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[GEOMETRYFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a geometry value of any type using its WKB representation and SRID.\n\nST_GeomFromWKB(), ST_GeometryFromWKB(), GeomFromWKB() and GeometryFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomfromwkb
[GEOMETRYN]
declaration=gc,N
category=Geometry Properties
description=Returns the N-th geometry in the GeometryCollection gc. Geometries are numbered\nbeginning with 1.\n\nST_GeometryN() and GeometryN() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_geometryn
[GEOMETRYTYPE]
declaration=g
category=Geometry Properties
description=Returns as a string the name of the geometry type of which the geometry instance\ng is a member. The name corresponds to one of the instantiable Geometry\nsubclasses.\n\nST_GeometryType() and GeometryType() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_geometrytype
[GEOMFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[GEOMFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a geometry value of any type using its WKB representation and SRID.\n\nST_GeomFromWKB(), ST_GeometryFromWKB(), GeomFromWKB() and GeometryFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomfromwkb
[GET_FORMAT]
declaration={DATE|DATETIME|TIME}, {'EUR'|'USA'|'JIS'|'ISO'|'INTERNAL'}
category=Date and Time Functions
description=Returns a format string. This function is useful in combination with the\nDATE_FORMAT() and the STR_TO_DATE() functions.\n\nPossible result formats are:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/get_format
[GET_LOCK]
declaration=str,timeout
category=Miscellaneous Functions
description=Tries to obtain a lock with a name given by the string str, using a timeout of\ntimeout seconds. Returns 1 if the lock was obtained successfully, 0 if the\nattempt timed out (for example, because another client has previously locked the\nname), or NULL if an error occurred (such as running out of memory or the thread\nwas killed with mariadb-admin kill).\n\nA lock is released with RELEASE_LOCK(), when the connection terminates (either\nnormally or abnormally). A connection can hold multiple locks at the same time,\nso a lock that is no longer needed needs to be explicitly released.\n\nThe IS_FREE_LOCK function returns whether a specified lock is free or not, and\nthe IS_USED_LOCK whether the function is in use or not.\n\nLocks obtained with GET_LOCK() do not interact with transactions. That is,\ncommitting a transaction does not release any such locks obtained during the\ntransaction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/get_lock
[GLENGTH]
declaration=ls
category=LineString Properties
description=Returns as a double-precision number the length of the LineString value ls in\nits associated spatial reference.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/glength
[GREATEST]
declaration=value1,value2,...
category=Comparison Operators
description=With two or more arguments, returns the largest (maximum-valued) argument. The\narguments are compared using the same rules as for LEAST(). This includes how\nNULL and invalid temporal arguments such as DATE('') are handled.\n\nURL: https://mariadb.com/docs/server/reference/sql-structure/operators/comparison-operators/greatest
[GROUP_CONCAT]
declaration=expr
category=Aggregate Functions
description=This function returns a string result with the concatenated non-NULL values from\na group. If any expr in GROUP_CONCAT evaluates to NULL, that tuple is not\npresent in the list returned by GROUP_CONCAT.\n\nIt returns NULL if all arguments are NULL, or there are no matching rows.\n\nThe maximum returned length in bytes is determined by the group_concat_max_len\nserver system variable, which defaults to 1M.\n\nIf group_concat_max_len <= 512, the return type is VARBINARY or VARCHAR;\notherwise, the return type is the smallest BLOB or TEXT type that can hold a\nresult of that length. With the default group_concat_max_len, that is MEDIUMBLOB\nor MEDIUMTEXT. The choice between binary or non-binary types depends on the\ninput.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/group_concat
[HEX]
declaration=N_or_S
category=String Functions
description=If N_or_S is a number, returns a string representation of the hexadecimal value\nof N, where N is a longlong (BIGINT) number. This is equivalent to\nCONV(N,10,16).\n\nIf N_or_S is a string, returns a hexadecimal string representation ofN_or_S\nwhere each byte of each character in N_or_S is converted to two hexadecimal\ndigits. If N_or_S is NULL, returns NULL. The inverse of this operation is\nperformed by the UNHEX() function.\n\nHEX() with an INET6 argument returns a hexadecimal representation of the\nunderlying 16-byte binary string.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/hex
[HOUR]
declaration=time
category=Date and Time Functions
description=Returns the hour for time. The range of the return value is 0 to 23 for\ntime-of-day values. However, the range of TIME values actually is much larger,\nso HOUR can return values greater than 23.\n\nThe return value is always positive, even if a negative TIME value is provided.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/hour
[IF]
declaration=expr1,expr2,expr3
category=Control Flow Functions
description=If expr1 is TRUE (expr1 <> 0 and expr1 <> NULL) then IF() returns expr2;\notherwise it returns expr3. IF() returns a numeric or string value, depending on\nthe context in which it is used.\n\nexpr1 is evaluated as a number. A string that doesn't start with a number\nevaluates to 0, so it counts as false, and a string with trailing non-numeric\ncharacters is truncated to its leading number. Both produce warning 1292.\n\nNote: There is also an IF statement which differs from theIF() function\ndescribed here.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/control-flow-functions/if-function
[IFNULL]
declaration=expr1,expr2
category=Control Flow Functions
description=If expr1 is not NULL, IFNULL() returns expr1; otherwise it returns expr2.\nIFNULL() returns a numeric or string value, depending on the context in which it\nis used.\n\nNVL() is an alias for IFNULL().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/control-flow-functions/ifnull
[INET6_ATON]
declaration=expr
category=Miscellaneous Functions
since=10.0.12
description=Given an IPv6 or IPv4 network address as a string, returns a binary string that\nrepresents the numeric value of the address.\n\nNo trailing zone ID's or trailing network masks are permitted. For IPv4\naddresses, or IPv6 addresses with IPv4 address parts, no classful addresses or\ntrailing port numbers are permitted and octal numbers are not supported.\n\nThe returned binary string will be VARBINARY(16) or VARBINARY(4) for IPv6 and\nIPv4 addresses respectively.\n\nReturns NULL if the argument is not understood.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/inet6_aton
[INET6_NTOA]
declaration=expr
category=Miscellaneous Functions
since=10.0.12
description=Given an IPv6 or IPv4 network address as a numeric binary string, returns the\naddress as a nonbinary string in the connection character set.\n\nThe return string is lowercase, and is platform independent, since it does not\nuse functions specific to the operating system. It has a maximum length of 39\ncharacters.\n\nReturns NULL if the argument is not understood.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/inet6_ntoa
[INET_ATON]
declaration=expr
category=Miscellaneous Functions
description=Given the dotted-quad representation of an IPv4 network address as a string,\nreturns an integer that represents the numeric value of the address. Addresses\nmay be 4- or 8-byte addresses.\n\nReturns NULL if the argument is not understood.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/inet_aton
[INET_NTOA]
declaration=expr
category=Miscellaneous Functions
description=Given a numeric IPv4 network address in network byte order, returns the\ndotted-quad representation of the address as a string. The address must be in\nthe range 0 to 4294967295; for a larger value, INET_NTOA() returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/inet_ntoa
[INSERT]
declaration=str,pos,len,newstr
category=String Functions
description=Returns the string str, with the substring beginning at position pos and len\ncharacters long replaced by the string newstr. Returns the original string if\npos is not within the length of the string. Replaces the rest of the string from\nposition pos if len is not within the length of the rest of the string. Returns\nNULL if any argument is NULL.\n\nA len of 0 inserts newstr without replacing any characters. Because a pos past\nthe last character returns the original string, INSERT() can't append to a\nstring; use CONCAT() instead.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/insert-function
[INSTR]
declaration=str,substr
category=String Functions
description=Returns the position of the first occurrence of substring substr in string str.\nThis is the same as the two-argument form of LOCATE(), except that the order of\nthe arguments is reversed.\n\nINSTR() follows the collation of its arguments. With the default collation the\nsearch is case-insensitive. With a case-sensitive or binary collation, or a\nbinary string, it is case-sensitive: INSTR(BINARY 'MariaDB','db') returns 0.\n\nIf any argument is NULL, returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/instr
[INTERIORRINGN]
declaration=poly,N
category=Polygon Properties
description=Returns the N-th interior ring for the Polygon value poly as a LineString. Rings\nare numbered beginning with 1.\n\nST_InteriorRingN() and InteriorRingN() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_interiorringn
[INTERSECTS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 spatially intersects geometry g2.\n\nINTERSECTS() is based on the original MySQL implementation and uses object\nbounding rectangles, while ST_INTERSECTS() uses object shapes.\n\nINTERSECTS() tests the opposite relationship to DISJOINT().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/intersects
[INTERVAL]
declaration=N0,N1,N2,N3,...
category=Comparison Operators
description=Returns the index of the last argument that is less than or equal to the first\nargument, or is NULL.\n\nReturns 0 if N0 < N1, 1 if N1 <= N0 < N2, 2 if N2 <= N0 < N3 and so on or -1 if\nN0 is NULL. All arguments are treated as integers. It is required that N1 <= N2\n<= N3 <= ... <= Nn for this function to work correctly because a fast binary\nsearch is used.\n\nURL: https://mariadb.com/docs/server/reference/sql-structure/operators/comparison-operators/interval
[ISCLOSED]
declaration=g
category=Geometry Properties
description=Returns 1 if a given LINESTRING's start and end points are the same, or 0 if\nthey are not the same.\n\nST_IsClosed() and IsClosed() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_isclosed
[ISEMPTY]
declaration=g
category=Geometry Properties
description=IsEmpty is a function defined by the OpenGIS specification, but is not fully\nimplemented by MariaDB or MySQL.\n\nSince MariaDB and MySQL do not support GIS EMPTY values such as POINT EMPTY, as\nimplemented it simply returns 1 if the geometry value g is invalid, 0 if it is\nvalid, and NULL if the argument is NULL.\n\nST_IsEmpty() and IsEmpty() are synonyms.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_isempty
[ISNULL]
declaration=expr
category=Comparison Operators
description=If expr is NULL, ISNULL() returns 1, otherwise it returns 0.\n\nSee also NULL Values in MariaDB.\n\nURL: https://mariadb.com/docs/server/reference/sql-structure/operators/comparison-operators/isnull
[ISRING]
declaration=g
category=Geometry Properties
since=10.1.2
description=Returns true if a given LINESTRING is a ring, that is, both ST_IsClosed and\nST_IsSimple. A simple curve does not pass through the same point more than once.\nHowever, see MDEV-7510.\n\nSt_IsRing() and IsRing() are synonyms.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_isring
[ISSIMPLE]
declaration=g
category=Geometry Properties
description=Returns 1 if the geometry g is simple, 0 if it is not, and NULL if g is NULL.\n\nA geometry is simple if it has no anomalous geometric points, such as\nself-intersections or self-tangency:\n\n- A POINT is always simple.\n- A LINESTRING is simple if it does not cross or touch itself. A closed\n  LINESTRING, whose first and last points are the same, is simple if it does not\n  touch itself anywhere else.\n- A MULTIPOINT is simple if no two of its points are the same.\n\nST_IsSimple() and IsSimple() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_issimple
[IS_FREE_LOCK]
declaration=str
category=Miscellaneous Functions
description=Checks whether the lock named str is free to use (that is, not locked). Returns\n1 if the lock is free (no one is using the lock),0 if the lock is in use, and\nNULL if an error occurs (such as an incorrect argument, like an empty string or\nNULL). str is case-sensitive.\n\nIf the metadata_lock_info plugin is installed, the Information Schema\nmetadata_lock_info table contains information about locks of this kind (as well\nas metadata locks).\n\nStatements using the IS_FREE_LOCK function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/is_free_lock
[IS_IPV4]
declaration=expr
category=Miscellaneous Functions
since=10.0.12
description=If the expression is a valid IPv4 address, returns 1, otherwise returns 0.\n\nIS_IPV4() is stricter than INET_ATON(), but as strict as INET6_ATON(), in\ndetermining the validity of an IPv4 address. This implies that if IS_IPV4\nreturns 1, the same expression will always return a non-NULL result when passed\nto INET_ATON(), but that the reverse may not apply.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/is_ipv4
[IS_IPV4_COMPAT]
declaration=expr
category=Miscellaneous Functions
since=10.0.12
description=Returns 1 if a given numeric binary string IPv6 address, such as returned by\nINET6_ATON(), is IPv4-compatible, otherwise returns 0.\n\nWhen the argument is not INET6, automatic implicit CAST to INET6 is applied. As\na consequence, IS_IPV4_COMPAT now understands arguments in both text\nrepresentation and binary(16) representation.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/is_ipv4_compat
[IS_IPV4_MAPPED]
declaration=expr
category=Miscellaneous Functions
since=10.0.12
description=Returns 1 if a given a numeric binary string IPv6 address, such as returned by\nINET6_ATON(), is a valid IPv4-mapped address, otherwise returns 0.\n\nWhen the argument is not INET6, automatic implicit CAST to INET6 is applied. As\na consequence, IS_IPV4_MAPPED now understands arguments in both text\nrepresentation and binary(16) representation.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/is_ipv4_mapped
[IS_IPV6]
declaration=expr
category=Miscellaneous Functions
since=10.0.12
description=Returns 1 if the expression is a valid IPv6 address specified as a string,\notherwise returns 0. Does not consider IPv4 addresses to be valid IPv6\naddresses.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/is_ipv6
[IS_USED_LOCK]
declaration=str
category=Miscellaneous Functions
description=Checks whether the lock named str is in use (that is, locked). If so, it returns\nthe connection identifier of the client that holds the lock. Otherwise, it\nreturns NULL. str is case-sensitive.\n\nIf the metadata_lock_info plugin is installed, the Information Schema\nmetadata_lock_info table contains information about locks of this kind (as well\nas metadata locks).\n\nStatements using the IS_USED_LOCK function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/is_used_lock
[JSON_ARRAY]
declaration=[value[, value2] ...]
category=JSON Functions
since=10.2.3
description=Returns a JSON array containing the listed values. The list can be empty.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_array
[JSON_ARRAYAGG]
declaration=column_or_expression
category=JSON Functions
since=10.5.0
description=JSON_ARRAYAGG returns a JSON array containing an element for each value in a\ngiven set of JSON or SQL values. It acts on a column or an expression that\nevaluates to a single value.\n\nThe maximum returned length in bytes is determined by the group_concat_max_len\nserver system variable.\n\nReturns NULL in the case of an error, or if the result contains no rows.\n\nJSON_ARRAYAGG cannot be used as a window function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_arrayagg
[JSON_ARRAY_APPEND]
declaration=json_doc, path, value[, path, value] ...
category=JSON Functions
since=10.2.3
description=Appends values to the end of the specified arrays within a JSON document,\nreturning the result, or NULL if any of the arguments are NULL.\n\nEvaluation is performed from left to right, with the resulting document from the\nprevious pair becoming the new value against which the next pair is evaluated.\n\nIf the json_doc is not a valid JSON document, or if any of the paths are not\nvalid, or contain a * or wildcard, an error is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_array_append
[JSON_ARRAY_INSERT]
declaration=json_doc, path, value[, path, value] ...
category=JSON Functions
since=10.2.3
description=Inserts a value into a JSON document, returning the modified document, or NULL\nif any of the arguments are NULL.\n\nEvaluation is performed from left to right, with the resulting document from the\nprevious pair becoming the new value against which the next pair is evaluated.\n\nIf the json_doc is not a valid JSON document, or if any of the paths are not\nvalid, or contain a * or wildcard, an error is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_array_insert
[JSON_ARRAY_INTERSECT]
declaration=arr1, arr2
category=JSON Functions
since=11.2.1
description=Finds intersection between two json arrays and returns an array of items found\nin both array.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_array_intersect
[JSON_COMPACT]
declaration=json_doc
category=JSON Functions
since=10.2.4
description=Removes all unnecessary spaces so the json document is as short as possible.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_compact
[JSON_CONTAINS]
declaration=json_doc, val[, path]
category=JSON Functions
since=10.2.3
description=Returns whether or not the specified value is found in the given JSON document\nor, optionally, at the specified path within the document. Returns 1 if it does,\n0 if not and NULL if any of the arguments are null. An error occurs if the\ndocument or path is not valid, or contains the * or wildcards.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_contains
[JSON_CONTAINS_PATH]
declaration=json_doc, return_arg, path[, path] ...
category=JSON Functions
since=10.2.3
description=Indicates whether the given JSON document contains data at the specified path or\npaths. Returns 1 if it does, 0 if not and NULL if any of the arguments are null.\n\nThe _return_arg_ can be one or all:\n\n- one - Returns 1 if at least one path exists within the JSON document.\n- all - Returns 1 only if all paths exist within the JSON document.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_contains_path
[JSON_DEPTH]
declaration=json_doc
category=JSON Functions
since=10.2.3
description=Returns the maximum depth of the given JSON document, or NULL if the argument is\nnull. An error occurs if the argument is an invalid JSON document.\n\n- Scalar values or empty arrays or objects have a depth of 1.\n- Arrays with only scalar values and objects with only scalar values for all\n  keys have depth of 1.\n- In all other cases, the depth can be 2 or greater.\n\nFrom MariaDB 12.2:\n\nThere is no maximum depth level - it's unlimited.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_depth
[JSON_DETAILED]
declaration=json_doc[, tab_size]
category=JSON Functions
since=10.2.4
description=Represents JSON in the most understandable way emphasizing nested structures.\n\nFrom MariaDB 10.10.3 / 10.9.5 / 10.8.7 / 10.7.8 / 10.6.12:\n\nJSON_PRETTY is an alias for JSON_DETAILED .\n\nBefore MariaDB 10.10.3 / 10.9.5 / 10.8.7 / 10.7.8 / 10.6.12:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_detailed
[JSON_EQUALS]
declaration=json1, json2
category=JSON Functions
since=10.7.1
description=Checks if there is equality between two json objects. Returns 1 if it there is,\n0 if not, or NULL if any of the arguments are null.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_equals
[JSON_EXISTS]
declaration=json_doc, json_path
category=JSON Functions
since=10.2.3
description=Determines whether json_doc has an element pointed to by path json_path. Returns\n1 if the element exists, 0 if not, or NULL if any of the inputs were NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_exists
[JSON_EXTRACT]
declaration=json_doc, path[, path] ...
category=JSON Functions
since=10.2.3
description=Extracts data from a JSON document. The extracted data is selected from the\nparts matching the path arguments. Returns all matched values; either as a\nsingle matched value, or, if the arguments could return multiple values, a\nresult autowrapped as an array in the matching order.\n\nReturns NULL if no paths match or if any of the arguments are NULL.\n\nAn error occurs if any path argument is not a valid path, or if the json_doc\nargument is not a valid JSON document.\n\nThe path expression be a JSONPath expression as supported by MariaDB\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_extract
[JSON_INSERT]
declaration=json_doc, path, val[, path, val] ...
category=JSON Functions
since=10.2.3
description=Inserts data into a JSON document, returning the resulting document or NULL if\neither of the _json_doc_ or path arguments are null.\n\nAn error occurs if the JSON document is invalid, or if any of the paths are\ninvalid or contain a * or wildcard.\n\nJSON_INSERT can only insert data, while JSON_REPLACE can only update. JSON_SET\ncan update or insert data.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_insert
[JSON_KEYS]
declaration=json_doc[, path]
category=JSON Functions
since=10.2.3
description=Returns the keys as a JSON array from the top-level value of a JSON object or,\nif the optional path argument is provided, the top-level keys from the path.\n\nExcludes keys from nested sub-objects in the top level value. The resulting\narray will be empty if the selected object is empty.\n\nReturns NULL if any of the arguments are null, a given path does not locate an\nobject, or if the json_doc argument is not an object.\n\nAn error will occur if JSON document is invalid, the path is invalid or if the\npath contains a * or wildcard.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_keys
[JSON_KEY_VALUE]
declaration=obj, json_path
category=JSON Functions
since=11.2.1
description=JSON_KEY_VALUE extracts key/value pairs from a JSON object. The JSON path\nparameter is used to only return key/value pairs for matching JSON objects.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_key_value
[JSON_LENGTH]
declaration=json_doc[, path]
category=JSON Functions
since=10.2.3
description=Returns the length of a JSON document, or, if the optional path argument is\ngiven, the length of the value within the document specified by the path.\n\nReturns NULL if any of the arguments argument are null or the path argument does\nnot identify a value in the document.\n\nAn error occurs if the JSON document is invalid, the path is invalid or if the\npath contains a * or wildcard.\n\nLength will be determined as follow:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_length
[JSON_LOOSE]
declaration=json_doc
category=JSON Functions
since=10.2.4
description=Adds spaces to a JSON document to make it look more readable.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_loose
[JSON_MERGE]
declaration=json_doc, json_doc[, json_doc] ...
category=JSON Functions
since=10.2.3
description=Merges the given JSON documents.\n\nReturns the merged result, or NULL if any argument is NULL.\n\nAn error occurs if any of the arguments are not valid JSON documents.\n\nJSON_MERGE is deprecated. JSON_MERGE_PATCH is an RFC 7396-compliant replacement,\nand JSON_MERGE_PRESERVE is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_merge
[JSON_MERGE_PATCH]
declaration=json_doc, json_doc[, json_doc] ...
category=JSON Functions
since=10.2.25
description=Merges the given JSON documents, returning the merged result, or NULL if any\nargument is NULL.\n\nJSON_MERGE_PATCH is an RFC 7396-compliant replacement for JSON_MERGE, which is\ndeprecated.\n\nUnlike JSON_MERGE_PRESERVE, members with duplicate keys are not preserved.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_merge_patch
[JSON_MERGE_PRESERVE]
declaration=json_doc, json_doc[, json_doc] ...
category=JSON Functions
since=10.2.25
description=Merges the given JSON documents, returning the merged result, or NULL if any\nargument is NULL.\n\nJSON_MERGE_PRESERVE is a synonym for JSON_MERGE, which has been deprecated.\n\nUnlike JSON_MERGE_PATCH, members with duplicate keys are preserved.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_merge_preserve
[JSON_NORMALIZE]
declaration=json
category=JSON Functions
since=10.7.1
description=Recursively sorts keys and removes spaces, allowing comparison of json documents\nfor equality.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_normalize
[JSON_OBJECT]
declaration=[key, value[, key, value] ...]
category=JSON Functions
since=10.2.3
description=Returns a JSON object containing the given key/value pairs. The key/value list\ncan be empty.\n\nAn error will occur if there are an odd number of arguments, or any key name is\nNULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_object
[JSON_OBJECTAGG]
declaration=key, value
category=JSON Functions
since=10.5.0
description=JSON_OBJECTAGG returns a JSON object containing key-value pairs. It takes two\nexpressions that evaluate to a single value, or two column names, as arguments,\nthe first used as a key, and the second as a value.\n\nThe maximum returned length in bytes is determined by the group_concat_max_len\nserver system variable.\n\nReturns NULL in the case of an error, or if the result contains no rows.\n\nJSON_OBJECTAGG cannot be used as a window function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_objectagg
[JSON_OBJECT_FILTER_KEYS]
declaration=obj, array_keys
category=JSON Functions
since=11.2.1
description=JSON_OBJECT_FILTER_KEYS returns a JSON object with keys from the object that are\nalso present in the array as string. It is used when one wants to get key-value\npair such that the keys are common but the values may not be common.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_object_filter_keys
[JSON_OBJECT_TO_ARRAY]
declaration=Obj
category=JSON Functions
since=11.2.1
description=It is used to convert all JSON objects found in a JSON document to JSON arrays\nwhere each item in the outer array represents a single key-value pair from the\nobject. It is used when we want not just common keys, but also common values. It\ncan be used in conjunction with JSON_ARRAY_INTERSECT().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_object_to_array
[JSON_OVERLAPS]
declaration=json_doc1, json_doc2
category=JSON Functions
since=10.9.1
description=JSON_OVERLAPS() compares two json documents and returns true if they have at\nleast one common key-value pair between two objects, array element common\nbetween two arrays, or array element common with scalar if one of the arguments\nis a scalar and other is an array. If two json documents are scalars, it returns\ntrue if they have same type and value.\n\nIf none of the above conditions are satisfied then it returns false.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_overlaps
[JSON_PRETTY]
declaration=json_doc[, tab_size]
category=JSON Functions
since=10.4.28
description=Represents JSON in the most understandable way emphasizing nested structures.\n\nFrom MariaDB 10.10.3 / 10.9.5 / 10.8.7 / 10.7.8 / 10.6.12:\n\nJSON_PRETTY is an alias for JSON_DETAILED .\n\nBefore MariaDB 10.10.3 / 10.9.5 / 10.8.7 / 10.7.8 / 10.6.12:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_detailed
[JSON_QUERY]
declaration=json_doc, path
category=JSON Functions
since=10.2.3
description=Given a JSON document, returns an object or array specified by the path. Returns\nNULL if not given a valid JSON document, or if there is no match.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_query
[JSON_QUOTE]
declaration=json_value
category=JSON Functions
since=10.2.3
description=Quotes a string as a JSON value, usually for producing valid JSON string\nliterals for inclusion in JSON documents. Wraps the string with double quote\ncharacters and escapes interior quotes and other special characters, returning a\nutf8mb4 string.\n\nReturns NULL if the argument is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_quote
[JSON_REMOVE]
declaration=json_doc, path[, path] ...
category=JSON Functions
since=10.2.3
description=Removes data from a JSON document returning the result, or NULL if any of the\narguments are null. If the element does not exist in the document, no changes\nare made.\n\nThe function returns NULL and throws a warning if the JSON document is invalid,\nthe path is invalid, contains a range, or contains a * or wildcard.\n\nPath arguments are evaluated from left to right, with the result from the\nearlier evaluation being used as the value for the next.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_remove
[JSON_REPLACE]
declaration=json_doc, path, val[, path, val] ...
category=JSON Functions
since=10.2.3
description=Replaces existing values in a JSON document, returning the result, or NULL if\nany of the arguments are NULL.\n\nAn error will occur if the JSON document is invalid, the path is invalid or if\nthe path contains a * or wildcard.\n\nPaths and values are evaluated from left to right, with the result from the\nearlier evaluation being used as the value for the next.\n\nJSON_REPLACE can only update data, while JSON_INSERT can only insert. JSON_SET\ncan update or insert data.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_replace
[JSON_SCHEMA_VALID]
declaration=schema, json
category=JSON Functions
since=11.1.1
description=JSON_SCHEMA_VALID allows MariaDB to support JSON schema validation. If a given\njson is valid against a schema it returns true. When JSON does not validate\nagainst the schema, it does not return a message about which keyword it failed\nagainst and only returns false.\n\nThe function supports JSON Schema Draft 2020 with a few exceptions:\n\n- External resources are not supported.\n- Hyper schema keywords are not supported.\n- Formats like date, email etc are treated as annotations.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_schema_valid
[JSON_SEARCH]
declaration=json_doc, return_arg, search_str[, escape_char[, path] ...]
category=JSON Functions
since=10.2.3
description=Returns the path to the given string within a JSON document, or NULL if any of\n_json_doc_, _search_str_ or a path argument is NULL; if the search string is not\nfound, or if no path exists within the document.\n\nA warning will occur if the JSON document is not valid, any of the path\narguments are not valid, if _return_arg_ is neither one nor all, or if the\nescape character is not a constant. NULL will be returned.\n\n_return_arg_ can be one of two values:\n\n- 'one: Terminates after finding the first match, so will return one path\n  string. If there is more than one match, it is undefined which is considered\n  first.\n- all: Returns all matching path strings, without duplicates. Multiple strings\n  are autowrapped as an array. The order is undefined.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_search
[JSON_SET]
declaration=json_doc, path, val[, path, val] ...
category=JSON Functions
since=10.2.3
description=Updates or inserts data into a JSON document, returning the result, or NULL if\nany of the arguments are NULL or the optional path fails to find an object.\n\nAn error will occur if the JSON document is invalid, the path is invalid or if\nthe path contains a * or a wildcard.\n\nJSON_SET can update or insert data, while JSON_REPLACE can only update, and\nJSON_INSERT only insert.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_set
[JSON_TABLE]
declaration=json_doc, context_path COLUMNS (column_list)
category=JSON Functions
since=10.6.0
description=JSON_TABLE can be used in contexts where a table reference can be used; in the\nFROM clause of a SELECT statement, and in multi-table UPDATE/DELETE statements.\n\njson_doc is the JSON document to extract data from. In the simplest case, it is\na string literal containing JSON. In more complex cases it can be an arbitrary\nexpression returning JSON. The expression may have references to columns of\nother tables. However, one can only refer to tables that precede this JSON_TABLE\ninvocation. For RIGHT JOIN, it is assumed that its outer side precedes the\ninner. All tables in outer selects are also considered preceding.\n\ncontext_path is a JSON Path expression pointing to a collection of nodes in\njson_doc that will be used as the source of rows.\n\nThe COLUMNS clause declares the names and types of the columns that JSON_TABLE\nreturns, as well as how the values of the columns are produced.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_table
[JSON_TYPE]
declaration=json_val
category=JSON Functions
since=10.2.3
description=Returns the type of a JSON value (as a string), or NULL if the argument is null.\n\nAn error will occur if the argument is an invalid JSON value.\n\nThe following is a complete list of the possible return types:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_type
[JSON_UNQUOTE]
declaration=val
category=JSON Functions
since=10.2.3
description=Unquotes a JSON value, returning a string, or NULL if the argument is null.\n\nAn error will occur if the given value begins and ends with double quotes and is\nan invalid JSON string literal.\n\nIf the given value is not a JSON string, value is passed through unmodified.\n\nCertain character sequences have special meanings within a string. Usually, a\nbackslash is ignored, but the escape sequences in the table below are recognised\nby MariaDB, unless the SQL Mode is set to NO_BACKSLASH_ESCAPES .\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_unquote
[JSON_VALID]
declaration=value
category=JSON Functions
since=10.2.3
description=Indicates whether the given value is a valid JSON document or not. Returns 1 if\nvalid, 0 if not, and NULL if the argument is NULL.\n\nThe JSON_VALID function is automatically used as a CHECK constraint for the JSON\ndata type alias in order to ensure that a valid json document is inserted.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_valid
[JSON_VALUE]
declaration=json_doc, path
category=JSON Functions
since=10.2.3
description=Given a JSON document, returns the scalar specified by the path. Returns NULL if\nnot given a valid JSON document, or if there is no match.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/json-functions/json_value
[KDF]
declaration=key_str, salt [, {info | iterations} [, kdf_name [, width ]]]
category=Encryption, Hashing and Compression Functions
since=11.3.0
description=KDF is a key derivation function, similar to OpenSSL's EVP_KDF_derive(). The\npurpose of a KDF is to be slow, so if the calculated value is lost/stolen, the\noriginal key_str is not achievable easily with modern GPU. KDFs are therefore an\nideal replacement for password hashes. KDFs can also pad out a password secret\nto the number of bits used in encryption algorithms.\n\nFor generating good encryption keys for AES_ENCRYPT a less expensive but\ncryptographically secure function like RANDOM_BYTES is recommended.\n\n- kdf_name is "hkdf" or "pbkdf2_hmac" (default).\n- Width (in bits) can be any number divisible by 8, by default it's taken from\n  @@block_encryption_mode.\n- Iterations must be positive, and is 1000 by default.\n\nNote that OpenSSL 1.0 doesn't support HKDF, so in this case NULL is returned.\nThis OpenSSL version is still used in SLES 12 and CentOS 7.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/kdf
[LAG]
declaration=expr[, offset]
category=Window Functions
since=10.2.2
description=The LAG function accesses data from a previous row according to the ORDER BY\nclause without the need for a self-join. The specific row is determined by the\noffset (default 1), which specifies the number of rows behind the current row to\nuse. An offset of 0 is the current row.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/lag
[LAST_DAY]
declaration=date
category=Date and Time Functions
description=Takes a date or datetime value and returns the corresponding value for the last\nday of the month. Returns NULL if the argument is invalid.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/last_day
[LAST_INSERT_ID1]
name=LAST_INSERT_ID
declaration=
category=Information Functions
description=LAST_INSERT_ID() (no arguments) returns the first automatically generated value\nsuccessfully inserted for an AUTO_INCREMENT column as a result of the most\nrecently executed INSERT statement. The value of LAST_INSERT_ID() remains\nunchanged if no rows are successfully inserted.\n\nIf one gives an argument to LAST_INSERT_ID(), then it will return the value of\nthe expression and the next call to LAST_INSERT_ID() will return the same value.\nThe value is also sent to the client and can be accessed by the mysql_insert_id\nfunction.\n\nFor example, after inserting a row that generates an AUTO_INCREMENT value, you\ncan get the value like this:\n\nYou can also use LAST_INSERT_ID() to delete the last inserted row:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/last_insert_id
[LAST_INSERT_ID2]
name=LAST_INSERT_ID
declaration=expr
category=Information Functions
description=LAST_INSERT_ID() (no arguments) returns the first automatically generated value\nsuccessfully inserted for an AUTO_INCREMENT column as a result of the most\nrecently executed INSERT statement. The value of LAST_INSERT_ID() remains\nunchanged if no rows are successfully inserted.\n\nIf one gives an argument to LAST_INSERT_ID(), then it will return the value of\nthe expression and the next call to LAST_INSERT_ID() will return the same value.\nThe value is also sent to the client and can be accessed by the mysql_insert_id\nfunction.\n\nFor example, after inserting a row that generates an AUTO_INCREMENT value, you\ncan get the value like this:\n\nYou can also use LAST_INSERT_ID() to delete the last inserted row:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/last_insert_id
[LAST_VALUE]
declaration=expr,[expr,...]
category=Information Functions
description=LAST_VALUE() evaluates all expressions and returns the last. This is useful\ntogether with setting user variables to a value with @var:=expr, for example\nwhen you want to get data of rows updated/deleted without having to do two\nqueries against the table.\n\nLAST_VALUE can be used as a window function.\n\nReturns NULL if no last value exists.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/last_value
[LCASE]
declaration=str
category=String Functions
description=LCASE() is a synonym for LOWER().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/lcase
[LEAD]
declaration=expr[, offset]
category=Window Functions
since=10.2.2
description=The LEAD function accesses data from a following row in the same result set\nwithout the need for a self-join. The specific row is determined by the offset\n(default 1), which specifies the number of rows ahead the current row to use. An\noffset of 0 is the current row.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/lead
[LEAST]
declaration=value1,value2,...
category=Comparison Operators
description=With two or more arguments, returns the smallest (minimum-valued) argument. The\narguments are compared using the following rules:\n\n- If the return value is used in an INTEGER context or all arguments are\n  integer-valued, they are compared as integers.\n- If the return value is used in a REAL context or all arguments are\n  real-valued, they are compared as reals.\n- If any argument is a case-sensitive string, the arguments are compared as\n  case-sensitive strings.\n- In all other cases, the arguments are compared as case-insensitive strings.\n\nLEAST() returns NULL if any argument is NULL.\n\nInvalid temporal arguments are an exception. An argument such as DATE('')\nreturns NULL when selected on its own. Inside LEAST(), it is compared the same\nway as with the other comparison operators:\n\nURL: https://mariadb.com/docs/server/reference/sql-structure/operators/comparison-operators/least
[LEFT]
declaration=str,len
category=String Functions
description=Returns the leftmost len characters from the string str, or NULL if any argument\nis NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/left
[LENGTH]
declaration=str
category=String Functions
description=Returns the length of the string str.\n\nIn the default mode, when Oracle mode is not set, the length is measured in\nbytes. In this case, a multi-byte character counts as multiple bytes. LENGTH()\nreturns the length in bytes, whereas CHAR_LENGTH() returns the number of\ncharacters. This means that, for a string containing five two-byte characters,\nLENGTH() returns 10, whereas CHAR_LENGTH() returns 5. When running Oracle mode,\nthe length is measured in characters, and LENGTH is a synonym for CHAR_LENGTH().\n\nIf str is not a string value, it is converted into a string. If str is NULL, the\nfunction returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/length
[LENGTHB]
declaration=str
category=String Functions
since=10.3.1
description=LENGTHB() returns the length of the given string, in bytes. When Oracle mode is\nnot set, this is a synonym for LENGTH.\n\nA multi-byte character counts as multiple bytes. This means that for a string\ncontaining five two-byte characters, LENGTHB() returns 10, whereas CHAR_LENGTH()\nreturns 5.\n\nIf str is not a string value, it is converted into a string. If str is NULL, the\nfunction returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/lengthb
[LINEFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a LINESTRING value using its WKT representation and SRID.\n\nST_LineFromText(), ST_LineStringFromText(), ST_LineFromText() and\nST_LineStringFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_linefromtext
[LINEFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a LINESTRING value using its WKB representation and SRID.\n\nST_LineFromWKB(), LineFromWKB(), ST_LineStringFromWKB(), and LineStringFromWKB()\nare synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_linefromwkb
[LINESTRING]
declaration=pt1,pt2,...
category=Geometry Constructors
description=WKB LineString from WKB Point coordinate data. Constructs a WKB LineString value\nfrom a number of WKB Point arguments. If any argument is not a WKB Point, the\nreturn value isNULL. If the number of Point arguments is less than two, the\nreturn value is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/linestring
[LINESTRINGFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a LINESTRING value using its WKT representation and SRID.\n\nST_LineFromText(), ST_LineStringFromText(), ST_LineFromText() and\nST_LineStringFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_linefromtext
[LINESTRINGFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a LINESTRING value using its WKB representation and SRID.\n\nST_LineFromWKB(), LineFromWKB(), ST_LineStringFromWKB(), and LineStringFromWKB()\nare synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_linefromwkb
[LN]
declaration=X
category=Numeric Functions
description=Returns the natural logarithm of X; that is, the base-e logarithm of X. If X is\nless than or equal to 0, or NULL, then NULL is returned.\n\nThe inverse of this function is EXP().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/ln
[LOAD_FILE]
declaration=file_name
category=String Functions
description=Reads the file and returns the file contents as a string. To use this function,\nthe file must be located on the server host, you must specify the full path name\nto the file, and you must have the FILE privilege. The file must be readable by\nall and it must be less than the size, in bytes, of the max_allowed_packet\nsystem variable. If the secure_file_priv system variable is set to a non-empty\ndirectory name, the file to be loaded must be located in that directory.\n\nIf the file does not exist or cannot be read because one of the preceding\nconditions is not satisfied, the function returns NULL.\n\nThe character_set_filesystem system variable has controlled interpretation of\nfile names that are given as literal strings.\n\nStatements using the LOAD_FILE() function are not safe for statement based\nreplication. This is because the slave will execute the LOAD_FILE() command\nitself. If the file doesn't exist on the slave, the function will return NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/load_file
[LOCALTIME]
declaration=[precision]
category=Date and Time Functions
description=LOCALTIME and LOCALTIME() are synonyms for NOW().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/localtime
[LOCALTIMESTAMP]
declaration=[precision]
category=Date and Time Functions
description=LOCALTIMESTAMP and LOCALTIMESTAMP() are synonyms for NOW().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/localtimestamp
[LOCATE1]
name=LOCATE
declaration=substr,str
category=String Functions
description=The first syntax returns the position of the first occurrence of substring\nsubstr in string str. The second syntax returns the position of the first\noccurrence of substring substr in string str, starting at position pos. Returns\n0 if substr is not in str.\n\nLOCATE() performs a case-insensitive search.\n\nIf any argument is NULL, returns NULL.\n\nINSTR() is the same as the two-argument form of LOCATE(), except that the order\nof the arguments is reversed.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/locate
[LOCATE2]
name=LOCATE
declaration=substr,str,pos
category=String Functions
description=The first syntax returns the position of the first occurrence of substring\nsubstr in string str. The second syntax returns the position of the first\noccurrence of substring substr in string str, starting at position pos. Returns\n0 if substr is not in str.\n\nLOCATE() performs a case-insensitive search.\n\nIf any argument is NULL, returns NULL.\n\nINSTR() is the same as the two-argument form of LOCATE(), except that the order\nof the arguments is reversed.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/locate
[LOG1]
name=LOG
declaration=B,X
category=Numeric Functions
description=If called with one parameter, this function returns the natural logarithm of X.\nIf X is less than or equal to 0, then NULL is returned.\n\nIf called with two parameters, it returns the logarithm of X to the base B. If B\nis <= 1 or X <= 0, the function returns NULL.\n\nIf any argument is NULL, the function returns NULL.\n\nThe inverse of this function (when called with a single argument) is the EXP()\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/log
[LOG2]
name=LOG
declaration=X
category=Numeric Functions
description=If called with one parameter, this function returns the natural logarithm of X.\nIf X is less than or equal to 0, then NULL is returned.\n\nIf called with two parameters, it returns the logarithm of X to the base B. If B\nis <= 1 or X <= 0, the function returns NULL.\n\nIf any argument is NULL, the function returns NULL.\n\nThe inverse of this function (when called with a single argument) is the EXP()\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/log
[LOG10]
declaration=X
category=Numeric Functions
description=Returns the base-10 logarithm of X.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/log10
[LOG2]
declaration=X
category=Numeric Functions
description=Returns the base-2 logarithm of X.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/log2
[LOWER]
declaration=str
category=String Functions
description=Returns the string str with all characters changed to lowercase according to the\ncurrent character set mapping. The default is latin1 (cp1252 West European).\n\nLCASE is a synonym for LOWER .\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/lower
[LPAD]
declaration=str, len [,padstr]
category=String Functions
description=Returns the string str, left-padded with the string padstr to a length of len\ncharacters. If str is longer than len, the return value is shortened to len\ncharacters. If padstr is omitted, the LPAD function pads spaces.\n\nReturns NULL if given a NULL argument. If the result is empty (zero length),\nreturns either an empty string or with SQL_MODE=Oracle, NULL.\n\nThe Oracle mode version of the function can be accessed outside of Oracle mode\nby using LPAD_ORACLE as the function name.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/lpad
[LTRIM]
declaration=str
category=String Functions
description=Returns the string str with leading space characters removed.\n\nReturns NULL if given a NULL argument. If the result is empty, returns either an\nempty string, or with SQL_MODE=Oracle, NULL.\n\nThe Oracle mode version of the function can be accessed outside of Oracle mode\nby using LTRIM_ORACLE as the function name.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/ltrim
[MAKEDATE]
declaration=year,dayofyear
category=Date and Time Functions
description=Returns a date, given year and day-of-year values. dayofyear must be greater\nthan 0 or the result is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/makedate
[MAKETIME]
declaration=hour,minute,second
category=Date and Time Functions
description=Returns a time value calculated from the hour, minute, and second arguments.\n\nIf minute or second are out of the range 0 to 60, NULL is returned. The hour can\nbe in the range -838 to 838, outside of which the value is truncated with a\nwarning.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/maketime
[MAKE_SET]
declaration=bits,str1,str2,...
category=String Functions
description=Returns a set value (a string containing substrings separated by "," characters)\nconsisting of the strings that have the corresponding bit in bits set. str1\ncorresponds to bit 0, str2 to bit 1, and so on. NULL values in str1, str2, ...\nare not appended to the result.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/make_set
[MASTER_GTID_WAIT]
declaration=gtid-list[, timeout
category=Miscellaneous Functions
description=This function takes a string containing a comma-separated list of global\ntransaction id's (similar to the value of, for example, gtid_binlog_pos). It\nwaits until the value of gtid_slave_pos has the same or higher seq_no within all\nreplication domains specified in the gtid-list; in other words, it waits until\nthe replica has reached the specified GTID position.\n\nAn optional second argument gives a timeout in seconds. If the timeout expires\nbefore the specified GTID position is reached, then the function returns -1.\nPassing NULL or a negative number for the timeout means no timeout, and the\nfunction will wait indefinitely.\n\nIf the wait completes without a timeout, 0 is returned. Passing NULL for the\ngtid-list makes the function return NULL immediately, without waiting.\n\nThe gtid-list may be the empty string, in which case MASTER_GTID_WAIT() returns\nimmediately. If the gtid-list contains fewer domains than gtid_slave_pos, then\nonly those domains are waited upon. If gtid-list contains a domain that is not\npresent in @@gtid_slave_pos, then MASTER_GTID_WAIT() will wait until an event\ncontaining such domain_id arrives on the replica (or until timed out or killed).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/master_gtid_wait
[MASTER_POS_WAIT]
declaration=log_name,log_pos[,timeout,["connection_name"]]
category=Miscellaneous Functions
description=This function is useful in replication for controlling primary/replica\nsynchronization. It blocks until the replica has read and applied all updates up\nto the specified position (log_name,log_pos) in the primary's binary log. The\nreturn value is the number of log events the replica had to wait for to advance\nto the specified position. The function returns NULL if the replica SQL thread\nis not started, the replica's primary information is not initialized, the\narguments are incorrect, or an error occurs. It returns -1 if the timeout has\nbeen exceeded. If the replica SQL thread stops whileMASTER_POS_WAIT() is\nwaiting, the function returns NULL. If the replica is past the specified\nposition, the function returns immediately.\n\nIf a timeout value is specified, MASTER_POS_WAIT() stops waiting when timeout\nseconds have elapsed. timeout must be greater than 0; a zero or negative timeout\nmeans no timeout.\n\nThe connection_name is used when you are using multi-source-replication. If you\ndon't specify it, it's set to the value of the default_master_connection system\nvariable.\n\nStatements using the MASTER_POS_WAIT() function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/master_pos_wait
[MATCH]
declaration=col1,col2,...
category=String Functions
description=A special construct used to perform a fulltext search on a fulltext index.\n\nSee Fulltext Index Overview for a full description, and Full-text Indexes for\nmore articles on the topic.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/match-against
[MAX]
declaration=[DISTINCT] expr
category=Aggregate Functions
description=Returns the largest, or maximum, value of expr. MAX() can also take a string\nargument in which case it returns the maximum string value. The DISTINCT keyword\ncan be used to find the maximum of the distinct values of expr, however, this\nproduces the same result as omitting DISTINCT.\n\nNote that SET and ENUM fields are compared by their string value rather than\ntheir relative position in the set, so MAX() may produce a different highest\nresult than ORDER BY DESC.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nMAX() can be used as a window function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/max
[MBRCONTAINS]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangle of g1 contains\nthe Minimum Bounding Rectangle of g2. This tests the opposite relationship as\nMBRWithin().\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrcontains
[MBRCOVEREDBY]
declaration=g1, g2
category=MBR (Minimum Bounding Rectangle)
since=11.7.0
description=Returns 1 if the minimum bounding rectangle of g1 is covered by the minimum\nbounding rectangle of g2, otherwise 0.\n\nReturns NULL If any argument is NULL, or an argument is an empty geometry.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrcoveredby
[MBRDISJOINT]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangles of the two\ngeometries g1 and g2 are disjoint. Two geometries are disjoint if they do not\nintersect, that is touch or overlap.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrdisjoint
[MBREQUAL]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangles of the two\ngeometries g1 and g2 are the same.\n\nMBREquals is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrequal
[MBREQUALS]
declaration=g1,g2
category=Geometry Relations
since=10.2.3
description=Returns 1 or 0 to indicate whether g1 is spatially equal to g2.\n\nEQUALS() is based on the original MySQL implementation and uses object bounding\nrectangles, while ST_EQUALS() uses object shapes.\n\nMBREQUALS is a synonym for Equals.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/equals
[MBRINTERSECTS]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangles of the two\ngeometries g1 and g2 intersect.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrintersects
[MBROVERLAPS]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangles of the two\ngeometries g1 and g2 overlap. The term spatially overlaps is used if two\ngeometries intersect and their intersection results in a geometry of the same\ndimension but not equal to either of the given geometries.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbroverlaps
[MBRTOUCHES]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangles of the two\ngeometries g1 and g2 touch. Two geometries spatially touch if the interiors of\nthe geometries do not intersect, but the boundary of one of the geometries\nintersects either the boundary or the interior of the other.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrtouches
[MBRWITHIN]
declaration=g1,g2
category=MBR (Minimum Bounding Rectangle)
description=Returns 1 or 0 to indicate whether the Minimum Bounding Rectangle of g1 is\nwithin the Minimum Bounding Rectangle of g2. This tests the opposite\nrelationship as MBRContains().\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/mbr-minimum-bounding-rectangle/mbrwithin
[MD5]
declaration=str
category=Encryption, Hashing and Compression Functions
description=Calculates an MD5 128-bit checksum for the string.\n\nThe return value is a 32-hex digit string, and a nonbinary string in the\nconnection character set and collation, determined by the values of the\ncharacter_set_connection and collation_connection system variables.\n\nNULL is returned if the argument was NULL.\n\nDon't use this function as an encryption function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/md5
[MEDIAN]
declaration=median expression
category=Window Functions
since=10.3.3
description=MEDIAN() is a window function that returns the median value of a range of\nvalues.\n\nIt is a specific case of PERCENTILE_CONT, with an argument of 0.5 and the ORDER\nBY column the one in MEDIAN's argument.\n\nIs equivalent to:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/median
[MICROSECOND]
declaration=expr
category=Date and Time Functions
description=Returns the microseconds from the time or datetime expression expr as a number\nin the range from 0 to 999999.\n\nIf expr is a time with no microseconds, zero is returned, while if expr is a\ndate with no time, zero with a warning is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/microsecond
[MID]
declaration=str,pos,len
category=String Functions
description=MID(str,pos,len) is a synonym for SUBSTRING(str,pos,len)!\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/mid
[MIN]
declaration=[DISTINCT] expr
category=Aggregate Functions
description=Returns the minimum value of expr. MIN() may take a string argument, in which\ncase it returns the minimum string value. The DISTINCT keyword can be used to\nfind the minimum of the distinct values of expr, however, this produces the same\nresult as omitting DISTINCT.\n\nNote that SET and ENUM fields are compared by their string value rather than\ntheir relative position in the set, so MIN() may produce a different lowest\nresult than ORDER BY ASC.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nMIN() can be used as a window function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/min
[MINUTE]
declaration=time
category=Date and Time Functions
description=Returns the minute for time, in the range 0 to 59.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/minute
[MLINEFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a MULTILINESTRING value using its WKT representation and SRID.\n\nMLineFromText() and MultiLineStringFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/mlinefromtext
[MLINEFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a MULTILINESTRING value using its WKB representation and SRID.\n\nMLineFromWKB() and MultiLineStringFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/mlinefromwkb
[MOD]
declaration=N,M
category=Numeric Functions
description=Modulo operation. Returns the remainder of N divided by M. See also Modulo\nOperator.\n\nAny number modulo zero returns NULL. When the ERROR_FOR_DIVISION_BY_ZERO SQL\nmode is enabled, as it is by default, it also produces a warning. If strict mode\nis also enabled, an INSERT or UPDATE that takes a modulo by zero fails with an\nerror instead.\n\nThe integer part of a division can be obtained using DIV.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/mod
[MONTH]
declaration=date
category=Date and Time Functions
description=Returns the month for date in the range 1 to 12 for January to December, or 0\nfor dates such as 0000-00-00 or 2008-00-00 that have a zero month part.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/month
[MONTHNAME]
declaration=date
category=Date and Time Functions
description=Returns the full name of the month for date. The language used for the name is\ncontrolled by the value of the lc_time_names system variable. See server locale\nfor more on the supported locales.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/monthname
[MONTHS_BETWEEN]
declaration=date1, date2
category=Date and Time Functions
since=12.2.1
description=MONTHS_BETWEEN returns the number of months between two dates. If the first date\ngiven is later than the second date, the result is positive; otherwise, the\nresult is negative. If both dates are the same days of the month, or both are\nlast days of months, the result is always an integer. Otherwise, the fractional\nportion of the result based on a 31-day month is calculated, and considered the\ndifference in time components between the dates.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/months_between
[MPOINTFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a MULTIPOINT value using its WKT representation and SRID.\n\nMPointFromText() and MultiPointFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/mpointfromtext
[MPOINTFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a MULTIPOINT value using its WKB representation and SRID.\n\nMPointFromWKB() and MultiPointFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/mpointfromwkb
[MPOLYFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a MULTIPOLYGON value using its WKT representation and SRID.\n\nMPolyFromText() and MultiPolygonFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/mpolyfromtext
[MPOLYFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a MULTIPOLYGON value using its WKB representation and SRID.\n\nMPolyFromWKB() and MultiPolygonFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/mpolyfromwkb
[MULTILINESTRING]
declaration=ls1,ls2,...
category=Geometry Constructors
description=Constructs a WKB MultiLineString value using WKB LineString arguments. If any\nargument is not a WKB LineString, the return value isNULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/multilinestring
[MULTILINESTRINGFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a MULTILINESTRING value using its WKT representation and SRID.\n\nMLineFromText() and MultiLineStringFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/mlinefromtext
[MULTILINESTRINGFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a MULTILINESTRING value using its WKB representation and SRID.\n\nMLineFromWKB() and MultiLineStringFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/mlinefromwkb
[MULTIPOINT]
declaration=pt1,pt2,...
category=Geometry Constructors
description=Constructs a WKB MultiPoint value using WKB Point arguments. If any argument is\nnot a WKB Point, the return value is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/multipoint
[MULTIPOINTFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a MULTIPOINT value using its WKT representation and SRID.\n\nMPointFromText() and MultiPointFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/mpointfromtext
[MULTIPOINTFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a MULTIPOINT value using its WKB representation and SRID.\n\nMPointFromWKB() and MultiPointFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/mpointfromwkb
[MULTIPOLYGON]
declaration=poly1,poly2,...
category=Geometry Constructors
description=Constructs a WKB MultiPolygon value from a set of WKB Polygon arguments. If any\nargument is not a WKB Polygon, the return value is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/multipolygon
[MULTIPOLYGONFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a MULTIPOLYGON value using its WKT representation and SRID.\n\nMPolyFromText() and MultiPolygonFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/mpolyfromtext
[MULTIPOLYGONFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a MULTIPOLYGON value using its WKB representation and SRID.\n\nMPolyFromWKB() and MultiPolygonFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/mpolyfromwkb
[NAME_CONST]
declaration=name,value
category=Miscellaneous Functions
description=Returns the given value. When used to produce a result set column,NAME_CONST()\ncauses the column to have the given name. The arguments should be constants.\n\nThis function is used internally when replicating stored procedures. It makes\nlittle sense to use it explicitly in SQL statements, and it was not supposed to\nbe used like that.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/name_const
[NATURAL_SORT_KEY]
declaration=str
category=String Functions
since=10.7.1
description=The NATURAL_SORT_KEY function is used for sorting that is closer to natural\nsorting. Strings are sorted in alphabetical order, while numbers are treated in\na way such that, for example, 10 is greater than 2, whereas in other forms of\nsorting, 2 would be greater than 10, just like z is greater than ya.\n\nThere are multiple natural sort implementations, differing in the way they\nhandle leading zeroes, fractions, i18n, negatives, decimals and so on.\n\nMariaDB's implementation ignores leading zeroes when performing the sort.\n\nYou can use also use NATURAL_SORT_KEY with generated columns. The value is not\nstored permanently in the table. When using a generated column, the virtual\ncolumn must be longer than the base column to cater for embedded numbers in the\nstring and MDEV-24582.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/natural_sort_key
[NOW]
declaration=[precision]
category=Date and Time Functions
description=Returns the current date and time as a value in YYYY-MM-DD HH:MM:SS or\nYYYYMMDDHHMMSS.uuuuuu format, depending on whether the function is used in a\nstring or numeric context. The value is expressed in the current time zone.\n\nMariaDB starting with 11.7\n\nFrom MariaDB 11.7:\n\nThese functions return SQL standard compliant types:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/now
[NTH_VALUE]
declaration=expr[, num_row]
category=Window Functions
since=10.2.2
description=The NTH_VALUE function returns the value evaluated at row number num_row of the\nwindow frame, starting from 1, or NULL if the row does not exist.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/nth_value
[NTILE]
declaration=expr
category=Window Functions
since=10.2.0
description=NTILE() is a window function that returns an integer indicating which group a\ngiven row falls into. The number of groups is specified in the argument (expr),\nstarting at one. Ordered rows in the partition are divided into the specified\nnumber of groups with as equal a size as possible.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/ntile
[NULLIF]
declaration=expr1,expr2
category=Control Flow Functions
description=Returns NULL if expr1 = expr2 is true, otherwise returns expr1. This is the same\nas CASE WHEN expr1 = expr2 THEN NULL ELSE expr1 END.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/control-flow-functions/nullif
[NUMGEOMETRIES]
declaration=gc
category=Geometry Properties
description=Returns the number of geometries in the GeometryCollection gc.\n\nST_NumGeometries() and NumGeometries() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_numgeometries
[NUMINTERIORRINGS]
declaration=poly
category=Polygon Properties
description=Returns an integer containing the number of interior rings in the Polygon value\npoly.\n\nNote that according the OpenGIS standard, a POLYGON should have exactly one\nExteriorRing and all other rings should lie within that ExteriorRing and thus be\nthe InteriorRings. Practically, however, some systems, including MariaDB's,\npermit polygons to have several 'ExteriorRings'. In the case of there being\nmultiple, non-overlapping exterior rings ST_NumInteriorRings() will return 1.\n\nST_NumInteriorRings() and NumInteriorRings() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_numinteriorrings
[NUMPOINTS]
declaration=ls
category=LineString Properties
description=Returns the number of Point objects in the LineString value ls.\n\nST_NumPoints() and NumPoints() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_numpoints
[NVL]
declaration=expr1,expr2
category=Control Flow Functions
since=10.3.0
description=If expr1 is not NULL, IFNULL() returns expr1; otherwise it returns expr2.\nIFNULL() returns a numeric or string value, depending on the context in which it\nis used.\n\nNVL() is an alias for IFNULL().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/control-flow-functions/ifnull
[NVL2]
declaration=expr1,expr2,expr3
category=Control Flow Functions
since=10.3.0
description=The NVL2 function returns a value based on whether a specified expression is\nNULL or not. If expr1 is not NULL, then NVL2 returns expr2. If expr1 is NULL,\nthen NVL2 returns expr3.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/control-flow-functions/nvl2
[OCT]
declaration=N
category=Numeric Functions
description=Returns a string representation of the octal value of N, where N is a longlong\n(BIGINT) number. This is equivalent to CONV(N,10,8). Returns NULL if N is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/oct
[OCTET_LENGTH]
declaration=str
category=String Functions
description=OCTET_LENGTH() returns the length of the given string, in octets (bytes). This\nis a synonym for LENGTHB(), and, when Oracle mode is not set, a synonym for\nLENGTH().\n\nA multi-byte character counts as multiple bytes. This means that for a string\ncontaining five two-byte characters, OCTET_LENGTH() returns 10, whereas\nCHAR_LENGTH() returns 5.\n\nIf str is not a string value, it is converted into a string. If str is NULL, the\nfunction returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/octet_length
[OLD_PASSWORD]
declaration=str
category=Encryption, Hashing and Compression Functions
description=OLD_PASSWORD() was added to MySQL when the implementation of PASSWORD() was\nchanged to improve security. OLD_PASSWORD() returns the value of the old\n(pre-MySQL 4.1) implementation of PASSWORD() as a string, and is intended to\npermit you to reset passwords for any pre-4.1 clients that need to connect to a\nmore recent MySQL server version, or any version of MariaDB, without locking\nthem out.\n\nThe return value is a nonbinary string in the connection character set and\ncollation, determined by the values of the character_set_connection and\ncollation_connection system variables.\n\nThe return value is 16 bytes in length, or NULL if the argument was NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/old_password
[OLD_VALUE]
declaration=val
category=Miscellaneous Functions
since=13.0.1
description=In the RETURNING clause of an UPDATE statement, OLD_VALUE() returns the value\nbefore the update. The function is meaningful only in this context.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/old-value
[ORD]
declaration=str
category=String Functions
description=If the leftmost character of the string str is a multi-byte character, returns\nthe code for that character, calculated from the numeric values of its\nconstituent bytes using this formula:\n\nIf the leftmost character is not a multi-byte character, ORD() returns the same\nvalue as the ASCII() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/ord
[OVERLAPS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether g1 spatially overlaps g2. The term spatially\noverlaps is used if two geometries of equal dimensions intersect and their\nintersection results in a geometry of the same dimension but not equal to either\nof the given geometries.\n\nOVERLAPS() is based on the original MySQL implementation and uses object\nbounding rectangles, while ST_OVERLAPS() uses object shapes.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/overlaps
[PASSWORD]
declaration=str
category=Encryption, Hashing and Compression Functions
description=The PASSWORD() function is used for hashing passwords for use in authentication\nby the MariaDB server. It is not intended for use in other applications.\n\nCalculates and returns a hashed password string from the plaintext password str.\nReturns an empty string if the argument is NULL.\n\nThe return value is a nonbinary string in the connection character set and\ncollation, determined by the values of the character_set_connection and\ncollation_connection system variables.\n\nThis is the function that is used for hashing MariaDB passwords for storage in\nthe Password column of the user table (see privileges), usually used with the\nSET PASSWORD statement. It is not intended for use in other applications.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/password
[PERCENTILE_CONT]
declaration=percentile
category=Window Functions
since=10.3.3
description=PERCENTILE_CONT() (standing for continuous percentile) is a window function\nwhich returns a value which corresponds to the given fraction in the sort order.\nIf required, it will interpolate between adjacent input items.\n\nEssentially, the following process is followed to find the value to return:\n\n- Get the number of rows in the partition, denoted by N\n- RN = p*(N-1), where p denotes the argument to the PERCENTILE_CONT function\n- Calculate FRN as FRN=floor(RN) and CRN as CRN=ceil(RN)\n- Look up rows FRN and CRN\n- If (CRN = FRN = RN) then the result is (value of expression from row at RN)\n- Otherwise the result is\n- (CRN - RN) * (value of expression for row at FRN) +\n- (RN - FRN) * (value of expression for row at CRN)\n\nThe MEDIAN function is a specific case of PERCENTILE_CONT, equivalent to\nPERCENTILE_CONT(0.5).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/percentile_cont
[PERCENTILE_DISC]
declaration=percentile
category=Window Functions
since=10.3.3
description=PERCENTILE_DISC() (standing for discrete percentile) is a window function which\nreturns the first value in the set whose ordered position is the same or more\nthan the specified fraction.\n\nEssentially, the following process is followed to find the value to return:\n\n- Get the number of rows in the partition.\n- Walk through the partition, in order, until finding the first row with\n  CUME_DIST() >= function_argument.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/percentile_disc
[PERCENT_RANK]
declaration=
category=Window Functions
since=10.2.0
description=PERCENT_RANK() is a window function that returns the relative percent rank of a\ngiven row. The following formula is used to calculate the percent rank:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/percent_rank
[PERIOD_ADD]
declaration=P,N
category=Date and Time Functions
description=Adds N months to period P. P is in the format YYMM or YYYYMM, and is not a date\nvalue. If P contains a two-digit year, values from 00 to 69 are converted to\nfrom 2000 to 2069, while values from 70 are converted to 1970 upwards.\n\nReturns a value in the format YYYYMM.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/period_add
[PERIOD_DIFF]
declaration=P1,P2
category=Date and Time Functions
description=Returns the number of months between periods P1 and P2. P1 and P2 can be in the\nformat YYMM or YYYYMM, and are not date values.\n\nIf P1 or P2 contains a two-digit year, values from 00 to 69 are converted to\nfrom 2000 to 2069, while values from 70 are converted to 1970 upwards.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/period_diff
[PI]
declaration=
category=Numeric Functions
description=Returns the value of pi (pi). The default number of decimal places displayed is\nsix, but MariaDB uses the full double-precision value internally.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/pi
[POINT]
declaration=x,y
category=Geometry Constructors
description=Constructs a WKB Point using the given coordinates.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/point
[POINTFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a POINT value using its WKT representation and SRID.\n\nST_PointFromText() and PointFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_pointfromtext
[POINTFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a POINT value using its WKB representation and SRID.\n\nST_PointFromWKB() and PointFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_pointfromwkb
[POINTN]
declaration=ls,N
category=LineString Properties
description=Returns the N-th Point in the LineString value ls. Points are numbered beginning\nwith 1.\n\nST_PointN() and PointN() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_pointn
[POINTONSURFACE]
declaration=g
category=Geometry Constructors
since=10.1.2
description=Given a geometry, returns a POINT guaranteed to intersect a surface. However,\nsee MDEV-7514.\n\nST_PointOnSurface() and PointOnSurface() are synonyms.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_pointonsurface
[POLYFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a POLYGON value using its WKT representation and SRID.\n\nST_PolyFromText(), ST_PolygonFromText(), PolyFromText() and ST_PolygonFromText()\nare all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_polyfromtext
[POLYFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a POLYGON value using its WKB representation and SRID.\n\nST_PolyFromWKB(), ST_PolygonFromWKB(), PolyFromWKB() and PolygonFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_polyfromwkb
[POLYGON]
declaration=ls1,ls2,...
category=Geometry Constructors
description=Constructs a WKB Polygon value from a number of WKB LineString arguments. If any\nargument does not represent the WKB of a LinearRing (that is, not a closed and\nsimple LineString) the return value is NULL.\n\nNote that according to the OpenGIS standard, a POLYGON should have exactly one\nExteriorRing and all other rings should lie within that ExteriorRing and thus be\nthe InteriorRings. Practically, however, some systems, including MariaDB's,\npermit polygons to have several 'ExteriorRings'. In the case of there being\nmultiple, non-overlapping exterior rings ST_NUMINTERIORRINGS() will return 1.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/polygon
[POLYGONFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a POLYGON value using its WKT representation and SRID.\n\nST_PolyFromText(), ST_PolygonFromText(), PolyFromText() and ST_PolygonFromText()\nare all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_polyfromtext
[POLYGONFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a POLYGON value using its WKB representation and SRID.\n\nST_PolyFromWKB(), ST_PolygonFromWKB(), PolyFromWKB() and PolygonFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_polyfromwkb
[POSITION]
declaration=substr IN str
category=String Functions
description=POSITION(substr IN str) is a synonym for LOCATE(substr,str).\n\nThe function is part of ODBC 3.0.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/position
[POW]
declaration=X,Y
category=Numeric Functions
description=Returns the value of X raised to the power of Y.\n\nPOWER() is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/pow
[POWER]
declaration=X,Y
category=Numeric Functions
description=This is a synonym for POW(), which returns the value of X raised to the power of\nY.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/power
[QUARTER]
declaration=date
category=Date and Time Functions
description=Returns the quarter of the year for date, in the range 1 to 4. Returns 0 if\nmonth contains a zero value, or NULL if the given value is not otherwise a valid\ndate (zero values are accepted).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/quarter
[QUOTE]
declaration=str
category=String Functions
description=Quotes a string to produce a result that can be used as a properly escaped data\nvalue in an SQL statement. The string is returned enclosed by single quotes and\nwith each instance of single quote ("'"), backslash (""),ASCII NUL, and\nControl-Z preceded by a backslash. If the argument is NULL, the return value is\nthe word "NULL" without enclosing single quotes.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/quote
[RADIANS]
declaration=X
category=Numeric Functions
description=Returns the argument X, converted from degrees to radians. Note that pi radians\nequals 180 degrees.\n\nThis is the converse of the DEGREES() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/radians
[RAND1]
name=RAND
declaration=
category=Numeric Functions
description=Returns a random DOUBLE precision floating point value v in the range 0 <= v <\n1.0. If a constant integer argument N is specified, it is used as the seed\nvalue, which produces a repeatable sequence of column values. In the example\nbelow, note that the sequences of values produced by RAND(3) is the same both\nplaces where it occurs.\n\nIn a WHERE clause, RAND() is evaluated each time the WHERE is executed.\n\nStatements using the RAND() function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/rand
[RAND2]
name=RAND
declaration=N
category=Numeric Functions
description=Returns a random DOUBLE precision floating point value v in the range 0 <= v <\n1.0. If a constant integer argument N is specified, it is used as the seed\nvalue, which produces a repeatable sequence of column values. In the example\nbelow, note that the sequences of values produced by RAND(3) is the same both\nplaces where it occurs.\n\nIn a WHERE clause, RAND() is evaluated each time the WHERE is executed.\n\nStatements using the RAND() function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/rand
[RANDOM_BYTES]
declaration=length
category=Encryption, Hashing and Compression Functions
since=10.10.1
description=Given a length from 1 to 1024, generates a binary string of length consisting of\nrandom bytes generated by the SSL library's random number generator.\n\nSee the RAND_bytes() function documentation of your SSL library for information\non the random number generator. In the case of OpenSSL, a cryptographically\nsecure pseudo random generator (CSPRNG) is used.\n\nStatements containing the RANDOM_BYTES function are unsafe for statement-based\nreplication.\n\nAn error occurs if length is outside the range 1 to 1024.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/random_bytes
[RANK]
declaration=
category=Window Functions
since=10.2.0
description=RANK() is a window function that displays the number of a given row, starting at\none and following the ORDER BY sequence of the window function, with identical\nvalues receiving the same result. It is similar to the ROW_NUMBER() function\nexcept that in that function, identical values will receive a different row\nnumber for each result.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/rank
[REGEXP_INSTR]
declaration=subject, pattern
category=Regular Expressions Functions
description=Return the index of a regex match. This function finds the starting position of\nthe first substring that matches the given pattern.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/regular-expressions-functions/regexp_instr
[REGEXP_REPLACE]
declaration=subject, pattern, replace
category=Regular Expressions Functions
description=REGEXP_REPLACE returns the string subject with all occurrences of the regular\nexpression pattern replaced by the string replace. If no occurrences are found,\nthen subject is returned as is.\n\nThe replace string can have backreferences to the subexpressions in the form N,\nwhere N is a number from 1 to 9.\n\nThe function follows the case sensitivity rules of the effective collation.\nMatching is performed case insensitively for case insensitive collations, and\ncase sensitively for case sensitive collations and for binary data.\n\nThe collation case sensitivity can be overwritten using the (?i) and (?-i) PCRE\nflags.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/regular-expressions-functions/regexp_replace
[REGEXP_SUBSTR]
declaration=subject,pattern
category=Regular Expressions Functions
description=Returns the part of the string subject that matches the regular expression\npattern, or an empty string if pattern was not found.\n\nThe function follows the case sensitivity rules of the effective collation.\nMatching is performed case insensitively for case insensitive collations, and\ncase sensitively for case sensitive collations and for binary data.\n\nThe collation case sensitivity can be overwritten using the (?i) and (?-i) PCRE\nflags.\n\nMariaDB uses the PCRE regular expression library for enhanced regular expression\nperformance, and REGEXP_SUBSTR was introduced as part of this enhancement.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/regular-expressions-functions/regexp_substr
[RELEASE_ALL_LOCKS]
declaration=
category=Miscellaneous Functions
since=10.5.2
description=Releases all named locks held by the current session. Returns the number of\nlocks released, or 0 if none were held.\n\nStatements using the RELEASE_ALL_LOCKS function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/release_all_locks
[RELEASE_LOCK]
declaration=str
category=Miscellaneous Functions
description=Releases the lock named by the string str that was obtained with GET_LOCK().\nReturns 1 if the lock was released, 0 if the lock was not established by this\nconnection (in which case the lock is not released), and NULL if the named lock\ndid not exist. The lock does not exist if it was never obtained by a call to\nGET_LOCK() or if it has previously been released.\n\nstr is case-sensitive. If str is an empty string or NULL, RELEASE_LOCK() returns\nNULL and does nothing.\n\nStatements using the RELEASE_LOCK function are not safe for statement-based\nreplication.\n\nThe DO statement is convenient to use with RELEASE_LOCK().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/release_lock
[REPEAT]
declaration=str,count
category=String Functions
description=Returns a string consisting of the string str repeated count times. Ifcount is\nless than 1, returns an empty string. Returns NULL if str orcount are NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/repeat-function
[REPLACE]
declaration=str,from_str,to_str
category=String Functions
description=Returns the string str with all occurrences of the string from_str replaced by\nthe string to_str. REPLACE() performs a case-sensitive match when searching for\nfrom_str. If any argument is NULL, the function returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/replace-function
[REVERSE]
declaration=str
category=String Functions
description=Returns the string str with the order of the characters reversed. If the input\nstring is NULL, the function returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/reverse
[RIGHT]
declaration=str,len
category=String Functions
description=Returns the rightmost len characters from the string str, or NULL if any\nargument is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/right
[ROUND1]
name=ROUND
declaration=X
category=Numeric Functions
description=Rounds the argument X to D decimal places. D defaults to 0 if not specified.D\ncan be negative to cause D digits left of the decimal point of the value X to\nbecome zero.\n\nThe rounding algorithm depends on the data type of X:\n\n- For floating-point types (FLOAT, DOUBLE) the C libraries rounding function is\n  used, so the behavior may differ between operating systems.\n- For fixed-point types (DECIMAL, DEC/NUMBER/FIXED) the "round half up" rule is\n  used, meaning that e.g. a value ending in exactly .5 is always rounded up.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/round
[ROUND2]
name=ROUND
declaration=X,D
category=Numeric Functions
description=Rounds the argument X to D decimal places. D defaults to 0 if not specified.D\ncan be negative to cause D digits left of the decimal point of the value X to\nbecome zero.\n\nThe rounding algorithm depends on the data type of X:\n\n- For floating-point types (FLOAT, DOUBLE) the C libraries rounding function is\n  used, so the behavior may differ between operating systems.\n- For fixed-point types (DECIMAL, DEC/NUMBER/FIXED) the "round half up" rule is\n  used, meaning that e.g. a value ending in exactly .5 is always rounded up.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/round
[ROWNUM]
declaration=
category=Information Functions
since=10.6.1
description=ROWNUM() returns the current number of accepted rows in the current context. It\nmain purpose is to emulate the ROWNUM pseudo column in Oracle. For MariaDB\nnative applications, we recommend the usage of LIMIT, as it is easier to use and\ngives more predictable results than the usage of ROWNUM().\n\nThe main difference between using LIMIT andROWNUM() to limit the rows in the\nresult is thatLIMIT works on the result set while ROWNUM works on the number of\naccepted rows (before any ORDER orGROUP BY clauses).\n\nThe following queries will return the same results:\n\nWhile the following may return different results based on in which orders the\nrows are found:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/rownum
[ROW_COUNT]
declaration=
category=Information Functions
description=ROW_COUNT() returns the number of rows updated, inserted or deleted by the\npreceding statement. This is the same as the row count that the mariadb client\ndisplays and the value from the mysql_affected_rows() C API function.\n\nGenerally:\n\n- For statements which return a result set (such as SELECT, SHOW, DESC or HELP),\n  returns -1, even when the result set is empty. This is also true for\n  administrative statements, such as OPTIMIZE.\n- For DML statements other than SELECT and for ALTER TABLE, returns the number\n  of affected rows.\n- For DDL statements (including TRUNCATE) and for other statements which don't\n  return any result set (such as USE, DO, SIGNAL or DEALLOCATE PREPARE), returns\n  0.\n\nFor UPDATE, affected rows is by default the number of rows that were actually\nchanged. If the CLIENT_FOUND_ROWS flag to mysql_real_connect() is specified when\nconnecting to mariadbd, affected rows is instead the number of rows matched by\nthe WHERE clause.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/row_count
[ROW_NUMBER]
declaration=
category=Window Functions
since=10.2.0
description=ROW_NUMBER() is a window function that displays the number of a given row,\nstarting at one and following the ORDER BY sequence of the window function, with\nidentical values receiving different row numbers. It is similar to the RANK()\nand DENSE_RANK() functions except that in that function, identical values will\nreceive the same rank for each result.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/window-functions/row_number
[RPAD]
declaration=str, len [, padstr]
category=String Functions
description=Returns the string str, right-padded with the string padstr to a length of len\ncharacters. If str is longer than len, the return value is shortened to len\ncharacters. If padstr is omitted, the RPAD function pads spaces.\n\nReturns NULL if given a NULL argument. If the result is empty (a length of\nzero), returns either an empty string, or, with SQL_MODE=Oracle, NULL.\n\nThe Oracle mode version of the function can be accessed outside of Oracle mode\nby using RPAD_ORACLE as the function name.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/rpad
[RTRIM]
declaration=str
category=String Functions
description=Returns the string str with trailing space characters removed.\n\nReturns NULL if given a NULL argument. If the result is empty, returns either an\nempty string, or, with SQL_MODE=Oracle, NULL.\n\nThe Oracle mode version of the function can be accessed outside of Oracle mode\nby using RTRIM_ORACLE as the function name.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/rtrim
[SCHEMA]
declaration=
category=Information Functions
description=Returns the default (current) database name as a string in the utf8 character\nset. If there is no default database, DATABASE() returns NULL. Within a stored\nroutine, the default database is the database that the routine is associated\nwith, which is not necessarily the same as the database that is the default in\nthe calling context.\n\nSCHEMA() is a synonym for DATABASE().\n\nTo select a default database, the USE statement can be run. Another way to set\nthe default database is specifying its name at mariadb command line client\nstartup.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/database
[SECOND]
declaration=time
category=Date and Time Functions
description=Returns the second for a given time (which can include microseconds), in the\nrange 0 to 59, or NULL if not given a valid time value.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/second
[SEC_TO_TIME]
declaration=seconds
category=Date and Time Functions
description=Returns the seconds argument, converted to hours, minutes, and seconds, as a\nTIME value. The range of the result is constrained to that of the TIME data\ntype. A warning occurs if the argument corresponds to a value outside that\nrange.\n\nThe time will be returned in the format hh:mm:ss, or hhmmss if used in a numeric\ncalculation.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/sec_to_time
[SESSION_USER]
declaration=
category=Information Functions
description=From MariaDB 11.7:\n\nShows the value of CURRENT_USER() when the session was created, that is, it\nshows a user@host pair from the mysql.global_priv table, like CURRENT_USER(),\nbut unlike CURRENT_USER() it will not change inside stored routines and views.\nThis is SQL Standard behavior for the SESSION_USER function.\n\nBefore MariaDB 11.7:\n\nSESSION_USER() is a synonym for USER().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/session_user
[SETVAL]
declaration=sequence_name, next_value, [is_used, [round]]
category=SEQUENCE Functions
since=10.3.1
description=Set the next value to be returned for a SEQUENCE.\n\nThis function is compatible with PostgreSQL syntax, extended with the round\nargument.\n\nIf the is_used argument is not given or is 1 or true, then the next used value\nwill one after the given value. If is_used is 0 or false then the next generated\nvalue will be the given value.\n\nIf round is used then it will set the round value (or the internal cycle count,\nstarting at zero) for the sequence. If round is not used, it's assumed to be 0.\n\nURL: https://mariadb.com/docs/server/reference/sql-structure/sequences/sequence-functions/setval
[SFORMAT]
declaration=format, value[, value ...]
category=String Functions
since=10.7.1
description=The SFORMAT function takes an input string and a formatting specification and\nreturns the string formatted using the rules the user passed in the\nspecification.\n\nIt uses the fmtlib library for Python-like (as well as Rust, C++20, etc) string\nformatting.\n\nOnly fmtlib 7.0.0+ is supported.\n\nThere is no native support for temporal and decimal values:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/sformat
[SHA1]
declaration=str
category=Encryption, Hashing and Compression Functions
description=Calculates an SHA-1 160-bit checksum for the string str, as described in RFC\n3174 (Secure Hash Algorithm).\n\nThe value is returned as a string of 40 hex digits, or NULL if the argument was\nNULL. The return value is a nonbinary string in the connection character set and\ncollation, determined by the values of the character_set_connection and\ncollation_connection system variables.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/sha1
[SHA2]
declaration=str,hash_len
category=Encryption, Hashing and Compression Functions
description=Given a string str, calculates an SHA-2 checksum, which is considered more\ncryptographically secure than its SHA-1 equivalent. The SHA-2 family includes\nSHA-224, SHA-256, SHA-384, and SHA-512, and the _hash_len_ must correspond to\none of these, i.e. 224, 256, 384 or 512. 0 is equivalent to 256.\n\nThe return value is a nonbinary string in the connection character set and\ncollation, determined by the values of the character_set_connection and\ncollation_connection system variables.\n\nNULL is returned if the hash length is not valid, or the string str is NULL.\n\nSHA2 only works if MariaDB is configured with TLS support.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/sha2
[SIGN]
declaration=X
category=Numeric Functions
description=Returns the sign of the argument as -1, 0, or 1, depending on whether X is\nnegative, zero, or positive.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/sign
[SIN]
declaration=X
category=Numeric Functions
description=Returns the sine of X, where X is given in radians.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/sin
[SLEEP]
declaration=duration
category=Miscellaneous Functions
description=Sleeps (pauses) for the number of seconds given by the duration argument, then\nreturns 0. If SLEEP() is interrupted, it returns 1. The duration may have a\nfractional part given in microseconds.\n\nStatements using the SLEEP() function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/sleep
[SOUNDEX]
declaration=str
category=String Functions
description=Returns a soundex string from str. Two strings that sound almost the same should\nhave identical soundex strings. A standard soundex string is four characters\nlong, but the SOUNDEX() function returns an arbitrarily long string. You can use\nSUBSTRING() on the result to get a standard soundex string. All non-alphabetic\ncharacters in str are ignored. All international alphabetic characters outside\nthe A-Z range are treated as vowels.\n\nImportant: When using SOUNDEX(), you should be aware of the following details:\n\n- This function is intended to work well with strings that are in the English\n  language only. Strings in other languages may not produce reasonable results.\n- This function implements the original Soundex algorithm, not the more popular\n  enhanced version (also described by D. Knuth). The difference is that original\n  version discards vowels first and duplicates second, whereas the enhanced\n  version discards duplicates first and vowels second.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/soundex
[SPACE]
declaration=N
category=String Functions
description=Returns a string consisting of N space characters. If N is NULL, returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/space
[SPIDER_BG_DIRECT_SQL]
declaration='sql', 'tmp_table_list', 'parameters'
category=Spider Functions
description=Executes the given SQL statement in the background on the remote server, as\ndefined in the parameters listing. If the query returns a result-set, it sttores\nthe results in the given temporary table. When the given SQL statement executes\nsuccessfully, this function returns the number of called UDF's. It returns 0\nwhen the given SQL statement fails.\n\nThis function is a UDF installed with the Spider storage engine.\n\nURL: https://mariadb.com/docs/server/server-usage/storage-engines/spider/spider-functions/spider_bg_direct_sql
[SPIDER_COPY_TABLES]
declaration=spider_table_name, source_link_id, destination_link_id_list [,parameters]
category=Spider Functions
description=A UDF installed with the Spider Storage Engine, this function copies table data\nfrom source_link_id to destination_link_id_list. The service does not need to be\nstopped in order to copy.\n\nIf the Spider table is partitioned, the name must be of the format\ntable_name#P#partition_name. The partition name can be viewed in the\nmysql.spider_tables table, for example:\n\nReturns 1 if the data was copied successfully, or 0 if copying the data failed.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/server-usage/storage-engines/spider/spider-functions/spider_copy_tables
[SPIDER_DIRECT_SQL]
declaration='sql', 'tmp_table_list', 'parameters'
category=Spider Functions
description=A UDF installed with the Spider Storage Engine, this function is used to execute\nthe SQL string sql on the remote server, as defined in parameters. If any\nresultsets are returned, they are stored in the tmp_table_list.\n\nThe function returns 1 if the SQL executes successfully, or 0 if it fails.\n\nURL: https://mariadb.com/docs/server/server-usage/storage-engines/spider/spider-functions/spider_direct_sql
[SPIDER_FLUSH_TABLE_MON_CACHE]
declaration=
category=Spider Functions
description=A UDF installed with the Spider Storage Engine, this function is used for\nrefreshing monitoring server information. It returns a value of 1.\n\nURL: https://mariadb.com/docs/server/server-usage/storage-engines/spider/spider-functions/spider_flush_table_mon_cache
[SQRT]
declaration=X
category=Numeric Functions
description=Returns the square root of X. If X is negative, NULL is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/sqrt
[SRID]
declaration=g
category=Geometry Properties
description=Returns an integer indicating the Spatial Reference System ID for the geometry\nvalue g.\n\nIn MariaDB, the SRID value is just an integer associated with the geometry\nvalue. All calculations are done assuming Euclidean (planar) geometry.\n\nST_SRID() and SRID() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_srid
[STARTPOINT]
declaration=ls
category=LineString Properties
description=Returns the Point that is the start point of the LineString value ls.\n\nST_StartPoint() and StartPoint() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_startpoint
[STD]
declaration=expr
category=Aggregate Functions
description=Returns the population standard deviation of expr. This is an extension to\nstandard SQL. The standard SQL function STDDEV_POP() can be used instead.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nSTD() can be used as a window function.\n\nThis function returns NULL if there were no matching rows.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/std
[STDDEV]
declaration=expr
category=Aggregate Functions
description=Returns the population standard deviation of expr. This function is provided for\ncompatibility with Oracle. The standard SQL function STDDEV_POP() can be used\ninstead.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nSTDDEV() can be used as a window function.\n\nThis function returns NULL if there were no matching rows.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/stddev
[STDDEV_POP]
declaration=expr
category=Aggregate Functions
description=Returns the population standard deviation of expr (the square root of\nVAR_POP()). You can also use STD() or STDDEV(), which are equivalent but not\nstandard SQL.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nSTDDEV_POP() can be used as a window function.\n\nSTDDEV_POP() returns NULL if there were no matching rows.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/stddev_pop
[STDDEV_SAMP]
declaration=expr
category=Aggregate Functions
description=Returns the sample standard deviation of expr (the square root of VAR_SAMP()).\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nSTDDEV_SAMP() can be used as a window function.\n\nSTDDEV_SAMP() returns NULL if there were no matching rows.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/stddev_samp
[STRCMP]
declaration=expr1,expr2
category=String Functions
description=STRCMP() returns 0 if the strings are the same, -1 if the first argument is\nsmaller than the second according to the current sort order, and 1 if the\nstrings are otherwise not the same. Returns NULL is either argument is NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/strcmp
[STR_TO_DATE]
declaration=str,format
category=Date and Time Functions
description=This is the inverse of the DATE_FORMAT() function. It takes a string str and a\nformat string format. STR_TO_DATE() returns aDATETIME value if the format string\ncontains both date and time parts, or aDATE or TIME value if the string contains\nonly date or time parts.\n\nThe date, time, or datetime values contained in str should be given in the\nformat indicated by format. If str contains an illegal date, time, or datetime\nvalue, STR_TO_DATE() returns NULL. An illegal value also produces a warning.\n\nUnder specific SQL_MODE settings an error may also be generated if the str isn't\na valid date:\n\n- ALLOW_INVALID_DATES\n- NO_ZERO_DATE\n- NO_ZERO_IN_DATE\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/str_to_date
[ST_AREA]
declaration=poly
category=Polygon Properties
description=Returns as a double-precision number the area of the Polygon value poly, as\nmeasured in its spatial reference system.\n\nST_Area() and Area() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_area
[ST_ASBINARY]
declaration=g
category=WKB
description=Converts a value in internal geometry format to its WKB representation and\nreturns the binary result.\n\nST_AsBinary(), AsBinary(), ST_AsWKB() and AsWKB() are synonyms,\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_asbinary
[ST_ASGEOJSON]
declaration=g[, max_decimals[, options]]
category=Geometry Constructors
since=10.2.4
description=Returns the given geometry g as a GeoJSON element. The optional _max_decimals_\nlimits the maximum number of decimals displayed.\n\nThe optional options flag can be set to 1 to add a bounding box to the output.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/geojson-st_asgeojson
[ST_ASTEXT]
declaration=g
category=WKT
description=Converts a value in internal geometry format to its WKT representation and\nreturns the string result.\n\nST_AsText(), AsText(), ST_AsWKT() and AsWKT() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_astext
[ST_ASWKB]
declaration=g
category=WKB
description=Converts a value in internal geometry format to its WKB representation and\nreturns the binary result.\n\nST_AsBinary(), AsBinary(), ST_AsWKB() and AsWKB() are synonyms,\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_asbinary
[ST_ASWKT]
declaration=g
category=WKT
description=Converts a value in internal geometry format to its WKT representation and\nreturns the string result.\n\nST_AsText(), AsText(), ST_AsWKT() and AsWKT() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_astext
[ST_BOUNDARY]
declaration=g
category=Geometry Properties
since=10.1.2
description=Returns a geometry that is the closure of the combinatorial boundary of the\ngeometry value g.\n\nBOUNDARY() is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_boundary
[ST_BUFFER]
declaration=g1,r
category=Geometry Constructors
description=Returns a geometry that represents all points whose distance from geometry g1 is\nless than or equal to distance, or radius, r.\n\nUses for this function could include creating for example a new geometry\nrepresenting a buffer zone around an island.\n\nBUFFER() is a synonym.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_buffer
[ST_CENTROID]
declaration=mpoly
category=Polygon Properties
description=Returns a point reflecting the mathematical centroid (geometric center) for the\nMultiPolygon mpoly. The resulting point will not necessarily be on the\nMultiPolygon.\n\nST_Centroid() and Centroid() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_centroid
[ST_COLLECT]
declaration=g
category=Miscellaneous GIS Functions
since=11.7.0
description=ST_Collect is an aggregate function that can also be used as a window function.\n\nGiven multiple geometries, returns the aggregation of the distinct geometry\narguments. This function also supports the DISTINCT option. If DISTINCT is used,\nit returns the aggregation of the distinct geometry arguments.\n\nThe resulting value type is chosen using the following policy:\n\n- If all arguments are Point values, the result is a MultiPoint value.\n- If all arguments are LineString values, the result is a MultiLineString value.\n- If all arguments are Polygon values, the result is a MultiPolygon value.\n- Otherwise, the result is a GeometryCollection value.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_collect
[ST_CONTAINS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether a geometry g1 completely contains geometry\ng2.\n\nST_CONTAINS() uses object shapes, while CONTAINS(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nST_CONTAINS tests the opposite relationship to ST_WITHIN().\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-contains
[ST_CONVEXHULL]
declaration=g
category=Geometry Constructors
since=10.1.2
description=Given a geometry, returns a geometry that is the minimum convex geometry\nenclosing all geometries within the set. Returns NULL if the geometry value is\nNULL or an empty value.\n\nST_ConvexHull() and ConvexHull() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_convexhull
[ST_CROSSES]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 if geometry g1 spatially crosses geometry g2. Returns NULL if g1 is a\nPolygon or a MultiPolygon, or if g2 is a Point or a MultiPoint. Otherwise,\nreturns 0.\n\nThe term spatially crosses denotes a spatial relation between two given\ngeometries that has the following properties:\n\n- The two geometries intersect.\n- Their intersection results in a geometry that has a dimension that is one less\n  than the maximum dimension of the two given geometries.\n- Their intersection is not equal to either of the two given geometries.\n\nST_CROSSES() uses object shapes, while CROSSES(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-crosses
[ST_DIFFERENCE]
declaration=g1,g2
category=Geometry Relations
description=Returns a geometry representing the point set difference of the given geometry\nvalues.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st_difference
[ST_DIMENSION]
declaration=g
category=Geometry Properties
description=Returns the inherent dimension of the geometry value g. The result can be\n\nST_Dimension() and Dimension() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_dimension
[ST_DISJOINT]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 is spatially disjoint from (does\nnot intersect with) geometry g2.\n\nST_DISJOINT() uses object shapes, while DISJOINT(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nST_DISJOINT() tests the opposite relationship to ST_INTERSECTS().\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st_disjoint
[ST_DISTANCE]
declaration=g1,g2
category=Geometry Relations
description=Returns the distance between two geometries, or null if not given valid inputs.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st_distance
[ST_DISTANCE_SPHERE]
declaration=g1,g2,[r]
category=Geometry Relations
since=10.2.38
description=Returns the spherical distance in meters between two geometries (point or\nmultipoint) on a sphere. The optional radius r is in meters, must be positive,\nand defaults to the Earth's radius (6370986 meters) if not specified. If either\nof the two geometries are not valid, NULL is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st_distance_sphere
[ST_ENDPOINT]
declaration=ls
category=LineString Properties
description=Returns the Point that is the endpoint of the LineString value ls.\n\nST_EndPoint() and EndPoint() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_endpoint
[ST_ENVELOPE]
declaration=g
category=Geometry Properties
description=Returns the Minimum Bounding Rectangle (MBR) for the geometry value g. The\nresult is returned as a Polygon value.\n\nThe polygon is defined by the corner points of the bounding box:\n\nST_ENVELOPE() and ENVELOPE() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_envelope
[ST_EQUALS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 is spatially equal to geometry\ng2.\n\nST_EQUALS() uses object shapes, while EQUALS(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-equals
[ST_EXTERIORRING]
declaration=poly
category=Polygon Properties
description=Returns the exterior ring of the Polygon value poly as a LineString.\n\nST_ExteriorRing() and ExteriorRing() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_exteriorring
[ST_GEOHASH1]
name=ST_GEOHASH
declaration=longitude, latitude, max_length
category=Miscellaneous GIS Functions
since=11.7.0
description=Returns the geohash corresponding to the input values, or NULL if any argument\nis NULL. Geohashes encode latitude and longitude coordinates into a text string\nmade up only of numeric and lowercase latin letter characters.\n\nThe longitude parameter is a numeric value in the interval [180, -180]. latitude\nis a numeric value in the interval [90, -90].\n\nIn the case of point, the x coordinate is treated as the longitude and the y\ncoordinate is treated as the latitude. The same constraints apply.\n\nThe max_length parameter is the upper limit on the resulting string size and\ncannot exceed 100.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_geohash
[ST_GEOHASH2]
name=ST_GEOHASH
declaration=point, max_length
category=Miscellaneous GIS Functions
since=11.7.0
description=Returns the geohash corresponding to the input values, or NULL if any argument\nis NULL. Geohashes encode latitude and longitude coordinates into a text string\nmade up only of numeric and lowercase latin letter characters.\n\nThe longitude parameter is a numeric value in the interval [180, -180]. latitude\nis a numeric value in the interval [90, -90].\n\nIn the case of point, the x coordinate is treated as the longitude and the y\ncoordinate is treated as the latitude. The same constraints apply.\n\nThe max_length parameter is the upper limit on the resulting string size and\ncannot exceed 100.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_geohash
[ST_GEOMCOLLFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a GEOMETRYCOLLECTION value using its WKT representation and SRID.\n\nST_GeomCollFromText(), ST_GeometryCollectionFromText(), GeomCollFromText() and\nGeometryCollectionFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomcollfromtext
[ST_GEOMCOLLFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a GEOMETRYCOLLECTION value using its WKB representation and SRID.\n\nST_GeomCollFromWKB(), ST_GeometryCollectionFromWKB(), GeomCollFromWKB() and\nGeometryCollectionFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomcollfromwkb
[ST_GEOMETRYCOLLECTIONFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a GEOMETRYCOLLECTION value using its WKT representation and SRID.\n\nST_GeomCollFromText(), ST_GeometryCollectionFromText(), GeomCollFromText() and\nGeometryCollectionFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomcollfromtext
[ST_GEOMETRYCOLLECTIONFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a GEOMETRYCOLLECTION value using its WKB representation and SRID.\n\nST_GeomCollFromWKB(), ST_GeometryCollectionFromWKB(), GeomCollFromWKB() and\nGeometryCollectionFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomcollfromwkb
[ST_GEOMETRYFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[ST_GEOMETRYFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a geometry value of any type using its WKB representation and SRID.\n\nST_GeomFromWKB(), ST_GeometryFromWKB(), GeomFromWKB() and GeometryFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomfromwkb
[ST_GEOMETRYN]
declaration=gc,N
category=Geometry Properties
description=Returns the N-th geometry in the GeometryCollection gc. Geometries are numbered\nbeginning with 1.\n\nST_GeometryN() and GeometryN() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_geometryn
[ST_GEOMETRYTYPE]
declaration=g
category=Geometry Properties
description=Returns as a string the name of the geometry type of which the geometry instance\ng is a member. The name corresponds to one of the instantiable Geometry\nsubclasses.\n\nST_GeometryType() and GeometryType() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_geometrytype
[ST_GEOMFROMGEOJSON]
declaration=g[, option]
category=Geometry Constructors
since=10.2.4
description=Given a GeoJSON input g, returns a geometry object. The option specifies what to\ndo if g contains geometries with coordinate dimensions higher than 2.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_geomfromgeojson
[ST_GEOMFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[ST_GEOMFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a geometry value of any type using its WKB representation and SRID.\n\nST_GeomFromWKB(), ST_GeometryFromWKB(), GeomFromWKB() and GeometryFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_geomfromwkb
[ST_INTERIORRINGN]
declaration=poly,N
category=Polygon Properties
description=Returns the N-th interior ring for the Polygon value poly as a LineString. Rings\nare numbered beginning with 1.\n\nST_InteriorRingN() and InteriorRingN() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_interiorringn
[ST_INTERSECTION]
declaration=g1,g2
category=Geometry Constructors
description=Returns a geometry that is the intersection, or shared portion, of geometry g1\nand geometry g2.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_intersection
[ST_INTERSECTS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 spatially intersects geometry g2.\n\nST_INTERSECTS() uses object shapes, while INTERSECTS(), based on the original\nMySQL implementation, uses object bounding rectangles.\n\nST_INTERSECTS() tests the opposite relationship to ST_DISJOINT().\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-intersects
[ST_ISCLOSED]
declaration=g
category=Geometry Properties
description=Returns 1 if a given LINESTRING's start and end points are the same, or 0 if\nthey are not the same.\n\nST_IsClosed() and IsClosed() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_isclosed
[ST_ISEMPTY]
declaration=g
category=Geometry Properties
description=IsEmpty is a function defined by the OpenGIS specification, but is not fully\nimplemented by MariaDB or MySQL.\n\nSince MariaDB and MySQL do not support GIS EMPTY values such as POINT EMPTY, as\nimplemented it simply returns 1 if the geometry value g is invalid, 0 if it is\nvalid, and NULL if the argument is NULL.\n\nST_IsEmpty() and IsEmpty() are synonyms.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_isempty
[ST_ISRING]
declaration=g
category=Geometry Properties
since=10.1.2
description=Returns true if a given LINESTRING is a ring, that is, both ST_IsClosed and\nST_IsSimple. A simple curve does not pass through the same point more than once.\nHowever, see MDEV-7510.\n\nSt_IsRing() and IsRing() are synonyms.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_isring
[ST_ISSIMPLE]
declaration=g
category=Geometry Properties
description=Returns 1 if the geometry g is simple, 0 if it is not, and NULL if g is NULL.\n\nA geometry is simple if it has no anomalous geometric points, such as\nself-intersections or self-tangency:\n\n- A POINT is always simple.\n- A LINESTRING is simple if it does not cross or touch itself. A closed\n  LINESTRING, whose first and last points are the same, is simple if it does not\n  touch itself anywhere else.\n- A MULTIPOINT is simple if no two of its points are the same.\n\nST_IsSimple() and IsSimple() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_issimple
[ST_ISVALID]
declaration=g
category=Miscellaneous GIS Functions
since=11.7.0
description=Given a geometry input, returns 1 if the argument is geometrically valid\naccording to the OGC specifications, 0 if the argument is not geometrically\nvalid.\n\nUnlike ST_Validate, requires valid GIS data, or ERROR 3037 (22023): Invalid GIS\ndata provided to function st_isvalid is returned.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_isvalid
[ST_LATFROMGEOHASH]
declaration=geohash
category=Miscellaneous GIS Functions
since=11.7.0
description=Decodes a given geohash string and returns the latitude in the interval [90,\n-90].\n\nIf the argument is NULL, the return value is NULL. If the argument is invalid,\nan ER_INCORRECT_TYPE error is thrown.\n\nThe ST_GeoHash function can be used to generate geohashes.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_latfromgeohash
[ST_LENGTH]
declaration=ls
category=Geometry Relations
description=Returns as a double-precision number the length of the LineString value ls in\nits associated spatial reference.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st_length
[ST_LINEFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a LINESTRING value using its WKT representation and SRID.\n\nST_LineFromText(), ST_LineStringFromText(), ST_LineFromText() and\nST_LineStringFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_linefromtext
[ST_LINEFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a LINESTRING value using its WKB representation and SRID.\n\nST_LineFromWKB(), LineFromWKB(), ST_LineStringFromWKB(), and LineStringFromWKB()\nare synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_linefromwkb
[ST_LINESTRINGFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a LINESTRING value using its WKT representation and SRID.\n\nST_LineFromText(), ST_LineStringFromText(), ST_LineFromText() and\nST_LineStringFromText() are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_linefromtext
[ST_LINESTRINGFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a LINESTRING value using its WKB representation and SRID.\n\nST_LineFromWKB(), LineFromWKB(), ST_LineStringFromWKB(), and LineStringFromWKB()\nare synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_linefromwkb
[ST_LONGFROMGEOHASH]
declaration=geohash
category=Miscellaneous GIS Functions
since=11.7.0
description=Decodes a given geohash string and returns the longitude in the interval [180,\n-180].\n\nIf the argument is NULL, the return value is NULL. If the argument is invalid,\nan ER_INCORRECT_TYPE error is thrown.\n\nThe ST_GeoHash function can be used to generate geohashes.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_longfromgeohash
[ST_MLINEFROMTEXT]
declaration=wkt[,srid]
category=WKT
since=10.1.4
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[ST_MPOINTFROMTEXT]
declaration=wkt[,srid]
category=WKT
since=10.1.4
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[ST_MULTILINESTRINGFROMTEXT]
declaration=wkt[,srid]
category=WKT
since=10.1.4
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[ST_MULTIPOINTFROMTEXT]
declaration=wkt[,srid]
category=WKT
since=10.1.4
description=Constructs a geometry value of any type using its WKT representation and SRID.\n\nGeomFromText(), GeometryFromText(), ST_GeomFromText(), ST_GeometryFromText(),\nST_MultiLineStringFromText, ST_MLineFromText, ST_MultiPolyFromText and\nST_MPolygonFromText are all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_geomfromtext
[ST_NUMGEOMETRIES]
declaration=gc
category=Geometry Properties
description=Returns the number of geometries in the GeometryCollection gc.\n\nST_NumGeometries() and NumGeometries() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_numgeometries
[ST_NUMINTERIORRINGS]
declaration=poly
category=Polygon Properties
description=Returns an integer containing the number of interior rings in the Polygon value\npoly.\n\nNote that according the OpenGIS standard, a POLYGON should have exactly one\nExteriorRing and all other rings should lie within that ExteriorRing and thus be\nthe InteriorRings. Practically, however, some systems, including MariaDB's,\npermit polygons to have several 'ExteriorRings'. In the case of there being\nmultiple, non-overlapping exterior rings ST_NumInteriorRings() will return 1.\n\nST_NumInteriorRings() and NumInteriorRings() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/polygon-properties/st_numinteriorrings
[ST_NUMPOINTS]
declaration=ls
category=LineString Properties
description=Returns the number of Point objects in the LineString value ls.\n\nST_NumPoints() and NumPoints() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_numpoints
[ST_OVERLAPS]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 spatially overlaps geometry g2.\n\nThe term spatially overlaps is used if two geometries of equal dimensions\nintersect and their intersection results in a geometry of the same dimension but\nnot equal to either of the given geometries.\n\nST_OVERLAPS() uses object shapes, while OVERLAPS(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-overlaps
[ST_POINTFROMGEOHASH]
declaration=geohash, srid
category=Miscellaneous GIS Functions
since=11.7.0
description=Takes a given geohash string and returns a point where the x is the longitude\nand the y is the latitude.\n\nThe latitude is returned as a numeric value in the interval [180, -180]. The\nlongitude is returned as a numeric value in the interval [90, -90]. If the\nargument is NULL, the return value is NULL. If the argument is invalid, an\nER_GIS_INVALID_DATA is thrown.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_pointfromgeohash
[ST_POINTFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a POINT value using its WKT representation and SRID.\n\nST_PointFromText() and PointFromText() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_pointfromtext
[ST_POINTFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a POINT value using its WKB representation and SRID.\n\nST_PointFromWKB() and PointFromWKB() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_pointfromwkb
[ST_POINTN]
declaration=ls,N
category=LineString Properties
description=Returns the N-th Point in the LineString value ls. Points are numbered beginning\nwith 1.\n\nST_PointN() and PointN() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_pointn
[ST_POINTONSURFACE]
declaration=g
category=Geometry Constructors
since=10.1.2
description=Given a geometry, returns a POINT guaranteed to intersect a surface. However,\nsee MDEV-7514.\n\nST_PointOnSurface() and PointOnSurface() are synonyms.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_pointonsurface
[ST_POLYFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a POLYGON value using its WKT representation and SRID.\n\nST_PolyFromText(), ST_PolygonFromText(), PolyFromText() and ST_PolygonFromText()\nare all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_polyfromtext
[ST_POLYFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a POLYGON value using its WKB representation and SRID.\n\nST_PolyFromWKB(), ST_PolygonFromWKB(), PolyFromWKB() and PolygonFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_polyfromwkb
[ST_POLYGONFROMTEXT]
declaration=wkt[,srid]
category=WKT
description=Constructs a POLYGON value using its WKT representation and SRID.\n\nST_PolyFromText(), ST_PolygonFromText(), PolyFromText() and ST_PolygonFromText()\nare all synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkt/st_polyfromtext
[ST_POLYGONFROMWKB]
declaration=wkb[,srid]
category=WKB
description=Constructs a POLYGON value using its WKB representation and SRID.\n\nST_PolyFromWKB(), ST_PolygonFromWKB(), PolyFromWKB() and PolygonFromWKB() are\nsynonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/wkb/st_polyfromwkb
[ST_RELATE]
declaration=g1, g2, i
category=Geometry Properties
since=10.1.2
description=Returns true if Geometry g1 is spatially related to Geometryg2 by testing for\nintersections between the interior, boundary and exterior of the two geometries\nas specified by the values in intersection matrix pattern i.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_relate
[ST_SIMPLIFY]
declaration=g, max_distance
category=Miscellaneous GIS Functions
since=11.7.0
description=Takes as input a geometry (g) and a double (max_distance). It applies the\nRamer-Douglas-Peucker algorithm on g and returns the resulting geometry.\n\nThe goal of the Douglas-Peucker algorithm is to provide generalized\nsimplifications by returning a geometry that is similar to g but uses only a\nsubset of points. To perform the simplification, all the vertices that are\nshorter than max_distance are removed.\n\nThe algorithm may produce self-intersections and therefore result in invalid\ngeometries. ST_IsValid can be used to test validity of the result.\n\nIf the max_distance is not positive or is NULL, an ER_WRONG_ARGUMENT will occur.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_simplify
[ST_SRID]
declaration=g
category=Geometry Properties
description=Returns an integer indicating the Spatial Reference System ID for the geometry\nvalue g.\n\nIn MariaDB, the SRID value is just an integer associated with the geometry\nvalue. All calculations are done assuming Euclidean (planar) geometry.\n\nST_SRID() and SRID() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-properties/st_srid
[ST_STARTPOINT]
declaration=ls
category=LineString Properties
description=Returns the Point that is the start point of the LineString value ls.\n\nST_StartPoint() and StartPoint() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/linestring-properties/st_startpoint
[ST_SYMDIFFERENCE]
declaration=g1,g2
category=Geometry Constructors
description=Returns a geometry that represents the portions of geometry g1 and geometry g2\nthat don't intersect.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_symdifference
[ST_TOUCHES]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 spatially touches geometry g2.\nTwo geometries spatially touch if the interiors of the geometries do not\nintersect, but the boundary of one of the geometries intersects either the\nboundary or the interior of the other.\n\nST_TOUCHES() uses object shapes, while TOUCHES(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-touches
[ST_UNION]
declaration=g1,g2
category=Geometry Constructors
description=Returns a geometry that is the union of the geometry g1 and geometry g2.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-constructors/st_union
[ST_VALIDATE]
declaration=g
category=Miscellaneous GIS Functions
since=11.7.0
description=The function checks that a given geometry is compliant with the Well-Known\nBinary (WKB) format and Spatial Reference System Identifier (SRID) syntax, and\nis geometrically valid.\n\nIt returns the geometry if it's valid, or NULL if not.\n\nThe function is useful to filter out invalid geometry data.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/miscellaneous-gis-functions/st_validate
[ST_WITHIN]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether geometry g1 is spatially within geometry g2.\n\nThis tests the opposite relationship as ST_CONTAINS().\n\nST_WITHIN() uses object shapes, while WITHIN(), based on the original MySQL\nimplementation, uses object bounding rectangles.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/st-within
[ST_X]
declaration=p
category=Point Properties
description=Returns the X-coordinate value for the point p as a double-precision number.\n\nST_X() and X() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/point-properties/st_x
[ST_Y]
declaration=p
category=Point Properties
description=Returns the Y-coordinate value for the point p as a double-precision number.\n\nST_Y() and Y() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/point-properties/st_y
[SUBDATE1]
name=SUBDATE
declaration=date,INTERVAL expr unit
category=Date and Time Functions
description=When invoked with the INTERVAL form of the second argument, SUBDATE() is a\nsynonym for DATE_SUB(). See Date and Time Units for a complete list of permitted\nunits.\n\nThe second form allows the use of an integer value for days. In such cases, it\nis interpreted as the number of days to be subtracted from the date or datetime\nexpression expr.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/subdate
[SUBDATE2]
name=SUBDATE
declaration=expr,days
category=Date and Time Functions
description=When invoked with the INTERVAL form of the second argument, SUBDATE() is a\nsynonym for DATE_SUB(). See Date and Time Units for a complete list of permitted\nunits.\n\nThe second form allows the use of an integer value for days. In such cases, it\nis interpreted as the number of days to be subtracted from the date or datetime\nexpression expr.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/subdate
[SUBSTR1]
name=SUBSTR
declaration=str FROM pos
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTR2]
name=SUBSTR
declaration=str FROM pos FOR len
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTR3]
name=SUBSTR
declaration=str,pos
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTR4]
name=SUBSTR
declaration=str,pos,len
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTRING1]
name=SUBSTRING
declaration=str FROM pos
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTRING2]
name=SUBSTRING
declaration=str FROM pos FOR len
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTRING3]
name=SUBSTRING
declaration=str,pos
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTRING4]
name=SUBSTRING
declaration=str,pos,len
category=String Functions
description=The forms without a len argument return a substring from string str starting at\nposition pos.\n\nThe forms with a len argument return a substring len characters long from string\nstr, starting at position pos.\n\nThe forms that use FROM are standard SQL syntax.\n\nIt is also possible to use a negative value for pos. In this case, the beginning\nof the substring is pos characters from the end of the string, rather than the\nbeginning. A negative value may be used for pos in any of the forms of this\nfunction.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring
[SUBSTRING_INDEX]
declaration=str,delim,count
category=String Functions
description=Returns the substring from string str before count occurrences of the delimiter\ndelim. If count is positive, everything to the left of the final delimiter\n(counting from the left) is returned. If count is negative, everything to the\nright of the final delimiter (counting from the right) is returned.\nSUBSTRING_INDEX() performs a case-sensitive match when searching for delim.\n\nIf any argument is NULL, returns NULL.\n\nFor example:\n\nIt means "Return all of the characters up to the 2nd occurrence of ."\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/substring_index
[SUBTIME]
declaration=expr1,expr2
category=Date and Time Functions
description=SUBTIME() returns expr1 - expr2 expressed as a value in the same format as\nexpr1. expr1 is a time or datetime expression, and expr2 is a time expression.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/subtime
[SUM]
declaration=[DISTINCT] expr
category=Aggregate Functions
description=Returns the sum of expr. If the return set has no rows, SUM() returnsNULL. The\nDISTINCT keyword can be used to sum only the distinct values of expr.\n\nSUM() can be used as a window function, although not with the DISTINCT\nspecifier.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/sum
[SYSDATE]
declaration=[precision]
category=Date and Time Functions
description=Returns the current date and time as a value in YYYY-MM-DD HH:MM:SS or\nYYYYMMDDHHMMSS.uuuuuu format, depending on whether the function is used in a\nstring or numeric context.\n\nThe optional precision determines the microsecond precision. See Microseconds in\nMariaDB.\n\nSYSDATE() returns the time at which it executes. This differs from the behavior\nfor NOW(), which returns a constant time that indicates the time at which the\nstatement began to execute. (Within a stored routine or trigger, NOW() returns\nthe time at which the routine or triggering statement began to execute.)\n\nIn addition, changing the timestamp system variable with a SET timestamp\nstatement affects the value returned by NOW() but not by SYSDATE(). This means\nthat timestamp settings in the binary log have no effect on invocations of\nSYSDATE().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/sysdate
[SYSTEM_USER]
declaration=
category=Information Functions
description=SYSTEM_USER() is a synonym for USER().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/system_user
[SYS_GUID]
declaration=
category=Miscellaneous Functions
since=10.6.1
description=Returns a 16-byte globally unique identifier (GUID), similar to the UUID\nfunction, but without the - character.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/sys_guid
[TAN]
declaration=X
category=Numeric Functions
description=Returns the tangent of X, where X is given in radians.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/tan
[TIME]
declaration=expr
category=Date and Time Functions
description=Extracts the time part of the time or datetime expression expr and returns it as\na string.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/time-function
[TIMEDIFF]
declaration=expr1,expr2
category=Date and Time Functions
description=TIMEDIFF() returns expr1 - expr2 expressed as a time value. expr1 andexpr2 are\ntime or date-and-time expressions, but both must be of the same type.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/timediff
[TIMESTAMP1]
name=TIMESTAMP
declaration=expr
category=Date and Time Functions
description=With a single argument, this function returns the date or datetime expression\nexpr as a datetime value. With two arguments, it adds the time expression expr2\nto the date or datetime expression expr1 and returns the result as a datetime\nvalue.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/timestamp-function
[TIMESTAMP2]
name=TIMESTAMP
declaration=expr1,expr2
category=Date and Time Functions
description=With a single argument, this function returns the date or datetime expression\nexpr as a datetime value. With two arguments, it adds the time expression expr2\nto the date or datetime expression expr1 and returns the result as a datetime\nvalue.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/timestamp-function
[TIMESTAMPADD]
declaration=unit,interval,datetime_expr
category=Date and Time Functions
description=Adds the integer expression interval to the date or datetime expression\ndatetime_expr. The unit for interval is given by the unit argument, which should\nbe one of the following values: MICROSECOND, SECOND, MINUTE, HOUR, DAY, WEEK,\nMONTH, QUARTER, or YEAR.\n\nThe unit value may be specified using one of keywords as shown, or with a prefix\nof SQL_TSI_. For example, DAY and SQL_TSI_DAY both are allowed.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/timestampadd
[TIMESTAMPDIFF]
declaration=unit,datetime_expr1,datetime_expr2
category=Date and Time Functions
description=Returns datetime_expr2 - datetime_expr1, where datetime_expr1 anddatetime_expr2\nare date or datetime expressions. One expression may be a date and the other a\ndatetime; a date value is treated as a datetime having the time part '00:00:00'\nwhere necessary. The unit for the result (an integer) is given by the unit\nargument. The legal values for unit are the same as those listed in the\ndescription of the TIMESTAMPADD() function, that is, MICROSECOND, SECOND,\nMINUTE, HOUR, DAY, WEEK, MONTH, QUARTER, or YEAR.\n\nTIMESTAMPDIFF can also be used to calculate age.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/timestampdiff
[TIME_FORMAT]
declaration=time,format
category=Date and Time Functions
description=This is used like the DATE_FORMAT() function, but the format string may contain\nformat specifiers only for hours, minutes, and seconds. Other specifiers produce\na NULL value or 0.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/time_format
[TIME_TO_SEC]
declaration=time
category=Date and Time Functions
description=Returns the time argument, converted to seconds.\n\nThe value returned by TIME_TO_SEC is of type DOUBLE. The returned value\npreserves microseconds of the argument. See also Microseconds in MariaDB.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/time_to_sec
[TOUCHES]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether g1 spatially touches g2. Two geometries\nspatially touch if the interiors of the geometries do not intersect, but the\nboundary of one of the geometries intersects either the boundary or the interior\nof the other.\n\nTOUCHES() is based on the original MySQL implementation and uses object bounding\nrectangles, while ST_TOUCHES() uses object shapes.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/touches
[TO_BASE64]
declaration=str
category=String Functions
description=Converts the string argument str to its base-64 encoded form, returning the\nresult as a character string in the connection character set and collation.\n\nThe argument str will be converted to string first if it is not a string. A NULL\nargument will return a NULL result.\n\nThe reverse function, FROM_BASE64(), decodes an encoded base-64 string.\n\nThere are a numerous different methods to base-64 encode a string. The following\nare used by MariaDB and MySQL:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/to_base64
[TO_CHAR]
declaration=expr[, fmt]
category=String Functions
since=10.6.1
description=From MariaDB 12.3:\n\nThe TO_CHAR function converts an expr of type date, datetime, time or timestamp\nto a string. The optional fmt argument supports\nYYY/YYY/YY/RRRR/RR/MM/MON/MONTH/MI/DD/DY/HH/HH12/HH24/SS and special characters.\nThe default value is YYYY-MM-DD HH24:MI:SS. TO_CHAR also accepts FM in the\nformat string, which disables padding of all components following it.\n\nFM can be specified multiple times, with each time disabling the previous state:\n\n- An odd number of FMs disables padding.\n- An even number of FMs enables padding.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/to_char
[TO_DATE]
declaration=string_expression [DEFAULT string_expression ON CONVERSION ERROR], format_string [,NLS_FORMAT_STRING]
category=Date and Time Functions
since=12.3.1
description=TO_DATE was added for Oracle support.\n\n- format_string has the same format elements as TO_CHAR(), except a few elements\n  that are not supported (see below). TO_DATE() returns a datetime value.\n- The allowed separators are the same as for TO_CHAR(): space ( ), tab (t), and\n  any of !, #, %, ', (, ), *, +, -, ., /, :, ;, .\n- & can be used if the next character is not a character in the a-z or A-Z\n  range. text indicates a text string that is used verbatim in the format. You\n  cannot use the double-quote (") as a separator.\n- NLS_FORMAT_STRING supports these options: NLS_CALENDAR=GREGORIAN and\n  NLS_DATE_LANGUAGE=language, where language can be one of the following:\n- All MariaDB short locales, like en_AU.\n- The following Oracle language names: ALBANIAN, AMERICAN, ARABIC, BASQUE,\n  BELARUSIAN, BRAZILIAN PORTUGUESE, BULGARIAN, CANADIAN FRENCH, CATALAN,\n  CROATIAN, CYRILLIC SERBIAN, CZECH, DANISH, DUTCH, ENGLISH, ESTONIAN, FINNISH,\n  FRENCH, GERMAN, GREEK, HEBREW, HINDI, HUNGARIAN, ICELANDIC, INDONESIAN,\n  ITALIAN, JAPANESE, KANNADA, KOREAN, LATIN AMERICAN SPANISH, LATVIAN,\n  LITHUANIAN, MACEDONIAN, MALAY, MEXICAN SPANISH, NORWEGIAN, POLISH, PORTUGUESE,\n  ROMANIAN, RUSSIAN, SIMPLIFIED CHINESE, SLOVAK, SLOVENIAN, SPANISH, SWAHILI,\n  SWEDISH, TAMIL, THAI, TRADITIONAL CHINESE, TURKISH, UKRAINIAN, VIETNAMESE\n\n- AD - Anno Domini ("in the year of the Lord")\n- AD_DOT - Anno Domini ("in the year of the Lord")\n- AM - Meridian indicator (before midday)\n- AM_DOT - Meridian indicator (before midday)\n- DAY - Name of day\n- DD - Day (1-31)\n- DDD - Day of year (1-336)\n- DY - Abbreviated name of day\n- FF[1-6] - Fractional seconds\n- HH - Hour (1-12)\n- HH12 - Hour (1-12)\n- HH24 - Hour (0-23)\n- MI - Minutes (0-59)\n- MM - Month (1-12)\n- MON - Abbreviated name of month\n- MONTH - Name of Month\n- PM - Meridian indicator (after midday)\n- PM_DOT - Meridian indicator (after midday)\n- RR - 20th century dates in the 21st century. 2 digits in the 50-99 range are\n...\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/to_date
[TO_DAYS]
declaration=date
category=Date and Time Functions
description=Given a date date, returns the number of days since the start of the current\ncalendar (0000-00-00).\n\nThe function is not designed for use with dates before the advent of the\nGregorian calendar in October 1582. Results are not reliable since it doesn't\naccount for the lost days when the calendar changed from the Julian calendar.\n\nThis is the converse of the FROM_DAYS() function.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/to_days
[TO_NUMBER1]
name=TO_NUMBER
declaration=number_or_string_subject
category=Numeric Functions
since=12.2
description=The function returns the DOUBLE data type for all signatures and input data\ntypes.\n\nWith one argument, TO_NUMBER converts a number, or a string that holds a plain\nnumber such as '-12.5', to DOUBLE.\n\nWith two arguments, string_format describes how string_subject is written. The\nformat supports the following elements:\n\nWithout S, MI, or PR, a fixed-point format does not accept a sign, so\nTO_NUMBER('-1234.50', '9999.99') returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/to_number
[TO_NUMBER2]
name=TO_NUMBER
declaration=string_subject,string_format
category=Numeric Functions
since=12.2
description=The function returns the DOUBLE data type for all signatures and input data\ntypes.\n\nWith one argument, TO_NUMBER converts a number, or a string that holds a plain\nnumber such as '-12.5', to DOUBLE.\n\nWith two arguments, string_format describes how string_subject is written. The\nformat supports the following elements:\n\nWithout S, MI, or PR, a fixed-point format does not accept a sign, so\nTO_NUMBER('-1234.50', '9999.99') returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/to_number
[TO_SECONDS]
declaration=expr
category=Date and Time Functions
description=Returns the number of seconds from year 0 till expr, or NULL if expr is not a\nvalid date or datetime.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/to_seconds
[TRIM]
declaration=[remstr FROM] str
category=String Functions
description=Returns the string str with all remstr prefixes or suffixes removed. If none of\nthe specifiers BOTH, LEADING, or TRAILING is given, BOTH is assumed. remstr is\noptional and, if not specified, spaces are removed.\n\nReturns NULL if given a NULL argument. If the result is empty, returns either an\nempty string, or, with SQL_MODE=Oracle, NULL. SQL_MODE=Oracle is not set by\ndefault.\n\nThe Oracle mode version of the function can be accessed in any mode by using\nTRIM_ORACLE as the function name.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/trim
[TRIM_ORACLE]
declaration=[{BOTH | LEADING | TRAILING} [remstr] FROM] str
category=String Functions
since=10.3.6
description=Returns the string str with all remstr prefixes or suffixes removed. If none of\nthe specifiers BOTH, LEADING, or TRAILING is given, BOTH is assumed. remstr is\noptional and, if not specified, spaces are removed.\n\nReturns NULL if given a NULL argument. If the result is empty, returns either an\nempty string, or, with SQL_MODE=Oracle, NULL. SQL_MODE=Oracle is not set by\ndefault.\n\nThe Oracle mode version of the function can be accessed in any mode by using\nTRIM_ORACLE as the function name.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/trim
[TRUNC]
declaration=date[,fmt]
category=Date and Time Functions
since=12.2.1
description=Returns a DATETIME truncated according to fmt.\n\nSupported formats:\n\nTruncate to day: DD, DDD, J Truncate to month: MM, MON, MONTH, RM Truncate to\nyear: SYEAR, SYYYY, Y,YEAR, YY, YYY, YYYY\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/trunc
[TRUNCATE]
declaration=X,D
category=Numeric Functions
description=Returns the number X, truncated to D decimal places. If D is 0, the result has\nno decimal point or fractional part. D can be negative to cause D digits left of\nthe decimal point of the value X to become zero.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/truncate
[UCASE]
declaration=str
category=String Functions
description=UCASE() is a synonym for UPPER().\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/ucase
[UNCOMPRESS]
declaration=string_to_uncompress
category=Encryption, Hashing and Compression Functions
description=Uncompresses a string compressed by the COMPRESS() function. If the argument is\nnot a compressed value, the result is NULL. This function requires MariaDB to\nhave been compiled with a compression library such as zlib. Otherwise, the\nreturn value is always NULL. The have_compress server system variable indicates\nwhether a compression library is present.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/uncompress
[UNCOMPRESSED_LENGTH]
declaration=compressed_string
category=Encryption, Hashing and Compression Functions
description=Returns the length that the compressed string had before being compressed with\nCOMPRESS().\n\nUNCOMPRESSED_LENGTH() returns NULL or an incorrect result if the string is not\ncompressed.\n\nReturns MYSQL_TYPE_LONG, or int(10), if the result fits within 32-bits.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/encryption-hashing-and-compression-functions/uncompressed_length
[UNHEX]
declaration=str
category=String Functions
description=Performs the inverse operation of HEX(str). That is, it interprets each pair of\nhexadecimal digits in the argument as a number and converts it to the character\nrepresented by the number. The resulting characters are returned as a binary\nstring.\n\nIf str is NULL, UNHEX() returns NULL.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/unhex
[UNIX_TIMESTAMP1]
name=UNIX_TIMESTAMP
declaration=
category=Date and Time Functions
description=If called with no argument, returns a Unix timestamp (seconds since 1970-01-01\n00:00:00 UTC) as an unsigned integer. If UNIX_TIMESTAMP() is called with a date\nargument, it returns the value of the argument as seconds since 1970-01-01\n00:00:00 UTC. date may be a DATE string, a DATETIME string, a TIMESTAMP, or a\nnumber in the format YYMMDD or YYYYMMDD. The server interprets date as a value\nin the current time zone and converts it to an internal value in UTC. Clients\ncan set their time zone as described in time zones.\n\nThe inverse function of UNIX_TIMESTAMP() is FROM_UNIXTIME()\n\nUNIX_TIMESTAMP() supports microseconds.\n\nFrom MariaDB 11.5:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/unix_timestamp
[UNIX_TIMESTAMP2]
name=UNIX_TIMESTAMP
declaration=date
category=Date and Time Functions
description=If called with no argument, returns a Unix timestamp (seconds since 1970-01-01\n00:00:00 UTC) as an unsigned integer. If UNIX_TIMESTAMP() is called with a date\nargument, it returns the value of the argument as seconds since 1970-01-01\n00:00:00 UTC. date may be a DATE string, a DATETIME string, a TIMESTAMP, or a\nnumber in the format YYMMDD or YYYYMMDD. The server interprets date as a value\nin the current time zone and converts it to an internal value in UTC. Clients\ncan set their time zone as described in time zones.\n\nThe inverse function of UNIX_TIMESTAMP() is FROM_UNIXTIME()\n\nUNIX_TIMESTAMP() supports microseconds.\n\nFrom MariaDB 11.5:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/unix_timestamp
[UPDATEXML]
declaration=xml_target, xpath_expr, new_xml
category=XML Functions
description=This function replaces a single portion of a given fragment of XML\nmarkupxml_target with a new XML fragment new_xml, and then returns the changed\nXML. The portion of xml_target that is replaced matches an XPath expression\nxpath_expr supplied by the user. If no expression matching xpath_expr is found,\nor if multiple matches are found, the function returns the original xml_target\nXML fragment. All three arguments should be strings.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/xml-functions/updatexml
[UPPER]
declaration=str
category=String Functions
description=Returns the string str with all characters changed to uppercase according to the\ncurrent character set mapping. The default is latin1 (cp1252 West European). The\nresult may depend on the collation and character set used. UCASE is a synonym.\n\nUPPER() is ineffective when applied to binary strings (BINARY, VARBINARY, BLOB).\nThe description of LOWER() shows how to perform lettercase conversion of binary\nstrings.\n\nThis page is licensed: GPLv2, originally from _fill_help_tables.sql_\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/upper
[USER]
declaration=
category=Information Functions
description=Returns the current MariaDB user name and host name, given when authenticating\nto MariaDB, as a string in the utf8 character set.\n\nThe value of USER() may differ from the value of CURRENT_USER(), which is the\nuser used to authenticate the current client. CURRENT_ROLE() returns the\ncurrently active role.\n\nFrom MariaDB 11.7:\n\nSYSTEM_USER() is a synonym for USER().\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/user
[UTC_DATE]
declaration=
category=Date and Time Functions
description=Returns the current UTC date as a value in YYYY-MM-DD or YYYYMMDD format,\ndepending on whether the function is used in a string or numeric context.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/utc_date
[UTC_TIME]
declaration=[precision]
category=Date and Time Functions
description=Returns the current UTC time as a value in HH:MM:SS or HHMMSS.uuuuuu format,\ndepending on whether the function is used in a string or numeric context.\n\nThe optional precision determines the microsecond precision. See Microseconds in\nMariaDB.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/utc_time
[UTC_TIMESTAMP]
declaration=[precision]
category=Date and Time Functions
description=Returns the current UTC date and time as a value in YYYY-MM-DD HH:MM:SS or\nYYYYMMDDHHMMSS.uuuuuu format, depending on whether the function is used in a\nstring or numeric context.\n\nThe optional precision determines the microsecond precision. See Microseconds in\nMariaDB.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/utc_timestamp
[UUID]
declaration=
category=Miscellaneous Functions
description=Returns a Universally Unique Identifier (UUID) version 1. Functions to generate\nv4 and v7 UUIDs are available from MariaDB 11.7. See UUIDv4 and UUIDv7\nrespectively.\n\nA UUID is designed as a number that is globally unique in space and time. Two\ncalls to UUID() are expected to generate two different values, even if these\ncalls are performed on two separate computers that are not connected to each\nother.\n\nUUID() results are intended to be unique, but cannot always be relied upon to be\nunpredictable and unguessable.\n\nA UUID is a 128-bit number represented by a utf8 string of five hexadecimal\nnumbers in aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee format:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/uuid
[UUID_SHORT]
declaration=
category=Miscellaneous Functions
description=Returns a "short" universally unique identifier as a 64-bit unsigned integer\n(rather than a string-form 128-bit identifier as returned by the UUID()\nfunction).\n\nThe value of UUID_SHORT() is guaranteed to be unique if the following conditions\nhold:\n\n- The server_id of the current host is unique among your set of master and\n  replica servers.\n- server_id is between 0 and 255.\n- You don't set back your system time for your server between mariadbd restarts.\n- You do not invoke UUID_SHORT() on average more than 16 million times per\n  second between mariadbd restarts\n\nThe UUID_SHORT() return value is constructed this way:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/uuid_short
[UUID_V4]
declaration=
category=Miscellaneous Functions
since=11.7.1
description=Returns a Universally Unique Identifier (UUID) version 4. To generate a version\n1 UUID, see the UUID function. To generate a version 7 UUID, see UUIDv7.\n\nA UUID is designed as a number that is globally unique in space and time. Two\ncalls to UUID() are expected to generate two different values, even if these\ncalls are performed on two separate computers that are not connected to each\nother.\n\nUUID_v4() results are intended to be unique, but cannot always be relied upon to\nbe unpredictable and unguessable.\n\nA UUID is a 128-bit number represented by a utf8 string of five hexadecimal\nnumbers in aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee format.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/uuid_v4
[UUID_V7]
declaration=
category=Miscellaneous Functions
since=11.7.1
description=Returns a Universally Unique Identifier (UUID) version 7. To generate a version\n1 UUID, see the UUID function. To generate a version 4 UUID, see UUID_v4.\n\nA UUID is designed as a number that is globally unique in space and time. Two\ncalls to UUID() are expected to generate two different values, even if these\ncalls are performed on two separate computers that are not connected to each\nother.\n\nA UUID is a 128-bit number represented by a utf8 string of five hexadecimal\nnumbers in aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee format.\n\nStatements using the UUID_v7() function are not safe for statement-based\nreplication.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/uuid_v7
[VALUE]
declaration=col_name
category=Miscellaneous Functions
description=In an INSERT ... ON DUPLICATE KEY UPDATE statement, you can use the\nVALUES(col_name) function in the UPDATE clause to refer to column values from\nthe INSERT portion of the statement. In other words, VALUES(col_name) in the\nUPDATE clause refers to the value of col_name that would be inserted, had no\nduplicate-key conflict occurred. This function is especially useful in\nmultiple-row inserts.\n\nThe VALUES() function is meaningful only in INSERT ... ON DUPLICATE KEY UPDATE\nstatements and returns NULL otherwise.\n\nThis function was renamed to VALUE(), because it's incompatible with the\nstandard Table Value Constructors syntax.\n\nThe VALUES() function can still be used but only in INSERT ... ON DUPLICATE KEY\nUPDATE statements; it's a syntax error otherwise.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/miscellaneous-functions/values-value
[VARIANCE]
declaration=expr
category=Aggregate Functions
description=Returns the population standard variance of expr. This is an extension to\nstandard SQL. The standard SQL function VAR_POP() can be used instead.\n\nVariance is calculated by\n\n- working out the mean for the set;\n- for each number, subtracting the mean and squaring the result;\n- calculating the average of the resulting differences.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/variance
[VAR_POP]
declaration=expr
category=Aggregate Functions
description=Returns the population standard variance of expr. It considers rows as the whole\npopulation, not as a sample, so it has the number of rows as the denominator.\nYou can also use VARIANCE(), which is equivalent but is not standard SQL.\n\nVariance is calculated by\n\n- working out the mean for the set;\n- for each number, subtracting the mean and squaring the result;\n- calculating the average of the resulting differences.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/var_pop
[VAR_SAMP]
declaration=expr
category=Aggregate Functions
description=Returns the sample variance of expr. That is, the denominator is the number of\nrows minus one.\n\nIt is an aggregate function, and so can be used with the GROUP BY clause.\n\nVAR_SAMP() can be used as a window function.\n\nVAR_SAMP() returns NULL if there were no matching rows.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/aggregate-functions/var_samp
[VEC_DISTANCE]
declaration=v, s
category=Vector Functions
since=11.8.0
description=VEC_DISTANCE is a generic function that behaves either as\nVEC_DISTANCE_EUCLIDEAN, calculating the Euclidean (L2) distance between two\npoints. Or VEC_DISTANCE_COSINE, calculating the Cosine distance between two\nvectors, depending on the underlying index type.\n\nIf the underlying index cannot be determined, an error 4206 is returned:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vector-functions-vec_distance
[VEC_DISTANCE_COSINE]
declaration=v, s
category=Vector Functions
since=11.7.0
description=VEC_Distance_Cosine is an SQL function that calculates the Cosine distance\nbetween two (not necessarily normalized) vectors.\n\nVectors must be of the same length. A distance between two vectors of different\nlengths is not defined, and VEC_Distance_Cosine will return NULL in such cases.\n\nIf the vector index was not built for the cosine function (see CREATE TABLE with\nVectors), the index is not used - a full table scan is performed instead. The\nVEC_DISTANCE function is a generic function that behaves either as\nVEC_DISTANCE_EUCLIDEAN or VEC_DISTANCE_COSINE, depending on the underlying index\ntype.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_distance_cosine
[VEC_DISTANCE_EUCLIDEAN]
declaration=v, s
category=Vector Functions
since=11.7.0
description=VEC_Distance_Euclidean is an SQL function that calculates a Euclidean (L2)\ndistance between two points.\n\nVectors must be of the same length, a distance between two vectors of different\nlengths is not defined and VEC_Distance_Euclidean returns NULL in such cases.\n\nIf the vector index was not built for the euclidean function (see CREATE TABLE\nwith Vectors), the index is not used, and a full table scan performed instead.\nThe VEC_DISTANCE function is a generic function that behaves either as\nVEC_DISTANCE_EUCLIDEAN or VEC_DISTANCE_COSINE, depending on the underlying index\ntype.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_distance_euclidean
[VEC_FROMTEXT]
declaration=s
category=Vector Functions
since=11.7.0
description=VEC_FromText converts a text representation of the vector (json array of\nnumbers) to a vector (little-endian IEEE float sequence of bytes, 4 bytes per\nfloat).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_fromtext
[VEC_TOTEXT]
declaration=v
category=Vector Functions
since=11.7.0
description=VEC_ToText converts a binary vector into a json array of numbers (floats).\nReturns NULL and throws a warning Error 4201 if given an invalid vector.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_totext
[VERSION]
declaration=
category=Information Functions
description=Returns a string that indicates the MariaDB server version. The string uses the\nutf8 character set.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/secondary-functions/information-functions/version
[WEEK]
declaration=date[,mode]
category=Date and Time Functions
description=This function returns the week number for date. The two-argument form ofWEEK()\nallows you to specify whether the week starts on Sunday or Monday and whether\nthe return value should be in the range from 0 to 53 or from 1 to 53. If the\nmode argument is omitted, the value of the default_week_format system variable\nis used.\n\nWith the mode value of 3, which means 'more than 3 days this year', weeks are\nnumbered according to ISO 8601:1988.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/week
[WEEKDAY]
declaration=date
category=Date and Time Functions
description=Returns the weekday index for date (0 = Monday, 1 = Tuesday, ... 6 = Sunday).\n\nThis contrasts with DAYOFWEEK() which follows the ODBC standard (1 = Sunday, 2 =\nMonday, ..., 7 = Saturday).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/weekday
[WEEKOFYEAR]
declaration=date
category=Date and Time Functions
description=Returns the calendar week of the date as a number in the range from 1 sqto 53.\nWEEKOFYEAR() is a compatibility function that is equivalent to WEEK(date,3).\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/weekofyear
[WEIGHT_STRING]
declaration=str [AS {CHAR|BINARY}(N)] [LEVEL levels] [flags]
category=String Functions
description=Returns a binary string representing the string's sorting and comparison value.\nA string with a lower result means that for sorting purposes the string appears\nbefore a string with a higher result.\n\nWEIGHT_STRING() is particularly useful when adding new collations, for testing\npurposes.\n\nIf str is a non-binary string (CHAR, VARCHAR or TEXT), WEIGHT_STRING returns the\nstring's collation weight. If str is a binary string (BINARY, VARBINARY or\nBLOB), the return value is simply the input value, since the weight for each\nbyte in a binary string is the byte value.\n\nWEIGHT_STRING() returns NULL if given a NULL input.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/string-functions/weight_string
[WITHIN]
declaration=g1,g2
category=Geometry Relations
description=Returns 1 or 0 to indicate whether g1 is spatially within g2. This tests the\nopposite relationship as Contains().\n\nWITHIN() is based on the original MySQL implementation, and uses object bounding\nrectangles, while ST_WITHIN() uses object shapes.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/geometry-relations/within
[WSREP_LAST_SEEN_GTID]
declaration=
category=Galera Functions
since=10.4.2
description=Returns the Global Transaction ID of the most recent write transaction observed\nby the client.\n\nThe result can be useful to determine the transaction to provide to\nWSREP_SYNC_WAIT_UPTO_GTID for waiting and unblocking purposes.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/galera-functions/wsrep_last_seen_gtid
[WSREP_LAST_WRITTEN_GTID]
declaration=
category=Galera Functions
since=10.4.2
description=Returns the Global Transaction ID of the most recent write transaction performed\nby the client.\n\nThis page is licensed: CC BY-SA / Gnu FDL\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/galera-functions/wsrep_last_written_gtid
[WSREP_SYNC_WAIT_UPTO_GTID]
declaration=gtid[,timeout]
category=Galera Functions
since=10.4.2
description=Blocks the client until the transaction specified by the given Global\nTransaction ID is applied and committed by the node.\n\nThe optional timeout argument can be used to specify a block timeout in seconds.\nIf not provided, the timeout will be indefinite.\n\nReturns the node that applied and committed the Global Transaction ID,\nER_LOCAL_WAIT_TIMEOUT if the function is timed out before this, or\nER_WRONG_ARGUMENTS if the function is given an invalid GTID.\n\nThe result from WSREP_LAST_SEEN_GTID can be useful to determine the transaction\nto provide to WSREP_SYNC_WAIT_UPTO_GTID for waiting and unblocking purposes.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/special-functions/galera-functions/wsrep_sync_wait_upto_gtid
[X]
declaration=p
category=Point Properties
description=Returns the X-coordinate value for the point p as a double-precision number.\n\nST_X() and X() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/point-properties/st_x
[XXH3]
declaration=expr
category=Numeric Functions
since=13.1.1
description=XXH3 returns a fast, non-cryptographic xxHash of a text value as a 64-bit number\n(BIGINT UNSIGNED). It's useful for checksums, change detection, and grouping or\nbucketing rows. For a 32-bit result, use XXH32().\n\nThe argument must be a text value: a string, BLOB/TEXT, JSON, ENUM, or SET.\nNumbers, dates, and other non-text values are rejected with an error; CAST()\nthem to a string first.\n\nHashing NULL returns NULL. Hashing an empty string returns 0.\n\nThe result depends on the collation, not on the raw bytes. Values that count as\nequal under the collation hash to the same number (for example, 'abc' and 'ABC'\nunder a case-insensitive collation). The same text in a different character set\nor collation gives a different number.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/xxh3
[XXH32]
declaration=expr
category=Numeric Functions
since=13.1.1
description=XXH32 returns a fast, non-cryptographic xxHash of a text value as a 32-bit\nnumber (INT UNSIGNED). It's useful for checksums, change detection, and grouping\nor bucketing rows. For a 64-bit result, use XXH3().\n\nThe argument must be a text value: a string, BLOB/TEXT, JSON, ENUM, or SET.\nNumbers, dates, and other non-text values are rejected with an error; CAST()\nthem to a string first.\n\nHashing NULL returns NULL. Hashing an empty string returns 0.\n\nThe result depends on the collation, not on the raw bytes. Values that count as\nequal under the collation hash to the same number (for example, 'abc' and 'ABC'\nunder a case-insensitive collation). The same text in a different character set\nor collation gives a different number.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/numeric-functions/xxh32
[Y]
declaration=p
category=Point Properties
description=Returns the Y-coordinate value for the point p as a double-precision number.\n\nST_Y() and Y() are synonyms.\n\nURL: https://mariadb.com/docs/server/reference/sql-statements/geometry-constructors/point-properties/st_y
[YEAR]
declaration=date
category=Date and Time Functions
description=Returns the year for the given date, in the range 1000 to 9999, or 0 for the\n"zero" date.\n\nSQL_TSI_YEAR is a synonym for YEAR:\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/year
[YEARWEEK1]
name=YEARWEEK
declaration=date
category=Date and Time Functions
description=Returns year and week for a date. The mode argument works exactly like the mode\nargument to WEEK(). The year in the result may be different from the year in the\ndate argument for the first and the last week of the year.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/yearweek
[YEARWEEK2]
name=YEARWEEK
declaration=date,mode
category=Date and Time Functions
description=Returns year and week for a date. The mode argument works exactly like the mode\nargument to WEEK(). The year in the result may be different from the year in the\ndate argument for the first and the last week of the year.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/yearweek
