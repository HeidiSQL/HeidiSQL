name: Lazarus

defaults:
    run:
        shell: bash

permissions:
  contents: write


on:

  push:
    branches: [ lazarus ]
    tags: [ "*" ]
    paths-ignore: [ "README.md", "LICENSE", "CHANGELOG.md", ".github/cliff.toml" ]

  pull_request:
    branches: [ lazarus ]

jobs:

    build:
        runs-on: ${{ matrix.operating-system }}
        env:
          GITHUB: 1
        strategy:
            fail-fast: false
            matrix:
                operating-system: [windows-latest, ubuntu-latest, macos-15]
                lazarus-versions: ["stable"]

        steps:
        - name: Checkout source code
          uses: actions/checkout@v6
          with:
            fetch-depth: 0

        # The installer is downloaded to ~/lazarus-installers, served by actions/cache.
        # Bump the cache key when changing the installer URL in this step.
        - name: Cache Lazarus 4.8 installer (Windows)
          if: ${{ matrix.operating-system == 'windows-latest' }}
          uses: actions/cache@v6
          with:
            path: ~/lazarus-installers
            key: lazarus48-installers-win64-fpc-3.2.2
        - name: Install Lazarus 4.8 (Windows)
          if: ${{ matrix.operating-system == 'windows-latest' }}
          shell: pwsh
          run: |
            $installer = "$env:USERPROFILE\lazarus-installers\lazarus-4.8.exe"
            New-Item -ItemType Directory -Force -Path (Split-Path $installer) | Out-Null
            if (-not (Test-Path $installer) -or (Get-Item $installer).Length -lt 100MB) {
              curl.exe -L --retry 3 -o $installer "https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe/download"
            }
            if ((Get-Item $installer).Length -lt 100MB) { throw "Lazarus installer download failed: file too small" }
            $lazarusDir = "${env:RUNNER_TEMP}\lazarus"
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/SP-", "/SUPPRESSMSGBOXES", "/DIR=$lazarusDir" -Wait -NoNewWindow
            Add-Content -Path $env:GITHUB_PATH -Value $lazarusDir
            Add-Content -Path $env:GITHUB_PATH -Value "$lazarusDir\fpc\3.2.2\bin\x86_64-win64"

        # The installers are downloaded to ~/lazarus-installers, served by actions/cache.
        # Bump the cache key when changing the installer URLs in this step.
        - name: Cache Lazarus 4.8 installers (macOS)
          if: ${{ matrix.operating-system == 'macos-15' }}
          uses: actions/cache@v6
          with:
            path: ~/lazarus-installers
            key: lazarus48-installers-macos-fpc-3.2.4rc1a
        - name: Install Lazarus 4.8 (macOS)
          if: ${{ matrix.operating-system == 'macos-15' }}
          run: |
            INSTALLER_CACHE="$HOME/lazarus-installers"
            mkdir -p "$INSTALLER_CACHE"
            if [ ! -s "$INSTALLER_CACHE/fpc.dmg" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg" -O "$INSTALLER_CACHE/fpc.dmg"
            fi
            if [ ! -s "$INSTALLER_CACHE/lazarus.zip" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip" -O "$INSTALLER_CACHE/lazarus.zip"
            fi
            sudo hdiutil attach "$INSTALLER_CACHE/fpc.dmg"
            FPC_VOL=$(ls -d /Volumes/fpc* | head -1)
            FPC_PKG=$(find "$FPC_VOL" -maxdepth 1 -name "*.pkg" | head -1)
            sudo installer -package "$FPC_PKG" -target /
            sudo hdiutil detach "$FPC_VOL"
            xattr -cr "$INSTALLER_CACHE/lazarus.zip"
            unzip -q "$INSTALLER_CACHE/lazarus.zip" -d "$RUNNER_TEMP"
            sed -i '' 's|"/Developer/lazarus/"|"'$RUNNER_TEMP'/lazarus/"|g' "$RUNNER_TEMP/lazarus/config/environmentoptions.xml" 2>/dev/null || true
            sudo ln -sf "$RUNNER_TEMP/lazarus/lazbuild" /usr/local/bin/lazbuild
            echo "$RUNNER_TEMP/lazarus" >> $GITHUB_PATH

        - name: Patch Lazarus 4.8 (macOS)
          if: ${{ matrix.operating-system == 'macos-15' }}
          run: |
            LAZARUS_DIR="$RUNNER_TEMP/lazarus"
            test -f "$LAZARUS_DIR/lcl/include/lclintf.inc"
            for p in "$GITHUB_WORKSPACE"/extra/lazarus-patches/4.8/*.patch; do
              patch -d "$LAZARUS_DIR" -p1 --dry-run < "$p"
              patch -d "$LAZARUS_DIR" -p1 < "$p"
            done
            grep -Fq "LCLIntf.SetCanvasScaleFactor(NodeBitmap.Canvas.Handle, ScaleFactor);" "$LAZARUS_DIR/components/virtualtreeview/laz.virtualtrees.pas"
            grep -Fq "CGContextScaleCTM(ctx.CGContext, AScaleRatio, AScaleRatio);" "$LAZARUS_DIR/lcl/interfaces/cocoa/cocoalclintf.inc"

        # The installers are downloaded to ~/lazarus-installers, served by actions/cache.
        # Bump the cache key when changing the installer URLs in the steps of this job.
        - name: Cache Lazarus 4.8 installers (Ubuntu)
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          uses: actions/cache@v6
          with:
            path: ~/lazarus-installers
            key: lazarus48-installers-linux-amd64-fpc-3.2.2-qt6pas-6.2.10
        - name: Install Lazarus 4.8 (Ubuntu)
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          run: |
            INSTALLER_CACHE="$HOME/lazarus-installers"
            mkdir -p "$INSTALLER_CACHE"
            if [ ! -s "$INSTALLER_CACHE/fpc-laz_3.2.2-210709_amd64.deb" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-laz_3.2.2-210709_amd64.deb" -O "$INSTALLER_CACHE/fpc-laz_3.2.2-210709_amd64.deb"
            fi
            if [ ! -s "$INSTALLER_CACHE/fpc-src_3.2.2-210709_amd64.deb" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-src_3.2.2-210709_amd64.deb" -O "$INSTALLER_CACHE/fpc-src_3.2.2-210709_amd64.deb"
            fi
            if [ ! -s "$INSTALLER_CACHE/lazarus-project_4.8.0-0_amd64.deb" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_amd64.deb" -O "$INSTALLER_CACHE/lazarus-project_4.8.0-0_amd64.deb"
            fi
            sudo apt-get update
            sudo apt-get install -y "$INSTALLER_CACHE/fpc-laz_3.2.2-210709_amd64.deb" "$INSTALLER_CACHE/fpc-src_3.2.2-210709_amd64.deb" "$INSTALLER_CACHE/lazarus-project_4.8.0-0_amd64.deb"
            echo "/usr/lib/lazarus/4.8" >> $GITHUB_PATH

        - name: Build HeidiSQL (Windows)
          if: ${{ matrix.operating-system == 'windows-latest' }}
          run: |
            echo Building with Windows
            make build-win64

        - name: Verify PE flags (Windows)
          if: ${{ matrix.operating-system == 'windows-latest' }}
          shell: pwsh
          run: |
            & .\extra\peflags\peflags.exe .\out\win64\heidisql.exe --check --policy
            $code = $LASTEXITCODE
            Write-Host "peflags policy exit code: $code"
            if (($code -band 1) -ne 0) { throw 'DYNAMICBASE not set' }
            if (($code -band 4) -ne 0) { throw 'NXCOMPAT not set' }
            if (($code -band 8) -ne 0) { throw 'HIGH_ENTROPY_VA not set on PE32+' }
            if (($code -band 2) -ne 0) {
              Write-Warning 'ASLR is not effective on the Lazarus Windows build due to missing/unusable relocation directory.'
            }
            exit 0

        - name: Upload binaries Windows
          id: upload-unsigned-win64
          if: ${{ matrix.operating-system == 'windows-latest' && matrix.lazarus-versions == 'stable' }}
          uses: actions/upload-artifact@v6
          with:
            name: ${{ matrix.operating-system }}-WIN64
            path: out/win64/heidisql.exe

        - name: Sign heidisql.exe via SignPath
          if: ${{ matrix.operating-system == 'windows-latest' && matrix.lazarus-versions == 'stable' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
          uses: signpath/github-action-submit-signing-request@v3
          with:
            api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
            organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
            project-slug: HeidiSQL
            # TODO: switch back to github.ref_type == 'tag' && 'release-signing' || 'test-signing'
            # once the SignPath release certificate is available.
            signing-policy-slug: test-signing
            github-artifact-id: ${{ steps.upload-unsigned-win64.outputs.artifact-id }}
            wait-for-completion: true
            output-artifact-directory: signed

        - name: Upload signed Windows binary
          if: ${{ matrix.operating-system == 'windows-latest' && matrix.lazarus-versions == 'stable' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
          uses: actions/upload-artifact@v6
          with:
            name: ${{ matrix.operating-system }}-WIN64-signed
            path: signed/heidisql.exe

        - name: Install Inno Setup
          if: ${{ matrix.operating-system == 'windows-latest' }}
          shell: pwsh
          run: choco install innosetup --no-progress -y

        - name: Build Windows installer
          if: ${{ matrix.operating-system == 'windows-latest' }}
          run: |
            # Prefer the signed binary, fall back to the unsigned one (e.g. fork PRs without SignPath)
            mkdir -p out
            if [ -f signed/heidisql.exe ]; then
              cp signed/heidisql.exe out/heidisql.exe
            else
              cp out/win64/heidisql.exe out/heidisql.exe
            fi
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" create-windows-installer.iss

        - name: Upload Windows installer
          if: ${{ matrix.operating-system == 'windows-latest' }}
          uses: actions/upload-artifact@v6
          with:
            name: windows-installer
            path: out/HeidiSQL_*_Setup.exe

        - name: Build HeidiSQL (Ubuntu GTK)
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          run: |
            echo Building with GTK2
            make build-gtk2

        - name: Upload binaries GTK
          if: ${{ matrix.operating-system == 'ubuntu-latest' && matrix.lazarus-versions == 'stable' }}
          uses: actions/upload-artifact@v6
          with:
            name: ${{ matrix.operating-system }}-GTK
            path: out/gtk2/heidisql

        - name: Getting libqt5pas-dev, libqt6pas-dev
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          run: |
            sudo apt update
            sudo apt install -y libqt5pas-dev wget qt6-base-dev
            INSTALLER_CACHE="$HOME/lazarus-installers"
            mkdir -p "$INSTALLER_CACHE"
            LIBQT6PAS_VERSION="6.2.10"
            if [ ! -s "$INSTALLER_CACHE/libqt6pas6_${LIBQT6PAS_VERSION}-1_amd64.deb" ]; then
              wget -q "https://github.com/davidbannon/libqt6pas/releases/download/v${LIBQT6PAS_VERSION}/libqt6pas6_${LIBQT6PAS_VERSION}-1_amd64.deb" -O "$INSTALLER_CACHE/libqt6pas6_${LIBQT6PAS_VERSION}-1_amd64.deb"
            fi
            sudo dpkg -i "$INSTALLER_CACHE/libqt6pas6_${LIBQT6PAS_VERSION}-1_amd64.deb" || sudo apt-get install -f -y
            if [ ! -s "$INSTALLER_CACHE/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_amd64.deb" ]; then
              wget -q "https://github.com/davidbannon/libqt6pas/releases/download/v${LIBQT6PAS_VERSION}/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_amd64.deb" -O "$INSTALLER_CACHE/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_amd64.deb"
            fi
            sudo dpkg -i "$INSTALLER_CACHE/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_amd64.deb" || sudo apt-get install -f -y

        - name: Build HeidiSQL (Ubuntu QT5)
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          run: |
            echo Building with QT5
            make build-qt5

        - name: Upload binaries QT5
          if: ${{ matrix.operating-system == 'ubuntu-latest' && matrix.lazarus-versions == 'stable' }}
          uses: actions/upload-artifact@v6
          with:
            name: ${{ matrix.operating-system }}-QT5
            path: out/qt5/heidisql

        - name: Patch Lazarus 4.8 for QT6
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          run: |
            LAZARUS_DIR="/usr/share/lazarus/4.8.0"
            test -f "$LAZARUS_DIR/lcl/include/lclintf.inc"
            for p in "$GITHUB_WORKSPACE"/extra/lazarus-patches/4.8/*.patch; do
              sudo patch -d "$LAZARUS_DIR" -p1 --dry-run < "$p"
              sudo patch -d "$LAZARUS_DIR" -p1 < "$p"
            done
            grep -Fq "QPaintDevice_devicePixelRatioF" "$LAZARUS_DIR/lcl/interfaces/qt6/qtwscontrols.pp"
            grep -Fq "LCLIntf.SetCanvasScaleFactor(NodeBitmap.Canvas.Handle, ScaleFactor);" "$LAZARUS_DIR/components/virtualtreeview/laz.virtualtrees.pas"

        - name: Build HeidiSQL (Ubuntu QT6)
          if: ${{ matrix.operating-system == 'ubuntu-latest' }}
          run: |
            echo Building with QT6
            make build-qt6

        - name: Upload binaries QT6
          if: ${{ matrix.operating-system == 'ubuntu-latest' && matrix.lazarus-versions == 'stable' }}
          uses: actions/upload-artifact@v6
          with:
            name: ${{ matrix.operating-system }}-QT6
            path: out/qt6/heidisql

        - name: Install FreeTDS (macOS)
          if: ${{ matrix.operating-system == 'macos-15' }}
          run: |
            brew install freetds

        - name: Build HeidiSQL (macOS)
          if: ${{ matrix.operating-system == 'macos-15' }}
          run: make build-macos

        - name: Upload binaries macOS
          if: ${{ matrix.operating-system == 'macos-15' && matrix.lazarus-versions == 'stable' }}
          uses: actions/upload-artifact@v6
          with:
            name: ${{ matrix.operating-system }}
            path: out/macos/heidisql

    build-macos-app:
      name: macOS App Bundle
      if: github.repository == 'HeidiSQL/HeidiSQL'
      runs-on: macos-15
      env:
        GITHUB: 1
      steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The installers are downloaded to ~/lazarus-installers, served by actions/cache.
      # Bump the cache key when changing the installer URLs in this step.
      - name: Cache Lazarus 4.8 installers (macOS)
        uses: actions/cache@v6
        with:
          path: ~/lazarus-installers
          key: lazarus48-installers-macos-fpc-3.2.4rc1a
      - name: Install Lazarus 4.8 (macOS)
        run: |
          INSTALLER_CACHE="$HOME/lazarus-installers"
          mkdir -p "$INSTALLER_CACHE"
          if [ ! -s "$INSTALLER_CACHE/fpc.dmg" ]; then
            wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20x86-64/Lazarus%204.8/fpc-3.2.4rc1a.intelarm64-macosx.dmg" -O "$INSTALLER_CACHE/fpc.dmg"
          fi
          if [ ! -s "$INSTALLER_CACHE/lazarus.zip" ]; then
            wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20macOS%20aarch64/Lazarus%204.8/lazarus-darwin-aarch64-4.8.zip" -O "$INSTALLER_CACHE/lazarus.zip"
          fi
          sudo hdiutil attach "$INSTALLER_CACHE/fpc.dmg"
          FPC_VOL=$(ls -d /Volumes/fpc* | head -1)
          FPC_PKG=$(find "$FPC_VOL" -maxdepth 1 -name "*.pkg" | head -1)
          sudo installer -package "$FPC_PKG" -target /
          sudo hdiutil detach "$FPC_VOL"
          xattr -cr "$INSTALLER_CACHE/lazarus.zip"
          unzip -q "$INSTALLER_CACHE/lazarus.zip" -d "$RUNNER_TEMP"
          sed -i '' 's|"/Developer/lazarus/"|"'$RUNNER_TEMP'/lazarus/"|g' "$RUNNER_TEMP/lazarus/config/environmentoptions.xml" 2>/dev/null || true
          sudo ln -sf "$RUNNER_TEMP/lazarus/lazbuild" /usr/local/bin/lazbuild
          echo "$RUNNER_TEMP/lazarus" >> $GITHUB_PATH

      - name: Patch Lazarus 4.8 (macOS)
        run: |
          LAZARUS_DIR="$RUNNER_TEMP/lazarus"
          test -f "$LAZARUS_DIR/lcl/include/lclintf.inc"
          for p in "$GITHUB_WORKSPACE"/extra/lazarus-patches/4.8/*.patch; do
            patch -d "$LAZARUS_DIR" -p1 --dry-run < "$p"
            patch -d "$LAZARUS_DIR" -p1 < "$p"
          done
          grep -Fq "LCLIntf.SetCanvasScaleFactor(NodeBitmap.Canvas.Handle, ScaleFactor);" "$LAZARUS_DIR/components/virtualtreeview/laz.virtualtrees.pas"
          grep -Fq "CGContextScaleCTM(ctx.CGContext, AScaleRatio, AScaleRatio);" "$LAZARUS_DIR/lcl/interfaces/cocoa/cocoalclintf.inc"

      - name: Import code signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_P12_BASE64}" ]; then
            echo "No signing certificate configured, skipping keychain setup"
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install FreeTDS (macOS)
        run: |
          brew install freetds

      # The Firebird macOS pkg is unpacked instead of installed via "installer",
      # to avoid running a Firebird server on the build runner.
      # The pkg is cached in ~/firebird-installers, served by actions/cache.
      # Bump the cache key when changing the pkg URL in this step.
      - name: Cache Firebird client (macOS)
        uses: actions/cache@v6
        with:
          path: ~/firebird-installers
          key: firebird-client-macos-arm64-5.0.4
      - name: Get Firebird client (macOS)
        run: |
          INSTALLER_CACHE="$HOME/firebird-installers"
          mkdir -p "$INSTALLER_CACHE"
          FIREBIRD_PKG="$INSTALLER_CACHE/Firebird-5.0.4.1812-0-macos-arm64.pkg"
          if [ ! -s "$FIREBIRD_PKG" ]; then
            wget -q "https://github.com/FirebirdSQL/firebird/releases/download/v5.0.4/Firebird-5.0.4.1812-0-macos-arm64.pkg" -O "$FIREBIRD_PKG"
          fi
          # pkgutil --expand requires its target directory to not exist yet
          rm -rf "$RUNNER_TEMP/firebird-pkg" "$RUNNER_TEMP/firebird-root"
          mkdir -p "$RUNNER_TEMP/firebird-root"
          pkgutil --expand "$FIREBIRD_PKG" "$RUNNER_TEMP/firebird-pkg"
          # bsdtar (= /usr/bin/tar on macOS) auto-detects the gzip'ed cpio payload
          (cd "$RUNNER_TEMP/firebird-root" && tar -xf "$RUNNER_TEMP/firebird-pkg/Firebird.pkg/Payload")
          test -f "$RUNNER_TEMP/firebird-root/Versions/A/Resources/lib/libfbclient.dylib"
          test -f "$RUNNER_TEMP/firebird-root/Versions/A/Resources/plugins/libSrp.dylib"
          echo "FBCLIENT_ROOT=$RUNNER_TEMP/firebird-root/Versions/A/Resources" >> "$GITHUB_ENV"

      - name: Build HeidiSQL (macOS)
        run: make build-macos

      - name: Create, sign and notarize app bundle
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
        run: |
          if [ -n "${MACOS_CODESIGN_IDENTITY}" ] && [ -n "${APPLE_ID}" ]; then
            xcrun notarytool store-credentials notarytool-profile-ci \
              --apple-id "${APPLE_ID}" \
              --team-id "${APPLE_TEAM_ID}" \
              --password "${APPLE_PASSWORD}"
            export MACOS_NOTARY_PROFILE=notarytool-profile-ci
            ./create-macos-app.sh --notarize
          else
            echo "Signing secrets not available, creating ad-hoc signed bundle"
            ./create-macos-app.sh --adhoc
          fi

      - name: Zip app bundle
        run: |
          cd "$(pwd)"
          rm -f heidisql-macos-app.zip
          /usr/bin/zip -r -y heidisql-macos-app.zip heidisql.app

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos-app-bundle
          path: heidisql-macos-app.zip

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

    build-qt6arm:
      name: Linux ARM64 QT6
      runs-on: ubuntu-24.04-arm
      env:
        GITHUB: 1

      steps:
        - name: Checkout source code
          uses: actions/checkout@v6
          with:
            fetch-depth: 0

        # The installers are downloaded to ~/lazarus-installers, served by actions/cache.
        # Bump the cache key when changing the installer URLs in the steps of this job.
        - name: Cache Lazarus 4.8 installers (ARM64)
          uses: actions/cache@v6
          with:
            path: ~/lazarus-installers
            key: lazarus48-installers-linux-arm64-fpc-3.2.3-qt6pas-6.2.10
        - name: Install Lazarus 4.8 (ARM64)
          run: |
            sudo apt-get update
            INSTALLER_CACHE="$HOME/lazarus-installers"
            mkdir -p "$INSTALLER_CACHE"
            if [ ! -s "$INSTALLER_CACHE/fpc-laz_3.2.3-240813_arm64.deb" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-laz_3.2.3-240813_arm64.deb" -O "$INSTALLER_CACHE/fpc-laz_3.2.3-240813_arm64.deb"
            fi
            if [ ! -s "$INSTALLER_CACHE/fpc-src_3.2.3-240813_arm64.deb" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/fpc-src_3.2.3-240813_arm64.deb" -O "$INSTALLER_CACHE/fpc-src_3.2.3-240813_arm64.deb"
            fi
            if [ ! -s "$INSTALLER_CACHE/lazarus-project_4.8.0-0_arm64.deb" ]; then
              wget -q "https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20arm64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_arm64.deb" -O "$INSTALLER_CACHE/lazarus-project_4.8.0-0_arm64.deb"
            fi
            sudo apt-get install -y "$INSTALLER_CACHE/fpc-laz_3.2.3-240813_arm64.deb" "$INSTALLER_CACHE/fpc-src_3.2.3-240813_arm64.deb" "$INSTALLER_CACHE/lazarus-project_4.8.0-0_arm64.deb"
            echo "/usr/lib/lazarus/4.8" >> $GITHUB_PATH

        - name: Install Qt6 for ARM64
          run: |
            sudo apt-get update
            sudo apt-get install -y wget qt6-base-dev
            INSTALLER_CACHE="$HOME/lazarus-installers"
            mkdir -p "$INSTALLER_CACHE"
            LIBQT6PAS_VERSION="6.2.10"
            if [ ! -s "$INSTALLER_CACHE/libqt6pas6_${LIBQT6PAS_VERSION}-1_arm64.deb" ]; then
              wget -q "https://github.com/davidbannon/libqt6pas/releases/download/v${LIBQT6PAS_VERSION}/libqt6pas6_${LIBQT6PAS_VERSION}-1_arm64.deb" -O "$INSTALLER_CACHE/libqt6pas6_${LIBQT6PAS_VERSION}-1_arm64.deb"
            fi
            sudo dpkg -i "$INSTALLER_CACHE/libqt6pas6_${LIBQT6PAS_VERSION}-1_arm64.deb" || sudo apt-get install -f -y
            if [ ! -s "$INSTALLER_CACHE/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_arm64.deb" ]; then
              wget -q "https://github.com/davidbannon/libqt6pas/releases/download/v${LIBQT6PAS_VERSION}/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_arm64.deb" -O "$INSTALLER_CACHE/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_arm64.deb"
            fi
            sudo dpkg -i "$INSTALLER_CACHE/libqt6pas6-dev_${LIBQT6PAS_VERSION}-1_arm64.deb" || sudo apt-get install -f -y

        - name: Patch Lazarus 4.8 for QT6
          run: |
            LAZARUS_DIR="/usr/share/lazarus/4.8.0"
            test -f "$LAZARUS_DIR/lcl/include/lclintf.inc"
            for p in "$GITHUB_WORKSPACE"/extra/lazarus-patches/4.8/*.patch; do
              sudo patch -d "$LAZARUS_DIR" -p1 --dry-run < "$p"
              sudo patch -d "$LAZARUS_DIR" -p1 < "$p"
            done
            grep -Fq "QPaintDevice_devicePixelRatioF" "$LAZARUS_DIR/lcl/interfaces/qt6/qtwscontrols.pp"
            grep -Fq "LCLIntf.SetCanvasScaleFactor(NodeBitmap.Canvas.Handle, ScaleFactor);" "$LAZARUS_DIR/components/virtualtreeview/laz.virtualtrees.pas"

        - name: Build HeidiSQL (Linux ARM64 QT6)
          run: |
            echo Building with QT6 on ARM64 using Lazarus 4.8
            make build-qt6arm

        - name: Upload binaries QT6 ARM64
          uses: actions/upload-artifact@v6
          with:
            name: ubuntu-24.04-arm-QT6
            path: out/qt6arm/heidisql

    release:
        if: github.ref_type == 'tag'
        env:
          GITHUB: 1

        name: Create GitHub Release
        runs-on: [ubuntu-latest]
        needs: [build, build-qt6arm, build-macos-app]

        steps:
            - name: Checkout source code
              uses: actions/checkout@v6
              with:
                fetch-depth: 0

            - name: Get current and previous tag into env vars
              run: |
                echo "tag=${{ github.ref_name }}" >> "$GITHUB_ENV"
                latest=$(git describe --abbrev=0 --tags)
                prev_tag=$(git describe --abbrev=0 --tags "${latest}^")
                echo "prev_tag=$prev_tag" >> "$GITHUB_ENV"

            - name: Download Ubuntu GTK
              uses: actions/download-artifact@v7
              with:
                name: ubuntu-latest-GTK
                path: out/gtk2

            - name: Download Ubuntu QT5
              uses: actions/download-artifact@v7
              with:
                name: ubuntu-latest-QT5
                path: out/qt5

            - name: Download Ubuntu QT6
              uses: actions/download-artifact@v7
              with:
                name: ubuntu-latest-QT6
                path: out/qt6

            - name: Download Ubuntu QT6 ARM64
              uses: actions/download-artifact@v7
              with:
                name: ubuntu-24.04-arm-QT6
                path: out/qt6arm
            - name: Download macOS app bundle
              uses: actions/download-artifact@v7
              with:
                name: macos-app-bundle
                path: dist
            - name: Rename macOS app bundle for release
              run: mv dist/heidisql-macos-app.zip "dist/heidisql_${tag#v}_macos_app.zip"

            # TODO: re-enable once the official installer is built in CI again.
            # Until then, the official Windows installer is built manually on the maintainer's machine
            # and must not be attached to the GitHub release.
            # - name: Download Windows installer
            #   uses: actions/download-artifact@v7
            #   with:
            #     name: windows-installer
            #     path: dist

            - name: List files
              run: |
                ls -alF out/gtk2
                ls -alF out/qt5
                ls -alF out/qt6
                ls -alF out/qt6arm

            - name: Install gettext
              run: sudo apt install -y gettext

            - name: Install FPM
              run: sudo gem install --no-document fpm

            - name: Install rpm tooling for fpm
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Create release archives (Linux GTK)
              run: make tar-gtk2

            - name: Create debian package
              run: make deb-package

            - name: Build rpm package
              run: make rpm-package

            - name: Create release archives (Linux QT5)
              run: make tar-qt5

            - name: Create release archives (Linux QT6)
              run: make tar-qt6

            - name: Create release archives (Linux QT6 ARM64)
              run: make tar-qt6arm

            - name: Generate Release Notes
              id: git-cliff
              uses: orhun/git-cliff-action@v4
              with:
                config: .github/cliff.toml
                args: "${{ env.prev_tag }}..HEAD --strip header"

            - name: Create GitHub release
              uses: softprops/action-gh-release@v3
              with:
                name: HeidiSQL ${{ env.tag }}
                body: ${{ steps.git-cliff.outputs.content }}
                files: dist/*
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
