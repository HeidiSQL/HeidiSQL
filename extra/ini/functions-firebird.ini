[ABS]
declaration=number
category=Mathematical Functions
description=Result type: Numerical, matching input type\n\nAbsolute value\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-abs
[ACOS]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nArc cosine\n\nThe result is an angle in the range [0, pi].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-acos
[ACOSH]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nInverse hyperbolic cosine\n\nThe result is in the range [0, INF].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-acosh
[ASCII_CHAR]
declaration=code
category=String and Binary Functions
description=Result type: CHAR(1) CHARACTER SET NONE\n\nCharacter from ASCII code\n\nReturns the ASCII character corresponding to the number passed in the argument.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-ascii-char
[ASCII_VAL]
declaration=ch
category=String and Binary Functions
description=Result type: SMALLINT\n\nASCII code from string\n\nReturns the ASCII code of the character passed in.\n\nIf the argument is a string with more than one character, the ASCII code of the\nfirst character is returned.\n\nIf the argument is an empty string, 0 is returned.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-ascii-val
[ASIN]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nArc sine\n\nThe result is an angle in the range [-pi/2, pi/2].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-asin
[ASINH]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nInverse hyperbolic sine\n\nThe result is in the range [-INF, INF].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-asinh
[ATAN]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nArc tangent\n\nThe result is an angle in the range <-pi/2, pi/2>.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-atan
[ATAN2]
declaration=y, x
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nTwo-argument arc tangent\n\nReturns the angle whose sine-to-cosine ratio is given by the two arguments, and\nwhose sine and cosine signs correspond to the signs of the arguments. This\nallows results across the entire circle, including the angles -pi/2 and pi/2.\n\nThe result is an angle in the range [-pi, pi].\n\nIf x is negative, the result is pi if y is 0, and -pi if y is -0.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-atan2
[ATANH]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nInverse hyperbolic tangent\n\nThe result is a number in the range [-INF, INF].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-atanh
[AVG]
declaration=[ALL | DISTINCT] <expr>
category=General-purpose Aggregate Functions
description=Result type: Depends on the input type\n\nAverage\n\nAVG returns the average argument value in the group. NULL is ignored.\n\nParameter ALL (the default) applies the aggregate function to all values.\n\nParameter DISTINCT directs the AVG function to consider only one instance of\neach unique value, no matter how many times this value occurs.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-avg
[BASE64_DECODE]
declaration=base64_data
category=String and Binary Functions
since=4.0
description=Result type: VARBINARY or BLOB\n\nDecodes a base64 string to binary\n\nBASE64_DECODE decodes a string with base64-encoded data, and returns the decoded\nvalue as VARBINARY or BLOB as appropriate for the input. If the length of the\ntype of base64_data is not a multiple of 4, an error is raised at prepare time.\nIf the length of the value of base64_data is not a multiple of 4, an error is\nraised at execution time.\n\nWhen the input is not BLOB, the length of the resulting type is calculated as\ntype_length * 3 / 4, where type_length is the maximum length in characters of\nthe input type.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-base64decode
[BASE64_ENCODE]
declaration=binary_data
category=String and Binary Functions
since=4.0
description=Result type: VARCHAR CHARACTER SET ASCII or BLOB SUB_TYPE TEXT CHARACTER SET\nASCII\n\nEncodes a (binary) value to a base64 string\n\nBASE64_ENCODE encodes binary_data with base64, and returns the encoded value as\na VARCHAR CHARACTER SET ASCII or BLOB SUB_TYPE TEXT CHARACTER SET ASCII as\nappropriate for the input. The returned value is padded with '=' so its length\nis a multiple of 4.\n\nWhen the input is not BLOB, the length of the resulting type is calculated as\ntype_length * 4 / 3 rounded up to a multiple of four, where type_length is the\nmaximum length in bytes of the input type. If this length exceeds the maximum\nlength of VARCHAR, the function returns a BLOB.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-base64encode
[BIN_AND]
declaration=number, number [, number ...]
category=Bitwise Functions
description=Result type: integer type (the widest type of the arguments)\n\nBitwise AND\n\nSMALLINT result is returned only if all the arguments are explicit SMALLINTs or\nNUMERIC(n, 0) with n <= 4; otherwise small integers return an INTEGER result.\n\nReturns the result of the bitwise AND operation on the argument(s).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bin-and
[BIN_NOT]
declaration=number
category=Bitwise Functions
description=Result type: integer type matching the argument\n\nBitwise NOT\n\nSMALLINT result is returned only if all the arguments are explicit SMALLINTs or\nNUMERIC(n, 0) with n <= 4; otherwise small integers return an INTEGER result.\n\nReturns the result of the bitwise NOT operation on the argument, i.e. one's\ncomplement.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bin-not
[BIN_OR]
declaration=number, number [, number ...]
category=Bitwise Functions
description=Result type: integer type (the widest type of the arguments)\n\nBitwise OR\n\nSMALLINT result is returned only if all the arguments are explicit SMALLINTs or\nNUMERIC(n, 0) with n <= 4; otherwise small integers return an INTEGER result.\n\nReturns the result of the bitwise OR operation on the argument(s).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bin-or
[BIN_SHL]
declaration=number, shift
category=Bitwise Functions
description=Result type: BIGINT or INT128 depending on the first argument\n\nBitwise left-shift\n\nReturns the first argument bitwise left-shifted by the second argument, i.e. a\n<< b or a-2b.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bin-shl
[BIN_SHR]
declaration=number, shift
category=Bitwise Functions
description=Result type: BIGINT or INT128 depending on the first argument\n\nBitwise right-shift with sign extension\n\nReturns the first argument bitwise right-shifted by the second argument, i.e. a\n>> b or a/2b.\n\nThe operation performed is an arithmetic right shift (x86 SAR), meaning that the\nsign of the first operand is always preserved.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bin-shr
[BIN_XOR]
declaration=number, number [, number ...]
category=Bitwise Functions
description=Result type: integer type (the widest type of the arguments)\n\nBitwise XOR\n\nSMALLINT result is returned only if all the arguments are explicit SMALLINTs or\nNUMERIC(n, 0) with n <= 4; otherwise small integers return an INTEGER result.\n\nReturns the result of the bitwise XOR operation on the argument(s).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bin-xor
[BIT_LENGTH]
declaration=string
category=String and Binary Functions
description=Result type: INTEGER, or BIGINT for BLOB\n\nString or binary length in bits\n\nGives the length in bits of the input string. For multibyte character sets, this\nmay be less than the number of characters times 8 times the "formal" number of\nbytes per character as found in RDB$CHARACTER_SETS.\n\nWith arguments of type CHAR, this function takes the entire formal string length\n(i.e. the declared length of a field or variable) into account. If you want to\nobtain the "logical" bit length, not counting the trailing spaces, right-TRIM\nthe argument before passing it to BIT_LENGTH.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-bit-length
[BLOB_APPEND]
declaration=expr1, expr2 [, exprN ... ]
category=String and Binary Functions
since=4.0
description=Result type: BLOB\n\nEfficient concatenation of blobs\n\nThe BLOB_APPEND function concatenates blobs without creating intermediate BLOBs,\navoiding excessive memory consumption and growth of the database file. The\nBLOB_APPEND function takes two or more arguments and adds them to a BLOB which\nremains open for further modification by a subsequent BLOB_APPEND call.\n\nThe resulting BLOB is left open for writing instead of being closed when the\nfunction returns. In other words, the BLOB can be appended as many times as\nrequired. The engine marks the BLOB returned by BLOB_APPEND with an internal\nflag, BLB_close_on_read, and closes it automatically when needed.\n\nThe first argument determines the behaviour of the function:\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-blob-append
[CAST]
declaration=<expression> AS <target_type>
category=Type Casting Functions
description=Result type: As specified by target_type\n\nConverts a value from one data type to another\n\nCAST converts an expression to the desired data type or domain. If the\nconversion is not possible, an error is raised.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-cast
[CEIL]
declaration=number
category=Mathematical Functions
description=Result type: BIGINT or INT128 for exact numeric number, or DOUBLE PRECISION or\nDECFLOAT for floating point number\n\nCeiling of a number\n\nReturns the smallest whole number greater than or equal to the argument.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-ceil
[CEILING]
declaration=number
category=Mathematical Functions
description=Result type: BIGINT or INT128 for exact numeric number, or DOUBLE PRECISION or\nDECFLOAT for floating point number\n\nCeiling of a number\n\nReturns the smallest whole number greater than or equal to the argument.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-ceil
[CHARACTER_LENGTH]
declaration=string
category=String and Binary Functions
description=Result type: INTEGER, or BIGINT for BLOB\n\nString length in characters\n\nGives the length in characters of the input string.\n\nWith arguments of type CHAR, this function returns the formal string length\n(i.e. the declared length of a field or variable). If you want to obtain the\n"logical" length, not counting the trailing spaces, right-TRIM the argument\nbefore passing it to CHAR[ACTER]_LENGTH.\n\nThis function fully supports text BLOBs of any length and character set.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-char-length
[CHAR_LENGTH]
declaration=string
category=String and Binary Functions
description=Result type: INTEGER, or BIGINT for BLOB\n\nString length in characters\n\nGives the length in characters of the input string.\n\nWith arguments of type CHAR, this function returns the formal string length\n(i.e. the declared length of a field or variable). If you want to obtain the\n"logical" length, not counting the trailing spaces, right-TRIM the argument\nbefore passing it to CHAR[ACTER]_LENGTH.\n\nThis function fully supports text BLOBs of any length and character set.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-char-length
[CHAR_TO_UUID]
declaration=ascii_uuid
category=UUID Functions
description=Result type: BINARY(16)\n\nConverts a string UUID to its binary representation\n\nConverts a human-readable 36-char UUID string to the corresponding 16-byte UUID.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-char-to-uuid
[COALESCE]
declaration=<exp1>, <exp2> [, <expN> ... ]
category=Conditional Functions
description=Result type: Depends on input\n\nReturns the first non-NULL argument\n\nThe COALESCE function takes two or more arguments and returns the value of the\nfirst non-NULL argument. If all the arguments evaluate to NULL, the result is\nNULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-coalesce
[COMPARE_DECFLOAT]
declaration=decfloat1, decfloat2
category=Special Functions for DECFLOAT
since=4.0
description=Result type: SMALLINT\n\nCompares two DECFLOAT values to be equal, different or unordered\n\nThe result is a SMALLINT value, as follows:\n\nUnlike the comparison operators ('<', '=', '>', etc.), comparison is exact:\nCOMPARE_DECFLOAT(2.17, 2.170) returns 2 not 0.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-comparedecfloat
[CORR]
declaration=<expr1>, <expr2>
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nCorrelation coefficient\n\nThe CORR function return the correlation coefficient for a pair of numerical\nexpressions.\n\nThe function CORR(<expr1>, <expr2>) is equivalent to\n\nThis is also known as the Pearson correlation coefficient.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-corr
[COS]
declaration=angle
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nCosine\n\nThe result is in the range [-1, 1].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-cos
[COSH]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nHyperbolic cosine\n\nThe result is in the range [1, INF].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-cosh
[COT]
declaration=angle
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nCotangent\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-cot
[COUNT]
declaration=[ALL | DISTINCT] <expr> | *
category=General-purpose Aggregate Functions
description=Result type: BIGINT\n\nCounts non-NULL values\n\nCOUNT returns the number of non-null values in a group.\n\nALL is the default: it counts all values in the set that are not NULL.\n\nIf DISTINCT is specified, duplicates are excluded from the counted set.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-count
[COVAR_POP]
declaration=<expr1>, <expr2>
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nPopulation covariance\n\nThe function COVAR_POP returns the population covariance for a pair of numerical\nexpressions.\n\nThe function COVAR_POP(<expr1>, <expr2>) is equivalent to\n\nIf the group or window is empty, or contains only NULL values, the result will\nbe NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-covar-pop
[COVAR_SAMP]
declaration=<expr1>, <expr2>
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nSample covariance\n\nThe function COVAR_SAMP returns the sample covariance for a pair of numerical\nexpressions.\n\nThe function COVAR_SAMP(<expr1>, <expr2>) is equivalent to\n\nIf the group or window is empty, contains only 1 row, or contains only NULL\nvalues, the result will be NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-covar-samp
[CRYPT_HASH]
declaration=value USING <hash>
category=String and Binary Functions
since=4.0
description=Result type: VARBINARY\n\nCryptographic hash\n\nCRYPT_HASH returns a cryptographic hash calculated from the input argument using\nthe specified algorithm. If the input argument is not a string or binary type,\nit is converted to string before hashing.\n\nThis function returns a VARBINARY with the length depending on the specified\nalgorithm.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-crypthash
[CUME_DIST]
declaration=
category=Ranking Functions
since=4.0
description=Result type: DOUBLE PRECISION\n\nRelative rank (or, cumulative distribution) of a row within a window partition\n\nCUME_DIST is calculated as the number of rows preceding or peer of the current\nrow divided by the number of rows in the partition.\n\nIn other words, CUME_DIST() OVER <window_name_or_spec> is equivalent to COUNT(*)\nOVER <window_name_or_spec> / COUNT(*) OVER()\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-cume-dist
[CURRENT_DATE]
declaration=
category=Date and Time Functions
description=Documented in CURRENT_DATE.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-functions-scalarfuncs-current-date
[CURRENT_TIME]
declaration=
category=Date and Time Functions
description=Documented in CURRENT_TIME.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-functions-scalarfuncs-current-time
[CURRENT_TIMESTAMP]
declaration=
category=Date and Time Functions
description=Documented in CURRENT_TIMESTAMP.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-functions-scalarfuncs-current-timestamp
[DATEADD]
declaration=<args>
category=Date and Time Functions
description=Result type: DATE, TIME or TIMESTAMP\n\nAdds or subtracts datetime units from a datetime value\n\nAdds the specified number of years, months, weeks, days, hours, minutes, seconds\nor milliseconds to a date/time value.\n\nThe result type is determined by the third argument.\n\nWith TIMESTAMP and DATE arguments, all units can be used.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-dateadd
[DATEDIFF]
declaration=<args>
category=Date and Time Functions
description=Result type: BIGINT, or NUMERIC(18,1) for MILLISECOND\n\nDifference between two datetime values in a datetime unit\n\nReturns the number of years, months, weeks, days, hours, minutes, seconds or\nmilliseconds elapsed between two date/time values.\n\nDATE and TIMESTAMP arguments can be combined. No other mixes are allowed.\n\nWith TIMESTAMP and DATE arguments, all units can be used.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-datediff
[DECODE]
declaration=<testexpr>, <expr1>, <result1> [<expr2>, <result2> ...] [, <defaultresult>]
category=Conditional Functions
description=Result type: Depends on input\n\nShorthand "simple CASE"-equivalent function\n\nDECODE is a shorthand for the so-called "simple CASE" construct, in which a\ngiven expression is compared to a number of other expressions until a match is\nfound. The result is determined by the value listed after the matching\nexpression. If no match is found, the default result is returned, if present,\notherwise NULL is returned.\n\nThe equivalent CASE construct:\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-decode
[DECRYPT]
declaration=encrypted_input USING <algorithm> [MODE <mode>] KEY key [IV iv] [<ctr_type>] [CTR_LENGTH ctr_length] [COUNTER initial_counter]
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY or BLOB\n\nDecrypts data using a symmetric cipher\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-decrypt
[DENSE_RANK]
declaration=
category=Ranking Functions
description=Result type: BIGINT\n\nRows with the same window_order values get the same rank within the partition\nwindow_partition, if specified. The dense rank of a row is equal to the number\nof different rank values in the partition preceding the current row, plus one.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-dense-rank
[ENCRYPT]
declaration=input USING <algorithm> [MODE <mode>] KEY key [IV iv] [<ctr_type>] [CTR_LENGTH ctr_length] [COUNTER initial_counter]
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY or BLOB\n\nEncrypts data using a symmetric cipher\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-encrypt
[EXP]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nNatural exponent\n\nReturns the natural exponential, enumber\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-exp
[EXTRACT]
declaration=<part> FROM <datetime>
category=Date and Time Functions
description=Result type: SMALLINT or NUMERIC\n\nExtracts a datetime unit from a datetime value\n\nExtracts and returns an element from a DATE, TIME or TIMESTAMP expression.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-extract
[FIRST_DAY]
declaration=OF <period> FROM date_or_timestamp
category=Date and Time Functions
since=4.0
description=Returns the first day of a time period containing a datetime value\n\nFIRST_DAY returns a date or timestamp (same as the type of date_or_timestamp)\nwith the first day of the year, month or week of a given date or timestamp\nvalue.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-firstday
[FIRST_VALUE]
declaration=<expr>
category=Navigational Functions
description=Result type: The same as type as expr\n\nFirst value of the current partition\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-first-value
[FLOOR]
declaration=number
category=Mathematical Functions
description=Result type: BIGINT or INT128 for exact numeric number, or DOUBLE PRECISION or\nDECFLOAT for floating point number\n\nFloor of a number\n\nReturns the largest whole number smaller than or equal to the argument.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-floor
[GEN_ID]
declaration=generator-name, step
category=Functions for Sequences (Generators)
description=Result type: BIGINT - dialect 2 and 3 INTEGER - dialect 1\n\nIncrements a sequence (generator) value and returns its new value\n\nIf step equals 0, the function will leave the value of the generator unchanged\nand return its current value.\n\nThe SQL-compliant NEXT VALUE FOR syntax is preferred, except when an increment\nother than the configured increment of the sequence is needed.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-gen-id
[GEN_UUID]
declaration=
category=UUID Functions
description=Result type: BINARY(16)\n\nGenerates a random binary UUID\n\nReturns a universally unique ID as a 16-byte character string.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-gen-uuid
[HASH]
declaration=value [USING <hash>]
category=String and Binary Functions
description=Result type: INTEGER, BIGINT\n\nNon-cryptographic hash\n\nHASH returns a hash value for the input argument. If the input argument is not a\nstring or binary type, it is converted to string before hashing.\n\nThe optional USING clause specifies the non-cryptographic hash algorithm to\napply. When the USING clause is absent, the legacy PJW algorithm is applied;\nthis is identical to its behaviour in previous Firebird versions.\n\nThis function fully supports text BLOBs of any length and character set.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-hash
[HEX_DECODE]
declaration=hex_data
category=String and Binary Functions
since=4.0
description=Result type: VARBINARY or BLOB\n\nDecode a hexadecimal string to binary\n\nHEX_DECODE decodes a string with hex-encoded data, and returns the decoded value\nas VARBINARY or BLOB as appropriate for the input. If the length of the type of\nhex_data is not a multiple of 2, an error is raised at prepare time. If the\nlength of the value of hex_data is not a multiple of 2, an error is raised at\nexecution time.\n\nWhen the input is not BLOB, the length of the resulting type is calculated as\ntype_length / 2, where type_length is the maximum length in characters of the\ninput type.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-hexdecode
[HEX_ENCODE]
declaration=binary_data
category=String and Binary Functions
since=4.0
description=Result type: VARCHAR CHARACTER SET ASCII or BLOB SUB_TYPE TEXT CHARACTER SET\nASCII\n\nEncodes a (binary) value to a hexadecimal string\n\nHEX_ENCODE encodes binary_data with hex, and returns the encoded value as a\nVARCHAR CHARACTER SET ASCII or BLOB SUB_TYPE TEXT CHARACTER SET ASCII as\nappropriate for the input.\n\nWhen the input is not BLOB, the length of the resulting type is calculated as\ntype_length * 2, where type_length is the maximum length in bytes of the input\ntype. If this length exceeds the maximum length of VARCHAR, the function returns\na BLOB.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-hexencode
[IIF]
declaration=<condition>, ResultT, ResultF
category=Conditional Functions
description=Result type: Depends on input\n\nTernary conditional function\n\nIIF takes three arguments. If the first evaluates to true, the second argument\nis returned; otherwise the third is returned.\n\nIIF could be likened to the ternary "<condition> ? resultT : resultF" operator\nin C-like languages.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-iif
[LAG]
declaration=<expr> [, <offset [, <default>]]
category=Navigational Functions
description=Result type: The same as type as expr\n\nValue from row in the current partition with a given offset before the current\nrow\n\nThe LAG function provides access to the row in the current partition with a\ngiven offset before the current row.\n\nIf offset points outside the current partition, default will be returned, or\nNULL if no default was specified.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-lag
[LAST_DAY]
declaration=OF <period> FROM date_or_timestamp
category=Date and Time Functions
since=4.0
description=Returns the last day of a time period containing a datetime value\n\nLAST_DAY returns a date or timestamp (same as the type of date_or_timestamp)\nwith the last day of the year, month or week of a given date or timestamp value.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-lastday
[LAST_VALUE]
declaration=<expr>
category=Navigational Functions
description=Result type: The same as type as expr\n\nLast value from the current partition\n\nSee also note on frame for navigational functions.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-last-value
[LEAD]
declaration=<expr> [, <offset [, <default>]]
category=Navigational Functions
description=Result type: The same as type as expr\n\nValue from a row in the current partition with a given offset after the current\nrow\n\nThe LEAD function provides access to the row in the current partition with a\ngiven offset after the current row.\n\nIf offset points outside the current partition, default will be returned, or\nNULL if no default was specified.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-lead
[LEFT]
declaration=string, length
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nExtracts the leftmost part of a string\n\nThis function fully supports text BLOBs of any length, including those with a\nmulti-byte character set.\n\nIf string is a BLOB, the result is a BLOB. Otherwise, the result is a VARCHAR(n)\nwith n the length of the input string.\n\nIf the length argument exceeds the string length, the input string is returned\nunchanged.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-left
[LIST]
declaration=[ALL | DISTINCT] <expr> [, separator ]
category=General-purpose Aggregate Functions
description=Result type: BLOB\n\nConcatenates values into a string list\n\nLIST returns a string consisting of the non-NULL argument values in the group,\nseparated either by a comma or by a user-supplied separator. If there are no\nnon-NULL values (this includes the case where the group is empty), NULL is\nreturned.\n\nALL (the default) results in all non-NULL values being listed. With DISTINCT,\nduplicates are removed, except if expr is a BLOB.\n\nThe optional separator argument may be any string expression. This makes it\npossible to specify e.g. ascii_char(13) as a separator.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-list
[LN]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nNatural logarithm\n\nAn error is raised if the argument is negative or 0.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-ln
[LOCALTIME]
declaration=
category=Date and Time Functions
description=Documented in LOCALTIME.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-functions-scalarfuncs-localtime
[LOCALTIMESTAMP]
declaration=
category=Date and Time Functions
description=Documented in LOCALTIMESTAMP.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-functions-scalarfuncs-localtimestamp
[LOG]
declaration=x, y
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nLogarithm with variable base\n\nReturns the x-based logarithm of y.\n\nIf either argument is 0 or below, an error is raised.\n\nIf both arguments are 1, NaN is returned.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-log
[LOG10]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nDecimal (base-10) logarithm\n\nAn error is raised if the argument is negative or 0.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-log10
[LOWER]
declaration=string
category=String and Binary Functions
description=Result type: (VAR)CHAR, (VAR)BINARY or BLOB\n\nConverts a string to lowercase\n\nReturns the lowercase equivalent of the input string. The exact result depends\non the character set. With ASCII or NONE for instance, only ASCII characters are\nlowercased; with character set OCTETS/(VAR)BINARY, the entire string is returned\nunchanged.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-lower
[LPAD]
declaration=str, endlen [, padstr]
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nLeft-pads a string\n\nLeft-pads a string with spaces or with a user-supplied string until a given\nlength is reached.\n\nThis function fully supports text BLOBs of any length and character set.\n\nIf str is a BLOB, the result is a BLOB. Otherwise, the result is a\nVARCHAR(endlen).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-lpad
[MAKE_DBKEY]
declaration=relation, recnum [, dpnum [, ppnum]]
category=Other Functions
since=4.0
description=Result type: BINARY(8)\n\nCreates a DBKEY value\n\nMAKE_DBKEY creates a DBKEY value using a relation name or ID, record number, and\n(optionally) logical numbers of data page and pointer page.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-makedbkey
[MAX]
declaration=[ALL | DISTINCT] <expr>
category=General-purpose Aggregate Functions
description=Result type: Returns a result of the same data type the input expression.\n\nMaximum\n\nMAX returns the maximum non-NULL element in the result set.\n\nIf the group is empty or contains only NULLs, the result is NULL.\n\nIf the input argument is a string, the function will return the value that will\nbe sorted last if COLLATE is used.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-max
[MAXVALUE]
declaration=<expr1> [, ... , <exprN> ]
category=Conditional Functions
description=Result type: Varies according to input - result will be of the same data type as\nthe first expression in the list (expr1).\n\nReturns the maximum value of its arguments\n\nReturns the maximum value from a list of numerical, string, or date/time\nexpressions. This function fully supports text BLOBs of any length and character\nset.\n\nIf one or more expressions resolve to NULL, MAXVALUE returns NULL. This\nbehaviour differs from the aggregate function MAX.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-maxvalue
[MIN]
declaration=[ALL | DISTINCT] <expr>
category=General-purpose Aggregate Functions
description=Result type: Returns a result of the same data type the input expression.\n\nMinimum\n\nMIN returns the minimum non-NULL element in the result set.\n\nIf the group is empty or contains only NULLs, the result is NULL.\n\nIf the input argument is a string, the function will return the value that will\nbe sorted first if COLLATE is used.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-min
[MINVALUE]
declaration=<expr1> [, ... , <exprN> ]
category=Conditional Functions
description=Result type: Varies according to input - result will be of the same data type as\nthe first expression in the list (expr1).\n\nReturns the minimum value of its arguments\n\nReturns the minimum value from a list of numerical, string, or date/time\nexpressions. This function fully supports text BLOBs of any length and character\nset.\n\nIf one or more expressions resolve to NULL, MINVALUE returns NULL. This\nbehaviour differs from the aggregate function MIN.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-minvalue
[MOD]
declaration=a, b
category=Mathematical Functions
description=Result type: SMALLINT, INTEGER or BIGINT depending on the type of a. If a is a\nfloating-point type, the result is a BIGINT.\n\nRemainder\n\nReturns the remainder of an integer division.\n\nNon-integer arguments are rounded before the division takes place. So, "mod(7.5,\n2.5)" gives 2 ("mod(8, 3)"), not 0.\n\nDo not confuse MOD() with the mathematical modulus operator; e.g.\nmathematically, -21 mod 4 is 3, while Firebird's MOD(-21, 4) is -1. In other\nwords, MOD() behaves as % in languages like C and Java.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-mod
[NORMALIZE_DECFLOAT]
declaration=decfloat_value
category=Special Functions for DECFLOAT
since=4.0
description=Result type: DECFLOAT\n\nReturns the simplest, normalized form of a DECFLOAT\n\nFor any non-zero value, trailing zeroes are removed with appropriate correction\nof the exponent.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-normalizedecfloat
[NTH_VALUE]
declaration=<expr>, <offset>
category=Navigational Functions
description=Result type: The same as type as expr\n\nThe Nth value starting from the first or the last row of the current frame\n\nThe NTH_VALUE function returns the Nth value starting from the first (FROM\nFIRST) or the last (FROM LAST) row of the current frame, see also note on frame\nfor navigational functions. Offset 1 with FROM FIRST is equivalent to\nFIRST_VALUE, and offset 1 with FROM LAST is equivalent to LAST_VALUE.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-nth-value
[NTILE]
declaration=number_of_tiles
category=Ranking Functions
since=4.0
description=Result type: BIGINT\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-ntile
[NULLIF]
declaration=<exp1>, <exp2>
category=Conditional Functions
description=Result type: Depends on input\n\nConditional NULL function\n\nNULLIF returns the value of the first argument, unless it is equal to the\nsecond. In that case, NULL is returned.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-nullif
[OCTET_LENGTH]
declaration=string
category=String and Binary Functions
description=Result type: INTEGER, or BIGINT for BLOB\n\nLength in bytes (octets) of a string or binary value\n\nGives the length in bytes (octets) of the input string. For multibyte character\nsets, this may be less than the number of characters times the "formal" number\nof bytes per character as found in RDB$CHARACTER_SETS.\n\nWith arguments of type CHAR or BINARY, this function takes the entire formal\nstring length (i.e. the declared length of a field or variable) into account. If\nyou want to obtain the "logical" byte length, not counting the trailing spaces,\nright-TRIM the argument before passing it to OCTET_LENGTH.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-octet-length
[OVERLAY]
declaration=string PLACING replacement FROM pos [FOR length]
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nOverwrites part of, or inserts into, a string\n\nBy default, the number of characters removed from (overwritten in) the host\nstring equals the length of the replacement string. With the optional fourth\nargument, a different number of characters can be specified for removal.\n\nThis function supports BLOBs of any length.\n\nIf string or replacement is a BLOB, the result is a BLOB. Otherwise, the result\nis a VARCHAR(n) with n the sum of the lengths of string and replacement.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-overlay
[PERCENT_RANK]
declaration=
category=Ranking Functions
since=4.0
description=Result type: DOUBLE PRECISION\n\nRelative rank of a row within a window partition.\n\nPERCENT_RANK is calculated as the RANK() minus 1 of the current row divided by\nthe number of rows in the partition minus 1.\n\nIn other words, PERCENT_RANK() OVER <window_name_or_spec> is equivalent to\n(RANK() OVER <window_name_or_spec> - 1) / CAST(COUNT(*) OVER() - 1 AS DOUBLE\nPRECISION)\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-perc-rank
[PI]
declaration=
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nApproximation of pi.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-pi
[POSITION1]
name=POSITION
declaration=substr IN string
category=String and Binary Functions
description=Result type: INTEGER\n\nFinds the position of the first or next occurrence of a substring in a string\n\nReturns the (1-based) position of the first occurrence of a substring in a host\nstring. With the optional third argument, the search starts at a given offset,\ndisregarding any matches that may occur earlier in the string. If no match is\nfound, the result is 0.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-position
[POSITION2]
name=POSITION
declaration=substr, string [, startpos]
category=String and Binary Functions
description=Result type: INTEGER\n\nFinds the position of the first or next occurrence of a substring in a string\n\nReturns the (1-based) position of the first occurrence of a substring in a host\nstring. With the optional third argument, the search starts at a given offset,\ndisregarding any matches that may occur earlier in the string. If no match is\nfound, the result is 0.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-position
[POWER]
declaration=x, y
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nPower\n\nReturns x to the power of y (xy).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-power
[QUANTIZE]
declaration=decfloat_value, exp_value
category=Special Functions for DECFLOAT
since=4.0
description=Result type: DECFLOAT\n\nReturns a value that is equal in value - except for rounding - to the first\nargument, but with the same exponent as the second argument\n\nQUANTIZE returns a DECFLOAT value that is equal in value and sign (except for\nrounding) to decfloat_value, and that has an exponent equal to the exponent of\nexp_value. The type of the return value is DECFLOAT(16) if both arguments are\nDECFLOAT(16), otherwise the result type is DECFLOAT(34).\n\nIf the exponent of decfloat_value is greater than the one of exp_value, the\ncoefficient of decfloat_value is multiplied by a power of ten, and its exponent\ndecreased. If the exponent is smaller, then its coefficient is rounded using the\ncurrent decfloat rounding mode, and its exponent is increased.\n\nWhen it is not possible to achieve the target exponent because the coefficient\nwould exceed the target precision (16 or 34 decimal digits), either a "Decfloat\nfloat invalid operation" error is raised or NaN is returned (depending on the\ncurrent decfloat traps configuration).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-quantize
[RAND]
declaration=
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nGenerates a random number\n\nReturns a random number between 0 and 1.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rand
[RANK]
declaration=
category=Ranking Functions
description=Result type: BIGINT\n\nRows with the same values of window-order get the same rank with in the\npartition window-partition, if specified. The rank of a row is equal to the\nnumber of rank values in the partition preceding the current row, plus one.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-rank
[RDB$ERROR]
declaration=<context>
category=Other Functions
since=4.0
description=Result type: Varies (see table below)\n\nReturns PSQL error information inside a WHEN ... DO block\n\nRDB$ERROR returns data of the specified context about the active PSQL exception.\nIts scope is confined to exception-handling blocks in PSQL (WHEN ... DO).\nOutside the exception handling blocks, RDB$ERROR always returns NULL. This\nfunction cannot be called from DSQL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rdberror
[RDB$GET_CONTEXT]
declaration='<namespace>', <varname>
category=Context Functions
description=Result type: VARCHAR(255)\n\nRetrieves the value of a context variable from a namespace\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-get-context
[RDB$GET_TRANSACTION_CN]
declaration=transaction_id
category=Other Functions
since=4.0
description=Result type: BIGINT\n\nReturns the commit number ("CN") of a transaction\n\nIf the return value is greater than 1, it is the actual CN of the transaction if\nit was committed after the database was started.\n\nThe function can also return one of the following results, indicating the commit\nstatus of the transaction:\n\nFor more information about CN, consult the Firebird 4.0 Release Notes.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-gettransactioncn
[RDB$RESET_CONTEXT]
declaration=
category=Context Functions
since=5.0
description=Result type: INTEGER\n\nRemoves all context variables in a given namespace.\n\nThe RDB$RESET_CONTEXT resets the specified context, removing all its context\nvariables. It returns the number of context variables removed.\n\nAttempts to reset the SYSTEM namespace or a non-existent namespace raises an\nerror.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-reset-context
[RDB$ROLE_IN_USE]
declaration=role_name
category=Other Functions
since=4.0
description=Result type: BOOLEAN\n\nChecks if a role is active for the current connection\n\nRDB$ROLE_IN_USE returns TRUE if the specified role is active for the current\nconnection, and FALSE otherwise. Contrary to CURRENT_ROLE - which only returns\nthe explicitly specified role - this function can be used to check for roles\nthat are active by default, or cumulative roles activated by an explicitly\nspecified role.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-roleinuse
[RDB$SET_CONTEXT]
declaration='<namespace>', <varname>, <value> | NULL
category=Context Functions
description=Result type: INTEGER\n\nCreates, sets or clears a variable in one of the user-writable namespaces\n\nWhen a transaction ends, its USER_TRANSACTION context is cleared.\n\nWhen a connection is closed, its USER_SESSION context is cleared.\n\nWhen a connection is reset using ALTER SESSION RESET, the USER_TRANSACTION and\nUSER_SESSION contexts are cleared.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-set-context
[RDB$SYSTEM_PRIVILEGE]
declaration=<sys_privilege>
category=Other Functions
since=4.0
description=Result type: BOOLEAN\n\nChecks if the authorization of the current connection has a system privilege\n\nRDB$SYSTEM_PRIVILEGE accepts a system privilege name and returns TRUE if the\ncurrent connection has the given system privilege, and FALSE otherwise.\n\nThe authorization of the current connection is determined by privileges of the\ncurrent user, the user PUBLIC, and the currently active roles (explicitly set or\nactivated by default).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-syspriv
[REGR_AVGX]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nAverage of the independent variable of the regression line\n\nThe function REGR_AVGX calculates the average of the independent variable (x) of\nthe regression line.\n\nThe function REGR_AVGX(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-avgx
[REGR_AVGY]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nAverage of the dependent variable of the regression line\n\nThe function REGR_AVGY calculates the average of the dependent variable (y) of\nthe regression line.\n\nThe function REGR_AVGY(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-avgy
[REGR_COUNT]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nNumber of non-empty pairs of the regression line\n\nThe function REGR_COUNT counts the number of non-empty pairs of the regression\nline.\n\nThe function REGR_COUNT(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-count
[REGR_INTERCEPT]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nPoint of intersection of the regression line with the y-axis\n\nThe function REGR_INTERCEPT calculates the point of intersection of the\nregression line with the y-axis.\n\nThe function REGR_INTERCEPT(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-intercept
[REGR_R2]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nCoefficient of determination of the regression line\n\nThe REGR_R2 function calculates the coefficient of determination, or R-squared,\nof the regression line.\n\nThe function REGR_R2(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-r2
[REGR_SLOPE]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nSlope of the regression line\n\nThe function REGR_SLOPE calculates the slope of the regression line.\n\nThe function REGR_SLOPE(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-slope
[REGR_SXX]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nSum of squares of the independent variable\n\nThe function REGR_SXX calculates the sum of squares of the independent\nexpression variable (x).\n\nThe function REGR_SXX(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-sxx
[REGR_SXY]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nSum of products of the independent variable and the dependent variable\n\nThe function REGR_SXY calculates the sum of products of independent variable\nexpression (x) times dependent variable expression (y).\n\nThe function REGR_SXY(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-sxy
[REGR_SYY]
declaration=<y>, <x>
category=Linear Regression Aggregate Functions
description=Result type: DOUBLE PRECISION\n\nSum of squares of the dependent variable\n\nThe function REGR_SYY calculates the sum of squares of the dependent variable\n(y).\n\nThe function REGR_SYY(<y>, <x>) is equivalent to\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-regr-syy
[REPLACE]
declaration=str, find, repl
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nReplaces all occurrences of a substring in a string\n\nThis function fully supports text BLOBs of any length and character set.\n\nIf any argument is a BLOB, the result is a BLOB. Otherwise, the result is a\nVARCHAR(n) with n calculated from the lengths of str, find and repl in such a\nway that even the maximum possible number of replacements won't overflow the\nfield.\n\nIf find is the empty string, str is returned unchanged.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-replace
[REVERSE]
declaration=string
category=String and Binary Functions
description=Result type: VARCHAR\n\nReverses a string\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-reverse
[RIGHT]
declaration=string, length
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nExtracts the rightmost part of a string\n\nThis function supports text BLOBs of any length.\n\nIf string is a BLOB, the result is a BLOB. Otherwise, the result is a VARCHAR(n)\nwith n the length of the input string.\n\nIf the length argument exceeds the string length, the input string is returned\nunchanged.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-right
[ROUND]
declaration=number [, scale]
category=Mathematical Functions
description=Result type: single argument: integer type, DOUBLE PRECISION or DECFLOAT; two\narguments: numerical, matching first argument\n\nRounds a number to the nearest integer. If the fractional part is exactly 0.5,\nrounding is upward for positive numbers and downward for negative numbers. With\nthe optional scale argument, the number can be rounded to powers-of-ten\nmultiples (tens, hundreds, tenths, hundredths, etc.).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-round
[ROW_NUMBER]
declaration=
category=Ranking Functions
description=Result type: BIGINT\n\nSequential row number in the partition\n\nReturns the sequential row number in the partition, where 1 is the first row in\neach of the partitions.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-windowfuncs-row-number
[RPAD]
declaration=str, endlen [, padstr]
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nRight-pads a string\n\nRight-pads a string with spaces or with a user-supplied string until a given\nlength is reached.\n\nThis function fully supports text BLOBs of any length and character set.\n\nIf str is a BLOB, the result is a BLOB. Otherwise, the result is a\nVARCHAR(endlen).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rpad
[RSA_DECRYPT]
declaration=encrypted_input KEY private_key [LPARAM tag_string] [HASH <hash>] [PKCS_1_5]
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY\n\nDecrypts data using an RSA private key and removes OAEP or PKCS 1.5 padding\n\nRSA_DECRYPT decrypts encrypted_input using the RSA private key and then removes\npadding from the resulting data.\n\nBy default, OAEP padding is used. The PKCS_1_5 option will switch to the less\nsecure PKCS 1.5 padding.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rsadecrypt
[RSA_ENCRYPT]
declaration=input KEY public_key [LPARAM tag_string] [HASH <hash>] [PKCS_1_5]
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY\n\nPads data using OAEP or PKCS 1.5 and then encrypts it with an RSA public key\n\nRSA_ENCRYPT pads input using the OAEP or PKCS 1.5 padding scheme and then\nencrypts it using the specified RSA public key. This function is normally used\nto encrypt short symmetric keys which are then used in block ciphers to encrypt\na message.\n\nBy default, OAEP padding is used. The PKCS_1_5 option will switch to the less\nsecure PKCS 1.5 padding.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rsaencrypt
[RSA_PRIVATE]
declaration=key_length
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY\n\nGenerates an RSA private key\n\nRSA_PRIVATE generates an RSA private key of the specified length (in bytes) in\nPKCS#1 format.\n\nThe larger the length specified, the longer it takes for the function to\ngenerate a private key.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rsaprivate
[RSA_PUBLIC]
declaration=private_key
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY\n\nGenerates an RSA public key\n\nRSA_PUBLIC returns the RSA public key in PKCS#1 format for the provided RSA\nprivate key (also PKCS#1 format).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rsapublic
[RSA_SIGN_HASH]
declaration=message_digest KEY private_key [HASH <hash>] [SALT_LENGTH salt_length] [PKCS_1_5]
category=Cryptographic Functions
since=4.0
description=Result type: VARBINARY\n\nPSS encodes a message hash and signs it with an RSA private key\n\nRSA_SIGN_HASH performs PSS encoding of the message_digest to be signed, and\nsigns using the RSA private key.\n\nBy default, OAEP padding is used. The PKCS_1_5 option will switch to the less\nsecure PKCS 1.5 padding.\n\nProbabilistic Signature Scheme (PSS) is a cryptographic signature scheme\nspecifically developed to allow modern methods of security analysis to prove\nthat its security directly relates to that of the RSA problem. There is no such\nproof for the traditional PKCS#1 v1.5 scheme.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rsasignhash
[RSA_VERIFY_HASH]
declaration=message_digest SIGNATURE signature KEY public_key [HASH <hash>] [SALT_LENGTH salt_length] [PKCS_1_5]
category=Cryptographic Functions
since=4.0
description=Result type: BOOLEAN\n\nVerifies a message hash against a signature using an RSA public key\n\nRSA_VERIFY_HASH performs PSS encoding of the message_digest to be verified, and\nverifies the digital signature using the provided RSA public key.\n\nBy default, OAEP padding is used. The PKCS_1_5 option will switch to the less\nsecure PKCS 1.5 padding.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-rsaverifyhash
[SIGN]
declaration=number
category=Mathematical Functions
description=Result type: SMALLINT\n\nSign or signum\n\nReturns the sign of the argument: -1, 0 or 1\n\nnumber < 0 -> -1\n\nnumber = 0 -> 0\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-sign
[SIN]
declaration=angle
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nSine\n\nThe result is in the range [-1, 1].\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-sin
[SINH]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nHyperbolic sine\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-sinh
[SQRT]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nSquare root\n\nIf number is negative, an error is raised.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-sqrt
[STDDEV_POP]
declaration=<expr>
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION or NUMERIC depending on the type of expr\n\nPopulation standard deviation\n\nThe function STDDEV_POP returns the population standard deviation for a group or\nwindow. NULL values are skipped.\n\nThe function STDDEV_POP(<expr>) is equivalent to\n\nIf the group or window is empty, or contains only NULL values, the result will\nbe NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-stddev-pop
[STDDEV_SAMP]
declaration=
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION or NUMERIC depending on the type of expr\n\nSample standard deviation\n\nThe function STDDEV_SAMP returns the sample standard deviation for a group or\nwindow. NULL values are skipped.\n\nThe function STDDEV_SAMP(<expr>) is equivalent to\n\nIf the group or window is empty, contains only 1 row, or contains only NULL\nvalues, the result will be NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-stddev-samp
[SUBSTRING]
declaration=<substring-args>
category=String and Binary Functions
description=Extracts a substring by position and length, or by SQL regular expression\n\nReturns a string's substring starting at the given position, either to the end\nof the string or with a given length, or extracts a substring using an SQL\nregular expression pattern.\n\nIf any argument is NULL, the result is also NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-substring
[SUM]
declaration=[ALL | DISTINCT] <expr>
category=General-purpose Aggregate Functions
description=Result type: Depends on the input type\n\nSum\n\nSUM calculates and returns the sum of non-NULL values in the group.\n\nIf the group is empty or contains only NULLs, the result is NULL.\n\nALL is the default option - all values in the set that are not NULL are\nprocessed. If DISTINCT is specified, duplicates are removed from the set and the\nSUM evaluation is done afterward.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-sum
[TAN]
declaration=angle
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nTangent\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-tan
[TANH]
declaration=number
category=Mathematical Functions
description=Result type: DOUBLE PRECISION\n\nHyperbolic tangent\n\nDue to rounding, the result is in the range [-1, 1] (mathematically, it's <-1,\n1>).\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-tanh
[TOTALORDER]
declaration=decfloat1, decfloat2
category=Special Functions for DECFLOAT
since=4.0
description=Result type: SMALLINT\n\nDetermines the total or linear order of its arguments\n\nTOTALORDER compares two DECFLOAT values including any special values. The\ncomparison is exact, and returns a SMALLINT, one of:\n\nFor TOTALORDER comparisons, DECFLOAT values are ordered as follows:\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-totalorder
[TRIM]
declaration=[<adjust>] str
category=String and Binary Functions
description=Result type: VARCHAR or BLOB\n\nTrims leading and/or trailing spaces or other substrings from a string\n\nRemoves leading and/or trailing spaces (or optionally other strings) from the\ninput string.\n\nIf str is a BLOB, the result is a BLOB. Otherwise, it is a VARCHAR(n) with n the\nformal length of str.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-trim
[TRUNC]
declaration=number [, scale]
category=Mathematical Functions
description=Result type: single argument: integer type, DOUBLE PRECISION or DECFLOAT; two\narguments: numerical, matching first argument\n\nTruncate number\n\nThe single argument variant returns the integer part of a number. With the\noptional scale argument, the number can be truncated to powers-of-ten multiples\n(tens, hundreds, tenths, hundredths, etc.).\n\nIf the scale argument is present, the result usually has the same scale as the\nfirst argument, e.g.\n\nTRUNC(789.2225, 2) returns 789.2200 (not 789.22)\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-trunc
[UNICODE_CHAR]
declaration=code
category=String and Binary Functions
since=5.0
description=Result type: CHAR(1) CHARACTER SET UTF8\n\nCharacter from Unicode code point\n\nReturns the character corresponding to the Unicode code point passed in the\nargument.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-unicode-char
[UNICODE_VAL]
declaration=ch
category=String and Binary Functions
since=5.0
description=Result type: INTEGER\n\nUnicode code point from string\n\nReturns the Unicode code point (range 0...0x10FFFF) of the character passed in.\n\nIf the argument is a string with more than one character, the Unicode code point\nof the first character is returned.\n\nIf the argument is an empty string, 0 is returned.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-unicode-val
[UPPER]
declaration=str
category=String and Binary Functions
description=Result type: (VAR)CHAR, (VAR)BINARY or BLOB\n\nConverts a string to uppercase\n\nReturns the uppercase equivalent of the input string. The exact result depends\non the character set. With ASCII or NONE for instance, only ASCII characters are\nuppercased; with character set OCTETS/(VAR)BINARY, the entire string is returned\nunchanged.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-upper
[UUID_TO_CHAR]
declaration=uuid
category=UUID Functions
description=Result type: CHAR(36)\n\nConverts a binary UUID to its string representation\n\nConverts a 16-byte UUID to its 36-character, human-readable ASCII\nrepresentation.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-scalarfuncs-uuid-to-char
[VAR_POP]
declaration=<expr>
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION or NUMERIC depending on the type of expr\n\nPopulation variance\n\nThe function VAR_POP returns the population variance for a group or window. NULL\nvalues are skipped.\n\nThe function VAR_POP(<expr>) is equivalent to\n\nIf the group or window is empty, or contains only NULL values, the result will\nbe NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-var-pop
[VAR_SAMP]
declaration=<expr>
category=Statistical Aggregate Functions
description=Result type: DOUBLE PRECISION or NUMERIC depending on the type of expr\n\nSample variance\n\nThe function VAR_POP returns the sample variance for a group or window. NULL\nvalues are skipped.\n\nThe function VAR_SAMP(<expr>) is equivalent to\n\nIf the group or window is empty, contains only 1 row, or contains only NULL\nvalues, the result will be NULL.\n\nURL: https://firebirdsql.org/file/documentation/html/en/refdocs/fblangref50/firebird-50-language-reference.html#fblangref50-aggfuncs-var-samp
