; Functions missing in MariaDB's help tables. Merged by generate-functions.php
[JSON_EXISTS]
declaration=json, path
category=JSON Functions
since=10.3.3
description=Determines whether a specified JSON value exists in the given data. Returns 1 if found, 0 if not, or NULL if any of the inputs were NULL.\n\nURL: https://mariadb.com/kb/en/json_exists/

[SFORMAT]
declaration=fmt, value, ...
category=String Functions
since=10.7.0
description=Formats the given values using a format string with {} placeholders, following the rules of the fmtlib / C++20 std::format library, e.g. SFORMAT('The answer is {}.', 42).\n\nURL: https://mariadb.com/kb/en/sformat/

[SUBSTR1]
name=SUBSTR
declaration=str,pos
category=String Functions
description=SUBSTR() is a synonym for SUBSTRING(). Returns a substring from string str starting at position pos.\n\nURL: https://mariadb.com/kb/en/substr/

[SUBSTR2]
name=SUBSTR
declaration=str,pos,len
category=String Functions
description=SUBSTR() is a synonym for SUBSTRING(). Returns a substring len characters long from string str, starting at position pos.\n\nURL: https://mariadb.com/kb/en/substr/
[VEC_DISTANCE]
declaration=v, s
category=Vector Functions
since=11.7
description=Calculates the distance between two vectors, using the distance metric of the vector index (Euclidean or cosine). Requires a vector index on one of the arguments.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_distance

[VEC_DISTANCE_COSINE]
declaration=v, s
category=Vector Functions
since=11.7
description=Calculates the cosine distance between two vectors, i.e. 1 minus the cosine of the angle between them.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_distance_cosine

[VEC_DISTANCE_EUCLIDEAN]
declaration=v, s
category=Vector Functions
since=11.7
description=Calculates the Euclidean (L2) distance between two vectors.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_distance_euclidean

[VEC_FROMTEXT]
declaration=s
category=Vector Functions
since=11.7
description=Converts a JSON array of numbers, e.g. '[1.5,2,3]', into the binary representation of a VECTOR.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_fromtext

[VEC_TOTEXT]
declaration=v
category=Vector Functions
since=11.7
description=Converts the binary representation of a VECTOR into a JSON array of numbers.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/vector-functions/vec_totext

[TRUNC]
declaration=date[,fmt]
category=Date and Time Functions
since=12.2
description=Returns a DATETIME truncated according to fmt (Oracle compatible).\n\nSupported formats: DD, DDD, J (day), MM, MON, MONTH, RM (month), SYEAR, SYYYY, Y, YEAR, YY, YYY, YYYY (year). Without fmt, the date is truncated to the day.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/trunc

[TO_NUMBER]
declaration=expr[, fmt]
category=String Functions
since=12.2
description=Converts expr to a NUMERIC value (Oracle compatible). Number format strings in fmt are not yet supported.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/function-and-operator-reference

[MONTHS_BETWEEN]
declaration=date1, date2
category=Date and Time Functions
since=12.2
description=Returns the number of months between date1 and date2 (Oracle compatible). The result is positive if date1 is later than date2, otherwise negative. If both dates are the same day of the month, or both are the last day of a month, the result is an integer. Otherwise a fractional part is calculated based on a 31-day month.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/months_between

[TO_DATE]
declaration=string_expression [DEFAULT string_expression ON CONVERSION ERROR], format_string [, nls_format_string]
category=Date and Time Functions
since=12.3
description=Converts a string to a DATETIME value, using format_string with the same format elements as TO_CHAR() (Oracle compatible). With DEFAULT ... ON CONVERSION ERROR, the given value is returned instead of an error for invalid input.\n\nURL: https://mariadb.com/docs/server/reference/sql-functions/date-time-functions/to_date
