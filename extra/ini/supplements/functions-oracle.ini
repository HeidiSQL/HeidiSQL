; Declarations for Oracle functions whose text syntax diagram is empty or wrong in the SQL Language Reference.
; Category, description and since are taken from the function page.
; Empty diagrams, declaration from the "Parameters" section:
[VECTOR_DIMS]
declaration=expr
[VECTOR_DIMENSION_COUNT]
declaration=expr
[VECTOR_DIMENSION_FORMAT]
declaration=expr
[VECTOR_NORM]
declaration=expr
; Diagram shows UUID(), declaration from the description:
[IS_UUID]
declaration=uuid_string [, version_specifier [, namespace, name]]
; Unbalanced braces in the diagram of STATS_T_TEST_*:
[STATS_T_TEST_ONE]
declaration=expr1 [, expr2 ] [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
replace=1
[STATS_T_TEST_PAIRED]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
replace=1
[STATS_T_TEST_INDEP]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
replace=1
[STATS_T_TEST_INDEPU]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
replace=1
; Diagram reads "DOMAIN DISPLAY(":
[DOMAIN_DISPLAY]
declaration=domain_name, (expr) [, expr]...
