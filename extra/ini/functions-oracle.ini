description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\nCALENDAR_START_END, FISCAL_START_END, CALENDAR_X_OF_Y, FISCAL_X_OF_Y,\nCALENDAR_ADD_X_PERIODS, and FISCAL_ADD_PERIODS functions accept a nlsparam.\n\nAll functions that take an nlsparam allow the specification of NLS_CALENDAR,\nwith the exception of the retail functions.\n\nThe NLS_CALENDAR, either inherited from the session or explicitly specified in\nthe nlsparam, indicates which calendar is used for navigation and output. Only\nthe GREGORIAN calendar is supported.\n\nThe CALENDAR_START_END, FISCAL_START_END, and RETAIL_START_END functions return\na DATE (with hour/minute/second components set to midnight) representing the\nGregorian date of the start or end of the associated period (year, quarter,\nmonth, week) in the associated calendar (calendar, fiscal, retail). Note that\nthere are no functions for DAY because they would all just return the given date\nfor both start and end.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/calendar_start_end.html
[CALENDAR_YEAR_NUMBER]
declaration=dtexpr [ , nlsparam ]
category=Calendar Functions
since=23
description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\n- The index_by parameter is a text value that must resolve to either POSITION or\nDATE (case-insensitive, defaults to DATE). It is used to distinguish between\nabsolute and position-based numbers for the following cases:\n\n- CALENDAR_DAY_OF_WEEK\n\n- FISCAL_DAY_OF_WEEK\n\n- RETAIL_DAY_OF_WEEK\n\n- FISCAL_MONTH_OF_YEAR\n\n- RETAIL_MONTH_OF_YEAR\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/calendar_x_of_y.html
[CALENDAR_YEAR_START_DATE]
declaration=dtexpr [ , nlsparam ]
category=Calendar Functions
since=23
description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\nCALENDAR_START_END, FISCAL_START_END, CALENDAR_X_OF_Y, FISCAL_X_OF_Y,\nCALENDAR_ADD_X_PERIODS, and FISCAL_ADD_PERIODS functions accept a nlsparam.\n\nAll functions that take an nlsparam allow the specification of NLS_CALENDAR,\nwith the exception of the retail functions.\n\nThe NLS_CALENDAR, either inherited from the session or explicitly specified in\nthe nlsparam, indicates which calendar is used for navigation and output. Only\nthe GREGORIAN calendar is supported.\n\nThe CALENDAR_START_END, FISCAL_START_END, and RETAIL_START_END functions return\na DATE (with hour/minute/second components set to midnight) representing the\nGregorian date of the start or end of the associated period (year, quarter,\nmonth, week) in the associated calendar (calendar, fiscal, retail). Note that\nthere are no functions for DAY because they would all just return the given date\nfor both start and end.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/calendar_start_end.html
[CARDINALITY]
declaration=nested_table
category=Collection Functions
description=CARDINALITY returns the number of elements in a nested table. The return type is\nNUMBER. If the nested table is empty, or is a null collection, then CARDINALITY\nreturns NULL.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CARDINALITY.html
[CAST]
declaration={ expr | MULTISET (subquery) } AS [ DOMAIN ] type_name [ domain_validate_clause ] [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=CAST lets you convert built-in data types or collection-typed values of one type\ninto another built-in data type or collection type. You can cast an unnamed\noperand (such as a date or the result set of a subquery) or a named collection\n(such as a varray or a nested table) into a type-compatible data type or named\ncollection. The type_name must be the name of a built-in data type, collection\ntype, or domain name and the operand must be a built-in data type or must\nevaluate to a collection value.\n\nFor the operand, expr can be either a built-in data type, a collection type, or\nan instance of an ANYDATA type. If expr is an instance of an ANYDATA type, then\nCAST tries to extract the value of the ANYDATA instance and return it if it\nmatches the cast target type, otherwise, null will be returned. MULTISET informs\nOracle Database to take the result set of the subquery and return a collection\nvalue. Table 7-4 shows which built-in data types can be cast into which other\nbuilt-in data types. (CAST does not support LONG, LONG RAW, or the\nOracle-supplied types.)\n\nCAST does not directly support any of the LOB data types. When you use CAST to\nconvert a CLOB value into a character data type or a BLOB value into the RAW\ndata type, the database implicitly converts the LOB value to character or raw\ndata and then explicitly casts the resulting value into the target data type. If\nthe resulting value is larger than the target type, then the database returns an\nerror.\n\nWhen you use CAST ... MULTISET to get a collection value, each select list item\nin the query passed to the CAST function is converted to the corresponding\nattribute type of the target collection element type.\n\nThe cells with an 'X' indicate the possible conversions from source to\ndestination data type using CAST.\n\nNote 1: Datetime/interval includes DATE, TIMESTAMP, TIMESTAMP WITH TIMEZONE,\nTIMESTAMP WITH LOCAL TIME ZONE, INTERVAL DAY TO SECOND, and INTERVAL YEAR TO\nMONTH.\n\nNote 2: You cannot cast a UROWID to a ROWID if the UROWID contains the value of\na ROWID of an index-organized table.\n\nNote 3: You can specify the DEFAULT return_value ON CONVERSION ERROR clause for\nthis type of conversion. You can specify the fmt and nlsparam clauses for this\n...\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CAST.html
[CEIL1]
name=CEIL
declaration=datetime [ , fmt ]
category=Datetime Functions
since=23
description=CEIL(datetime) returns the date or the timestamp rounded up to the unit\nspecified by the second argument fmt, the format model. If the input value is\nalready truncated to the specified unit, then the return value is the same as\nthe input. That is, if datetime = TRUNC(datetime, fmt), then CEIL(datetime, fmt)\n= datetime. For example, CEIL(DATE '2023-02-01', 'MONTH') returns February 1\n2023.\n\nThis function is not sensitive to the NLS_CALENDAR session parameter. It\noperates according to the rules of the Gregorian calendar. The value returned is\nalways of data type DATE, even if you specify a different datetime data type for\nthe argument. If you do not specify the second argument, the default format\nmodel 'DD' is used.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ceil-datetime.html
[CEIL2]
name=CEIL
declaration=n
category=Numeric Functions
description=CEIL returns the smallest integer that is greater than or equal to n. The number\nn can always be written as the difference of an integer k and a positive\nfraction f such that 0 <= f < 1 and n = k - f. The value of CEIL is the integer\nk. Thus, the value of CEIL is n itself if and only if n is precisely an integer.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CEIL.html
[CHARTOROWID]
declaration=char
category=Conversion Functions
description=CHARTOROWID converts a value from CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type\nto ROWID data type.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CHARTOROWID.html
[CHECKSUM]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
since=21
description=Use CHECKSUM to detect changes in a table. The order of the rows in the table\ndoes not affect the result. You can use CHECKSUM with DISTINCT, as part of a\nGROUP BY query, as a window function, or an analytical function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/checksum.html
[CHR]
declaration=n [ USING NCHAR_CS ]
category=Character Functions Returning Character Values
description=CHR returns the character having the binary equivalent to n as a VARCHAR2 value\nin either the database character set or, if you specify USING NCHAR_CS, the\nnational character set.\n\nFor single-byte character sets, if n > 256, then Oracle Database returns the\nbinary equivalent of n mod 256. For multibyte character sets, n must resolve to\none entire code point. Invalid code points are not validated, and the result of\nspecifying invalid code points is indeterminate.\n\nThis function takes as an argument a NUMBER value, or any value that can be\nimplicitly converted to NUMBER, and returns a character.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CHR.html
[CLUSTER_DETAILS]
declaration=[ schema . ] model [ , cluster_id [ , topN ] ] [ DESC | ASC | ABS ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=CLUSTER_DETAILS returns cluster details for each row in the selection. The\nreturn value is an XML string that describes the attributes of the highest\nprobability cluster or the specified cluster_id.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CLUSTER_DETAILS.html
[CLUSTER_DISTANCE]
declaration=[ schema . ] model [ , cluster_id ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=CLUSTER_DISTANCE returns a cluster distance for each row in the selection. The\ncluster distance is the distance between the row and the centroid of the highest\nprobability cluster or the specified cluster_id. The distance is returned as\nBINARY_DOUBLE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CLUSTER_DISTANCE.html
[CLUSTER_ID]
declaration=[ schema . ] model mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=CLUSTER_ID returns the identifier of the highest probability cluster for each\nrow in the selection. The cluster identifier is returned as an Oracle NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CLUSTER_ID.html
[CLUSTER_PROBABILITY]
declaration=[ schema . ] model [, cluster_id ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=CLUSTER_PROBABILITY returns a probability for each row in the selection. The\nprobability refers to the highest probability cluster or to the specified\ncluster_id. The cluster probability is returned as BINARY_DOUBLE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CLUSTER_PROBABILITY.html
[CLUSTER_SET]
declaration=[ schema . ] model [ , topN [ , cutoff ] ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=CLUSTER_SET returns a set of cluster ID and probability pairs for each row in\nthe selection. The return value is a varray of objects with field names\nCLUSTER_ID and PROBABILITY. The cluster identifier is an Oracle NUMBER; the\nprobability is BINARY_DOUBLE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CLUSTER_SET.html
[COALESCE]
declaration=expr [, expr ]...
category=NULL-Related Functions
description=COALESCE returns the first non-null expr in the expression list. You must\nspecify at least two expressions. If all occurrences of expr evaluate to null,\nthen the function returns null.\n\nOracle Database uses short-circuit evaluation. The database evaluates each expr\nvalue and determines whether it is NULL, rather than evaluating all of the expr\nvalues before determining whether any of them is NULL.\n\nIf all occurrences of expr are numeric data type or any nonnumeric data type\nthat can be implicitly converted to a numeric data type, then Oracle Database\ndetermines the argument with the highest numeric precedence, implicitly converts\nthe remaining arguments to that data type, and returns that data type.\n\nThis function is a generalization of the NVL function.\n\nYou can also use COALESCE as a variety of the CASE expression. For example,\n\nis equivalent to:\n\nSimilarly,\n\nwhere n >= 3, is equivalent to:\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COALESCE.html
[COLLATION]
declaration=expr
category=Collation Functions
description=COLLATION returns the name of the derived collation for expr. This function\nreturns named collations and pseudo-collations. If the derived collation is a\nUnicode Collation Algorithm (UCA) collation, then the function returns the long\nform of its name. This function is evaluated during compilation of the SQL\nstatement that contains it. If the derived collation is undefined due to a\ncollation conflict while evaluating expr, then the function returns null.\n\nexpr must evaluate to a character string of type CHAR, VARCHAR2, LONG, NCHAR, or\nNVARCHAR2.\n\nThis function returns a VARCHAR2 value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COLLATION.html
[COLLECT]
declaration=[ DISTINCT | UNIQUE ] column [ ORDER BY expr ]
category=Collection Functions
description=COLLECT is an aggregate function that takes as its argument a column of any type\nand creates a nested table of the input type out of the rows selected. To get\naccurate results from this function you must use it within a CAST function.\n\nIf column is itself a collection, then the output of COLLECT is a nested table\nof collections. If column is of a user-defined type, then column must have a MAP\nor ORDER method defined on it in order for you to use the optional DISTINCT,\nUNIQUE, and ORDER BY clauses.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COLLECT.html
[COMPOSE]
declaration=char
category=Conversion Functions
description=COMPOSE takes as its argument a character value char and returns the result of\napplying the Unicode canonical composition, as described in the Unicode Standard\ndefinition D117, to it. If the character set of the argument is not one of the\nUnicode character sets, COMPOSE returns its argument unmodified.\n\nCOMPOSE does not directly return strings in any of the Unicode normalization\nforms. To get a string in the NFC form, first call DECOMPOSE with the CANONICAL\nsetting and then COMPOSE . To get a string in the NFKC form, first call\nDECOMPOSE with the COMPATIBILITY setting and then COMPOSE .\n\nchar can be of any of the data types: CHAR, VARCHAR2, NCHAR, or NVARCHAR2. Other\ndata types are allowed if they can be implicitly converted to VARCHAR2 or\nNVARCHAR2. The return value of COMPOSE is in the same character set as its\nargument.\n\nCLOB and NCLOB values are supported through implicit conversion. If char is a\ncharacter LOB value, then it is converted to a VARCHAR2 value before the COMPOSE\noperation. The operation will fail if the size of the LOB value exceeds the\nsupported length of the VARCHAR2 in the particular execution environment.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COMPOSE.html
[CONCAT]
declaration=char1 , char2 [ , charN ]...
category=Character Functions Returning Character Values
description=CONCAT takes as input two or more arguments and returns the concatenation of all\narguments.\n\nThe arguments can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2,\nCLOB, or NCLOB. Arguments of other data types are implicitly converted to\nVARCHAR2 before concatenation.\n\nThe string returned is in the same character set as char1. Its data type depends\non the data types of the arguments.\n\nIn concatenations of two or more different data types, Oracle Database returns\nthe data type that results in a lossless conversion. Therefore, if one of the\narguments is a LOB, then the returned value is a LOB. If one of the arguments is\na national data type, then the returned value is a national data type.\n\nRules for the Data Types of Return Values\n\nAmong all arguments:\n\n- if there is a NCLOB, or if there is a CLOB and a NVARCHAR2 /NCHAR, then the\nreturn type is NCLOB.\n\n- otherwise, if there is CLOB, then the return type is CLOB\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CONCAT.html
[CONVERT]
declaration=char, dest_char_set[, source_char_set ]
category=Conversion Functions
description=CONVERT converts a character string from one character set to another.\n\n- The char argument is the value to be converted. It can be any of the data\ntypes CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or NCLOB.\n\n- The dest_char_set argument is the name of the character set to which char is\nconverted.\n\n- The source_char_set argument is the name of the character set in which char is\nstored in the database. The default value is the database character set.\n\nThe return value for CHAR and VARCHAR2 is VARCHAR2. For NCHAR and NVARCHAR2, it\nis NVARCHAR2. For CLOB, it is CLOB, and for NCLOB, it is NCLOB.\n\nBoth the destination and source character set arguments can be either literals\nor columns containing the name of the character set.\n\nFor complete correspondence in character conversion, it is essential that the\ndestination character set contains a representation of all the characters\ndefined in the source character set. Where a character does not exist in the\ndestination character set, a replacement character appears. Replacement\ncharacters can be defined as part of a character set definition.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CONVERT.html
[CON_DBID_TO_ID]
declaration=container_dbid
category=Environment and Identifier Functions
description=CON_DBID_TO_ID takes as its argument a container DBID and returns the container\nID. For container_dbid, specify a NUMBER value or any value that can be\nimplicitly converted to NUMBER. The function returns a NUMBER value.\n\nThis function is useful in a multitenant container database (CDB). If you use\nthis function in a non-CDB, then it returns 0.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CON_DBID_TO_ID.html
[CON_GUID_TO_ID]
declaration=container_guid
category=Environment and Identifier Functions
description=CON_GUID_TO_ID takes as its argument a container GUID (globally unique\nidentifier) and returns the container ID. For container_guid, specify a raw\nvalue. The function returns a NUMBER value.\n\nThis function is useful in a multitenant container database (CDB). If you use\nthis function in a non-CDB, then it returns 0.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CON_GUID_TO_ID.html
[CON_NAME_TO_ID]
declaration=container_name
category=Environment and Identifier Functions
description=CON_NAME_TO_ID takes as its argument a container name and returns the container\nID. For container_name, specify a string, or an expression that resolves to a\nstring, in any data type. The function returns a NUMBER value.\n\nThis function is useful in a multitenant container database (CDB). If you use\nthis function in a non-CDB, then it returns 0.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CON_NAME_TO_ID.html
[CON_UID_TO_ID]
declaration=container_uid
category=Environment and Identifier Functions
description=CON_UID_TO_ID takes as its argument a container UID (unique identifier) and\nreturns the container ID. For container_uid, specify a NUMBER value or any value\nthat can be implicitly converted to NUMBER. The function returns a NUMBER value.\n\nThis function is useful in a multitenant container database (CDB). If you use\nthis function in a non-CDB, then it returns 0.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CON_UID_TO_ID.html
[CORR]
declaration=expr1, expr2
category=Aggregate Functions
description=CORR returns the coefficient of correlation of a set of number pairs. You can\nuse it as an aggregate or analytic function.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. Oracle determines\nthe argument with the highest numeric precedence, implicitly converts the\nremaining arguments to that data type, and returns that data type.\n\nOracle Database applies the function to the set of (expr1, expr2) after\neliminating the pairs for which either expr1 or expr2 is null. Then Oracle makes\nthe following computation:\n\nThe function returns a value of type NUMBER. If the function is applied to an\nempty set, then it returns null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CORR.html
[CORR_K]
declaration=expr1, expr2 [, ' { COEFFICIENT | ONE_SIDED_SIG | ONE_SIDED_SIG_POS | ONE_SIDED_SIG_NEG | TWO_SIDED_SIG } ' ]
category=Aggregate Functions
description=The CORR_* functions are:\n\n- CORR_S\n\n- CORR_K\n\nThe CORR function (see CORR) calculates the Pearson's correlation coefficient\nand requires numeric expressions as input. The CORR_* functions support\nnonparametric or rank correlation. They let you find correlations between\nexpressions that are ordinal scaled (where a ranking of the values is possible).\nCorrelation coefficients take on a value ranging from -1 to 1, where 1 indicates\na perfect relationship, -1 a perfect inverse relationship (when one variable\nincreases as the other decreases), and a value close to 0 means no relationship.\n\nThese functions take two mandatory arguments, expr1 and expr2, and an optional\nthird argument. The return value of the functions is a NUMBER.\n\nThe mandatory arguments are the two variables being analyzed. They can be of any\ndata type that is comparable other than LONG, CLOB, BLOB, BFILE, or VECTOR. If\nthe data type is a user-defined type (UDT), it must have a MAP or ORDER method\nto be comparable.\n\nThe third argument specifies the variant of the result returned by the\nfunctions. It is of type VARCHAR2 and must be a constant expression, for\nexample, a character literal. If you omit the third argument, then the default\nis 'COEFFICIENT'. The allowed argument values and their meaning are shown in\nTable 7-2 Table 7-5:\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CORR_A.html
[CORR_S]
declaration=expr1, expr2 [, ' { COEFFICIENT | ONE_SIDED_SIG | ONE_SIDED_SIG_POS | ONE_SIDED_SIG_NEG | TWO_SIDED_SIG } ' ]
category=Aggregate Functions
description=The CORR_* functions are:\n\n- CORR_S\n\n- CORR_K\n\nThe CORR function (see CORR) calculates the Pearson's correlation coefficient\nand requires numeric expressions as input. The CORR_* functions support\nnonparametric or rank correlation. They let you find correlations between\nexpressions that are ordinal scaled (where a ranking of the values is possible).\nCorrelation coefficients take on a value ranging from -1 to 1, where 1 indicates\na perfect relationship, -1 a perfect inverse relationship (when one variable\nincreases as the other decreases), and a value close to 0 means no relationship.\n\nThese functions take two mandatory arguments, expr1 and expr2, and an optional\nthird argument. The return value of the functions is a NUMBER.\n\nThe mandatory arguments are the two variables being analyzed. They can be of any\ndata type that is comparable other than LONG, CLOB, BLOB, BFILE, or VECTOR. If\nthe data type is a user-defined type (UDT), it must have a MAP or ORDER method\nto be comparable.\n\nThe third argument specifies the variant of the result returned by the\nfunctions. It is of type VARCHAR2 and must be a constant expression, for\nexample, a character literal. If you omit the third argument, then the default\nis 'COEFFICIENT'. The allowed argument values and their meaning are shown in\nTable 7-2 Table 7-5:\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CORR_A.html
[COS]
declaration=n
category=Numeric Functions
description=COS returns the cosine of n (an angle expressed in radians).\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COS.html
[COSH]
declaration=n
category=Numeric Functions
description=COSH returns the hyperbolic cosine of n.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COSH.html
[COUNT]
declaration={ * | [ DISTINCT | ALL ] expr }
category=Aggregate Functions
description=COUNT returns the number of rows returned by the query. You can use it as an\naggregate or analytic function.\n\nIf you specify DISTINCT, then you can specify only the query_partition_clause of\nthe analytic_clause. The order_by_clause and windowing_clause are not allowed.\n\nIf you specify expr, then COUNT returns the number of rows where expr is not\nnull. You can count either all rows, or only distinct values of expr.\n\nIf you specify the asterisk (*), then this function returns all rows, including\nduplicates and nulls. COUNT never returns null.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COUNT.html
[COVAR_POP]
declaration=expr1, expr2
category=Aggregate Functions
description=COVAR_POP returns the population covariance of a set of number pairs. You can\nuse it as an aggregate or analytic function.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. Oracle determines\nthe argument with the highest numeric precedence, implicitly converts the\nremaining arguments to that data type, and returns that data type.\n\nThe database applies the function to the set of (expr1, expr2) pairs after\neliminating all pairs for which either expr1 or expr2 is null. Then the database\nmakes the following computation:\n\nwhere n is the number of (expr1, expr2) pairs where neither expr1 nor expr2 is\nnull.\n\nThe function returns a value of type NUMBER. If the function is applied to an\nempty set, then it returns null.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COVAR_POP.html
[COVAR_SAMP]
declaration=expr1, expr2
category=Aggregate Functions
description=COVAR_SAMP returns the sample covariance of a set of number pairs. You can use\nit as an aggregate or analytic function.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The database\ndetermines the argument with the highest numeric precedence, implicitly converts\nthe remaining arguments to that data type, and returns that data type.\n\nThe database applies the function to the set of (expr1, expr2) pairs after\neliminating all pairs for which either expr1 or expr2 is null. Then the database\nmakes the following computation:\n\nwhere n is the number of (expr1, expr2) pairs where neither expr1 nor expr2 is\nnull.\n\nThe function returns a value of type NUMBER. If the function is applied to an\nempty set, then it returns null.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/COVAR_SAMP.html
[CUBE_TABLE]
declaration=' { schema.cube [ {HIERARCHY | HRR} dimension hierarchy ]... | schema.dimension [ {HIERARCHY | HRR} [dimension] hierarchy ] } '
category=OLAP Functions
description=CUBE_TABLE extracts data from a cube or dimension and returns it in the\ntwo-dimensional format of a relational table, which can be used by SQL-based\napplications.\n\nThe function takes a single VARCHAR2 argument. The optional hierarchy clause\nenables you to specify a dimension hierarchy. A cube can have multiple hierarchy\nclauses, one for each dimension.\n\nYou can generate these different types of tables:\n\n- A cube table contains a key column for each dimension and a column for each\nmeasure and calculated measure in the cube. To create a cube table, you can\nspecify the cube with or without a cube hierarchy clause. For a dimension with\nmultiple hierarchies, this clause limits the return values to the dimension\nmembers and levels in the specified hierarchy. Without a hierarchy clause, all\ndimension members and all levels are included.\n\n- A dimension table contains a key column, and a column for each level and each\nattribute. It also contains a MEMBER_TYPE column, which identifies each member\nwith one of the following codes:\n\n- L - Loaded from a table, view, or synonym\n\n- A - Loaded member and the single root of all hierarchies in the dimension,\nthat is, the "all" aggregate member\n\n- C - Calculated member\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CUBE_TABLE.html
[CUME_DIST]
declaration=expr[,expr ]...
category=Aggregate Functions
description=CUME_DIST calculates the cumulative distribution of a value in a group of\nvalues. The range of values returned by CUME_DIST is >0 to <=1. Tie values\nalways evaluate to the same cumulative distribution value.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. Oracle Database\ndetermines the argument with the highest numeric precedence, implicitly converts\nthe remaining arguments to that data type, makes the calculation, and returns\nNUMBER.\n\n- As an aggregate function, CUME_DIST calculates, for a hypothetical row r\nidentified by the arguments of the function and a corresponding sort\nspecification, the relative position of row r among the rows in the aggregation\ngroup. Oracle makes this calculation as if the hypothetical row r were inserted\ninto the group of rows to be aggregated over. The arguments of the function\nidentify a single hypothetical row within each aggregate group. Therefore, they\nmust all evaluate to constant expressions within each aggregate group. The\nconstant argument expressions and the expressions in the ORDER BY clause of the\naggregate match by position. Therefore, the number of arguments must be the same\nand their types must be compatible.\n\n- As an analytic function, CUME_DIST computes the relative position of a\nspecified value in a group of values. For a row r, assuming ascending ordering,\nthe CUME_DIST of r is the number of rows with values lower than or equal to the\nvalue of r, divided by the number of rows being evaluated (the entire query\nresult set or a partition).\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CUME_DIST.html
[CUMULATE]
declaration=([ schema . ] (table | view) | query_name), COLUMNS (datetime_column), step, size [, offset ]
category=Streaming Windowing Table Functions
since=23
description=The CUMULATE table function creates a set of expanding time windows. Each window\nstarts at the same time, and its end boundary advances by a fixed step until it\nreaches the maximum window size.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CUMULATE.html
[CV]
declaration=[ dimension_column ]
category=Model Functions
description=The CV function can be used only in the model_clause of a SELECT statement and\nthen only on the right-hand side of a model rule. It returns the current value\nof a dimension column or a partitioning column carried from the left-hand side\nto the right-hand side of a rule. This function is used in the model_clause to\nprovide relative indexing with respect to the dimension column. The return type\nis that of the data type of the dimension column. If you omit the argument, then\nit defaults to the dimension column associated with the relative position of the\nfunction within the cell reference.\n\nThe CV function can be used outside a cell reference. In this case,\ndimension_column is required.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/CV.html
[DATAOBJ_TO_MAT_PARTITION]
declaration=table, partition_id
category=Data Cartridge Functions
description=DATAOBJ_TO_MAT_PARTITION is useful only to Data Cartridge developers who are\nperforming data maintenance or query operations on system-partitioned tables\nthat are used to store domain index data. The DML or query operations are\ntriggered by corresponding operations on the base table of the domain index.\n\nThis function takes as arguments the name of the base table and the partition ID\nof the base table partition, both of which are passed to the function by the\nappropriate ODCIIndex method. The function returns the materialized partition\nnumber of the corresponding system-partitioned table, which can be used to\nperform the operation (DML or query) on that partition of the system-partitioned\ntable.\n\nIf the base table is interval partitioned, then Oracle recommends that you use\nthis function instead of the DATAOBJ_TO_PARTITION function. The\nDATAOBJ_TO_PARTITION function determines the absolute partition number, given\nthe physical partition identifier. However, if the base table is interval\npartitioned, then there might be holes in the partition numbers corresponding to\nunmaterialized partitions. Because the system partitioned table only has\nmaterialized partitions, DATAOBJ_TO_PARTITION numbers can cause a mis-match\nbetween the partitions of the base table and the partitions of the underlying\nsystem partitioned index storage tables. The DATAOBJ_TO_MAT_PARTITION function\nreturns the materialized partition number (as opposed to the absolute partition\nnumber) and helps keep the two tables in sync. Indextypes planning to support\nlocal domain indexes on interval partitioned tables should migrate to the use of\nthis function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DATAOBJ_TO_MAT_PARTITION.html
[DATAOBJ_TO_PARTITION]
declaration=table, partition_id
category=Data Cartridge Functions
description=DATAOBJ_TO_PARTITION is useful only to Data Cartridge developers who are\nperforming data maintenance or query operations on system-partitioned tables\nthat are used to store domain index data. The DML or query operations are\ntriggered by corresponding operations on the base table of the domain index.\n\nThis function takes as arguments the name of the base table and the partition ID\nof the base table partition, both of which are passed to the function by the\nappropriate ODCIIndex method. The function returns the absolute partition number\nof the corresponding system-partitioned table, which can be used to perform the\noperation (DML or query) on that partition of the system-partitioned table.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DATAOBJ_TO_PARTITION.html
[DECODE]
declaration=expr, search, result [, search, result ]... [, default ]
category=Encoding and Decoding Functions
description=DECODE compares expr to each search value one by one. If expr is equal to a\nsearch, then Oracle Database returns the corresponding result. If no match is\nfound, then Oracle returns default. If default is omitted, then Oracle returns\nnull.\n\n- If expr and search are character data, then Oracle compares them using\nnonpadded comparison semantics. expr, search, and result can be any of the data\ntypes CHAR, VARCHAR2, NCHAR, or NVARCHAR2. The string returned is of VARCHAR2\ndata type and is in the same character set as the first result parameter.\n\n- If the first search-result pair are numeric, then Oracle compares all\nsearch-result expressions and the first expr to determine the argument with the\nhighest numeric precedence, implicitly converts the remaining arguments to that\ndata type, and returns that data type.\n\nThe search, result, and default values can be derived from expressions. Oracle\nDatabase uses short-circuit evaluation. The database evaluates each search value\nonly before comparing it to expr, rather than evaluating all search values\nbefore comparing any of them with expr. Consequently, Oracle never evaluates a\nsearch if a previous search is equal to expr.\n\nOracle automatically converts expr and each search value to the data type of the\nfirst search value before comparing. Oracle automatically converts the return\nvalue to the same data type as the first result. If the first result has the\ndata type CHAR or if the first result is null, then Oracle converts the return\nvalue to the data type VARCHAR2.\n\nIn a DECODE function, Oracle considers two nulls to be equivalent. If expr is\nnull, then Oracle returns the result of the first search that is also null.\n\nThe maximum number of components in the DECODE function, including expr,\nsearches, results, and default, is 255.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DECODE.html
[DECOMPOSE]
declaration=string [, { 'CANONICAL' | 'COMPATIBILITY' } ]
category=Conversion Functions
description=DECOMPOSE takes as its first argument a character value string and returns the\nresult of applying one of the Unicode decompositions to it. The decomposition to\napply is determined by the second, optional parameter. If the character set of\nthe first argument is not one of the Unicode character sets, DECOMPOSE returns\nthe argument unmodified.\n\nIf the second argument to DECOMPOSE is the string CANONICAL\n(case-insensitively), DECOMPOSE applies canonical decomposition, as described in\nthe Unicode Standard definition D68, and returns a string in the NFD\nnormalization form. If the second argument is the string COMPATIBILITY,\nDECOMPOSE applies compatibility decomposition, as described in the Unicode\nStandard definition D65, and returns a string in the NFKD normalization form.\nThe default behavior is to apply the canonical decomposition.\n\nIn a pessimistic case, the return value of DECOMPOSE may be a few times longer\nthan string. If a string to be returned is longer than the maximum length\nVARCHAR2 value in a given runtime environment, the value is silently truncated\nto the maximum VARCHAR2 length.\n\nBoth arguments to DECOMPOSE can be of any of the data types CHAR, VARCHAR2,\nNCHAR, or NVARCHAR2. Other data types are allowed if they can be implicitly\nconverted to VARCHAR2or NVARCHAR2. The return value of DECOMPOSE is in the same\ncharacter set as its first argument.\n\nCLOB and NCLOB values are supported through implicit conversion. If string is a\ncharacter LOB value, then it is converted to a VARCHAR2 value before the\nDECOMPOSE operation. The operation will fail if the size of the LOB value\nexceeds the supported length of the VARCHAR2 in the particular execution\nenvironment.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DECOMPOSE.html
[DENSE_RANK]
declaration=expr [, expr ]...
category=Aggregate Functions
description=DENSE_RANK computes the rank of a row in an ordered group of rows and returns\nthe rank as a NUMBER. The ranks are consecutive integers beginning with 1. The\nlargest rank value is the number of unique values returned by the query. Rank\nvalues are not skipped in the event of ties. Rows with equal values for the\nranking criteria receive the same rank. This function is useful for top-N and\nbottom-N reporting.\n\nThis function accepts as arguments any numeric data type and returns NUMBER.\n\n- As an aggregate function, DENSE_RANK calculates the dense rank of a\nhypothetical row identified by the arguments of the function with respect to a\ngiven sort specification. The arguments of the function must all evaluate to\nconstant expressions within each aggregate group, because they identify a single\nrow within each group. The constant argument expressions and the expressions in\nthe order_by_clause of the aggregate match by position. Therefore, the number of\narguments must be the same and types must be compatible.\n\n- As an analytic function, DENSE_RANK computes the rank of each row returned\nfrom a query with respect to the other rows, based on the values of the\nvalue_exprs in the order_by_clause.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DENSE_RANK.html
[DEPTH]
declaration=correlation_integer
category=XML Functions
description=DEPTH is an ancillary function used only with the UNDER_PATH and EQUALS_PATH\nconditions. It returns the number of levels in the path specified by the\nUNDER_PATH condition with the same correlation variable.\n\nThe correlation_integer can be any NUMBER integer. Use it to correlate this\nancillary function with its primary condition if the statement contains multiple\nprimary conditions. Values less than 1 are treated as 1.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DEPTH.html
[DEREF]
declaration=expr
category=Object Reference Functions
description=DEREF returns the object reference of argument expr, where expr must return a\nREF to an object. If you do not use this function in a query, then Oracle\nDatabase returns the object ID of the REF instead, as shown in the example that\nfollows.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DEREF.html
[DOMAIN_CHECK]
declaration=[ domain_owner .] domain_name , (expr)[ ,expr ]...
category=Domain Functions
since=23
description=DOMAIN_CHECK first converts the data type of the arguments in expr to the data\ntype of their corresponding domain columns. It then applies the constraint\nconditions (not null or check constraint) on domain_name to expr.\n\nIf the domain's constraint is deferred or unvalidated, DOMAIN_CHECK still\napplies the conditions to expr. If the domain's constraint is disabled, it is\nnot checked as part of DOMAIN_CHECK.\n\n- domain_name must be an identifier and can be specified using\ndomain_owner.domain_name. If you specify it without domain_owner, it resolves\nfirst to the current user then as a public synonym. If the name cannot be\nresolved, an error is raised.\n\n- If domain_name refers to a non-existent domain or one that you do not have\nEXECUTE privileges on, then DOMAIN_CHECK will raise an error.\n\n- If the domain column data type is STRICT, then the value is converted to the\ndomain column's data type. For example, if the domain column data type is\nVARCHAR2(100) STRICT, then the value is converted to VARCHAR2(100). Note that\nthe conversion will not automatically trim the input to the maximum length. If\nthe value evaluates to 'abc' for some row and the domain data type is CHAR(2\nCHAR), the conversion will fail instead of returning 'ab'.\n\nIf the domain column data type is not STRICT, then the value is converted to the\nmost permissive variant of the domain column's data type in terms of length,\nscale, and precision. For example, if the input value is a VARCHAR2(30), it is\nconverted to a VARCHAR2(100) because it is shorter than the domain length. If\nthe input value is a VARCHAR2(200), it remains a VARCHAR2(200) because this is\nlarger than the domain length.\n\n- If the data type conversion fails, the error is masked and DOMAIN_CHECK\nreturns FALSE. You can use DOMAIN_CHECK to filter out values that cannot be\ninserted into a column of the given domain.\n\nIf the data type conversion succeeds and domain_name does not have any enabled\nconstraint associated with it, DOMAIN_CHECK returns TRUE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/domain_check.html
[DOMAIN_CHECK_TYPE]
declaration=[ domain_owner .] domain_name, (expr)[ ,expr ]...
category=Domain Functions
since=23
description=Use DOMAIN_CHECK_TYPE to convert the value expression to the data type of the\ndomain column without checking domain constraints. If you want to check\nconstraints, you must use DOMAIN_CHECK.\n\nDOMAIN_CHECK_TYPE takes the same arguments as DOMAIN_CHECK and returns TRUE if\nthe data type of the arguments match the data types of the corresponding domain\ncolumns. If the data type match fails, it returns FALSE.\n\n- domain_name must be an identifier and can be specified using\ndomain_owner.domain_name. If you specify it without domain_owner, it resolves\nfirst to the current user then as a public synonym. If the name cannot be\nresolved, an error is raised.\n\n- If domain_name refers to a non-existent domain or one that you do not have\nEXECUTE privileges on, then DOMAIN_CHECK will raise an error.\n\n- If the domain column data type is STRICT, then the value is converted to the\ndomain column's data type. For example, if the domain column data type is\nVARCHAR2(100) STRICT, then the value is converted to VARCHAR2(100). Note that\nthe conversion will not automatically trim the input to the maximum length. If\nthe value evaluates to 'abc' for some row and the domain data type is CHAR(2\nCHAR), the conversion will fail instead of returning 'ab'.\n\nIf the domain column data type is not STRICT, then the value is converted to the\nmost permissive variant of the domain column's data type in terms of length,\nscale and precision. For example, if the input value is a VARCHAR2(30), it is\nconverted to a VARCHAR2(100) because it is shorter than the domain length. If\nthe input value is a VARCHAR2(200), it remains aVARCHAR2(200) because this is\nlarger than the domain length.\n\n- If the data type conversion fails, the error is masked and DOMAIN_CHECK_TYPE\nreturns FALSE. You can use DOMAIN_CHECK_TYPE to filter out values that cannot be\ninserted into a column of the given domain..\n\nMULTI-COLUMN Domains\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/domain_check_type.html
[DOMAIN_DISPLAY]
declaration=domain_name, (expr) [, expr]...
category=Domain Functions
since=23
description=DOMAIN_DISPLAY returns expr formatted according to the domain's display\nexpression. This returns NULL if the arguments are not associated with a domain\nor the domain has no display expression.\n\nWhen calling DOMAIN_DISPLAY for multicolumn domains, all values of expr should\nbe from the same domain. It returns NULL if the number of expr arguments are\ndifferent from the number of domain columns or they are in a different order in\nthe domain.\n\nTo get the display expression for a non-domain value, cast expr to the domain\ntype. This is only possible for single column domains.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/domain_display.html
[DOMAIN_NAME]
declaration=domain_name, (expr)[ ,expr ]...
category=Domain Functions
since=23
description=DOMAIN_NAME returns the fully qualified name of the domain associated with expr.\nThis returns NULL if expr is associated with a domain.\n\nWhen calling DOMAIN_NAME for multicolumn domains, all values of expr should be\nfrom the same domain. It returns NULL if the number of expr arguments are\ndifferent from the number of domain columns or they are in a different order in\nthe domain.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/domain_name.html
[DOMAIN_ORDER]
declaration=domain_name, (expr)[ ,expr ]...
category=Domain Functions
since=23
description=DOMAIN_ORDER returns expr formatted according to the domain's order expression.\nThis returns NULL if the arguments are not associated with a domain or the\ndomain has no order expression.\n\nWhen calling DOMAIN_ORDER for multicolumn domains, all values of expr should be\nfrom the same domain. It returns NULL if the number expr arguments are different\nfrom the number of domain columns or they are in a different order in the\ndomain.\n\nTo get the display expression for a non-domain value, cast expr to the domain\ntype. This is only possible for single column domains.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/domain_order.html
[DUMP]
declaration=expr[, return_fmt [, start_position [, length ] ] ]
category=Encoding and Decoding Functions
description=DUMP returns a VARCHAR2 value containing the data type code, length in bytes,\nand internal representation of expr. The returned result is always in the\ndatabase character set. For the data type corresponding to each code, see Table\n2-1.\n\nThe argument return_fmt specifies the format of the return value and can have\nany of the following values:\n\n- 8 returns result in octal notation.\n\n- 10 returns result in decimal notation.\n\n- 16 returns result in hexadecimal notation.\n\n- 17 returns each byte printed as a character if and only if it can be\ninterpreted as a printable character in the character set of the\ncompiler-typically ASCII or EBCDIC. Some ASCII control characters may be printed\nin the form ^X as well. Otherwise the character is printed in hexadecimal\nnotation. All NLS parameters are ignored. Do not depend on any particular output\nformat for DUMP with return_fmt 17.\n\nBy default, the return value contains no character set information. To retrieve\nthe character set name of expr, add 1000 to any of the preceding format values.\nFor example, a return_fmt of 1008 returns the result in octal and provides the\ncharacter set name of expr.\n\nThe arguments start_position and length combine to determine which portion of\nthe internal representation to return. The default is to return the entire\ninternal representation in decimal notation.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/DUMP.html
[EMPTY_BLOB]
declaration=
category=Large Object Functions
description=EMPTY_BLOB and EMPTY_CLOB return an empty LOB locator that can be used to\ninitialize a LOB variable or, in an INSERT or UPDATE statement, to initialize a\nLOB column or attribute to EMPTY. EMPTY means that the LOB is initialized, but\nnot populated with data.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EMPTY_BLOB-EMPTY_CLOB.html
[EMPTY_CLOB]
declaration=
category=Large Object Functions
description=EMPTY_BLOB and EMPTY_CLOB return an empty LOB locator that can be used to\ninitialize a LOB variable or, in an INSERT or UPDATE statement, to initialize a\nLOB column or attribute to EMPTY. EMPTY means that the LOB is initialized, but\nnot populated with data.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EMPTY_BLOB-EMPTY_CLOB.html
[EVERY]
declaration=[ DISTINCT | ALL ] boolean_expr
category=Aggregate Functions
since=23
description=EVERY returns 'TRUE' if the boolean_expr evaluates to true for every row that\nqualifies. Otherwise it returns 'FALSE'. You can use it as an aggregate or\nanalytic function. It is the same as the function BOOLEAN_AND_AGG.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/every.html
[EXISTSNODE]
declaration=XMLType_instance, XPath_string [, namespace_string ]
category=XML Functions
description=EXISTSNODE determines whether traversal of an XML document using a specified\npath results in any nodes. It takes as arguments the XMLType instance containing\nan XML document and a VARCHAR2 XPath string designating a path. The optional\nnamespace_string must resolve to a VARCHAR2 value that specifies a default\nmapping or namespace mapping for prefixes, which Oracle Database uses when\nevaluating the XPath expression(s).\n\nThe namespace_string argument defaults to the namespace of the root element. If\nyou refer to any subelement in Xpath_string, then you must specify\nnamespace_string, and you must specify the "who" prefix in both of these\narguments.\n\nThe return value is NUMBER:\n\n- 0 if no nodes remain after applying the XPath traversal on the document\n\n- 1 if any nodes remain\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EXISTSNODE.html
[EXP]
declaration=n
category=Numeric Functions
description=EXP returns e raised to the nth power, where e = 2.71828183... . The function\nreturns a value of the same type as the argument.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EXP.html
[EXTRACT1]
name=EXTRACT
declaration=XMLType_instance, XPath_string [, namespace_string ]
category=XML Functions
description=EXTRACT (XML) is similar to the EXISTSNODE function. It applies a VARCHAR2 XPath\nstring and returns an XMLType instance containing an XML fragment. You can\nspecify an absolute XPath_string with an initial slash or a relative\nXPath_string by omitting the initial slash. If you omit the initial slash, then\nthe context of the relative path defaults to the root node. The optional\nnamespace_string is required if the XML you are handling uses a namespace\nprefix. This argument must resolve to a VARCHAR2 value that specifies a default\nmapping or namespace mapping for prefixes, which Oracle Database uses when\nevaluating the XPath expression(s).\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EXTRACT-XML.html
[EXTRACT2]
name=EXTRACT
declaration={ YEAR | MONTH | DAY | HOUR | MINUTE | SECOND | TIMEZONE_HOUR | TIMEZONE_MINUTE | TIMEZONE_REGION | TIMEZONE_ABBR } FROM { expr }
category=Datetime Functions
description=EXTRACT extracts and returns the value of a specified datetime field from a\ndatetime or interval expression. The expr can be any expression that evaluates\nto a datetime or interval data type compatible with the requested field:\n\n- If YEAR or MONTH is requested, then expr must evaluate to an expression of\ndata type DATE, TIMESTAMP, TIMESTAMP WITH TIME ZONE, TIMESTAMP WITH LOCAL TIME\nZONE, or INTERVAL YEAR TO MONTH.\n\n- If DAY is requested, then expr must evaluate to an expression of data type\nDATE, TIMESTAMP, TIMESTAMP WITH TIME ZONE, TIMESTAMP WITH LOCAL TIME ZONE, or\nINTERVAL DAY TO SECOND.\n\n- If HOUR, MINUTE, or SECOND is requested, then expr must evaluate to an\nexpression of data type TIMESTAMP, TIMESTAMP WITH TIME ZONE, TIMESTAMP WITH\nLOCAL TIME ZONE, or INTERVAL DAY TO SECOND. DATE is not valid here, because\nOracle Database treats it as ANSI DATE data type, which has no time fields.\n\n- If TIMEZONE_HOUR, TIMEZONE_MINUTE, TIMEZONE_ABBR, TIMEZONE_REGION, or\nTIMEZONE_OFFSET is requested, then expr must evaluate to an expression of data\ntype TIMESTAMP WITH TIME ZONE or TIMESTAMP WITH LOCAL TIME ZONE.\n\nEXTRACT interprets expr as an ANSI datetime data type. For example, EXTRACT\ntreats DATE not as legacy Oracle DATE but as ANSI DATE, without time elements.\nTherefore, you can extract only YEAR, MONTH, and DAY from a DATE value.\nLikewise, you can extract TIMEZONE_HOUR and TIMEZONE_MINUTE only from the\nTIMESTAMP WITH TIME ZONE data type.\n\nWhen you specify TIMEZONE_REGION or TIMEZONE_ABBR (abbreviation), the value\nreturned is a VARCHAR2 string containing the appropriate time zone region name\nor abbreviation. When you specify any of the other datetime fields, the value\nreturned is an integer value of NUMBER data type representing the datetime value\nin the Gregorian calendar. When extracting from a datetime with a time zone\nvalue, the value returned is in UTC. For a listing of time zone region names and\ntheir corresponding abbreviations, query the V$TIMEZONE_NAMES dynamic\nperformance view.\n\nThis function can be very useful for manipulating datetime field values in very\nlarge tables, as shown in the first example below.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EXTRACT-datetime.html
[EXTRACTVALUE]
declaration=XMLType_instance, XPath_string [, namespace_string ]
category=XML Functions
description=The EXTRACTVALUE function takes as arguments an XMLType instance and an XPath\nexpression and returns a scalar value of the resultant node. The result must be\na single node and be either a text node, attribute, or element. If the result is\nan element, then the element must have a single text node as its child, and it\nis this value that the function returns. You can specify an absolute\nXPath_string with an initial slash or a relative XPath_string by omitting the\ninitial slash. If you omit the initial slash, the context of the relative path\ndefaults to the root node.\n\nIf the specified XPath points to a node with more than one child, or if the node\npointed to has a non-text node child, then Oracle returns an error. The optional\nnamespace_string must resolve to a VARCHAR2 value that specifies a default\nmapping or namespace mapping for prefixes, which Oracle uses when evaluating the\nXPath expression(s).\n\nFor documents based on XML schemas, if Oracle can infer the type of the return\nvalue, then a scalar value of the appropriate type is returned. Otherwise, the\nresult is of type VARCHAR2. For documents that are not based on XML schemas, the\nreturn type is always VARCHAR2.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/EXTRACTVALUE.html
[FEATURE_COMPARE]
declaration=[ schema . ] model mining_attribute_clause AND mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=The FEATURE_COMPARE function uses a Feature Extraction model to compare two\ndifferent documents, including short ones such as keyword phrases or two\nattribute lists, for similarity or dissimilarity. The FEATURE_COMPARE function\ncan be used with Feature Extraction algorithms such as Singular Value\nDecomposition (SVD), Principal Component Analysis PCA), Non-Negative Matrix\nFactorization (NMF), and Explicit Semantic Analysis (ESA). This function is\napplicable not only to documents, but also to numeric and categorical data.\n\nThe input to the FEATURE_COMPARE function is a single feature model built using\nthe Feature Extraction algorithms of Oracle Machine Learning for SQL, such as\nNMF, SVD, and ESA. The double USING clause provides a mechanism to compare two\ndifferent documents or constant keyword phrases, or any combination of the two,\nfor similarity or dissimilarity using the extracted features in the model.\n\nThe syntax of the FEATURE_COMPARE function can use an optional GROUPING hint\nwhen scoring a partitioned model. See GROUPING Hint.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FEATURE_COMPARE.html
[FEATURE_DETAILS]
declaration=[ schema . ] model [ , feature_id [ , topN ] ] [ DESC | ASC | ABS ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=FEATURE_DETAILS returns feature details for each row in the selection. The\nreturn value is an XML string that describes the attributes of the highest value\nfeature or the specified feature_id.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FEATURE_DETAILS.html
[FEATURE_ID]
declaration=[ schema . ] model mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=FEATURE_ID returns the identifier of the highest value feature for each row in\nthe selection. The feature identifier is returned as an Oracle NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FEATURE_ID.html
[FEATURE_SET]
declaration=[ schema . ] model [, topN [, cutoff ] ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=FEATURE_SET returns a set of feature ID and feature value pairs for each row in\nthe selection. The return value is a varray of objects with field names\nFEATURE_ID and VALUE. The data type of both fields is NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FEATURE_SET.html
[FEATURE_VALUE]
declaration=[ schema . ] model [, feature_id ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=FEATURE_VALUE returns a feature value for each row in the selection. The value\nrefers to the highest value feature or to the specified feature_id. The feature\nvalue is returned as BINARY_DOUBLE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FEATURE_VALUE.html
[FIRST_VALUE]
declaration=expr
category=Analytic Functions
description=FIRST_VALUE is an analytic function. It returns the first value in an ordered\nset of values. If the first value in the set is null, then the function returns\nNULL unless you specify IGNORE NULLS. This setting is useful for data\ndensification.\n\n{RESPECT | IGNORE} NULLS determines whether null values of expr are included in\nor eliminated from the calculation. The default is RESPECT NULLS. If you specify\nIGNORE NULLS, then FIRST_VALUE returns the first non-null value in the set, or\nNULL if all values are null. Refer to "Using Partitioned Outer Joins: Examples"\nfor an example of data densification.\n\nYou cannot nest analytic functions by using FIRST_VALUE or any other analytic\nfunction for expr. However, you can use other built-in function expressions for\nexpr. Refer to "About SQL Expressions" for information on valid forms of expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FIRST_VALUE.html
[FISCAL_ADD_DAYS]
declaration=dtexpr , num_periods [, fiscal_year_start] [ , nlsparam ]
category=Calendar Functions
since=23
description=The fiscal variants of this class of functions is equivalent to the definitions\nabove for calendar. The difference has to do with what constitutes a month. If\nthe fiscal year start is on the 1st of a month, these functions will return\nexactly the same value as their calendar counterparts. If the fiscal year start\nis not on the 1st, however, then they will diverge.\n\n- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- The num_periods parameter is an integer that when positive will add periods\nand when negative will subtract periods.\n\n- All fiscal functions take an optional fiscal_year_start parameter defining the\nmonth and day of the start of the fiscal year.\n\nIf the fiscal_year_start parameter is specified, it's an expression of type\nDATE, TIMESTAMP, TIMESTAMP WITH TIME ZONE, or TIMESTAMP WITH LOCAL TIME ZONE\nrepresenting the first day in the fiscal year. All components other than the\nmonth and day are ignored.\n\nIf the fiscal_year_start function argument is not specified, the value of the\nCALENDAR_FISCAL_YEAR_START system/session parameter is used (which itself\ndefaults to January 1 if not specified). The CALENDAR_FISCAL_YEAR_START\nsystem/session parameter is a text value that will be converted to a DATE using\nthe NLS_DATE_FORMAT. An optional second parameter value may be specified to use\nan explicit format, such as:\n\nFISCAL_ADD_YEARS adds or subtracts the given number of years, where a year is\nalways defined as a period of 12 months. See below for how months are handled.\n\nFISCAL_ADD_QUARTERS adds or subtracts the given number of quarters, where a\nquarter is always defined as a period of 3 months. See below for how months are\nhandled.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/fiscal_add_x_periods.html
