[FLOOR1]
name=FLOOR
declaration=datetime [ , fmt ]
category=Datetime Functions
since=23
description=FLOOR(datetime) returns the date or the timestamp rounded down to the unit\nspecified by the second argument fmt, the format model. This function is not\nsensitive to the NLS_CALENDAR session parameter. It operates according to the\nrules of the Gregorian calendar. The value returned is always of data type DATE,\neven if you specify a different datetime data type for the first argument. If\nyou do not specify the second argument, the default format model 'DD' is used.\n\nThe FLOOR and TRUNC functions are synonymous for dates and timestamps.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/floor-datetime.html
[FLOOR2]
name=FLOOR
declaration=n
category=Numeric Functions
description=FLOOR returns the largest integer equal to or less than n. The number n can\nalways be written as the sum of an integer k and a positive fraction f such that\n0 <= f < 1 and n = k + f. The value of FLOOR is the integer k. Thus, the value\nof FLOOR is n itself if and only if n is precisely an integer.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FLOOR.html
[FROM_TZ]
declaration=timestamp_value, time_zone_value
category=Datetime Functions
description=FROM_TZ converts a timestamp value and a time zone to a TIMESTAMP WITH TIME ZONE\nvalue. time_zone_value is a character string in the format 'TZH:TZM' or a\ncharacter expression that returns a string in TZR with optional TZD format.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/FROM_TZ.html
[FROM_VECTOR]
declaration=expr [ RETURNING (CLOB | VARCHAR2 [ (size [BYTE | CHAR]) ]) FORMAT (SPARSE | DENSE) ]
category=Vector Functions
since=23
description=FROM_VECTOR takes a vector as input and returns a string of type VARCHAR2 or\nCLOB as output.\n\nFROM_VECTOR optionally takes a RETURNING clause to specify the data type of the\nreturned value.\n\nIf VARCHAR2 is specified without size, the size of the returned value size is\n32767.\n\nYou can optionally specify the text format of the output in the FORMAT clause,\nusing the tokens SPARSE or DENSE. Note that the input vector storage format does\nnot need to match the specified output format.\n\nThere is no support to convert to CHAR, NCHAR, and NVARCHAR2.\n\nFROM_VECTOR is synonymous with VECTOR_SERIALIZE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/from_vector.html
[GREATEST]
declaration=expr [, expr ]...
category=General Comparison Functions
description=GREATEST returns the greatest of a list of one or more expressions. Oracle\nDatabase uses the first expr to determine the return type. If the first expr is\nnumeric, then Oracle determines the argument with the highest numeric\nprecedence, implicitly converts the remaining arguments to that data type before\nthe comparison, and returns that data type. If the first expr is not numeric,\nthen each expr after the first is implicitly converted to the data type of the\nfirst expr before the comparison.\n\nOracle Database compares each expr using nonpadded comparison semantics. The\ncomparison is binary by default and is linguistic if the NLS_COMP parameter is\nset to LINGUISTIC and the NLS_SORT parameter has a setting other than BINARY.\nCharacter comparison is based on the numerical codes of the characters in the\ndatabase character set and is performed on whole strings treated as one sequence\nof bytes, rather than character by character. If the value returned by this\nfunction is character data, then its data type is VARCHAR2 if the first expr is\na character data type and NVARCHAR2 if the first expr is a national character\ndata type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/GREATEST.html
[GROUPING]
declaration=expr
category=Aggregate Functions
description=GROUPING distinguishes superaggregate rows from regular grouped rows. GROUP BY\nextensions such as ROLLUP and CUBE produce superaggregate rows where the set of\nall values is represented by null. Using the GROUPING function, you can\ndistinguish a null representing the set of all values in a superaggregate row\nfrom a null in a regular row.\n\nThe expr in the GROUPING function must match one of the expressions in the GROUP\nBY clause. The function returns a value of 1 if the value of expr in the row is\na null representing the set of all values. Otherwise, it returns zero. The data\ntype of the value returned by the GROUPING function is Oracle NUMBER. Refer to\nthe SELECT group_by_clause for a discussion of these terms.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/GROUPING.html
[GROUPING_ID]
declaration=expr [, expr ]...
category=Aggregate Functions
description=GROUPING_ID returns a number corresponding to the GROUPING bit vector associated\nwith a row. GROUPING_ID is applicable only in a SELECT statement that contains a\nGROUP BY extension, such as ROLLUP or CUBE, and a GROUPING function. In queries\nwith many GROUP BY expressions, determining the GROUP BY level of a particular\nrow requires many GROUPING functions, which leads to cumbersome SQL. GROUPING_ID\nis useful in these cases.\n\nGROUPING_ID is functionally equivalent to taking the results of multiple\nGROUPING functions and concatenating them into a bit vector (a string of ones\nand zeros). By using GROUPING_ID you can avoid the need for multiple GROUPING\nfunctions and make row filtering conditions easier to express. Row filtering is\neasier with GROUPING_ID because the desired rows can be identified with a single\ncondition of GROUPING_ID = n. The function is especially useful when storing\nmultiple levels of aggregation in a single table.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/GROUPING_ID.html
[GROUP_ID]
declaration=
category=Aggregate Functions
description=GROUP_ID distinguishes duplicate groups resulting from a GROUP BY specification.\nIt is useful in filtering out duplicate groupings from the query result. It\nreturns an Oracle NUMBER to uniquely identify duplicate groups. This function is\napplicable only in a SELECT statement that contains a GROUP BY clause.\n\nIf n duplicates exist for a particular grouping, then GROUP_ID returns numbers\nin the range 0 to n-1.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/GROUP_ID.html
[HEXTORAW]
declaration=char
category=Conversion Functions
description=HEXTORAW converts char containing hexadecimal digits in the CHAR, VARCHAR2,\nNCHAR, or NVARCHAR2 data type to a raw value.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/HEXTORAW.html
[HOP]
declaration=([ schema . ] (table | view) | query_name), COLUMNS (datetime_column), slide, size [, offset ]
category=Streaming Windowing Table Functions
since=23
description=The HOP function assigns rows to fixed-size, time-based windows that start at\nregular slide intervals. When the slide is shorter than the window size, the\nwindows overlap and a row can belong to more than one window. When the slide is\nlonger than the window size, gaps can occur between windows.\n\nUse HOP when you need regularly advancing windows for rolling analysis of\ntime-based data.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/HOP.html
[INITCAP]
declaration=char
category=Character Functions Returning Character Values
description=INITCAP returns char, with the first letter of each word in uppercase, all other\nletters in lowercase. Words are delimited by white space or characters that are\nnot alphanumeric.\n\nchar can be of any of the data types CHAR, VARCHAR2, NCHAR, or NVARCHAR2. The\nreturn value is the same data type as char. The database sets the case of the\ninitial characters based on the binary mapping defined for the underlying\ncharacter set. For linguistic-sensitive uppercase and lowercase, refer to\nNLS_INITCAP.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/INITCAP.html
[INSTR]
declaration=string , substring [, position [, occurrence ] ]
category=Character Functions Returning Number Values
description=The INSTR functions search string for substring. The search operation is defined\nas comparing the substring argument with substrings of string of the same length\nfor equality until a match is found or there are no more substrings left. Each\nconsecutive compared substring of string begins one character to the right (for\nforward searches) or one character to the left (for backward searches) from the\nfirst character of the previous compared substring. If a substring that is equal\nto substring is found, then the function returns an integer indicating the\nposition of the first character of this substring. If no such substring is\nfound, then the function returns zero.\n\n- position is an nonzero integer indicating the character of string where Oracle\nDatabase begins the search-that is, the position of the first character of the\nfirst substring to compare with substring. If position is negative, then Oracle\ncounts backward from the end of string and then searches backward from the\nresulting position.\n\n- occurrence is an integer indicating which occurrence of substring in string\nOracle should search for. The value of occurrence must be positive. If\noccurrence is greater than 1, then the database does not return on the first\nmatch but continues comparing consecutive substrings of string, as described\nabove, until match number occurrence has been found.\n\nINSTR accepts and returns positions in characters as defined by the input\ncharacter set, with the first character of string having position 1. INSTRB uses\nbytes instead of characters. INSTRC uses Unicode complete characters. INSTR2\nuses UCS2 code points. INSTR4 uses UCS4 code points.\n\nstring can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are INSTRC, INSTR2, and INSTR4, which do not allow string\nto be a CLOB or NCLOB.\n\nsubstring can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB,\nor NCLOB.\n\nThe value returned is of NUMBER data type.\n\nBoth position and occurrence must be of data type NUMBER, or any data type that\ncan be implicitly converted to NUMBER, and must resolve to an integer. The\ndefault values of both position and occurrence are 1, meaning Oracle begins\nsearching at the first character of string for the first occurrence of\n...\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/INSTR.html
