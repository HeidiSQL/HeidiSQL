R data type.\n\nBoth position and occurrence must be of data type NUMBER, or any data type that\ncan be implicitly converted to NUMBER, and must resolve to an integer. The\ndefault values of both position and occurrence are 1, meaning Oracle begins\nsearching at the first character of string for the first occurrence of\n...\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/INSTR.html
[IS_UUID]
declaration=uuid_string [, version_specifier [, namespace, name]]
category=UUID Functions
since=23
description=IS_UUID checks whether the input argument is a valid UUID string. It returns\nTRUE when the input conforms to an accepted UUID format, FALSE otherwise, and\nNULL when the input is NULL.\n\nThe input can be in canonical form or specified as 32 hexadecimal characters. It\ncan be enclosed in braces. If the input is a string literal, enclose it in\nsingle quotation marks.\n\nWith one argument, IS_UUID accepts Version 4, Version 5, and Version 7 UUIDs in\nthe following formats:\n\nIn these formats:\n\nA string of 32 zeros that denotes a Nil UUID or 32 f characters that denotes a\nUniversal UUID is also accepted.\n\nTo check for a specific UUID version, specify IS_UUID(uuid_string,\nversion_specifier). The function returns TRUE if the input is a UUID of the\nspecified version and FALSE otherwise.\n\nFor Version 5, you can also specify IS_UUID(uuid_string, 5, namespace, name).\nThis form checks the UUID by using the namespace and name from which it was\ngenerated.\n\nThe following statement checks whether the input is a Version 4 UUID:\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/is_uuid.html
[JSON]
declaration=expr
category=JSON Functions
since=21
description=The JSON data type constructor, JSON, takes as input a textual JSON value (a\nscalar, object, or array), parses it, and returns the value as an instance of\nJSON type. Alternatively, the input can be an instance of SQL type VECTOR, a\nuser-defined PL/SQL type, or a SQL aggregate type.\n\nYou can use the JSON data type constructor JSON to parse textual JSON input ( a\nscalar, object, or array), and return it as an instance of type JSON.\n\nInput values must pass the IS JSON test. Input values that fail the IS JSON test\nare rejected with a syntax error.\n\nTo filter out duplicate input values, you must run the IS JSON (WITH UNIQUE\nKEYS) check on the textual JSON input before using the JSON constructor.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/json-type-constructor.html
[JSON_ARRAY]
declaration=JSON_ARRAY_content
category=JSON Functions
description=The SQL/JSON function JSON_ARRAY takes as its input a sequence of SQL scalar\nexpressions or one collection type instance, VARRAY or NESTED TABLE.\n\nIt converts each expression to a JSON value, and returns a JSON array that\ncontains those JSON values.\n\nIf an ADT has a member which is a collection than the type mapping creates a\nJSON object for the ADT with a nested JSON array for the collection member.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_ARRAY.html
[JSON_ARRAYAGG]
declaration=expr [ FORMAT JSON ] [ order_by_clause ] [ JSON_on_null_clause ] [ JSON_returning_clause ] [ STRICT ]
category=JSON Functions
description=The SQL/JSON function JSON_ARRAYAGG is an aggregate function. It takes as its\ninput a column of SQL expressions, converts each expression to a JSON value, and\nreturns a single JSON array that contains those JSON values.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_ARRAYAGG.html
[JSON_DATAGUIDE]
declaration=expr [ , format [ , flag ] ]
category=JSON Functions
description=The aggregate function JSON_DATAGUIDE computes the data guide of a set of JSON\ndata. The data guide is returned as a CLOB which can be in either flat or\nhierarchical format depending on the passing format parameter.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_DATAGUIDE.html
[JSON_OBJECT]
declaration=JSON_OBJECT_content
category=JSON Functions
description=The SQL/JSON function JSON_OBJECT takes as its input either a sequence of\nkey-value pairs or one object type instance. A collection type cannot be passed\nto JSON_OBJECT.\n\nIt returns a JSON object that contains an object member for each of those\nkey-value pairs.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_OBJECT.html
[JSON_OBJECTAGG]
declaration=[ KEY ] key_expr VALUE val_expr [ JSON_on_null_clause ] [ JSON_agg_returning_clause ] [ STRICT ] [ WITH UNIQUE KEYS ]
category=JSON Functions
description=The SQL/JSON function JSON_OBJECTAGG is an aggregate function. It takes as its\ninput a property key-value pair. Typically, the property key, the property\nvalue, or both are columns of SQL expressions. This function constructs an\nobject member for each key-value pair and returns a single JSON object that\ncontains those object members.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_OBJECTAGG.html
[JSON_QUERY]
declaration=expr [ FORMAT JSON ], JSON_basic_path_expression [ JSON_passing_clause ] [ JSON_query_returning_clause ] [ JSON_query_wrapper_clause ] [ JSON_query_quotes_clause ] [ JSON_query_on_error_clause ] [ JSON_query_on_empty_clause ] [ JSON_query_on_mismatch_clause ] [ TYPE ({ STRICT | LAX }) ]
category=JSON Functions
description=JSON_QUERY selects and returns one or more values from JSON data and returns\nthose values. You can use JSON_QUERY to retrieve fragments of a JSON document.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_QUERY.html
[JSON_SCALAR]
declaration=expr [ SQL | JSON ] [ NULL ON NULL ] [ NULL ON ERROR ] [ ERROR ON ERROR ] [ EMPTY STRING ON NULL ]
category=JSON Functions
since=21
description=JSON_SCALAR accepts a SQL scalar value as input and returns a corresponding JSON\nscalar value as a JSON type instance. The value can be an Oracle-specific\nJSON-language type, such as a date, which is not part of the JSON standard.\n\nTo use JSON_SCALAR you must set the database initialization parameter compatible\nis at least 20. Otherwise it raises an error.\n\nThe argument to JSON_SCALAR can be an instance of any of these SQL data types:\nBINARY_DOUBLE, BINARY_FLOAT, BLOB, CLOB, DATE, INTERVAL YEAR TO MONTH, INTERVAL\nDAY TO SECOND, JSON, NUMBER, RAW, TIMESTAMP, VARCHAR, VARCHAR2, or VECTOR.\n\nThe returned JSON type instance is a JSON-language scalar value supported by\nOracle.\n\nIf the argument to JSON_SCALAR is a SQL NULL value, then you can obtain a return\nvalue as follows:\n\n- SQL NULL, the default behavior\n\n- JSON null, using keywords NULL ON NULL\n\n- An empty JSON string, " ", using keywords EMPTY STRING ON NULL\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/json_scalar.html
[JSON_SERIALIZE]
declaration=expr [ JSON_returning_clause ] [ PRETTY ] [ ASCII ] [ ORDERED ] [ TRUNCATE ] [ { NULL | ERROR | EMPTY { ARRAY | OBJECT} } ON ERROR ]
category=JSON Functions
since=21
description=json_serialize takes JSON data of any SQL data type ( BLOB,CLOB, JSON, or\nVARCHAR2 ) as input and returns a textual representation of it. You typically\nuse it to transform the result of a query.\n\nYou can use json_serialize to convert binary JSON data to textual form (CLOB or\nVARCHAR2), or to transform textual JSON data by pretty-printing it or escaping\nnon-ASCII Unicode characters in it.\n\nWhen Oracle SQL function vector_serialize is applied to a JSON type instance,\nany non- standard Oracle scalar JSON value is returned as a standard JSON scalar\nvalue.\n\nWhen you apply vector_serialize to a VECTOR type instance, it returns a textual\nJSON array of numbers.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_SERIALIZE.html
[JSON_TABLE]
declaration=expr [ FORMAT JSON ] [ , JSON_basic_path_expression ] [ JSON_table_on_error_clause ] [ TYPE ({ STRICT | LAX }) ] [ JSON_table_on_empty_clause ] JSON_columns_clause
category=JSON Functions
description=The SQL/JSON function JSON_TABLE creates a relational view of JSON data. It maps\nthe result of a JSON data evaluation into relational rows and columns. You can\nquery the result returned by the function as a virtual relational table using\nSQL. The main purpose of JSON_TABLE is to create a row of relational data for\neach object inside a JSON array and output JSON values from within that object\nas individual SQL column values.\n\nYou must specify JSON_TABLE only in the FROM clause of a SELECT statement. The\nfunction first applies a path expression, called a SQL/JSON row path expression,\nto the supplied JSON data. The JSON value that matches the row path expression\nis called a row source in that it generates a row of relational data. The\nCOLUMNS clause evaluates the row source, finds specific JSON values within the\nrow source, and returns those JSON values as SQL values in individual columns of\na row of relational data.\n\nThe COLUMNS clause enables you to search for JSON values in different ways by\nusing the following clauses:\n\n- JSON_exists_column - Evaluates JSON data in the same manner as the JSON_EXISTS\ncondition, that is, determines if a specified JSON value exists, and returns\neither a VARCHAR2 column of values 'true' or 'false', or a NUMBER column of\nvalues 1 or 0.\n\n- JSON_query_column - Evaluates JSON data in the same manner as the JSON_QUERY\nfunction, that is, finds one or more specified JSON values, and returns a column\nof character strings that contain those JSON values.\n\n- JSON_value_column - Evaluates JSON data in the same manner as the JSON_VALUE\nfunction, that is, finds a specified scalar JSON value, and returns a column of\nthose JSON values as SQL values.\n\n- JSON_nested_path - Allows you to flatten JSON values in a nested JSON object\nor JSON array into individual columns in a single row along with JSON values\nfrom the parent object or array. You can use this clause recursively to project\ndata from multiple layers of nested objects or arrays into a single row.\n\n- ordinality_column - Returns a column of generated row numbers.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_TABLE.html
[JSON_TRANSFORM]
declaration=input_expr , operation [ , operation ]... [ TYPE ({ STRICT | LAX }) ] [ JSON_passing_clause ] [ JSON_TRANSFORM_returning_clause ]
category=JSON Functions
since=21
description=JSON_TRANSFORM modifies JSON documents. You specify operations to perform and\nSQL/JSON path expressions that target the places to modify. The operations are\napplied to the input data in the order specified: each operation acts on the\ndata that results from applying all of the preceding operations.\n\nJSON_TRANSFORM either succeeds completely or not at all. If any of the specified\noperations raises an error, then none of the operations take effect.\nJSON_TRANSFORM returns the original data changed according to the operations\nspecified.\n\nYou can use the JSON_TRANSFORM within the UPDATE statement to modify documents\nin a JSON column.\n\nYou can use it in a SELECT list, to modify the selected documents. The modified\ndocuments can be returned or processed further.\n\nJSON_TRANSFORM can accept as input, and return as output, any SQL data type that\nsupports JSON data: JSON, VARCHAR2, CLOB, or BLOB. Note that data type JSON is\navailable only if database initialization parameter compatible is 20 or greater.\n\nThe default return (output) data type is the same as the input data type.\n\nJSON_TRANSFORM Operations\n\n- Use ADD_SET to add missing value to an array, as if adding an element to a\nset.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_TRANSFORM.html
[JSON_VALUE]
declaration=expr [ FORMAT JSON ], JSON_basic_path_expression [ JSON_value_returning_clause ] [ JSON_value_on_error_clause ] [ JSON_value_on_empty_clause ] [ JSON_value_on_mismatch_clause ] [ TYPE ({ STRICT | LAX }) ]
category=JSON Functions
description=SQL/JSON function JSON_VALUE selects JSON data and returns a SQL scalar or an\ninstance of a user-defined SQL object type or SQL collection type (varray,\nnested table)\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/JSON_VALUE.html
[KURTOSIS_POP]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=The population kurtosis function KURTOSIS_POP is primarily used to determine the\ncharacteristics of outliers in a given distribution.\n\nNULL values in expr are ignored.\n\nReturns NULL if all rows in the group have NULL expr values.\n\nReturns 0 if there are one or two rows in expr.\n\nFor a given set of values, the result of population kurtosis (KURTOSIS_POP) and\nsample kurtosis (KURTOSIS_SAMP) are always deterministic. However, the values of\nKURTOSIS_POP and KURTOSIS_SAMP differ. As the number of values in the data set\nincreases, the difference between the computed values of KURTOSIS_SAMP and\nKURTOSIS_POP decreases.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/KURTOSIS_POP.html
[KURTOSIS_SAMP]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=The sample kurtosis function KURTOSIS_SAMP is primarily used to determine the\ncharacteristics of outliers in a given distribution.\n\nNULL values in expr are ignored.\n\nReturns NULL if all rows in the group have NULL expr values.\n\nReturns 0 if there are one or two rows in expr.\n\nFor a given set of values, the result of sample kurtosis (KURTOSIS_SAMP) and\npopulation kurtosis (KURTOSIS_POP) are always deterministic. However, the values\nof KURTOSIS_SAMP and KURTOSIS_POP differ. As the number of values in the data\nset increases, the difference between the computed values of KURTOSIS_SAMP and\nKURTOSIS_POP decreases.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/KURTOSIS_SAMP.html
[LAG]
declaration=value_expr [, offset [, default]]
category=Analytic Functions
description=LAG is an analytic function. It provides access to more than one row of a table\nat the same time without a self join. Given a series of rows returned from a\nquery and a position of the cursor, LAG provides access to a row at a given\nphysical offset prior to that position.\n\nFor the optional offset argument, specify an integer that is greater than zero.\nIf you do not specify offset, then its default is 1. The optional default value\nis returned if the offset goes beyond the scope of the window. If you do not\nspecify default, then its default is null.\n\n{RESPECT | IGNORE} NULLS determines whether null values of value_expr are\nincluded in or eliminated from the calculation. The default is RESPECT NULLS.\n\nYou cannot nest analytic functions by using LAG or any other analytic function\nfor value_expr. However, you can use other built-in function expressions for\nvalue_expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LAG.html
[LAST_DAY]
declaration=date
category=Datetime Functions
description=LAST_DAY returns the date of the last day of the month that contains date. The\nlast day of the month is defined by the session parameter NLS_CALENDAR. The\nreturn type is always DATE, regardless of the data type of date.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LAST_DAY.html
[LAST_VALUE]
declaration=expr
category=Analytic Functions
description=LAST_VALUE is an analytic function that is useful for data densification. It\nreturns the last value in an ordered set of values.\n\n{RESPECT | IGNORE} NULLS determines whether null values of expr are included in\nor eliminated from the calculation. The default is RESPECT NULLS. If the last\nvalue in the set is null, then the function returns NULL unless you specify\nIGNORE NULLS. If you specify IGNORE NULLS, then LAST_VALUE returns the last\nnon-null value in the set, or NULL if all values are null. Refer to "Using\nPartitioned Outer Joins: Examples" for an example of data densification.\n\nYou cannot nest analytic functions by using LAST_VALUE or any other analytic\nfunction for expr. However, you can use other built-in function expressions for\nexpr. Refer to "About SQL Expressions" for information on valid forms of expr.\n\nIf you omit the windowing_clause of the analytic_clause, it defaults to RANGE\nBETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. This default sometimes returns an\nunexpected value, because the last value in the window is at the bottom of the\nwindow, which is not fixed. It keeps changing as the current row changes. For\nexpected results, specify the windowing_clause as RANGE BETWEEN UNBOUNDED\nPRECEDING AND UNBOUNDED FOLLOWING. Alternatively, you can specify the\nwindowing_clause as RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LAST_VALUE.html
[LEAD]
declaration=value_expr [, offset [, default]]
category=Analytic Functions
description=LEAD is an analytic function. It provides access to more than one row of a table\nat the same time without a self join. Given a series of rows returned from a\nquery and a position of the cursor, LEAD provides access to a row at a given\nphysical offset beyond that position.\n\nIf you do not specify offset, then its default is 1. The optional default value\nis returned if the offset goes beyond the scope of the table. If you do not\nspecify default, then its default value is null.\n\n{RESPECT | IGNORE} NULLS determines whether null values of value_expr are\nincluded in or eliminated from the calculation. The default is RESPECT NULLS.\n\nYou cannot nest analytic functions by using LEAD or any other analytic function\nfor value_expr. However, you can use other built-in function expressions for\nvalue_expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LEAD.html
[LEAST]
declaration=expr [, expr ]...
category=General Comparison Functions
description=LEAST returns the least of a list of one or more expressions. Oracle Database\nuses the first expr to determine the return type. If the first expr is numeric,\nthen Oracle determines the argument with the highest numeric precedence,\nimplicitly converts the remaining arguments to that data type before the\ncomparison, and returns that data type. If the first expr is not numeric, then\neach expr after the first is implicitly converted to the data type of the first\nexpr before the comparison.\n\nOracle Database compares each expr using nonpadded comparison semantics. The\ncomparison is binary by default and is linguistic if the NLS_COMP parameter is\nset to LINGUISTIC and the NLS_SORT parameter has a setting other than BINARY.\nCharacter comparison is based on the numerical codes of the characters in the\ndatabase character set and is performed on whole strings treated as one sequence\nof bytes, rather than character by character. If the value returned by this\nfunction is character data, then its data type is VARCHAR2 if the first expr is\na character data type and NVARCHAR2 if the first expr is a national character\ndata type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LEAST.html
[LENGTH]
declaration=char
category=Character Functions Returning Number Values
description=The LENGTH functions return the length of char. LENGTH calculates length using\ncharacters as defined by the input character set. LENGTHB uses bytes instead of\ncharacters. LENGTHC uses Unicode complete characters. LENGTH2 uses UCS2 code\npoints. LENGTH4 uses UCS4 code points.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are LENGTHC, LENGTH2, and LENGTH4, which do not allow char\nto be a CLOB or NCLOB. The return value is of data type NUMBER. If char has data\ntype CHAR, then the length includes all trailing blanks. If char is null, then\nthis function returns null.\n\nFor more on character length see the following:\n\n- Oracle Database Globalization Support Guide\n\n- Oracle Database SecureFiles and Large Objects Developer's Guide\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LENGTH.html
[LENGTH2]
declaration=char
category=Character Functions Returning Number Values
description=The LENGTH functions return the length of char. LENGTH calculates length using\ncharacters as defined by the input character set. LENGTHB uses bytes instead of\ncharacters. LENGTHC uses Unicode complete characters. LENGTH2 uses UCS2 code\npoints. LENGTH4 uses UCS4 code points.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are LENGTHC, LENGTH2, and LENGTH4, which do not allow char\nto be a CLOB or NCLOB. The return value is of data type NUMBER. If char has data\ntype CHAR, then the length includes all trailing blanks. If char is null, then\nthis function returns null.\n\nFor more on character length see the following:\n\n- Oracle Database Globalization Support Guide\n\n- Oracle Database SecureFiles and Large Objects Developer's Guide\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LENGTH.html
[LENGTH4]
declaration=char
category=Character Functions Returning Number Values
description=The LENGTH functions return the length of char. LENGTH calculates length using\ncharacters as defined by the input character set. LENGTHB uses bytes instead of\ncharacters. LENGTHC uses Unicode complete characters. LENGTH2 uses UCS2 code\npoints. LENGTH4 uses UCS4 code points.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are LENGTHC, LENGTH2, and LENGTH4, which do not allow char\nto be a CLOB or NCLOB. The return value is of data type NUMBER. If char has data\ntype CHAR, then the length includes all trailing blanks. If char is null, then\nthis function returns null.\n\nFor more on character length see the following:\n\n- Oracle Database Globalization Support Guide\n\n- Oracle Database SecureFiles and Large Objects Developer's Guide\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LENGTH.html
[LENGTHB]
declaration=char
category=Character Functions Returning Number Values
description=The LENGTH functions return the length of char. LENGTH calculates length using\ncharacters as defined by the input character set. LENGTHB uses bytes instead of\ncharacters. LENGTHC uses Unicode complete characters. LENGTH2 uses UCS2 code\npoints. LENGTH4 uses UCS4 code points.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are LENGTHC, LENGTH2, and LENGTH4, which do not allow char\nto be a CLOB or NCLOB. The return value is of data type NUMBER. If char has data\ntype CHAR, then the length includes all trailing blanks. If char is null, then\nthis function returns null.\n\nFor more on character length see the following:\n\n- Oracle Database Globalization Support Guide\n\n- Oracle Database SecureFiles and Large Objects Developer's Guide\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LENGTH.html
[LENGTHC]
declaration=char
category=Character Functions Returning Number Values
description=The LENGTH functions return the length of char. LENGTH calculates length using\ncharacters as defined by the input character set. LENGTHB uses bytes instead of\ncharacters. LENGTHC uses Unicode complete characters. LENGTH2 uses UCS2 code\npoints. LENGTH4 uses UCS4 code points.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are LENGTHC, LENGTH2, and LENGTH4, which do not allow char\nto be a CLOB or NCLOB. The return value is of data type NUMBER. If char has data\ntype CHAR, then the length includes all trailing blanks. If char is null, then\nthis function returns null.\n\nFor more on character length see the following:\n\n- Oracle Database Globalization Support Guide\n\n- Oracle Database SecureFiles and Large Objects Developer's Guide\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LENGTH.html
[LISTAGG]
declaration=[ ALL | DISTINCT ] measure_expr [, ' delimiter ' ] [ listagg_overflow_clause ]
category=Aggregate Functions
description=For a specified measure, LISTAGG orders data within each group specified in the\nORDER BY clause and then concatenates the values of the measure column.\n\n- As a single-set aggregate function, LISTAGG operates on all rows and returns a\nsingle output row.\n\n- As a group-set aggregate, the function operates on and returns an output row\nfor each group defined by the GROUP BY clause.\n\n- As an analytic function, LISTAGG partitions the query result set into groups\nbased on one or more expression in the query_partition_clause.\n\nThe arguments to the function are subject to the following rules:\n\n- The ALL keyword is optional and is provided for semantic clarity.\n\n- The measure_expr is the measure column and can be any expression. Null values\nin the measure column are ignored.\n\n- The delimiter designates the string that is to separate the measure column\nvalues. This clause is optional and defaults to NULL.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LISTAGG.html
[LN]
declaration=n
category=Numeric Functions
description=LN returns the natural logarithm of n, where n is greater than 0.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LN.html
[LNNVL]
declaration=condition
category=NULL-Related Functions
description=LNNVL provides a concise way to evaluate a condition when one or both operands\nof the condition may be null. The function can be used in the WHERE clause of a\nquery, or as the WHEN condition in a searched CASE expression. It takes as an\nargument a condition and returns TRUE if the condition is FALSE or UNKNOWN and\nFALSE if the condition is TRUE. LNNVL can be used anywhere a scalar expression\ncan appear, even in contexts where the IS [NOT] NULL, AND, or OR conditions are\nnot valid but would otherwise be required to account for potential nulls.\n\nOracle Database sometimes uses the LNNVL function internally in this way to\nrewrite NOT IN conditions as NOT EXISTS conditions. In such cases, output from\nEXPLAIN PLAN shows this operation in the plan table output. The condition can\nevaluate any scalar values but cannot be a compound condition containing AND,\nOR, or BETWEEN.\n\nThe table that follows shows what LNNVL returns given that a = 2 and b is null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LNNVL.html
[LOG]
declaration=n2, n1
category=Numeric Functions
description=LOG returns the logarithm, base n2, of n1. The base n2 can be any positive value\nother than 0 or 1 and n1 can be any positive value.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If any argument is\nBINARY_FLOAT or BINARY_DOUBLE, then the function returns BINARY_DOUBLE.\nOtherwise the function returns NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LOG.html
[LOWER]
declaration=char
category=Character Functions Returning Character Values
description=LOWER returns char, with all letters lowercase. char can be any of the data\ntypes CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or NCLOB. The return value is the\nsame data type as char. The database sets the case of the characters based on\nthe binary mapping defined for the underlying character set. For\nlinguistic-sensitive lowercase, refer to NLS_LOWER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LOWER.html
[LPAD]
declaration=expr1, n [, expr2 ]
category=Character Functions Returning Character Values
description=LPAD returns expr1, left-padded to length n characters with the sequence of\ncharacters in expr2. This function is useful for formatting the output of a\nquery.\n\nBoth expr1 and expr2 can be any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. The string returned is of VARCHAR2 data type if expr1\nis a character data type, NVARCHAR2 if expr1 is a national character data type,\nand a LOB if expr1 is a LOB data type. The string returned is in the same\ncharacter set as expr1. The argument n must be a NUMBER integer or a value that\ncan be implicitly converted to a NUMBER integer.\n\nIf you do not specify expr2, then the default is a single blank. If expr1 is\nlonger than n, then this function returns the portion of expr1 that fits in n.\n\nThe argument n is the total length of the return value as it is displayed on\nyour terminal screen. In most character sets, this is also the number of\ncharacters in the return value. However, in some multibyte character sets, the\ndisplay length of a character string can differ from the number of characters in\nthe string.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LPAD.html
[LTRIM]
declaration=char [, set ]
category=Character Functions Returning Character Values
description=LTRIM removes from the left end of char all of the characters contained in set.\nIf you do not specify set, then it defaults to a single blank. Oracle Database\nbegins scanning char from its first character and removes all characters that\nappear in set until reaching a character not in set and then returns the result.\n\nBoth char and set can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2,\nCLOB, or NCLOB. The string returned is of VARCHAR2 data type if char is a\ncharacter data type, NVARCHAR2 if char is a national character data type, and a\nLOB if char is a LOB data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/LTRIM.html
[MAKE_REF]
declaration={ table | view } , key [, key ]...
category=Object Reference Functions
description=MAKE_REF creates a REF to a row of an object view or a row in an object table\nwhose object identifier is primary key based. This function is useful, for\nexample, if you are creating an object view\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MAKE_REF.html
[MAX]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
description=MAX returns maximum value of expr. You can use it as an aggregate or analytic\nfunction.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MAX.html
[MEDIAN]
declaration=expr
category=Aggregate Functions
description=MEDIAN is an inverse distribution function that assumes a continuous\ndistribution model. It takes a numeric or datetime value and returns the middle\nvalue or an interpolated value that would be the middle value once the values\nare sorted. Nulls are ignored in the calculation.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If you specify\nonly expr, then the function returns the same data type as the numeric data type\nof the argument. If you specify the OVER clause, then Oracle Database determines\nthe argument with the highest numeric precedence, implicitly converts the\nremaining arguments to that data type, and returns that data type.\n\nThe result of MEDIAN is computed by first ordering the rows. Using N as the\nnumber of rows in the group, Oracle calculates the row number (RN) of interest\nwith the formula RN = (1 + (0.5*(N-1)). The final result of the aggregate\nfunction is computed by linear interpolation between the values from rows at row\nnumbers CRN = CEILING(RN) and FRN = FLOOR(RN).\n\nThe final result will be:\n\nYou can use MEDIAN as an analytic function. You can specify only the\nquery_partition_clause in its OVER clause. It returns, for each row, the value\nthat would fall in the middle among a set of values within each partition.\n\nCompare this function with these functions:\n\n- PERCENTILE_CONT, which returns, for a given percentile, the value that\ncorresponds to that percentile by way of interpolation. MEDIAN is the specific\ncase of PERCENTILE_CONT where the percentile value defaults to 0.5.\n\n- PERCENTILE_DISC, which is useful for finding values for a given percentile\nwithout interpolation.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MEDIAN.html
[MIN]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
description=MIN returns minimum value of expr. You can use it as an aggregate or analytic\nfunction.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MIN.html
[MOD]
declaration=n2, n1
category=Numeric Functions
description=MOD returns the remainder of n2 divided by n1. Returns n2 if n1 is 0.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. Oracle determines\nthe argument with the highest numeric precedence, implicitly converts the\nremaining arguments to that data type, and returns that data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MOD.html
[MONTHS_BETWEEN]
declaration=date1, date2
category=Datetime Functions
description=MONTHS_BETWEEN returns number of months between dates date1 and date2. The month\nand the last day of the month are defined by the parameter NLS_CALENDAR. If\ndate1 is later than date2, then the result is positive. If date1 is earlier than\ndate2, then the result is negative. If date1 and date2 are either the same days\nof the month or both last days of months, then the result is always an integer.\nOtherwise Oracle Database calculates the fractional portion of the result based\non a 31-day month and considers the difference in time components date1 and\ndate2.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/MONTHS_BETWEEN.html
[NANVL]
declaration=n2, n1
category=Numeric Functions
description=The NANVL function is useful only for floating-point numbers of type\nBINARY_FLOAT or BINARY_DOUBLE. It instructs Oracle Database to return an\nalternative value n1 if the input value n2 is NaN (not a number). If n2 is not\nNaN, then Oracle returns n2.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. Oracle determines\nthe argument with the highest numeric precedence, implicitly converts the\nremaining arguments to that data type, and returns that data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NANVL.html
[NCHR]
declaration=number
category=Character Functions Returning Character Values
description=NCHR returns the character having the binary equivalent to number in the\nnational character set. The value returned is always NVARCHAR2. This function is\nequivalent to using the CHR function with the USING NCHAR_CS clause.\n\nThis function takes as an argument a NUMBER value, or any value that can be\nimplicitly converted to NUMBER, and returns a character.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NCHR.html
[NEW_TIME]
declaration=date, timezone1, timezone2
category=Datetime Functions
description=NEW_TIME returns the date and time in time zone timezone2 when date and time in\ntime zone timezone1 are date. Before using this function, you must set the\nNLS_DATE_FORMAT parameter to display 24-hour time. The return type is always\nDATE, regardless of the data type of date.\n\nThe arguments timezone1 and timezone2 can be any of these text strings:\n\n- AST, ADT: Atlantic Standard or Daylight Time\n\n- BST, BDT: Bering Standard or Daylight Time\n\n- CST, CDT: Central Standard or Daylight Time\n\n- EST, EDT: Eastern Standard or Daylight Time\n\n- GMT: Greenwich Mean Time\n\n- HST, HDT: Alaska-Hawaii Standard Time or Daylight Time.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NEW_TIME.html
[NEXT_DAY]
declaration=date, char
category=Datetime Functions
description=NEXT_DAY returns the date of the first weekday named by char that is later than\nthe date date. The return type is always DATE, regardless of the data type of\ndate. The argument char must be a day of the week in the date language of your\nsession, either the full name or the abbreviation. The minimum number of letters\nrequired is the number of letters in the abbreviated version. Any characters\nimmediately following the valid abbreviation are ignored. The return value has\nthe same hours, minutes, and seconds component as the argument date.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NEXT_DAY.html
[NLSSORT]
declaration=char [, 'nlsparam' ]
category=Character Functions Returning Character Values
description=NLSSORT returns a collation key for the character value char and an explicitly\nor implicitly specified collation. A collation key is a string of bytes used to\nsort char according to the specified collation. The property of the collation\nkeys is that mutual ordering of two such keys generated for the given collation\nwhen compared according to their binary order is the same as mutual ordering of\nthe source character values when compared according to the given collation.\n\nBoth char and 'nlsparam' can be any of the data types CHAR, VARCHAR2, NCHAR, or\nNVARCHAR2.\n\nThe value of 'nlsparam' must have the form\n\nwhere collation is the name of a linguistic collation or BINARY. NLSSORT uses\nthe specified collation to generate the collation key. If you omit 'nlsparam',\nthen this function uses the derived collation of the argument char. If you\nspecify BINARY, then this function returns the char value itself cast to RAW and\npossibly truncated as described below.\n\nIf you specify 'nlsparam', then you can append to the linguistic collation name\nthe suffix _ai to request an accent-insensitive collation or _ci to request a\ncase-insensitive collation. Refer to Oracle Database Globalization Support Guide\nfor more information on accent- and case-insensitive sorting. Using\naccent-insensitive or case-insensitive collations with the ORDER BY query clause\nis not recommended as it leads to a nondeterministic sort order.\n\nThe returned collation key is of RAW data type. The length of the collation key\nresulting from a given char value for a given collation may exceed the maximum\nlength of the RAW value returned by NLSSORT. In this case, the behavior of\nNLSSORT depends on the value of the initialization parameter MAX_STRING_SIZE. If\nMAX_STRING_SIZE = EXTENDED, then the maximum length of the return value is 32767\nbytes. If the collation key exceeds this limit, then the function fails with the\nerror "ORA-12742: unable to create the collation key". This error may also be\nreported for short input strings if they contain a high percentage of Unicode\ncharacters with very high decomposition ratios.\n\nIf MAX_STRING_SIZE = STANDARD, then the maximum length of the return value is\n2000 bytes. If the value to be returned exceeds the limit, then NLSSORT\ncalculates the collation key for a maximum prefix, or initial substring, of char\nso that the calculated result does not exceed the maximum length. For\nmonolingual collations, for example FRENCH, the prefix length is typically 1000\n...\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLSSORT.html
[NLS_CHARSET_DECL_LEN]
declaration=byte_count, char_set_id
category=Character Set Functions
description=NLS_CHARSET_DECL_LEN returns the declaration length (in number of characters) of\nan NCHAR column. The byte_count argument is the width of the column. The\nchar_set_id argument is the character set ID of the column.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_CHARSET_DECL_LEN.html
[NLS_CHARSET_ID]
declaration=string
category=Character Set Functions
description=NLS_CHARSET_ID returns the character set ID number corresponding to character\nset name string. The string argument is a run-time VARCHAR2 value. The string\nvalue 'CHAR_CS' returns the database character set ID number of the server. The\nstring value 'NCHAR_CS' returns the national character set ID number of the\nserver.\n\nInvalid character set names return null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_CHARSET_ID.html
[NLS_CHARSET_NAME]
declaration=number
category=Character Set Functions
description=NLS_CHARSET_NAME returns the name of the character set corresponding to ID\nnumber number. The character set name is returned as a VARCHAR2 value in the\ndatabase character set. If number is not recognized as a valid character set ID,\nthen this function returns null.\n\nThis function returns a VARCHAR2 value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_CHARSET_NAME.html
[NLS_COLLATION_ID]
declaration=expr
category=Collation Functions
description=NLS_COLLATION_ID takes as its argument a collation name and returns the\ncorresponding collation ID number. Collation IDs are used in the data dictionary\ntables and in Oracle Call Interface (OCI). Collation names are used in SQL\nstatements and data dictionary views\n\nFor expr, specify the collation name as a VARCHAR2 value. You can specify a\nvalid named collation or a pseudo-collation, in any combination of uppercase and\nlowercase letters.\n\nThis function returns a NUMBER value. If you specify an invalid collation name,\nthen this function returns null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_COLLATION_ID.html
[NLS_COLLATION_NAME]
declaration=expr [, flag ]
category=Collation Functions
description=NLS_COLLATION_NAME takes as its argument a collation ID number and returns the\ncorresponding collation name. Collation IDs are used in the data dictionary\ntables and in Oracle Call Interface (OCI). Collation names are used in SQL\nstatements and data dictionary views\n\nFor expr, specify the collation ID as a NUMBER value.\n\nThis function returns a VARCHAR2 value. If you specify an invalid collation ID,\nthen this function returns null.\n\nThe optional flag parameter applies only to Unicode Collation Algorithm (UCA)\ncollations. This parameter determines whether the function returns the short\nform or long form of the collation name. The parameter must be a character\nexpression evaluating to the value 'S', 's', 'L', or 'l', with the following\nmeaning:\n\n- 'S' or 's' - Returns the short form of the collation name\n\n- 'L' or 'l' - Returns the long form of the collation name\n\nIf you omit flag, then the default is 'L'.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_COLLATION_NAME.html
[NLS_INITCAP]
declaration=char [, 'nlsparam' ]
category=Character Functions Returning Character Values
description=NLS_INITCAP returns char, with the first letter of each word in uppercase, all\nother letters in lowercase. Words are delimited by white space or characters\nthat are not alphanumeric.\n\nBoth char and 'nlsparam' can be any of the data types CHAR, VARCHAR2, NCHAR, or\nNVARCHAR2. The string returned is of VARCHAR2 data type and is in the same\ncharacter set as char.\n\nThe value of 'nlsparam' can have this form:\n\nwhere sort is a named collation. The collation handles special linguistic\nrequirements for case conversions. These requirements can result in a return\nvalue of a different length than the char. If you omit 'nlsparam', then this\nfunction uses the determined collation of the function.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_INITCAP.html
[NLS_LOWER]
declaration=char [, 'nlsparam' ]
category=Character Functions Returning Character Values
description=NLS_LOWER returns char, with all letters lowercase.\n\nBoth char and 'nlsparam' can be any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. The string returned is of VARCHAR2 data type if char\nis a character data type and a LOB if char is a LOB data type. The return string\nis in the same character set as char.\n\nThe 'nlsparam' can have the same form and serve the same purpose as in the\nNLS_INITCAP function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_LOWER.html
[NLS_UPPER]
declaration=char [, 'nlsparam' ]
category=Character Functions Returning Character Values
description=NLS_UPPER returns char, with all letters uppercase.\n\nBoth char and 'nlsparam' can be any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. The string returned is of VARCHAR2 data type if char\nis a character data type and a LOB if char is a LOB data type. The return string\nis in the same character set as char.\n\nThe 'nlsparam' can have the same form and serve the same purpose as in the\nNLS_INITCAP function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NLS_UPPER.html
[NTH_VALUE]
declaration=measure_expr, n
category=Analytic Functions
description=NTH_VALUE returns the measure_expr value of the nth row in the window defined by\nthe analytic_clause. The returned value has the data type of the measure_expr.\n\n- {RESPECT \ IGNORE} NULLS determines whether null values of measure_expr are\nincluded in or eliminated from the calculation. The default is RESPECT NULLS.\n\n- n determines the nth row for which the measure value is to be returned. n can\nbe a constant, bind variable, column, or an expression involving them, as long\nas it resolves to a positive integer. The function returns NULL if the data\nsource window has fewer than n rows. If n is null, then the function returns an\nerror.\n\n- FROM {FIRST \ LAST} determines whether the calculation begins at the first or\nlast row of the window. The default is FROM FIRST.\n\nIf you omit the windowing_clause of the analytic_clause, it defaults to RANGE\nBETWEEN UNBOUNDED PRECEDING AND CURRENT ROW. This default sometimes returns an\nunexpected value for NTH_VALUE ... FROM LAST ... , because the last value in the\nwindow is at the bottom of the window, which is not fixed. It keeps changing as\nthe current row changes. For expected results, specify the windowing_clause as\nRANGE BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING. Alternatively, you\ncan specify the windowing_clause as RANGE BETWEEN CURRENT ROW AND UNBOUNDED\nFOLLOWING.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NTH_VALUE.html
[NTILE]
declaration=expr
category=Analytic Functions
description=NTILE is an analytic function. It divides an ordered data set into a number of\nbuckets indicated by expr and assigns the appropriate bucket number to each row.\nThe buckets are numbered 1 through expr. The expr value must resolve to a\npositive constant for each partition. Oracle Database expects an integer, and if\nexpr is a noninteger constant, then Oracle truncates the value to an integer.\nThe return value is NUMBER.\n\nThe number of rows in the buckets can differ by at most 1. The remainder values\n(the remainder of number of rows divided by buckets) are distributed one for\neach bucket, starting with bucket 1.\n\nIf expr is greater than the number of rows, then a number of buckets equal to\nthe number of rows will be filled, and the remaining buckets will be empty.\n\nYou cannot nest analytic functions by using NTILE or any other analytic function\nfor expr. However, you can use other built-in function expressions for expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NTILE.html
[NULLIF]
declaration=expr1, expr2
category=NULL-Related Functions
description=NULLIF compares expr1 and expr2. If they are equal, then the function returns\nnull. If they are not equal, then the function returns expr1. You cannot specify\nthe literal NULL for expr1.\n\nIf both arguments are numeric data types, then Oracle Database determines the\nargument with the higher numeric precedence, implicitly converts the other\nargument to that data type, and returns that data type. If the arguments are not\nnumeric, then they must be of the same data type, or Oracle returns an error.\n\nThe NULLIF function is logically equivalent to the following CASE expression:\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NULLIF.html
[NUMTODSINTERVAL]
declaration=n, 'interval_unit'
category=Datetime Functions
description=NUMTODSINTERVAL converts n to an INTERVAL DAY TO SECOND literal. The argument n\ncan be any NUMBER value or an expression that can be implicitly converted to a\nNUMBER value. The argument interval_unit can be of CHAR, VARCHAR2, NCHAR, or\nNVARCHAR2 data type. The value for interval_unit specifies the unit of n and\nmust resolve to one of the following string values:\n\n- 'DAY'\n\n- 'HOUR'\n\n- 'MINUTE'\n\n- 'SECOND'\n\ninterval_unit is case insensitive. Leading and trailing values within the\nparentheses are ignored. By default, the precision of the return is 9.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NUMTODSINTERVAL.html
[NUMTOYMINTERVAL]
declaration=n, 'interval_unit'
category=Datetime Functions
description=NUMTOYMINTERVAL converts number n to an INTERVAL YEAR TO MONTH literal. The\nargument n can be any NUMBER value or an expression that can be implicitly\nconverted to a NUMBER value. The argument interval_unit can be of CHAR,\nVARCHAR2, NCHAR, or NVARCHAR2 data type. The value for interval_unit specifies\nthe unit of n and must resolve to one of the following string values:\n\n- 'YEAR'\n\n- 'MONTH'\n\ninterval_unit is case insensitive. Leading and trailing values within the\nparentheses are ignored. By default, the precision of the return is 9.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NUMTOYMINTERVAL.html
[NVL]
declaration=expr1, expr2
category=NULL-Related Functions
description=NVL lets you replace null (returned as a blank) with a string in the results of\na query. If expr1 is null, then NVL returns expr2. If expr1 is not null, then\nNVL returns expr1.\n\nThe arguments expr1 and expr2 can have any data type. If their data types are\ndifferent, then Oracle Database implicitly converts one to the other. If they\ncannot be converted implicitly, then the database returns an error. The implicit\nconversion is implemented as follows:\n\n- If expr1 is character data, then Oracle Database converts expr2 to the data\ntype of expr1 before comparing them and returns VARCHAR2 in the character set of\nexpr1.\n\n- If expr1 is numeric, then Oracle Database determines which argument has the\nhighest numeric precedence, implicitly converts the other argument to that data\ntype, and returns that data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NVL.html
[NVL2]
declaration=expr1, expr2, expr3
category=NULL-Related Functions
description=NVL2 lets you determine the value returned by a query based on whether a\nspecified expression is null or not null. If expr1 is not null, then NVL2\nreturns expr2. If expr1 is null, then NVL2 returns expr3.\n\nThe argument expr1 can have any data type. The arguments expr2 and expr3 can\nhave any data types except LONG.\n\nIf the data types of expr2 and expr3 are different, then Oracle Database\nimplicitly converts one to the other. If they cannot be converted implicitly,\nthen the database returns an error. If expr2 is character or numeric data, then\nthe implicit conversion is implemented as follows:\n\n- If expr2 is character data, then Oracle Database converts expr3 to the data\ntype of expr2 before returning a value unless expr3 is a null constant. In that\ncase, a data type conversion is not necessary, and the database returns VARCHAR2\nin the character set of expr2.\n\n- If expr2 is numeric data, then Oracle Database determines which argument has\nthe highest numeric precedence, implicitly converts the other argument to that\ndata type, and returns that data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NVL2.html
[ORA_DM_PARTITION_NAME]
declaration=[ schema . ] model mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=ORA_DM_PARTITION_NAME is a single row function that works along with other\nexisting functions. This function returns the name of the partition associated\nwith the input row. When ORA_DM_PARTITION_NAME is used on a non-partitioned\nmodel, the result is NULL.\n\nThe syntax of the ORA_DM_PARTITION_NAME function can use an optional GROUPING\nhint when scoring a partitioned model. See GROUPING Hint.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ORA_DM_PARTITION_NAME.html
[ORA_DST_AFFECTED]
declaration=datetime_expr
category=Datetime Functions
description=ORA_DST_AFFECTED is useful when you are changing the time zone data file for\nyour database. The function takes as an argument a datetime expression that\nresolves to a TIMESTAMP WITH TIME ZONE value or a VARRAY object that contains\nTIMESTAMP WITH TIME ZONE values. The function returns 1 if the datetime value is\naffected by or will result in a "nonexisting time" or "duplicate time" error\nwith the new time zone data. Otherwise, it returns 0.\n\nThis function can be issued only when changing the time zone data file of the\ndatabase and upgrading the timestamp with the time zone data, and only between\nthe execution of the DBMS_DST.BEGIN_PREPARE and the DBMS_DST.END_PREPARE\nprocedures or between the execution of the DBMS_DST.BEGIN_UPGRADE and the\nDBMS_DST.END_UPGRADE procedures.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ORA_DST_AFFECTED.html
[ORA_DST_CONVERT]
declaration=datetime_expr [, integer [, integer ]]
category=Datetime Functions
description=ORA_DST_CONVERT is useful when you are changing the time zone data file for your\ndatabase. The function lets you specify error handling for a specified datetime\nexpression.\n\n- For datetime_expr, specify a datetime expression that resolves to a TIMESTAMP\nWITH TIME ZONE value or a VARRAY object that contains TIMESTAMP WITH TIME ZONE\nvalues.\n\n- The optional second argument specifies handling of "duplicate time" errors.\nSpecify 0 (false) to suppress the error by returning the source datetime value.\nThis is the default. Specify 1 (true) to allow the database to return the\nduplicate time error.\n\n- The optional third argument specifies handling of "nonexisting time" errors.\nSpecify 0 (false) to suppress the error by returning the source datetime value.\nThis is the default. Specify 1 (true) to allow the database to return the\nnonexisting time error.\n\nIf no error occurs, this function returns a value of the same data type as\ndatetime_expr (a TIMESTAMP WITH TIME ZONE value or a VARRAY object that contains\nTIMESTAMP WITH TIME ZONE values). The returned datetime value when interpreted\nwith the new time zone file corresponds to datetime_expr interpreted with the\nold time zone file.\n\nThis function can be issued only when changing the time zone data file of the\ndatabase and upgrading the timestamp with the time zone data, and only between\nthe execution of the DBMS_DST.BEGIN_UPGRADE and the DBMS_DST.END_UPGRADE\nprocedures.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ORA_DST_CONVERT.html
[ORA_DST_ERROR]
declaration=datetime_expr
category=Datetime Functions
description=ORA_DST_ERROR is useful when you are changing the time zone data file for your\ndatabase. The function takes as an argument a datetime expression that resolves\nto a TIMESTAMP WITH TIME ZONE value or a VARRAY object that contains TIMESTAMP\nWITH TIME ZONE values, and indicates whether the datetime value will result in\nan error with the new time zone data. The return values are:\n\n- 0: the datetime value does not result in an error with the new time zone data.\n\n- 1878: the datetime value results in a "nonexisting time" error.\n\n- 1883: the datetime value results in a "duplicate time" error.\n\nThis function can be issued only when changing the time zone data file of the\ndatabase and upgrading the timestamp with the time zone data, and only between\nthe execution of the DBMS_DST.BEGIN_PREPARE and the DBMS_DST.END_PREPARE\nprocedures or between the execution of the DBMS_DST.BEGIN_UPGRADE and the\nDBMS_DST.END_UPGRADE procedures.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ORA_DST_ERROR.html
[ORA_HASH]
declaration=expr [, max_bucket [, seed_value ] ]
category=Encoding and Decoding Functions
description=ORA_HASH is a function that computes a hash value for a given expression. Use\nthis function to analyze a subset of data and generate a random sample.\n\n- The expr argument determines the data for which you want Oracle Database to\ncompute a hash value. There are no restrictions on the length of data\nrepresented by expr, which commonly resolves to a column name. The expr cannot\nbe a LONG or LOB type. It cannot be a user-defined object type unless it is a\nnested table type. The hash value for nested table types does not depend on the\norder of elements in the collection. All other data types are supported for\nexpr.\n\n- The optional max_bucket argument determines the maximum bucket value returned\nby the hash function. You can specify any value between 0 and 4294967295. The\ndefault is 4294967295.\n\nNote that the default hash value is a 32 bit unsigned number. The default\nmax_bucket of 2^32-1 simply returns this value.\n\nBucketing is done using a MOD function to the default value. If max_bucket = N,\nthen the bucket value is computed by (default hash value) MOD (N + 1), which\nresults in a bucket value between 0 and N.\n\nNote that this technique does not result in a statistically uniform distribution\nof values across buckets and is somewhat biased towards smaller bucket numbers,\nexcept when N + 1 is a power of 2. This is not noticeable when max_bucket (i.e\nN) is small relative to the default (4294967295) but may be noticeable for\nmax_bucket values that are very large, especially within an order of magnitude\nof the default, say > 100M.\n\n- The optional seed_value argument enables Oracle to produce many different\nresults for the same set of data. Oracle applies the hash function to the\ncombination of expr and seed_value. You can specify any value between 0 and\n4294967295. The default is 0.\n\nThe function returns a NUMBER value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ORA_HASH.html
[PATH]
declaration=correlation_integer
category=XML Functions
description=PATH is an ancillary function used only with the UNDER_PATH and EQUALS_PATH\nconditions. It returns the relative path that leads to the resource specified in\nthe parent condition.\n\nThe correlation_integer can be any NUMBER integer and is used to correlate this\nancillary function with its primary condition. Values less than 1 are treated as\n1.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PATH.html
[PERCENTILE_CONT]
declaration=expr
category=Aggregate Functions
description=PERCENTILE_CONT is an inverse distribution function that assumes a continuous\ndistribution model. It takes a percentile value and a sort specification, and\nreturns an interpolated value that would fall into that percentile value with\nrespect to the sort specification. Nulls are ignored in the calculation.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nThe first expr must evaluate to a numeric value between 0 and 1, because it is a\npercentile value. This expr must be constant within each aggregation group. The\nORDER BY clause takes a single expression that must be a numeric or datetime\nvalue, as these are the types over which Oracle can perform interpolation.\n\nThe result of PERCENTILE_CONT is computed by linear interpolation between values\nafter ordering them. Using the percentile value (P) and the number of rows (N)\nin the aggregation group, you can compute the row number you are interested in\nafter ordering the rows with respect to the sort specification. This row number\n(RN) is computed according to the formula RN = (1+(P*(N-1)). The final result of\nthe aggregate function is computed by linear interpolation between the values\nfrom rows at row numbers CRN = CEILING(RN) and FRN = FLOOR(RN).\n\nThe final result will be:\n\nYou can use the PERCENTILE_CONT function as an analytic function. You can\nspecify only the query_partitioning_clause in its OVER clause. It returns, for\neach row, the value that would fall into the specified percentile among a set of\nvalues within each partition.\n\nThe MEDIAN function is a specific case of PERCENTILE_CONT where the percentile\nvalue defaults to 0.5. For more information, refer to MEDIAN.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PERCENTILE_CONT.html
[PERCENTILE_DISC]
declaration=expr
category=Aggregate Functions
description=PERCENTILE_DISC is an inverse distribution function that assumes a discrete\ndistribution model. It takes a percentile value and a sort specification and\nreturns an element from the set. Nulls are ignored in the calculation.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nThe first expr must evaluate to a numeric value between 0 and 1, because it is a\npercentile value. This expression must be constant within each aggregate group.\nThe ORDER BY clause takes a single expression that can be of any type that can\nbe sorted.\n\nFor a given percentile value P, PERCENTILE_DISC sorts the values of the\nexpression in the ORDER BY clause and returns the value with the smallest\nCUME_DIST value (with respect to the same sort specification) that is greater\nthan or equal to P.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PERCENTILE_DISC.html
[PERCENT_RANK]
declaration=expr [, expr ]...
category=Aggregate Functions
description=PERCENT_RANK is similar to the CUME_DIST (cumulative distribution) function. The\nrange of values returned by PERCENT_RANK is 0 to 1, inclusive. The first row in\nany set has a PERCENT_RANK of 0. The return value is NUMBER.\n\n- As an aggregate function, PERCENT_RANK calculates, for a hypothetical row r\nidentified by the arguments of the function and a corresponding sort\nspecification, the rank of row r minus 1 divided by the number of rows in the\naggregate group. This calculation is made as if the hypothetical row r were\ninserted into the group of rows over which Oracle Database is to aggregate.\n\nThe arguments of the function identify a single hypothetical row within each\naggregate group. Therefore, they must all evaluate to constant expressions\nwithin each aggregate group. The constant argument expressions and the\nexpressions in the ORDER BY clause of the aggregate match by position. Therefore\nthe number of arguments must be the same and their types must be compatible.\n\n- As an analytic function, for a row r, PERCENT_RANK calculates the rank of r\nminus 1, divided by 1 less than the number of rows being evaluated (the entire\nquery result set or a partition).\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PERCENT_RANK.html
[POWER]
declaration=n2, n1
category=Numeric Functions
description=POWER returns n2 raised to the n1 power. The base n2 and the exponent n1 can be\nany numbers, but if n2 is negative, then n1 must be an integer.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If any argument is\nBINARY_FLOAT or BINARY_DOUBLE, then the function returns BINARY_DOUBLE.\nOtherwise, the function returns NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/POWER.html
[POWERMULTISET]
declaration=expr
category=Collection Functions
description=POWERMULTISET takes as input a nested table and returns a nested table of nested\ntables containing all nonempty subsets (called submultisets) of the input nested\ntable.\n\n- expr can be any expression that evaluates to a nested table.\n\n- If expr resolves to null, then Oracle Database returns NULL.\n\n- If expr resolves to a nested table that is empty, then Oracle returns an\nerror.\n\n- The element types of the nested table must be comparable. Refer to "Comparison\nConditions" for information on the comparability of nonscalar types.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/POWERMULTISET.html
[POWERMULTISET_BY_CARDINALITY]
declaration=expr, cardinality
category=Collection Functions
description=POWERMULTISET_BY_CARDINALITY takes as input a nested table and a cardinality and\nreturns a nested table of nested tables containing all nonempty subsets (called\nsubmultisets) of the nested table of the specified cardinality.\n\n- expr can be any expression that evaluates to a nested table.\n\n- cardinality can be any positive integer.\n\n- If expr resolves to null, then Oracle Database returns NULL.\n\n- If expr resolves to a nested table that is empty, then Oracle returns an\nerror.\n\n- The element types of the nested table must be comparable. Refer to "Comparison\nConditions" for information on the comparability of nonscalar types.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/POWERMULTISET_BY_CARDINALITY.html
[PREDICTION]
declaration=[ grouping_hint ] [ schema . ] model [ cost_matrix_clause ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=PREDICTION returns a prediction for each row in the selection. The data type of\nthe returned prediction depends on whether the function performs Regression,\nClassification, or Anomaly Detection.\n\n- Regression: Returns the expected target value for each row. The data type of\nthe return value is the data type of the target.\n\n- Classification: Returns the most probable target class (or lowest cost target\nclass, if costs are specified) for each row. The data type of the return value\nis the data type of the target.\n\n- Anomaly Detection: Returns 1 or 0 for each row. Typical rows are classified as\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREDICTION.html
[PREDICTION_BOUNDS]
declaration=[schema.] model [, confidence_level [, class_value]] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=PREDICTION_BOUNDS applies a Generalized Linear Model (GLM) to predict a class or\na value for each row in the selection. The function returns the upper and lower\nbounds of each prediction in a varray of objects with fields UPPER and LOWER.\n\nGLM can perform either regression or binary classification:\n\n- The bounds for regression refer to the predicted target value. The data type\nof UPPER and LOWER is the data type of the target.\n\n- The bounds for binary classification refer to the probability of either the\npredicted target class or the specified class_value. The data type of UPPER and\nLOWER is BINARY_DOUBLE.\n\nIf the model was built using ridge regression, or if the covariance matrix is\nfound to be singular during the build, then PREDICTION_BOUNDS returns NULL for\nboth bounds.\n\nconfidence_level is a number in the range (0,1). The default value is 0.95. You\ncan specify class_value while leaving confidence_level at its default by\nspecifying NULL for confidence_level.\n\nThe syntax of the PREDICTION_BOUNDS function can use an optional GROUPING hint\nwhen scoring a partitioned model. See GROUPING Hint.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREDICTION_BOUNDS.html
[PREDICTION_COST]
declaration=[ schema . ] model [ , class ] cost_matrix_clause mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=PREDICTION_COST returns a cost for each row in the selection. The cost refers to\nthe lowest cost class or to the specified class. The cost is returned as\nBINARY_DOUBLE.\n\nPREDICTION_COST can perform classification or anomaly detection. For\nclassification, the returned cost refers to a predicted target class. For\nanomaly detection, the returned cost refers to a classification of 1 (for\ntypical rows) or 0 (for anomalous rows).\n\nYou can use PREDICTION_COST in conjunction with the PREDICTION function to\nobtain the prediction and the cost of the prediction.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREDICTION_COST.html
[PREDICTION_DETAILS]
declaration=[ schema . ] model [ , class_value [ , topN ] ] [ DESC | ASC | ABS ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=PREDICTION_DETAILS returns prediction details for each row in the selection. The\nreturn value is an XML string that describes the attributes of the prediction.\n\nFor regression, the returned details refer to the predicted target value. For\nclassification and anomaly detection, the returned details refer to the highest\nprobability class or the specified class_value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREDICTION_DETAILS.html
[PREDICTION_PROBABILITY]
declaration=[ schema . ] model [ , class ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=PREDICTION_PROBABILITY returns a probability for each row in the selection. The\nprobability refers to the highest probability class or to the specified class.\nThe data type of the returned probability is BINARY_DOUBLE.\n\nPREDICTION_PROBABILITY can perform classification or anomaly detection. For\nclassification, the returned probability refers to a predicted target class. For\nanomaly detection, the returned probability refers to a classification of 1 (for\ntypical rows) or 0 (for anomalous rows).\n\nYou can use PREDICTION_PROBABILITY in conjunction with the PREDICTION function\nto obtain the prediction and the probability of the prediction.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREDICTION_PROBABILITY.html
[PREDICTION_SET]
declaration=[ schema . ] model [ , bestN [ , cutoff ] ] [ cost_matrix_clause ] mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
description=PREDICTION_SET returns a set of predictions with either probabilities or costs\nfor each row in the selection. The return value is a varray of objects with\nfield names PREDICTION_ID and PROBABILITY or COST. The prediction identifier has\nthe data type of the target; the probability and cost fields are BINARY_DOUBLE.\n\nPREDICTION_SET can perform classification or anomaly detection. For\nclassification, the return value refers to a predicted target class. For anomaly\ndetection, the return value refers to a classification of 1 (for typical rows)\nor 0 (for anomalous rows).\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREDICTION_SET.html
[PRESENTNNV]
declaration=cell_reference, expr1, expr2
category=Model Functions
description=The PRESENTNNV function can be used only in the model_clause of the SELECT\nstatement and then only on the right-hand side of a model rule. It returns expr1\nwhen cell_reference exists prior to the execution of the model_clause and is not\nnull when PRESENTNNV is evaluated. Otherwise it returns expr2. This function\ndiffers from NVL2 in that NVL2 evaluates the data at the time it is executed,\nrather than evaluating the data as it was prior to the execution of the\nmodel_clause.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PRESENTNNV.html
[PRESENTV]
declaration=cell_reference, expr1, expr2
category=Model Functions
description=The PRESENTV function can be used only within the model_clause of the SELECT\nstatement and then only on the right-hand side of a model rule. It returns expr1\nwhen, prior to the execution of the model_clause, cell_reference exists.\nOtherwise it returns expr2.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PRESENTV.html
[PREVIOUS]
declaration=cell_reference
category=Model Functions
description=The PREVIOUS function can be used only in the model_clause of the SELECT\nstatement and then only in the ITERATE ... [ UNTIL ] clause of the\nmodel_rules_clause. It returns the value of cell_reference at the beginning of\neach iteration.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/PREVIOUS.html
[RANK]
declaration=expr [, expr ]...
category=Aggregate Functions
description=RANK calculates the rank of a value in a group of values. The return type is\nNUMBER.\n\nRows with equal values for the ranking criteria receive the same rank. Oracle\nDatabase then adds the number of tied rows to the tied rank to calculate the\nnext rank. Therefore, the ranks may not be consecutive numbers. This function is\nuseful for top-N and bottom-N reporting.\n\n- As an aggregate function, RANK calculates the rank of a hypothetical row\nidentified by the arguments of the function with respect to a given sort\nspecification. The arguments of the function must all evaluate to constant\nexpressions within each aggregate group, because they identify a single row\nwithin each group. The constant argument expressions and the expressions in the\nORDER BY clause of the aggregate match by position. Therefore, the number of\narguments must be the same and their types must be compatible.\n\n- As an analytic function, RANK computes the rank of each row returned from a\nquery with respect to the other rows returned by the query, based on the values\nof the value_exprs in the order_by_clause.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/RANK.html
[RATIO_TO_REPORT]
declaration=expr
category=Analytic Functions
description=RATIO_TO_REPORT is an analytic function. It computes the ratio of a value to the\nsum of a set of values. If expr evaluates to null, then the ratio-to-report\nvalue also evaluates to null.\n\nThe set of values is determined by the query_partition_clause. If you omit that\nclause, then the ratio-to-report is computed over all rows returned by the\nquery.\n\nYou cannot nest analytic functions by using RATIO_TO_REPORT or any other\nanalytic function for expr. However, you can use other built-in function\nexpressions for expr. Refer to "About SQL Expressions" for information on valid\nforms of expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/RATIO_TO_REPORT.html
[RAWTOHEX]
declaration=raw
category=Conversion Functions
description=RAWTOHEX converts raw to a character value containing its hexadecimal\nrepresentation.\n\nAs a SQL built-in function, RAWTOHEX accepts an argument of any scalar data type\nother than LONG, LONG RAW, CLOB, NCLOB, BLOB, or BFILE. If the argument is of a\ndata type other than RAW, then this function converts the argument value, which\nis represented using some number of data bytes, into a RAW value with the same\nnumber of data bytes. The data itself is not modified in any way, but the data\ntype is recast to a RAW data type.\n\nThis function returns a VARCHAR2 value with the hexadecimal representation of\nbytes that make up the value of raw. Each byte is represented by two hexadecimal\ndigits.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/RAWTOHEX.html
[RAWTONHEX]
declaration=raw
category=Conversion Functions
description=RAWTONHEX converts raw to a character value containing its hexadecimal\nrepresentation. RAWTONHEX(raw) is equivalent to TO_NCHAR(RAWTOHEX(raw)). The\nvalue returned is always in the national character set.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/RAWTONHEX.html
[RAW_TO_UUID]
declaration=uuid_string
category=UUID Functions
since=23
description=RAW_TO_UUID converts the input argument uuid_string into canonical format of 36\nbytes which consists of 32 hexadecimal bytes and 4 hyphens. uuid_string must be\nof datatype RAW(16).\n\nIf the input is NULL, it returns NULL.\n\nExample\n\nThe output is:\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/raw_to_uuid.html
[REF]
declaration=correlation_variable
category=Object Reference Functions
description=REF takes as its argument a correlation variable (table alias) associated with a\nrow of an object table or an object view. A REF value is returned for the object\ninstance that is bound to the variable or row.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REF.html
[REFTOHEX]
declaration=expr
category=Object Reference Functions
description=REFTOHEX converts argument expr to a character value containing its hexadecimal\nequivalent. expr must return a REF.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REFTOHEX.html
[REGEXP_COUNT]
declaration=source_char, pattern [, position [, match_param]]
category=Character Functions Returning Number Values
description=REGEXP_COUNT complements the functionality of the REGEXP_INSTR function by\nreturning the number of times a pattern occurs in a source string. The function\nevaluates strings using characters as defined by the input character set. It\nreturns an integer indicating the number of occurrences of pattern. If no match\nis found, then the function returns 0.\n\n- source_char is a character expression that serves as the search value. It is\ncommonly a character column and can be of any of the data types CHAR, VARCHAR2,\nNCHAR, NVARCHAR2, CLOB, or NCLOB.\n\n- pattern is the regular expression. It is usually a text literal and can be of\nany of the data types CHAR, VARCHAR2, NCHAR, or NVARCHAR2. It can contain up to\n512 bytes. If the data type of pattern is different from the data type of\nsource_char, then Oracle Database converts pattern to the data type of\nsource_char.\n\nREGEXP_COUNT ignores subexpression parentheses in pattern. For example, the\npattern '(123(45))' is equivalent to '12345'. For a listing of the operators you\ncan specify in pattern, refer to Oracle Regular Expression Support.\n\n- position is a positive integer indicating the character of source_char where\nOracle should begin the search. The default is 1, meaning that Oracle begins the\nsearch at the first character of source_char. After finding the first occurrence\nof pattern, the database searches for a second occurrence beginning with the\nfirst character following the first occurrence.\n\n- match_param is a character expression of the data type VARCHAR2 or CHAR that\nlets you change the default matching behavior of the function.\n\nThe value of match_param can include one or more of the following characters:\n\n- 'i' specifies case-insensitive matching, even if the determined collation of\nthe condition is case-sensitive.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REGEXP_COUNT.html
[REGEXP_INSTR]
declaration=source_char, pattern [, position [, occurrence [, return_opt [, match_param [, subexpr ] ] ] ] ]
category=Character Functions Returning Number Values
description=REGEXP_INSTR extends the functionality of the INSTR function by letting you\nsearch a string for a regular expression pattern. The function evaluates strings\nusing characters as defined by the input character set. It returns an integer\nindicating the beginning or ending position of the matched substring, depending\non the value of the return_option argument. If no match is found, then the\nfunction returns 0.\n\nThis function complies with the POSIX regular expression standard and the\nUnicode Regular Expression Guidelines. For more information, refer to Oracle\nRegular Expression Support.\n\n- source_char is a character expression that serves as the search value. It is\ncommonly a character column and can be of any of the data types CHAR, VARCHAR2,\nNCHAR, NVARCHAR2, CLOB, or NCLOB.\n\n- pattern is the regular expression. It is usually a text literal and can be of\nany of the data types CHAR, VARCHAR2, NCHAR, or NVARCHAR2. It can contain up to\n512 bytes. If the data type of pattern is different from the data type of\nsource_char, then Oracle Database converts pattern to the data type of\nsource_char. For a listing of the operators you can specify in pattern, refer to\nOracle Regular Expression Support.\n\n- position is a positive integer indicating the character of source_char where\nOracle should begin the search. The default is 1, meaning that Oracle begins the\nsearch at the first character of source_char.\n\n- occurrence is a positive integer indicating which occurrence of pattern in\nsource_char Oracle should search for. The default is 1, meaning that Oracle\nsearches for the first occurrence of pattern. If occurrence is greater than 1,\nthen the database searches for the second occurrence beginning with the first\ncharacter following the first occurrence of pattern, and so forth. This behavior\nis different from the INSTR function, which begins its search for the second\noccurrence at the second character of the first occurrence.\n\n- return_option lets you specify what Oracle should return in relation to the\noccurrence:\n\n- If you specify 0, then Oracle returns the position of the first character of\nthe occurrence. This is the default.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REGEXP_INSTR.html
[REGEXP_REPLACE]
declaration=source_char, pattern [, replace_string [, position [, occurrence [, match_param ] ] ] ]
category=Character Functions Returning Character Values
description=REGEXP_REPLACE extends the functionality of the REPLACE function by letting you\nsearch a string for a regular expression pattern. By default, the function\nreturns source_char with every occurrence of the regular expression pattern\nreplaced with replace_string. The string returned is in the same character set\nas source_char. The function returns VARCHAR2 if the first argument is not a LOB\nand returns CLOB if the first argument is a LOB.\n\nThis function complies with the POSIX regular expression standard and the\nUnicode Regular Expression Guidelines. For more information, refer to Oracle\nRegular Expression Support.\n\n- source_char is a character expression that serves as the search value. It is\ncommonly a character column and can be of any of the data types CHAR, VARCHAR2,\nNCHAR, NVARCHAR2, CLOB or NCLOB.\n\n- pattern is the regular expression. It is usually a text literal and can be of\nany of the data types CHAR, VARCHAR2, NCHAR, or NVARCHAR2. It can contain up to\n512 bytes. If the data type of pattern is different from the data type of\nsource_char, then Oracle Database converts pattern to the data type of\nsource_char. For a listing of the operators you can specify in pattern, refer to\nOracle Regular Expression Support.\n\n- replace_string can be of any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. If replace_string is a CLOB or NCLOB, then Oracle\ntruncates replace_string to 32K. The replace_string can contain up to 500\nbackreferences to subexpressions in the form \n, where n is a number from 1 to\n9. If you want to include a backslash (``) in replace_string, then you must\nprecede it with the escape character, which is also a backslash. For example, to\nreplace \2 you would enter \2. For more information on backreference\nexpressions, refer to the notes to " Oracle Regular Expression Support", Table\nD-1.\n\n- position is a positive integer indicating the character of source_char where\nOracle should begin the search. The default is 1, meaning that Oracle begins the\nsearch at the first character of source_char.\n\n- occurrence is a nonnegative integer indicating the occurrence of the replace\noperation:\n\n- If you specify 0, then Oracle replaces all occurrences of the match.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REGEXP_REPLACE.html
[REGEXP_SUBSTR]
declaration=source_char, pattern [, position [, occurrence [, match_param [, subexpr ] ] ] ]
category=Character Functions Returning Character Values
description=REGEXP_SUBSTR extends the functionality of the SUBSTR function by letting you\nsearch a string for a regular expression pattern. It is also similar to\nREGEXP_INSTR, but instead of returning the position of the substring, it returns\nthe substring itself. This function is useful if you need the contents of a\nmatch string but not its position in the source string. The function returns the\nstring as VARCHAR2 or CLOB data in the same character set as source_char.\n\nThis function complies with the POSIX regular expression standard and the\nUnicode Regular Expression Guidelines. For more information, refer to Oracle\nRegular Expression Support.\n\n- source_char is a character expression that serves as the search value. It is\ncommonly a character column and can be of any of the data types CHAR, VARCHAR2,\nNCHAR, NVARCHAR2, CLOB, or NCLOB.\n\n- pattern is the regular expression. It is usually a text literal and can be of\nany of the data types CHAR, VARCHAR2, NCHAR, or NVARCHAR2. It can contain up to\n512 bytes. If the data type of pattern is different from the data type of\nsource_char, then Oracle Database converts pattern to the data type of\nsource_char. For a listing of the operators you can specify in pattern, refer to\nOracle Regular Expression Support.\n\n- position is a positive integer indicating the character of source_char where\nOracle should begin the search. The default is 1, meaning that Oracle begins the\nsearch at the first character of source_char.\n\n- occurrence is a positive integer indicating which occurrence of pattern in\nsource_char Oracle should search for. The default is 1, meaning that Oracle\nsearches for the first occurrence of pattern.\n\nIf occurrence is greater than 1, then the database searches for the second\noccurrence beginning with the first character following the first occurrence of\npattern, and so forth. This behavior is different from the SUBSTR function,\nwhich begins its search for the second occurrence at the second character of the\nfirst occurrence.\n\n- match_param is a character expression of the data type VARCHAR2 or CHAR that\nlets you change the default matching behavior of the function. The behavior of\nthis parameter is the same for this function as for REGEXP_COUNT. Refer to\nREGEXP_COUNT for detailed information.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REGEXP_SUBSTR.html
[REMAINDER]
declaration=n2, n1
category=Numeric Functions
description=REMAINDER returns the remainder of n2 divided by n1.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. Oracle determines\nthe argument with the highest numeric precedence, implicitly converts the\nremaining arguments to that data type, and returns that data type.\n\nThe MOD function is similar to REMAINDER except that it uses FLOOR in its\nformula, whereas REMAINDER uses ROUND. Refer to MOD.\n\n- If n1 = 0 or n2 = infinity, then Oracle returns\n\n- An error if the arguments are of type NUMBER\n\n- NaN if the arguments are BINARY_FLOAT or BINARY_DOUBLE.\n\n- If n1 != 0, then the remainder is n2 - (n1*N) where N is the integer nearest\nn2/n1. If n2/n1 equals x.5, then N is the nearest even integer.\n\n- If n2 is a floating-point number, and if the remainder is 0, then the sign of\nthe remainder is the sign of n2. Remainders of 0 are unsigned for NUMBER values.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REMAINDER.html
[REPLACE]
declaration=char, search_string [, replacement_string ]
category=Character Functions Returning Character Values
description=REPLACE returns char with every occurrence of search_string replaced with\nreplacement_string. If replacement_string is omitted or null, then all\noccurrences of search_string are removed. If search_string is null, then char is\nreturned.\n\nBoth search_string and replacement_string, as well as char, can be any of the\ndata types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or NCLOB. The string returned\nis in the same character set as char. The function returns VARCHAR2 if the first\nargument is not a LOB and returns CLOB if the first argument is a LOB.\n\nREPLACE provides functionality related to that provided by the TRANSLATE\nfunction. TRANSLATE provides single-character, one-to-one substitution. REPLACE\nlets you substitute one string for another as well as to remove character\nstrings.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/REPLACE.html
[RETAIL_ADD_DAYS]
declaration=dtexpr , num_periods [, is_restated]
category=Calendar Functions
since=23
description=These functions add (or subtract if interval is negative) a given number of\nperiods from the given date based on the Gregorian calendar.\n\n- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- The num_periods parameter is an integer that when positive will add periods\nand when negative will subtract periods.\n\n- All retail functions take an optional is_restated parameter that controls how\nyears that require 53 weeks are handled.\n\nThe is_restated parameter is a text expression that must resolve to either `\nRESTATED or NOT RESTATED (case-insensitive). A retail year typically contains\nexactly 52 weeks, which is 364 days. Therefore, every 5 or 6 years an extra 53rd\nweek is added. This is a non-restated calendar and is what is produced when the\n*is_restated* parameter is NOT RESTATED (the default). Some users prefer to have\nall years contain 52 weeks for comparison purposes. Such calendars are called\nrestated calendars, and is what is produced when the *is_restated* parameter is\nRESTATED`.\n\nRETAIL_ADD_YEARS adds or subtracts the given number of years, where a year is\nalways defined as a period of 12 months.\n\nRETAIL_ADD_QUARTERS adds or subtracts the given number of quarters, where a\nquarter is always defined as a period of 3 months.\n\nRETAIL_ADD_MONTHS This is defined similarly as the FISCAL_ADD_MONTHS . This will\nreturn the corresponding day (by position) within the target month, and follow\nthe same rule as above where if the given date is the last day of the month or\nif the resulting month has fewer days, the last day of the resulting month is\nused.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/retail_add_x_periods.html
[RETAIL_ADD_MONTHS]
declaration=dtexpr , num_periods [, is_restated]
category=Calendar Functions
since=23
