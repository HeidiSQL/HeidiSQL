description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- All retail functions take an optional is_restated parameter that controls how\nyears that require 53 weeks are handled.\n\nThe is_restated parameter is a text expression that must resolve to either `\nRESTATED or NOT RESTATED (case-insensitive). A retail year typically contains\nexactly 52 weeks, which is 364 days. Therefore, every 5 or 6 years an extra 53rd\nweek is added. This is a non-restated calendar and is what is produced when the\n*is_restated* parameter is NOT RESTATED (the default). Some users prefer to have\nall years contain 52 weeks for comparison purposes. Such calendars are called\nrestated calendars, and is what is produced when the *is_restated* parameter is\nRESTATED`.\n\n- The index_by parameter is a text value that must resolve to either POSITION or\nDATE (case-insensitive, defaults to DATE). It is used to distinguish between\nabsolute and position-based numbers for the following cases:\n\n- CALENDAR_DAY_OF_WEEK\n\n- FISCAL_DAY_OF_WEEK\n\n- RETAIL_DAY_OF_WEEK\n\n- FISCAL_MONTH_OF_YEAR\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/retail_x_of_y.html
[RETAIL_WEEK_START_DATE]
declaration=dtexpr [ , is_restated] ]
category=Calendar Functions
since=23
description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- All retail functions take an optional is_restated parameter that controls how\nyears that require 53 weeks are handled.\n\nThe is_restated parameter is a text expression that must resolve to either `\nRESTATED or NOT RESTATED (case-insensitive). A retail year typically contains\nexactly 52 weeks, which is 364 days. Therefore, every 5 or 6 years an extra 53rd\nweek is added. This is a non-restated calendar and is what is produced when the\n*is_restated* parameter is NOT RESTATED (the default). Some users prefer to have\nall years contain 52 weeks for comparison purposes. Such calendars are called\nrestated calendars, and is what is produced when the *is_restated* parameter is\nRESTATED`.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/retail_start_end.html
[RETAIL_YEAR]
declaration=dtexpr [ , fmt ] [ , is_restated ] [ , nlsparam ]
category=Calendar Functions
since=23
description=These functions return a VARCHAR2 value that uniquely identifies a member in the\nspecified level using the 4-5-4 calendar of the National Retail Federation\n(NRF).\n\nEach of the retail functions returns a VARCHAR2 value that uniquely identifies a\nmember in an implicit hierarchy at a particular level. For this reason, the\nNLS_DATE_FORMAT, NLS_TIMESTAMP_FORMAT, and NLS_TIMESTAMP_TZ_FORMAT do not apply\nto these functions. They each have their own default formats. These functions\nrespect the setting of NLS_DATE_LANGUAGE.\n\n- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- fmt is a text expression representing a format string. In all cases, the\ncase-sensitivity of the format specifiers follows the same behavior as TO_CHAR.\nFor example, MON specifies an abbreviated month in upper-case (e.g. JAN), mon\nspecifies an abbreviated month name in lower-case (e.g. jan), and Mon specifies\nan abbreviated month name in title-case (e.g. Jan).\n\n- All retail functions take an optional is_restated parameter that controls how\nyears that require 53 weeks are handled.\n\nThe is_restated parameter is a text expression that must resolve to either `\nRESTATED or NOT RESTATED (case-insensitive). A retail year typically contains\nexactly 52 weeks, which is 364 days. Therefore, every 5 or 6 years an extra 53rd\nweek is added. This is a non-restated calendar and is what is produced when the\n*is_restated* parameter is NOT RESTATED (the default). Some users prefer to have\nall years contain 52 weeks for comparison purposes. Such calendars are called\nrestated calendars, and is what is produced when the *is_restated* parameter is\nRESTATED`.\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/retail.html
