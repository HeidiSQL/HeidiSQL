[ROUND1]
name=ROUND
declaration=datetime [, fmt ]
category=Datetime Functions
description=ROUND returns datetime rounded to the unit specified by the format model fmt.\n\nThis function is not sensitive to the NLS_CALENDAR session parameter. It\noperates according to the rules of the Gregorian calendar. The value returned is\nalways of data type DATE, even if you specify a different datetime data type for\ndate. If you omit fmt, then date is rounded to the nearest day. The date\nexpression must resolve to a DATE value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ROUND-date.html
[ROUND2]
name=ROUND
declaration=n [, integer ]
category=Numeric Functions
description=ROUND returns n rounded to integer places to the right of the decimal point. If\nyou omit integer, then n is rounded to zero places. If integer is negative, then\nn is rounded off to the left of the decimal point.\n\nn can be any numeric data type or any nonnumeric data type that can be\nimplicitly converted to a numeric data type. If you omit integer, then the\nfunction returns the value ROUND(n, 0) in the same data type as the numeric data\ntype of n. If you include integer, then the function returns NUMBER.\n\nROUND is implemented using the following rules:\n\n- If n is 0, then ROUND always returns 0 regardless of integer.\n\n- If n is negative, then ROUND(n, integer) returns -ROUND(-n, integer).\n\n- If n is positive, then\n\nROUND applied to a NUMBER value may give a slightly different result from ROUND\napplied to the same value expressed in floating-point. The different results\narise from differences in internal representations of NUMBER and floating point\nvalues. The difference will be 1 in the rounded digit if a difference occurs.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ROUND-number.html
[ROWIDTOCHAR]
declaration=rowid
category=Conversion Functions
description=ROWIDTOCHAR converts a rowid value to VARCHAR2 data type. The result of this\nconversion is always 18 characters long.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ROWIDTOCHAR.html
[ROWIDTONCHAR]
declaration=rowid
category=Conversion Functions
description=ROWIDTONCHAR converts a rowid value to NVARCHAR2 data type. The result of this\nconversion is always in the national character set and is 18 characters long.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ROWIDTONCHAR.html
[ROW_NUMBER]
declaration=
category=Analytic Functions
description=ROW_NUMBER is an analytic function. It assigns a unique number to each row to\nwhich it is applied (either each row in the partition or each row returned by\nthe query), in the ordered sequence of rows specified in the order_by_clause,\nbeginning with 1.\n\nBy nesting a subquery using ROW_NUMBER inside a query that retrieves the\nROW_NUMBER values for a specified range, you can find a precise subset of rows\nfrom the results of the inner query. This use of the function lets you implement\ntop-N, bottom-N, and inner-N reporting. For consistent results, the query must\nensure a deterministic sort order.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ROW_NUMBER.html
[RPAD]
declaration=expr1 , n [, expr2 ]
category=Character Functions Returning Character Values
description=RPAD returns expr1, right-padded to length n characters with expr2, replicated\nas many times as necessary. This function is useful for formatting the output of\na query.\n\nBoth expr1 and expr2 can be any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. The string returned is of VARCHAR2 data type if expr1\nis a character data type, NVARCHAR2 if expr1 is a national character data type,\nand a LOB if expr1 is a LOB data type. The string returned is in the same\ncharacter set as expr1. The argument n must be a NUMBER integer or a value that\ncan be implicitly converted to a NUMBER integer.\n\nexpr1 cannot be null. If you do not specify expr2, then it defaults to a single\nblank. If expr1 is longer than n, then this function returns the portion of\nexpr1 that fits in n.\n\nThe argument n is the total length of the return value as it is displayed on\nyour terminal screen. In most character sets, this is also the number of\ncharacters in the return value. However, in some multibyte character sets, the\ndisplay length of a character string can differ from the number of characters in\nthe string.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/RPAD.html
[RTRIM]
declaration=char [, set ]
category=Character Functions Returning Character Values
description=RTRIM removes from the right end of char all of the characters that appear in\nset. This function is useful for formatting the output of a query.\n\nIf you do not specify set, then it defaults to a single blank. RTRIM works\nsimilarly to LTRIM.\n\nBoth char and set can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2,\nCLOB, or NCLOB. The string returned is of VARCHAR2 data type if char is a\ncharacter data type, NVARCHAR2 if char is a national character data type, and a\nLOB if char is a LOB data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/RTRIM.html
[SCN_TO_TIMESTAMP]
declaration=number
category=Conversion Functions
description=SCN_TO_TIMESTAMP takes as an argument a number that evaluates to a system change\nnumber (SCN), and returns the approximate timestamp associated with that SCN.\nThe returned value is of TIMESTAMP data type. This function is useful any time\nyou want to know the timestamp associated with an SCN. For example, it can be\nused in conjunction with the ORA_ROWSCN pseudocolumn to associate a timestamp\nwith the most recent change to a row.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SCN_TO_TIMESTAMP.html
[SESSIONS]
declaration=([ schema . ] (table | view) | query_name) [ PARTITION BY (expr | (expr /,)) ], COLUMNS (datetime_column), gap
category=Streaming Windowing Table Functions
since=23
description=The SESSIONS table function groups rows into sessions based on the time between\nconsecutive rows. A new session starts when the time between rows exceeds the\nspecified gap. You can use PARTITION BY to create independent sessions for\ndifferent values.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SESSIONS.html
[SET]
declaration=nested_table
category=Collection Functions
description=SET converts a nested table into a set by eliminating duplicates. The function\nreturns a nested table whose elements are distinct from one another. The\nreturned nested table is of the same type as the input nested table.\n\nThe element types of the nested table must be comparable. Refer to "Comparison\nConditions" for information on the comparability of nonscalar types.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SET.html
[SIGN]
declaration=n
category=Numeric Functions
description=SIGN returns the sign of n. This function takes as an argument any numeric data\ntype, or any nonnumeric data type that can be implicitly converted to NUMBER,\nand returns NUMBER.\n\nFor value of NUMBER type, the sign is:\n\n- -1 if n<0\n\n- 0 if n=0\n\n- 1 if n>0\n\nFor binary floating-point numbers (BINARY_FLOAT and BINARY_DOUBLE), this\nfunction returns the sign bit of the number. The sign bit is:\n\n- -1 if n<0\n\n- +1 if n>=0 or n=NaN\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SIGN.html
[SIN]
declaration=n
category=Numeric Functions
description=SIN returns the sine of n (an angle expressed in radians).\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SIN.html
[SINH]
declaration=n
category=Numeric Functions
description=SINH returns the hyperbolic sine of n.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SINH.html
[SKEWNESS_POP]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=SKEWNESS_POP is an aggregate function that is primarily used to determine\nsymmetry in a given distribution.\n\nNULL values in expr are ignored.\n\nReturns NULL if all rows in the group have NULL expr values.\n\nReturns 0 if there are one or two rows in expr.\n\nFor a given set of values, the result of population skewness (SKEWNESS_POP) and\nsample skewness (SKEWNESS_SAMP) are always deterministic. However, the values of\nSKEWNESS_POP and SKEWNESS_SAMP differ. As the number of values in the data set\nincreases, the difference between the computed values of SKEWNESS_SAMP and\nSKEWNESS_POP decreases.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SKEWNESS_POP.html
[SKEWNESS_SAMP]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=SKEWNESS_SAMP is an aggregate function that is primarily used to determine\nsymmetry in a given distribution.\n\nNULL values in expr are ignored.\n\nReturns NULL if all rows in the group have NULL expr values.\n\nReturns 0 if there are one or two rows in expr.\n\nFor a given set of values, the result of population skewness (SKEWNESS_POP) and\nsample skewness (SKEWNESS_SAMP) are always deterministic. However, the values of\nSKEWNESS_POP and SKEWNESS_SAMP differ. As the number of values in the data set\nincreases, the difference between the computed values of SKEWNESS_SAMP and\nSKEWNESS_POP decreases.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SKEWNESS_SAMP.html
[SOUNDEX]
declaration=char
category=Character Functions Returning Character Values
description=SOUNDEX returns a character string containing the phonetic representation of\nchar. This function lets you compare words that are spelled differently, but\nsound alike in English.\n\nThe phonetic representation is defined in The Art of Computer Programming,\nVolume 3: Sorting and Searching, by Donald E. Knuth, as follows:\n\n- Retain the first letter of the string and remove all other occurrences of the\nfollowing letters: a, e, h, i, o, u, w, y.\n\n- Assign numbers to the remaining letters (after the first) as follows:\n\n- If two or more letters with the same number were adjacent in the original name\n(before step 1), or adjacent except for any intervening h and w, then retain the\nfirst letter and omit rest of all the adjacent letters with same number.\n\n- Return the first four bytes padded with 0.\n\nchar can be of any of the data types CHAR, VARCHAR2, NCHAR, or NVARCHAR2. The\nreturn value is the same data type as char.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SOUNDEX.html
[SQRT]
declaration=n
category=Numeric Functions
description=SQRT returns the square root of n.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\n- If n resolves to a NUMBER, then the value n cannot be negative. SQRT returns a\nreal number.\n\n- If n resolves to a binary floating-point number (BINARY_FLOAT or\nBINARY_DOUBLE):\n\n- If n >= 0, then the result is positive.\n\n- If n = -0, then the result is -0.\n\n- If n < 0, then the result is NaN.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SQRT.html
[STANDARD_HASH]
declaration=expr [, 'method' ]
category=Encoding and Decoding Functions
description=STANDARD_HASH computes a hash value for a given expression using one of several\nhash algorithms that are defined and standardized by the National Institute of\nStandards and Technology. This function is useful for performing authentication\nand maintaining data integrity in security applications such as digital\nsignatures, checksums, and fingerprinting.\n\nYou can use the STANDARD_HASH function to create an index on an extended data\ntype column. Refer to "Creating an Index on an Extended Data Type Column" for\nmore information.\n\n- The expr argument determines the data for which you want Oracle Database to\ncompute a hash value. There are no restrictions on the length of data\nrepresented by expr, which commonly resolves to a column name. The expr cannot\nbe a LONG or LOB type. It cannot be a user-defined object type. All other data\ntypes are supported for expr.\n\n- The optional method argument lets you specify the name of the hash algorithm\nto be used. Valid algorithms are SHA1, SHA256, SHA384, SHA512 and MD5. If you\nomit this argument, then SHA1 is used.\n\nThe function returns a RAW value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STANDARD_HASH.html
[STATS_BINOMIAL_TEST]
declaration=expr1, expr2, p [, { 'TWO_SIDED_PROB' | 'EXACT_PROB' | 'ONE_SIDED_PROB_OR_MORE' | 'ONE_SIDED_PROB_OR_LESS' } ]
category=Aggregate Functions
description=STATS_BINOMIAL_TEST is an exact probability test used for dichotomous variables,\nwhere only two possible values exist. It tests the difference between a sample\nproportion and a given proportion. The sample size in such tests is usually\nsmall.\n\nThis function takes three required arguments: expr1 is the sample being\nexamined, expr2 contains the values for which the proportion is expected to be,\nand p is a proportion to test against. The optional fourth argument lets you\nspecify the meaning of the NUMBER value returned by this function, as shown in\nTable 7-10. For this argument, you can specify a text literal, or a bind\nvariable or expression that evaluates to a constant character value. If you omit\nthe fourth argument, then the default is 'TWO_SIDED_PROB'.\n\n'EXACT_PROB' gives the probability of getting exactly proportion p. In cases\nwhere you want to test whether the proportion found in the sample is\nsignificantly different from a 50-50 split, p would normally be 0.50. If you\nwant to test only whether the proportion is different, then use the return value\n'TWO_SIDED_PROB'. If your test is whether the proportion is more than the value\nof expr2, then use the return value 'ONE_SIDED_PROB_OR_MORE'. If the test is to\ndetermine whether the proportion of expr2 is less, then use the return value\n'ONE_SIDED_PROB_OR_LESS'.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_BINOMIAL_TEST.html
[STATS_CROSSTAB]
declaration=expr1, expr2 [, { 'CHISQ_OBS' | 'CHISQ_SIG' | 'CHISQ_DF' | 'PHI_COEFFICIENT' | 'CRAMERS_V' | 'CONT_COEFFICIENT' | 'COHENS_K' } ]
category=Aggregate Functions
description=Crosstabulation (commonly called crosstab) is a method used to analyze two\nnominal variables. The STATS_CROSSTAB function takes two required arguments:\nexpr1 and expr2 are the two variables being analyzed. The optional third\nargument lets you specify the meaning of the NUMBER value returned by this\nfunction, as shown in Table 7-11. For this argument, you can specify a text\nliteral, or a bind variable or expression that evaluates to a constant character\nvalue. If you omit the third argument, then the default is 'CHISQ_SIG'.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_CROSSTAB.html
[STATS_F_TEST]
declaration=expr1, expr2 [, { { 'STATISTIC' | 'DF_NUM' | 'DF_DEN' | 'ONE_SIDED_SIG' } , expr3 | 'TWO_SIDED_SIG' } ]
category=Aggregate Functions
description=STATS_F_TEST tests whether two variances are significantly different. The\nobserved value of f is the ratio of one variance to the other, so values very\ndifferent from 1 usually indicate significant differences.\n\nThis function takes two required arguments: expr1 is the grouping or independent\nvariable and expr2 is the sample of values. The optional third argument lets you\nspecify the meaning of the NUMBER value returned by this function, as shown in\nTable 7-12. For this argument, you can specify a text literal, or a bind\nvariable or expression that evaluates to a constant character value. If you omit\nthe third argument, then the default is 'TWO_SIDED_SIG'.\n\nThe one-tailed significance is always in relation to the upper tail. The final\nargument, expr3, indicates which of the two groups specified by expr1 is the\nhigh value or numerator (the value whose rejection region is the upper tail).\n\nThe observed value of f is the ratio of the variance of one group to the\nvariance of the second group. The significance of the observed value of f is the\nprobability that the variances are different just by chance-a number between 0\nand 1. A small value for the significance indicates that the variances are\nsignificantly different. The degree of freedom for each of the variances is the\nnumber of observations in the sample minus 1.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_F_TEST.html
[STATS_KS_TEST]
declaration=expr1, expr2 [, { 'STATISTIC' | 'SIG' } ]
category=Aggregate Functions
description=STATS_KS_TEST is a Kolmogorov-Smirnov function that compares two samples to test\nwhether they are from the same population or from populations that have the same\ndistribution. It does not assume that the population from which the samples were\ntaken is normally distributed.\n\nThis function takes two required arguments: expr1 classifies the data into the\ntwo samples and expr2 contains the values for each of the samples. If expr1\nclassifies the data into only one sample or into more than two samples, then an\nerror is raised. The optional third argument lets you specify the meaning of the\nNUMBER value returned by this function, as shown in Table 7-13. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'SIG'.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_KS_TEST.html
[STATS_MODE]
declaration=expr
category=Aggregate Functions
description=STATS_MODE takes as its argument a set of values and returns the value that\noccurs with the greatest frequency. If more than one mode exists, then Oracle\nDatabase chooses one and returns only that one value.\n\nTo obtain multiple modes (if multiple modes exist), you must use a combination\nof other functions, as shown in the hypothetical query:\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_MODE.html
[STATS_MW_TEST]
declaration=expr1, expr2 [, { 'STATISTIC' | 'U_STATISTIC' | 'ONE_SIDED_SIG' , expr3 | 'TWO_SIDED_SIG' } ]
category=Aggregate Functions
description=A Mann Whitney test compares two independent samples to test the null hypothesis\nthat two populations have the same distribution function against the alternative\nhypothesis that the two distribution functions are different.\n\nThe STATS_MW_TEST does not assume that the differences between the samples are\nnormally distributed, as do the STATS_T_TEST_* functions. This function takes\ntwo required arguments: expr1 classifies the data into groups and expr2 contains\nthe values for each of the groups. The optional third argument lets you specify\nthe meaning of the NUMBER value returned by this function, as shown in Table\n7-14. For this argument, you can specify a text literal, or a bind variable or\nexpression that evaluates to a constant character value. If you omit the third\nargument, then the default is 'TWO_SIDED_SIG'.\n\nThe significance of the observed value of Z or U is the probability that the\nvariances are different just by chance-a number between 0 and 1. A small value\nfor the significance indicates that the variances are significantly different.\nThe degree of freedom for each of the variances is the number of observations in\nthe sample minus 1.\n\nThe one-tailed significance is always in relation to the upper tail. The final\nargument, expr3, indicates which of the two groups specified by expr1 is the\nhigh value (the value whose rejection region is the upper tail).\n\nSTATS_MW_TEST computes the probability that the samples are from the same\ndistribution by checking the differences in the sums of the ranks of the values.\nIf the samples come from the same distribution, then the sums should be close in\nvalue.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_MW_TEST.html
[STATS_ONE_WAY_ANOVA]
declaration=expr1, expr2 [, { 'SUM_SQUARES_BETWEEN' | 'SUM_SQUARES_WITHIN' | 'DF_BETWEEN' | 'DF_WITHIN' | 'MEAN_SQUARES_BETWEEN' | 'MEAN_SQUARES_WITHIN' | 'F_RATIO' | 'SIG' } ]
category=Aggregate Functions
description=The one-way analysis of variance function (STATS_ONE_WAY_ANOVA) tests\ndifferences in means (for groups or variables) for statistical significance by\ncomparing two different estimates of variance. One estimate is based on the\nvariances within each group or category. This is known as the mean squares\nwithin or mean square error. The other estimate is based on the variances among\nthe means of the groups. This is known as the mean squares between. If the means\nof the groups are significantly different, then the mean squares between will be\nlarger than expected and will not match the mean squares within. If the mean\nsquares of the groups are consistent, then the two variance estimates will be\nabout the same.\n\nSTATS_ONE_WAY_ANOVA takes two required arguments: expr1 is an independent or\ngrouping variable that divides the data into a set of groups and expr2 is a\ndependent variable (a numeric expression) containing the values corresponding to\neach member of a group. The optional third argument lets you specify the meaning\nof the NUMBER value returned by this function, as shown in Table 7-15. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'SIG'.\n\nThe significance of one-way analysis of variance is determined by obtaining the\none-tailed significance of an f-test on the ratio of the mean squares between\nand the mean squares within. The f-test should use one-tailed significance,\nbecause the mean squares between can be only equal to or larger than the mean\nsquares within. Therefore, the significance returned by STATS_ONE_WAY_ANOVA is\nthe probability that the differences between the groups happened by chance-a\nnumber between 0 and 1. The smaller the number, the greater the significance of\nthe difference between the groups. Refer to the STATS_F_TEST for information on\nperforming an f-test.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_ONE_WAY_ANOVA.html
[STATS_T_TEST_INDEP]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
category=Aggregate Functions
description=The t-test functions are:\n\n- STATS_T_TEST_ONE: A one-sample t-test\n\n- STATS_T_TEST_PAIRED: A two-sample, paired t-test (also known as a crossed\nt-test)\n\n- STATS_T_TEST_INDEP: A t-test of two independent groups with the same variance\n(pooled variances)\n\n- STATS_T_TEST_INDEPU: A t-test of two independent groups with unequal variance\n(unpooled variances)\n\nThe t-test measures the significance of a difference of means. You can use it to\ncompare the means of two groups or the means of one group with a constant. Each\nt-test function takes two expression arguments, although the second expression\nis optional for the one-sample function (STATS_T_TEST_ONE). Each t-test function\ntakes an optional third argument, which lets you specify the meaning of the\nNUMBER value returned by the function, as shown in Table 7-16. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'TWO_SIDED_SIG'.\n\nThe two independent STATS_T_TEST_* functions can take a fourth argument (expr3)\nif the third argument is specified as 'STATISTIC' or 'ONE_SIDED_SIG'. In this\ncase, expr3 indicates which value of expr1 is the high value, or the value whose\nrejection region is the upper tail.\n\nThe significance of the observed value of t is the probability that the value of\nt would have been obtained by chance-a number between 0 and 1. The smaller the\nvalue, the more significant the difference between the means. One-sided\nsignificance is always respect to the upper tail. For one-sample and paired\nt-test, the high value is the first expression. For independent t-test, the high\nvalue is the one specified by expr3.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_T_TEST_.html
[STATS_T_TEST_INDEPU]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
category=Aggregate Functions
description=The t-test functions are:\n\n- STATS_T_TEST_ONE: A one-sample t-test\n\n- STATS_T_TEST_PAIRED: A two-sample, paired t-test (also known as a crossed\nt-test)\n\n- STATS_T_TEST_INDEP: A t-test of two independent groups with the same variance\n(pooled variances)\n\n- STATS_T_TEST_INDEPU: A t-test of two independent groups with unequal variance\n(unpooled variances)\n\nThe t-test measures the significance of a difference of means. You can use it to\ncompare the means of two groups or the means of one group with a constant. Each\nt-test function takes two expression arguments, although the second expression\nis optional for the one-sample function (STATS_T_TEST_ONE). Each t-test function\ntakes an optional third argument, which lets you specify the meaning of the\nNUMBER value returned by the function, as shown in Table 7-16. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'TWO_SIDED_SIG'.\n\nThe two independent STATS_T_TEST_* functions can take a fourth argument (expr3)\nif the third argument is specified as 'STATISTIC' or 'ONE_SIDED_SIG'. In this\ncase, expr3 indicates which value of expr1 is the high value, or the value whose\nrejection region is the upper tail.\n\nThe significance of the observed value of t is the probability that the value of\nt would have been obtained by chance-a number between 0 and 1. The smaller the\nvalue, the more significant the difference between the means. One-sided\nsignificance is always respect to the upper tail. For one-sample and paired\nt-test, the high value is the first expression. For independent t-test, the high\nvalue is the one specified by expr3.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_T_TEST_.html
[STATS_T_TEST_ONE]
declaration=expr1 [, expr2 ] [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
category=Aggregate Functions
description=The t-test functions are:\n\n- STATS_T_TEST_ONE: A one-sample t-test\n\n- STATS_T_TEST_PAIRED: A two-sample, paired t-test (also known as a crossed\nt-test)\n\n- STATS_T_TEST_INDEP: A t-test of two independent groups with the same variance\n(pooled variances)\n\n- STATS_T_TEST_INDEPU: A t-test of two independent groups with unequal variance\n(unpooled variances)\n\nThe t-test measures the significance of a difference of means. You can use it to\ncompare the means of two groups or the means of one group with a constant. Each\nt-test function takes two expression arguments, although the second expression\nis optional for the one-sample function (STATS_T_TEST_ONE). Each t-test function\ntakes an optional third argument, which lets you specify the meaning of the\nNUMBER value returned by the function, as shown in Table 7-16. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'TWO_SIDED_SIG'.\n\nThe two independent STATS_T_TEST_* functions can take a fourth argument (expr3)\nif the third argument is specified as 'STATISTIC' or 'ONE_SIDED_SIG'. In this\ncase, expr3 indicates which value of expr1 is the high value, or the value whose\nrejection region is the upper tail.\n\nThe significance of the observed value of t is the probability that the value of\nt would have been obtained by chance-a number between 0 and 1. The smaller the\nvalue, the more significant the difference between the means. One-sided\nsignificance is always respect to the upper tail. For one-sample and paired\nt-test, the high value is the first expression. For independent t-test, the high\nvalue is the one specified by expr3.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_T_TEST_.html
[STATS_T_TEST_PAIRED]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' | 'DF' } ]
category=Aggregate Functions
description=The t-test functions are:\n\n- STATS_T_TEST_ONE: A one-sample t-test\n\n- STATS_T_TEST_PAIRED: A two-sample, paired t-test (also known as a crossed\nt-test)\n\n- STATS_T_TEST_INDEP: A t-test of two independent groups with the same variance\n(pooled variances)\n\n- STATS_T_TEST_INDEPU: A t-test of two independent groups with unequal variance\n(unpooled variances)\n\nThe t-test measures the significance of a difference of means. You can use it to\ncompare the means of two groups or the means of one group with a constant. Each\nt-test function takes two expression arguments, although the second expression\nis optional for the one-sample function (STATS_T_TEST_ONE). Each t-test function\ntakes an optional third argument, which lets you specify the meaning of the\nNUMBER value returned by the function, as shown in Table 7-16. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'TWO_SIDED_SIG'.\n\nThe two independent STATS_T_TEST_* functions can take a fourth argument (expr3)\nif the third argument is specified as 'STATISTIC' or 'ONE_SIDED_SIG'. In this\ncase, expr3 indicates which value of expr1 is the high value, or the value whose\nrejection region is the upper tail.\n\nThe significance of the observed value of t is the probability that the value of\nt would have been obtained by chance-a number between 0 and 1. The smaller the\nvalue, the more significant the difference between the means. One-sided\nsignificance is always respect to the upper tail. For one-sample and paired\nt-test, the high value is the first expression. For independent t-test, the high\nvalue is the one specified by expr3.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_T_TEST_.html
[STATS_WSR_TEST]
declaration=expr1, expr2 [, { 'STATISTIC' | 'ONE_SIDED_SIG' | 'TWO_SIDED_SIG' } ]
category=Aggregate Functions
description=STATS_WSR_TEST is a Wilcoxon Signed Ranks test of paired samples to determine\nwhether the median of the differences between the samples is significantly\ndifferent from zero. The absolute values of the differences are ordered and\nassigned ranks. Then the null hypothesis states that the sum of the ranks of the\npositive differences is equal to the sum of the ranks of the negative\ndifferences.\n\nThis function takes two required arguments: expr1 and expr2 are the two samples\nbeing analyzed. The optional third argument lets you specify the meaning of the\nNUMBER value returned by this function, as shown in Table 7-17. For this\nargument, you can specify a text literal, or a bind variable or expression that\nevaluates to a constant character value. If you omit the third argument, then\nthe default is 'TWO_SIDED_SIG'.\n\nOne-sided significance is always with respect to the upper tail. The high value\n(the value whose rejection region is the upper tail) is expr1.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STATS_WSR_TEST.html
[STDDEV]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
description=STDDEV returns the sample standard deviation of expr, a set of numbers. You can\nuse it as both an aggregate and analytic function. It differs from STDDEV_SAMP\nin that STDDEV returns zero when it has only 1 row of input data, whereas\nSTDDEV_SAMP returns null.\n\nOracle Database calculates the standard deviation as the square root of the\nvariance defined for the VARIANCE aggregate function.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nIf you specify DISTINCT, then you can specify only the query_partition_clause of\nthe analytic_clause. The order_by_clause and windowing_clause are not allowed.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STDDEV.html
[STDDEV_POP]
declaration=expr
category=Aggregate Functions
description=STDDEV_POP computes the population standard deviation and returns the square\nroot of the population variance. You can use it as both an aggregate and\nanalytic function.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nThis function is the same as the square root of the VAR_POP function. When\nVAR_POP returns null, this function returns null.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STDDEV_POP.html
[STDDEV_SAMP]
declaration=expr
category=Aggregate Functions
description=STDDEV_SAMP computes the cumulative sample standard deviation and returns the\nsquare root of the sample variance. You can use it as both an aggregate and\nanalytic function.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nThis function is same as the square root of the VAR_SAMP function. When VAR_SAMP\nreturns null, this function returns null.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/STDDEV_SAMP.html
[SUBSTR]
declaration=char, position [, substring_length ]
category=Character Functions Returning Character Values
description=The SUBSTR functions return a portion of char, beginning at character position,\nsubstring_length characters long. SUBSTR calculates lengths using characters as\ndefined by the input character set. SUBSTRB uses bytes instead of characters.\nSUBSTRC uses Unicode complete characters. SUBSTR2 uses UCS2 code points. SUBSTR4\nuses UCS4 code points.\n\n- If position is 0, then it is treated as 1.\n\n- If position is positive, then Oracle Database counts from the beginning of\nchar to find the first character.\n\n- If position is negative, then Oracle counts backward from the end of char.\n\n- If substring_length is omitted, then Oracle returns all characters to the end\nof char. If substring_length is less than 1, then Oracle returns null.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are SUBSTRC, SUBSTR2, and SUBSTR4, which do not allow char\nto be a CLOB or NCLOB. Both position and substring_length must be of data type\nNUMBER, or any data type that can be implicitly converted to NUMBER, and must\nresolve to an integer. The return value is the same data type as char, except\nthat for a CHAR argument a VARCHAR2 value is returned, and for an NCHAR argument\nan NVARCHAR2 value is returned. Floating-point numbers passed as arguments to\nSUBSTR are automatically converted to integers.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SUBSTR.html
[SUBSTR2]
declaration=char, position [, substring_length ]
category=Character Functions Returning Character Values
description=The SUBSTR functions return a portion of char, beginning at character position,\nsubstring_length characters long. SUBSTR calculates lengths using characters as\ndefined by the input character set. SUBSTRB uses bytes instead of characters.\nSUBSTRC uses Unicode complete characters. SUBSTR2 uses UCS2 code points. SUBSTR4\nuses UCS4 code points.\n\n- If position is 0, then it is treated as 1.\n\n- If position is positive, then Oracle Database counts from the beginning of\nchar to find the first character.\n\n- If position is negative, then Oracle counts backward from the end of char.\n\n- If substring_length is omitted, then Oracle returns all characters to the end\nof char. If substring_length is less than 1, then Oracle returns null.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are SUBSTRC, SUBSTR2, and SUBSTR4, which do not allow char\nto be a CLOB or NCLOB. Both position and substring_length must be of data type\nNUMBER, or any data type that can be implicitly converted to NUMBER, and must\nresolve to an integer. The return value is the same data type as char, except\nthat for a CHAR argument a VARCHAR2 value is returned, and for an NCHAR argument\nan NVARCHAR2 value is returned. Floating-point numbers passed as arguments to\nSUBSTR are automatically converted to integers.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SUBSTR.html
