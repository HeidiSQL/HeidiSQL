description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- fmt is a text expression representing a format string. In all cases, the\ncase-sensitivity of the format specifiers follows the same behavior as TO_CHAR.\nFor example, MON specifies an abbreviated month in upper-case (e.g. JAN), mon\nspecifies an abbreviated month name in lower-case (e.g. jan), and Mon specifies\nan abbreviated month name in title-case (e.g. Jan).\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\n- All fiscal functions take an optional fiscal_year_start parameter defining the\nmonth and day of the start of the fiscal year.\n\nIf the fiscal_year_start parameter is specified, it's an expression of type\nDATE, TIMESTAMP, TIMESTAMP WITH TIME ZONE, or TIMESTAMP WITH LOCAL TIME ZONE\nrepresenting the first day in the fiscal year. All components other than the\nmonth and day are ignored.\n\nIf the fiscal_year_start function argument is not specified, the value of the\nCALENDAR_FISCAL_YEAR_START system/session parameter is used (which itself\ndefaults to January 1 if not specified). The CALENDAR_FISCAL_YEAR_START\nsystem/session parameter is a text value that will be converted to a DATE using\nthe NLS_DATE_FORMAT. An optional second parameter value may be specified to use\nan explicit format, such as:\n\n- The index_by parameter is a text value that must resolve to either POSITION or\nDATE (case-insensitive, defaults to DATE). It is used to distinguish between\nabsolute and position-based numbers for the following cases:\n\n- CALENDAR_DAY_OF_WEEK\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/fiscal_x_of_y.html
