[ABS]
declaration=n
category=Numeric Functions
description=ABS returns the absolute value of n.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ABS.html
[ACOS]
declaration=n
category=Numeric Functions
description=ACOS returns the arc cosine of n. The argument n must be in the range of -1 to\n1, and the function returns a value in the range of 0 to pi, expressed in\nradians.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ACOS.html
[ADD_MONTHS]
declaration=date, integer
category=Datetime Functions
description=ADD_MONTHS returns the date date plus integer months. A month is defined by the\nsession parameter NLS_CALENDAR. The date argument can be a datetime value or any\nvalue that can be implicitly converted to DATE. The integer argument can be an\ninteger or any value that can be implicitly converted to an integer. The return\ntype is always DATE, regardless of the data type of date. If date is the last\nday of the month or if the resulting month has fewer days than the day component\nof date, then the result is the last day of the resulting month. Otherwise, the\nresult has the same day component as date.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ADD_MONTHS.html
[ANY_VALUE]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
since=21
description=ANY_VALUE returns a single non-deterministic value of expr. You can use it as an\naggregate function.\n\nUse ANY_VALUE to optimize a query that has a GROUP BY clause. ANY_VALUE returns\na value of an expression in a group. It is optimized to return the first value.\n\nIt ensures that there are no comparisons for any incoming row and also\neliminates the necessity to specify every column as part of the GROUP BY clause.\nBecause it does not compare values, ANY_VALUE returns a value more quickly than\nMIN or MAX in a GROUP BY query.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ANY_VALUE.html
[APPROX_COUNT]
declaration=(* | expr) [ , 'MAX_ERROR' ]
category=Aggregate Functions
description=APPROX_COUNT returns the approximate count of an expression. If you supply\nMAX_ERROR as the second argument, then the function returns the maximum error\nbetween the actual and approximate count.\n\nYou must use this function with a corresponding APPROX_RANK function in the\nHAVING clause. If a query uses APPROX_COUNT, APPROX_SUM, or APPROX_RANK, then\nthe query must not use any other aggregation functions.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_COUNT.html
[APPROX_COUNT_DISTINCT]
declaration=expr
category=Aggregate Functions
description=APPROX_COUNT_DISTINCT returns the approximate number of rows that contain a\ndistinct value for expr.\n\nThis function provides an alternative to the COUNT (DISTINCT expr) function,\nwhich returns the exact number of rows that contain distinct values of expr.\nAPPROX_COUNT_DISTINCT processes large amounts of data significantly faster than\nCOUNT, with negligible deviation from the exact result.\n\nFor expr, you can specify a column of any scalar data type other than BFILE,\nBLOB, CLOB, LONG, LONG RAW, or NCLOB.\n\nAPPROX_COUNT_DISTINCT ignores rows that contain a null value for expr. This\nfunction returns a NUMBER.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_COUNT_DISTINCT.html
[APPROX_COUNT_DISTINCT_AGG]
declaration=detail
category=Aggregate Functions
description=APPROX_COUNT_DISTINCT_AGG takes as its input a column of details containing\ninformation about approximate distinct value counts, and enables you to perform\naggregations of those counts.\n\nFor detail, specify a column of details created by the\nAPPROX_COUNT_DISTINCT_DETAIL function or the APPROX_COUNT_DISTINCT_AGG function.\nThis column is of data type BLOB.\n\nYou can specify this function in a SELECT statement with a GROUP BY clause to\naggregate the information contained in the details within each group of rows and\nreturn a single detail for each group.\n\nThis function returns a BLOB value, called a detail, which contains information\nabout the count aggregations in a special format. You can store details returned\nby this function in a table or materialized view, and then again use the\nAPPROX_COUNT_DISTINCT_AGG function to further aggregate those details, or use\nthe TO_APPROX_COUNT_DISTINCT function to convert the detail values to\nhuman-readable NUMBER values.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_COUNT_DISTINCT_AGG.html
[APPROX_COUNT_DISTINCT_DETAIL]
declaration=expr
category=Aggregate Functions
description=APPROX_COUNT_DISTINCT_DETAIL calculates information about the approximate number\nof rows that contain a distinct value for expr and returns a BLOB value, called\na detail, which contains that information in a special format.\n\nFor expr, you can specify a column of any scalar data type other than BFILE,\nBLOB, CLOB, LONG, LONG RAW, or NCLOB. This function ignores rows for which the\nvalue of expr is null.\n\nThis function is commonly used with the GROUP BY clause in a SELECT statement.\nWhen used in this way, it calculates approximate distinct value count\ninformation for expr within each group of rows and returns a single detail for\neach group.\n\nThe details returned by APPROX_COUNT_DISTINCT_DETAIL can be used as input to the\nAPPROX_COUNT_DISTINCT_AGG function, which enables you to perform aggregations of\nthe details, or the TO_APPROX_COUNT_DISTINCT function, which converts a detail\nto a human-readable distinct count value. You can use these three functions\ntogether to perform resource-intensive approximate count calculations once,\nstore the resulting details, and then perform efficient aggregations and queries\non those details. For example:\n\n- Use the APPROX_COUNT_DISTINCT_DETAIL function to calculate approximate\ndistinct value count information and store the resulting details in a table or\nmaterialized view. These could be highly-granular details, such as city\ndemographic counts or daily sales counts.\n\n- Use the APPROX_COUNT_DISTINCT_AGG function to aggregate the details obtained\nin the previous step and store the resulting details in a table or materialized\nview. These could be details of lower granularity, such as state demographic\ncounts or monthly sales counts.\n\n- Use the TO_APPROX_COUNT_DISTINCT function to convert the stored detail values\nto human-readable NUMBER values. You can use the TO_APPROX_COUNT_DISTINCT\nfunction to query detail values created by the APPROX_COUNT_DISTINCT_DETAIL\nfunction or the APPROX_COUNT_DISTNCT_AGG function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_COUNT_DISTINCT_DETAIL.html
[APPROX_MEDIAN]
declaration=expr [ DETERMINISTIC ] [, { 'ERROR_RATE' | 'CONFIDENCE' } ]
category=Aggregate Functions
description=APPROX_MEDIAN is an approximate inverse distribution function that assumes a\ncontinuous distribution model. It takes a numeric or datetime value and returns\nan approximate middle value or an approximate interpolated value that would be\nthe middle value once the values are sorted. Nulls are ignored in the\ncalculation.\n\nThis function provides an alternative to the MEDIAN function, which returns the\nexact middle value or interpolated value. APPROX_MEDIAN processes large amounts\nof data significantly faster than MEDIAN, with negligible deviation from the\nexact result.\n\nFor expr, specify the expression for which the approximate median value is being\ncalculated. The acceptable data types for expr, and the return value data type\nfor this function, depend on the algorithm that you specify with the\nDETERMINISTIC clause.\n\nDETERMINISTIC\n\nThis clause lets you specify the type of algorithm this function uses to\ncalculate the approximate median value.\n\n- If you specify DETERMINISTIC, then this function calculates a deterministic\napproximate median value. In this case, expr must evaluate to a numeric value,\nor to a value that can be implicitly converted to a numeric value. The function\nreturns the same data type as the numeric data type of its argument.\n\n- If you omit DETERMINSTIC, then this function calculates a nondeterministic\napproximate median value. In this case, expr must evaluate to a numeric or\ndatetime value, or to a value that can be implicitly converted to a numeric or\ndatetime value. The function returns the same data type as the numeric or\ndatetime data type of its argument.\n\nERROR_RATE | CONFIDENCE\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_MEDIAN.html
[APPROX_PERCENTILE]
declaration=expr [ DETERMINISTIC ] [, { 'ERROR_RATE' | 'CONFIDENCE' } ]
category=Aggregate Functions
description=APPROX_PERCENTILE is an approximate inverse distribution function. It takes a\npercentile value and a sort specification, and returns the value that would fall\ninto that percentile value with respect to the sort specification. Nulls are\nignored in the calculation\n\nThis function provides an alternative to the PERCENTILE_CONT and PERCENTILE_DISC\nfunctions, which returns the exact results. APPROX_PERCENTILE processes large\namounts of data significantly faster than PERCENTILE_CONT and PERCENTILE_DISC,\nwith negligible deviation from the exact result.\n\nThe first expr is the percentile value, which must evaluate to a numeric value\nbetween 0 and 1.\n\nThe second expr, which is part of the ORDER BY clause, is a single expression\nover which this function calculates the result. The acceptable data types for\nexpr, and the return value data type for this function, depend on the algorithm\nthat you specify with the DETERMINISTIC clause.\n\nDETERMINISTIC\n\nThis clause lets you specify the type of algorithm this function uses to\ncalculate the return value.\n\n- If you specify DETERMINISTIC, then this function calculates a deterministic\nresult. In this case, the ORDER BY clause expression must evaluate to a numeric\nvalue, or to a value that can be implicitly converted to a numeric value, in the\nrange -2,147,483,648 through 2,147,483,647. The function rounds numeric input to\nthe closest integer. The function returns the same data type as the numeric data\ntype of the ORDER BY clause expression. The return value is not necessarily one\nof the values of expr\n\n- If you omit DETERMINSTIC, then this function calculates a nondeterministic\nresult. In this case, the ORDER BY clause expression must evaluate to a numeric\nor datetime value, or to a value that can be implicitly converted to a numeric\nor datetime value. The function returns the same data type as the numeric or\ndatetime data type of the ORDER BY clause expression. The return value is one of\nthe values of expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_PERCENTILE.html
[APPROX_PERCENTILE_AGG]
declaration=expr
category=Aggregate Functions
description=APPROX_PERCENTILE_AGG takes as its input a column of details containing\napproximate percentile information, and enables you to perform aggregations of\nthat information.\n\nFor detail, specify a column of details created by the APPROX_PERCENT_DETAIL\nfunction or the APPROX_PERCENTILE_AGG function. This column is of data type\nBLOB.\n\nYou can specify this function in a SELECT statement with a GROUP BY clause to\naggregate the information contained in the details within each group of rows and\nreturn a single detail for each group.\n\nThis function returns a BLOB value, called a detail, which contains approximate\npercentile information in a special format. You can store details returned by\nthis function in a table or materialized view, and then again use the\nAPPROX_PERCENTILE_AGG function to further aggregate those details, or use the\nTO_APPROX_PERCENTILE function to convert the details to specified percentile\nvalues.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_PERCENTILE_AGG.html
[APPROX_PERCENTILE_DETAIL]
declaration=expr [ DETERMINISTIC ]
category=Aggregate Functions
description=APPROX_PERCENTILE_DETAIL calculates approximate percentile information for the\nvalues of expr and returns a BLOB value, called a detail, which contains that\ninformation in a special format.\n\nThe acceptable data types for expr depend on the algorithm that you specify with\nthe DETERMINISTIC clause. Refer to the DETERMINISTIC clause for more\ninformation.\n\nThis function is commonly used with the GROUP BY clause in a SELECT statement.\nIt calculates approximate percentile information for expr within each group of\nrows and returns a single detail for each group.\n\nThe details returned by APPROX_PERCENTILE_DETAIL can be used as input to the\nAPPROX_PERCENTILE_AGG function, which enables you to perform aggregations of the\ndetails, or the TO_APPROX_PERCENTILE function, which converts a detail to a\nspecified percentile value. You can use these three functions together to\nperform resource-intensive approximate percentile calculations once, store the\nresulting details, and then perform efficient aggregations and queries on those\ndetails. For example:\n\n- Use the APPROX_PERCENTILE_DETAIL function to perform approximate percentile\ncalculations and store the resulting details in a table or materialized view.\nThese could be highly-granular percentile details, such as income percentile\ninformation for cities.\n\n- Use the APPROX_PERCENTILE_AGG function to aggregate the details obtained in\nthe previous step and store the resulting details in a table or materialized\nview. These could be details of lower granularity, such as income percentile\ninformation for states.\n\n- Use the TO_APPROX_PERCENTILE function to convert the stored detail values to\npercentile values. You can use the TO_APPROX_PERCENTILE function to query detail\nvalues created by the APPROX_PERCENTILE_DETAIL function or the\nAPPROX_PERCENTILE_AGG function.\n\nDETERMINISTIC\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_PERCENTILE_DETAIL.html
[APPROX_RANK]
declaration=expr [ PARTITION BY partition_by_clause ] [ ORDER BY order_by_clause DESC]
category=Aggregate Functions
description=APPROX_RANK returns the approximate value in a group of values.\n\nThis function takes an optional PARTITION BY clause followed by a mandatory\nORDER BY ... DESC clause. The PARTITION BY key must be a subset of the GROUP BY\nkey. The ORDER BY clause must include either APPROX_COUNT or APPROX_SUM.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_RANK.html
[APPROX_SUM]
declaration=(* | expr)[ , 'MAX_ERROR' ]
category=Aggregate Functions
description=APPROX_SUM returns the approximate sum of an expression. If you supply MAX_ERROR\nas the second argument, then the function returns the maximum error between the\nactual and approximate sum.\n\nYou must use this function with a corresponding APPROX_RANK function in the\nHAVING clause. If a query uses APPROX_COUNT, APPROX_SUM, or APPROX_RANK, then\nthe query must not use any other aggregation functions.\n\nNote that APPROX_SUM returns an error when the input is a negative number.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/APPROX_SUM.html
[ASCII]
declaration=char
category=Character Functions Returning Number Values
description=ASCII returns the decimal representation in the database character set of the\nfirst character of char.\n\nchar can be of data type CHAR, VARCHAR2, NCHAR, or NVARCHAR2. The value returned\nis of data type NUMBER. If your database character set is 7-bit ASCII, then this\nfunction returns an ASCII value. If your database character set is EBCDIC Code,\nthen this function returns an EBCDIC value. There is no corresponding EBCDIC\ncharacter function.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ASCII.html
[ASCIISTR]
declaration=char
category=Conversion Functions
description=ASCIISTR takes as its argument a string, or an expression that resolves to a\nstring, in any character set and returns an ASCII version of the string in the\ndatabase character set. Non-ASCII characters are converted to the form \xxxx,\nwhere xxxx represents a UTF-16 code unit.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ASCIISTR.html
[ASIN]
declaration=n
category=Numeric Functions
description=ASIN returns the arc sine of n. The argument n must be in the range of -1 to 1,\nand the function returns a value in the range of -pi/2 to pi/2, expressed in\nradians.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ASIN.html
[ATAN]
declaration=n
category=Numeric Functions
description=ATAN returns the arc tangent of n. The argument n can be in an unbounded range\nand returns a value in the range of -pi/2 to pi/2, expressed in radians.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ATAN.html
[ATAN2]
declaration=n1 , n2
category=Numeric Functions
description=ATAN2 returns the arc tangent of n1 and n2. The argument n1 can be in an\nunbounded range and returns a value in the range of -pi to pi, depending on the\nsigns of n1 and n2, expressed in radians.\n\nThis function takes as arguments any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If any argument is\nBINARY_FLOAT or BINARY_DOUBLE, then the function returns BINARY_DOUBLE.\nOtherwise the function returns NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/ATAN2.html
[AVG]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
description=AVG returns average value of expr.\n\nIt takes as an argument any numeric data type or any nonnumeric data type that\ncan be implicitly converted to a numeric data type or an interval data type.\n\nThe function returns the same data type as the numeric data type of the\nargument. If the input is an interval, this returns an interval with the same\nunits as the input.\n\nIf you specify DISTINCT, then you can specify only the query_partition_clause of\nthe analytic_clause. The order_by_clause and windowing_clause are not allowed.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/AVG.html
[BAR_CHART]
declaration=value [, maximum ] [, minimum ] [, width ] [, symbol ]
category=Numeric Functions
since=23
description=You can use the SQL function BAR_CHART to display a numeric or Boolean value as\na bar of characters. You can specify the range represented by the bar, its\nwidth, and the character used to draw it.\n\nThe function returns a character representation for display with the data in a\nquery result.\n\nThe BAR_CHART function requires the value argument. You can optionally specify\nmaximum, minimum, width, and symbol, in that order. If you specify an optional\nargument, you must also specify all preceding optional arguments.\n\nvalue\n\nThe first argument value is a numeric or Boolean expression that determines the\nlength of the bar. It can be a numeric literal, column value, bind variable, or\nanother numeric or Boolean expression. For a numeric value, BAR_CHART maps the\nvalue to a bar between length 0 and width, based on the range from minimum to\nmaximum.\n\nIf value is less than minimum, it is treated as minimum. If value is greater\nthan maximum, it is treated as maximum. If value is null, the function returns\nnull.\n\nFor a Boolean value, TRUE is treated as 1 and FALSE as 0.\n\nmaximum\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/bar_chart-operator.html
[BFILENAME]
declaration='directory', 'filename'
category=Large Object Functions
description=BFILENAME returns a BFILE locator that is associated with a physical LOB binary\nfile on the server file system.\n\n- 'directory' is a database object that serves as an alias for a full path name\non the server file system where the files are actually located.\n\n- 'filename' is the name of the file in the server file system.\n\nYou must create the directory object and associate a BFILE value with a physical\nfile before you can use them as arguments to BFILENAME in a SQL or PL/SQL\nstatement, DBMS_LOB package, or OCI operation.\n\nYou can use this function in two ways:\n\n- In a DML statement to initialize a BFILE column\n\n- In a programmatic interface to access BFILE data by assigning a value to the\nBFILE locator\n\nThe directory argument is case sensitive. You must ensure that you specify the\ndirectory object name exactly as it exists in the data dictionary. For example,\nif an "Admin" directory object was created using mixed case and a quoted\nidentifier in the CREATE DIRECTORY statement, then when using the BFILENAME\nfunction you must refer to the directory object as 'Admin'. You must specify the\nfilename argument according to the case and punctuation conventions for your\noperating system.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/BFILENAME.html
[BIN_TO_NUM]
declaration=expr [, expr ]...
category=Conversion Functions
description=BIN_TO_NUM converts a bit vector to its equivalent number. Each argument to this\nfunction represents a bit in the bit vector. This function takes as arguments\nany numeric data type, or any nonnumeric data type that can be implicitly\nconverted to NUMBER. Each expr must evaluate to 0 or 1. This function returns\nOracle NUMBER.\n\nBIN_TO_NUM is useful in data warehousing applications for selecting groups of\ninterest from a materialized view using grouping sets.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/BIN_TO_NUM.html
[BITAND]
declaration=expr1, expr2
category=Numeric Functions
description=The BITAND function treats its inputs and its output as vectors of bits; the\noutput is the bitwise AND of the inputs.\n\nThe types of expr1 and expr2 are NUMBER, and the result is of type NUMBER. If\neither argument to BITAND is NULL, the result is NULL.\n\nThe arguments must be in the range -(2(n-1)) .. ((2(n-1))-1). If an argument is\nout of this range, the result is undefined.\n\nThe result is computed in several steps. First, each argument A is replaced with\nthe value SIGN(A)*FLOOR(ABS(A)). This conversion has the effect of truncating\neach argument towards zero. Next, each argument A (which must now be an integer\nvalue) is converted to an n-bit two's complement binary integer value. The two\nbit values are combined using a bitwise AND operation. Finally, the resulting\nn-bit two's complement value is converted back to NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/BITAND.html
[BIT_AND_AGG]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=BIT_AND_AGG is a bitwise aggregation function that returns the result of a\nbitwise AND operation.\n\nYou can use ` BIT_AND_AGG as part of a GROUP BY query, window function, or as an\nanalytical function. The return type of BIT_AND_AGG` is always a number.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/BIT_AND_AGG.html
[BIT_OR_AGG]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=BIT_OR_AGG is a bitwise aggregation function that returns the result of a\nbitwise OR operation.\n\nYou can use BIT_OR_AGG as part of a GROUP BY query, window function, or as an\nanalytical function. The return type of BIT_OR_AGG is always a number.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/BIT_OR_AGG.html
[BIT_XOR_AGG]
declaration=[DISTINCT | ALL | UNIQUE] expr
category=Aggregate Functions
since=21
description=BIT_XOR_AGG is a bitwise aggregation function that returns the result of a\nbitwise XOR operation.\n\nYou can use ` BIT_XOR_AGG as part of a GROUP BY query, window function, or as an\nanalytical function. The return type of BIT_XOR_AGG` is always a number.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/BIT_XOR_AGG.html
[BOOLEAN_AND_AGG]
declaration=[ DISTINCT | ALL ] boolean_expr
category=Aggregate Functions
since=23
description=BOOLEAN_AND_AGG returns 'TRUE' if the boolean_expr evaluates to true for every\nrow that qualifies. Otherwise it returns 'FALSE'. You can use it as an aggregate\nor analytic function.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/boolean_and_agg.html
[BOOLEAN_OR_AGG]
declaration=[ DISTINCT | ALL ] boolean_expr
category=Aggregate Functions
since=23
description=BOOLEAN_OR_AGG returns 'TRUE' if the boolean_expr evaluates to true for at least\none row that qualifies. Otherwise it returns 'FALSE'. You can use it as an\naggregate or analytic function.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/boolean_or_agg.html
[CALENDAR_ADD_DAYS]
declaration=dtexpr , num_periods [ , nlsparam ]
category=Calendar Functions
since=23
description=These functions add (or subtract if interval is negative) a given number of\nperiods from the given date based on the Gregorian calendar.\n\n- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- The num_periods parameter is an integer that when positive will add periods\nand when negative will subtract periods.\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\nThe CALENDAR_ADD_X_PERIODS, FISCAL_ADD_X_PERIODS, and RETAIL_ADD_X_PERIODS\nfunctions take a num_periods parameter indicating how many periods (years,\nquarters, months, weeks, days) to add to the given dtexpr. The functions will\nreturn a DATE (with hour/minute/second components retained from the given DATE).\n\nCALENDAR_ADD_YEARS adds or subtracts the given number of years, where a year is\nalways defined as a period of 12 months.\n\nCALENDAR_ADD_QUARTERS adds or subtracts the given number of quarters, where a\nquarter is always defined as a period of 3 months.\n\nCALENDAR_ADD_MONTHS is identical to the existing ADD_MONTHS function. This will\nadd or subtract to get a target month. If the given date is the last day of its\nmonth or if the resulting month has fewer days than the day component of the\ngiven date, the last day of the resulting month is used. Otherwise, the result\nhas the same day component as the given date.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/calendar_add_x_periods.html
[CALENDAR_ADD_MONTHS]
declaration=dtexpr , num_periods [ , nlsparam ]
category=Calendar Functions
since=23
description=These functions add (or subtract if interval is negative) a given number of\nperiods from the given date based on the Gregorian calendar.\n\n- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- The num_periods parameter is an integer that when positive will add periods\nand when negative will subtract periods.\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\nThe CALENDAR_ADD_X_PERIODS, FISCAL_ADD_X_PERIODS, and RETAIL_ADD_X_PERIODS\nfunctions take a num_periods parameter indicating how many periods (years,\nquarters, months, weeks, days) to add to the given dtexpr. The functions will\nreturn a DATE (with hour/minute/second components retained from the given DATE).\n\nCALENDAR_ADD_YEARS adds or subtracts the given number of years, where a year is\nalways defined as a period of 12 months.\n\nCALENDAR_ADD_QUARTERS adds or subtracts the given number of quarters, where a\nquarter is always defined as a period of 3 months.\n\nCALENDAR_ADD_MONTHS is identical to the existing ADD_MONTHS function. This will\nadd or subtract to get a target month. If the given date is the last day of its\nmonth or if the resulting month has fewer days than the day component of the\ngiven date, the last day of the resulting month is used. Otherwise, the result\nhas the same day component as the given date.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/calendar_add_x_periods.html
