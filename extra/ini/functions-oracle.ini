[SUBSTRC]
declaration=char, position [, substring_length ]
category=Character Functions Returning Character Values
description=The SUBSTR functions return a portion of char, beginning at character position,\nsubstring_length characters long. SUBSTR calculates lengths using characters as\ndefined by the input character set. SUBSTRB uses bytes instead of characters.\nSUBSTRC uses Unicode complete characters. SUBSTR2 uses UCS2 code points. SUBSTR4\nuses UCS4 code points.\n\n- If position is 0, then it is treated as 1.\n\n- If position is positive, then Oracle Database counts from the beginning of\nchar to find the first character.\n\n- If position is negative, then Oracle counts backward from the end of char.\n\n- If substring_length is omitted, then Oracle returns all characters to the end\nof char. If substring_length is less than 1, then Oracle returns null.\n\nchar can be any of the data types CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or\nNCLOB. The exceptions are SUBSTRC, SUBSTR2, and SUBSTR4, which do not allow char\nto be a CLOB or NCLOB. Both position and substring_length must be of data type\nNUMBER, or any data type that can be implicitly converted to NUMBER, and must\nresolve to an integer. The return value is the same data type as char, except\nthat for a CHAR argument a VARCHAR2 value is returned, and for an NCHAR argument\nan NVARCHAR2 value is returned. Floating-point numbers passed as arguments to\nSUBSTR are automatically converted to integers.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SUBSTR.html
[SUM]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
description=SUM returns the sum of values of expr. You can use it as an aggregate or\nanalytic function.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nRelease 23 adds support for INTERVAL interval data types. However interval data\ntypes cannot be implicitly converted to a numeric data type. If the input is an\nINTERVAL, the function returns an INTERVAL with the same units as the input.\n\nIf you specify DISTINCT, then you can specify only the query_partition_clause of\nthe analytic_clause. The order_by_clause and windowing_clause are not allowed.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SUM.html
[SYS_CONNECT_BY_PATH]
declaration=column, char
category=Hierarchical Functions
description=SYS_CONNECT_BY_PATH is valid only in hierarchical queries. It returns the path\nof a column value from root to node, with column values separated by char for\neach row returned by CONNECT BY condition.\n\nBoth column and char can be any of the data types CHAR, VARCHAR2, NCHAR, or\nNVARCHAR2. The string returned is of VARCHAR2 data type and is in the same\ncharacter set as column.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_CONNECT_BY_PATH.html
[SYS_CONTEXT]
declaration='namespace', 'parameter' [, length ]
category=Environment and Identifier Functions
description=SYS_CONTEXT returns the value of parameter associated with the context namespace\nat the current instant. You can use this function in both SQL and PL/SQL\nstatements. SYS_CONTEXT must be executed locally.\n\nFor namespace and parameter, you can specify either a string or an expression\nthat resolves to a string designating a namespace or an attribute. If you\nspecify literal arguments for namespace and parameter, and you are using\nSYS_CONTEXT explicitly in a SQL statement-rather than in a PL/SQL function that\nin turn is in mentioned in a SQL statement-then Oracle Database evaluates\nSYS_CONTEXT only once per SQL statement execution for each call site that\ninvokes the SYS_CONTEXT function.\n\nThe context namespace must already have been created, and the associated\nparameter and its value must also have been set using the\nDBMS_SESSION.set_context procedure. The namespace must be a valid identifier.\nThe parameter name can be any string. It is not case sensitive, but it cannot\nexceed 30 bytes in length.\n\nThe data type of the return value is VARCHAR2. The default maximum size of the\nreturn value is 256 bytes. You can override this default by specifying the\noptional length parameter, which must be a NUMBER or a value that can be\nimplicitly converted to NUMBER. The valid range of values is 1 to 4000 bytes. If\nyou specify an invalid value, then Oracle Database ignores it and uses the\ndefault.\n\nOracle provides the following built-in namespaces:\n\n- USERENV - Describes the current session. The predefined parameters of\nnamespace USERENV are listed in Table 7-18.\n\nSYS_SESSION_ROLES - Indicates whether a specified role is currently enabled for\nthe session. Oracle Database evaluates the ` SYS_SESSION_ROLES context for the\ncurrent user, and assumes the defining user's role when it evaluates\nSYS_SESSION_ROLES within a definer's rights procedure or function. An\nalternative to using SYS_SESSION_ROLES to find the login user's enabled roles in\na definer's rights procedure is to use the DBMS_SESSION:SESSION_IS_ROLE_ENABLED`\nfunction. Invoker's rights, procedures or functions, and/or code based access\ncontrol (CBAC) are also alternatives.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_CONTEXT.html
[SYS_DBURIGEN]
declaration={ column | attribute } [ rowid ] [, { column | attribute } [ rowid ] ]... [, 'text ()' ]
category=XML Functions
description=SYS_DBURIGen takes as its argument one or more columns or attributes, and\noptionally a rowid, and generates a URL of data type DBURIType to a particular\ncolumn or row object. You can then use the URL to retrieve an XML document from\nthe database.\n\nAll columns or attributes referenced must reside in the same table. They must\nperform the function of a primary key. They need not actually match the primary\nkey of the table, but they must reference a unique value. If you specify\nmultiple columns, then all but the final column identify the row in the\ndatabase, and the last column specified identifies the column within the row.\n\nBy default the URL points to a formatted XML document. If you want the URL to\npoint only to the text of the document, then specify the optional 'text()'.\n\nIf the table or view containing the columns or attributes does not have a schema\nspecified in the context of the query, then Oracle Database interprets the table\nor view name as a public synonym.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_DBURIGEN.html
[SYS_EXTRACT_UTC]
declaration=datetime_with_timezone
category=Datetime Functions
description=SYS_EXTRACT_UTC extracts the UTC (Coordinated Universal Time-formerly Greenwich\nMean Time) from a datetime value with time zone offset or time zone region name.\nIf a time zone is not specified, then the datetime is associated with the\nsession time zone.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_EXTRACT_UTC.html
[SYS_GUID]
declaration=
category=Environment and Identifier Functions
description=SYS_GUID generates and returns a globally unique identifier (RAW value) made up\nof 16 bytes. On most platforms, the generated identifier consists of a host\nidentifier, a process or thread identifier of the process or thread invoking the\nfunction, and a nonrepeating value (sequence of bytes) for that process or\nthread.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_GUID.html
[SYS_OP_ZONE_ID]
declaration=[ [ schema. ] table. | t_alias. ] rowid [, scale ]
category=Aggregate Functions
description=SYS_OP_ZONE_ID takes as its argument a rowid and returns a zone ID. The rowid\nidentifies a row in a table. The zone ID identifies the set of contiguous disk\nblocks, called the zone, that contains the row. The function returns a NUMBER\nvalue.\n\nThe SYS_OP_ZONE_ID function is used when creating a zone map with the CREATE\nMATERIALIZED ZONEMAP statement. You must specify SYS_OP_ZONE_ID in the SELECT\nand GROUP BY clauses of the defining subquery of the zone map.\n\nFor rowid, specify the ROWID pseudocolumn of the fact table of the zone map.\n\nUse schema and table to specify the schema and name of the fact table, or\nt_alias to specify the table alias for the fact table. The specification of\nthese parameters depends on the FROM clause in the defining subquery of the zone\nmap:\n\n- If the FROM clause specifies a table alias for the fact table, then you must\nalso specify the table alias (t_alias) in SYS_OP_ZONE_ID.\n\n- If the FROM clause does not specify a table alias for the fact table, then use\ntable to specify the name of the fact table. You can use the schema qualifier if\nthe fact table is in a schema other than your own. If you omit schema, then the\ndatabase assumes the fact table is in your own schema. If the FROM clause\nspecifies only one table (the fact table) then you need not specify schema or\ntable.\n\nThe optional scale parameter represents the scale of the zone map. It is not\nnecessary to specify this parameter because, by default, SYS_OP_ZONE_ID uses the\nscale of the zone map being created. If you do specify scale, then it must match\nthe scale of the zone map being created. Refer to the SCALE clause of CREATE\nMATERIALIZED ZONEMAP for information on specifying the scale of a zone map.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_OP_ZONE_ID.html
[SYS_TYPEID]
declaration=object_type_value
category=Environment and Identifier Functions
description=SYS_TYPEID returns the typeid of the most specific type of the operand. This\nvalue is used primarily to identify the type-discriminant column underlying a\nsubstitutable column. For example, you can use the value returned by SYS_TYPEID\nto build an index on the type-discriminant column.\n\nYou can use this function only on object type operands. All final root object\ntypes-final types not belonging to a type hierarchy-have a null typeid. Oracle\nDatabase assigns to all types belonging to a type hierarchy a unique non-null\ntypeid.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_TYPEID.html
[SYS_XMLAGG]
declaration=expr [, fmt ]
category=XML Functions
description=SYS_XMLAgg aggregates all of the XML documents or fragments represented by expr\nand produces a single XML document. It adds a new enclosing element with a\ndefault name ROWSET. If you want to format the XML document differently, then\nspecify fmt, which is an instance of the XMLFormat object.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_XMLAGG.html
[SYS_XMLGEN]
declaration=expr [, fmt ]
category=XML Functions
description=SYS_XMLGen takes an expression that evaluates to a particular row and column of\nthe database, and returns an instance of type XMLType containing an XML\ndocument. The expr can be a scalar value, a user-defined type, or an XMLType\ninstance.\n\n- If expr is a scalar value, then the function returns an XML element containing\nthe scalar value.\n\n- If expr is a type, then the function maps the user-defined type attributes to\nXML elements.\n\n- If expr is an XMLType instance, then the function encloses the document in an\nXML element whose default tag name is ROW.\n\nBy default the elements of the XML document match the elements of expr. For\nexample, if expr resolves to a column name, then the enclosing XML element will\nbe the same column name. If you want to format the XML document differently,\nthen specify fmt, which is an instance of the XMLFormat object.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/SYS_XMLGEN.html
[TAN]
declaration=n
category=Numeric Functions
description=TAN returns the tangent of n (an angle expressed in radians).\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TAN.html
[TANH]
declaration=n
category=Numeric Functions
description=TANH returns the hyperbolic tangent of n.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If the argument is\nBINARY_FLOAT, then the function returns BINARY_DOUBLE. Otherwise the function\nreturns the same numeric data type as the argument.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TANH.html
[TIMESTAMP_TO_SCN]
declaration=timestamp
category=Conversion Functions
description=TIMESTAMP_TO_SCN takes as an argument a timestamp value and returns the\napproximate system change number (SCN) associated with that timestamp. The\nreturned value is of data type NUMBER. This function is useful any time you want\nto know the SCN associated with a particular timestamp.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TIMESTAMP_TO_SCN.html
[TO_BINARY_DOUBLE]
declaration=expr [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_BINARY_DOUBLE converts expr to a double-precision floating-point number.\n\n- expr can be any expression that evaluates to a character string of type CHAR,\nVARCHAR2, NCHAR, or NVARCHAR2, a numeric value of type NUMBER, BINARY_FLOAT, or\nBINARY_DOUBLE,BOOLEAN, or null. If expr is BINARY_DOUBLE, then the function\nreturns expr. If expr evaluates to null, then the function returns null.\nOtherwise, the function converts expr to a BINARY_DOUBLE value.\n\n- The optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value returned by this function if an error occurs while converting\nexpr to BINARY_DOUBLE. This clause has no effect if an error occurs while\nevaluating expr. The return_value can be an expression or a bind variable, and\nmust evaluate to a character string of type CHAR, VARCHAR2, NCHAR, or NVARCHAR2,\na numeric value of type NUMBER, BINARY_FLOAT, or BINARY_DOUBLE, or null. The\nfunction converts return_value to BINARY_DOUBLE in the same way it converts expr\nto BINARY_DOUBLE. If return_value cannot be converted to BINARY_DOUBLE, then the\nfunction returns an error.\n\n- The optional 'fmt' and 'nlsparam' arguments serve the same purpose as for the\nTO_NUMBER function. If you specify these arguments, then expr and return_value,\nif specified, must each be a character string or null. If either is a character\nstring, then the function uses the fmt and nlsparam arguments to convert the\ncharacter string to a BINARY_DOUBLE value.\n\nIf expr or return_value evaluate to the following character strings, then the\nfunction converts them as follows:\n\n- The case-insensitive string 'INF' is converted to positive infinity.\n\n- The case-insensitive string '-INF' is converted to negative identity.\n\n- The case-insensitive string 'NaN' is converted to NaN (not a number).\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_BINARY_DOUBLE.html
[TO_BINARY_FLOAT]
declaration=expr [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_BINARY_FLOAT converts expr to a single-precision floating-point number.\n\n- expr can be any expression that evaluates to a character string of type CHAR,\nVARCHAR2, NCHAR, or NVARCHAR2, a numeric value of type NUMBER, BINARY_FLOAT, or\nBINARY_DOUBLE,BOOLEAN, or null. If expr is BINARY_FLOAT, then the function\nreturns expr. If expr evaluates to null, then the function returns null.\nOtherwise, the function converts expr to a BINARY_FLOAT value.\n\n- The optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value returned by this function if an error occurs while converting\nexpr to BINARY_FLOAT. This clause has no effect if an error occurs while\nevaluating expr. The return_value can be an expression or a bind variable, and\nmust evaluate to a character string of type CHAR, VARCHAR2, NCHAR, or NVARCHAR2,\na numeric value of type NUMBER, BINARY_FLOAT, or BINARY_DOUBLE, or null. The\nfunction converts return_value to BINARY_FLOAT in the same way it converts expr\nto BINARY_FLOAT. If return_value cannot be converted to BINARY_FLOAT, then the\nfunction returns an error.\n\n- The optional 'fmt' and 'nlsparam' arguments serve the same purpose as for the\nTO_NUMBER function. If you specify these arguments, then expr and return_value,\nif specified, must each be a character string or null. If either is a character\nstring, then the function uses the fmt and nlsparam arguments to convert the\ncharacter string to a BINARY_FLOAT value.\n\nIf expr or return_value evaluate to the following character strings, then the\nfunction converts them as follows:\n\n- The case-insensitive string 'INF' is converted to positive infinity.\n\n- The case-insensitive string '-INF' is converted to negative identity.\n\n- The case-insensitive string 'NaN' is converted to NaN (not a number).\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_BINARY_FLOAT.html
[TO_BLOB1]
name=TO_BLOB
declaration=bfile [, mime_type]
category=Conversion Functions
description=TO_BLOB (bfile) converts a BFILE value to a BLOB value.\n\nFor mime_type, specify the MIME type to be set on the BLOB value returned by\nthis function. If you omit mime_type, then a MIME type will not be set on the\nBLOB value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_BLOB-bfile.html
[TO_BLOB2]
name=TO_BLOB
declaration=raw_value
category=Conversion Functions
description=TO_BLOB (raw) converts LONG RAW and RAW values to BLOB values.\n\nFrom within a PL/SQL package, you can use TO_BLOB (raw) to convert RAW and BLOB\nvalues to BLOB.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_BLOB-raw.html
[TO_CHAR1]
name=TO_CHAR
declaration=n [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_CHAR (number) converts n to a value of VARCHAR2 data type, using the optional\nnumber format fmt. The value n can be of type NUMBER, BINARY_FLOAT, or\nBINARY_DOUBLE. If you omit fmt, then n is converted to a VARCHAR2 value exactly\nlong enough to hold its significant digits.\n\nIf n is negative, then the sign is applied after the format is applied. Thus\nTO_CHAR(-1, '$9') returns -$1, rather than $-1.\n\nRefer to "Format Models" for information on number formats.\n\nThe 'nlsparam' argument specifies these characters that are returned by number\nformat elements:\n\n- Decimal character\n\n- Group separator\n\n- Local currency symbol\n\n- International currency symbol\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_CHAR-number.html
[TO_CHAR2]
name=TO_CHAR
declaration=nchar | clob | nclob
category=Conversion Functions
description=TO_CHAR (character) converts NCHAR, NVARCHAR2, CLOB, or NCLOB data to the\ndatabase character set. The value returned is always VARCHAR2.\n\nWhen you use this function to convert a character LOB into the database\ncharacter set, if the LOB value to be converted is larger than the target type,\nthen the database returns an error.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_CHAR-character.html
[TO_CHAR3]
name=TO_CHAR
declaration={ bfile | blob } [, csid]
category=Conversion Functions
description=TO_CHAR (bfile|blob) converts BFILE or BLOB data to the database character set.\nThe value returned is always VARCHAR2. If the value returned is too large to fit\ninto the VARCHAR2 data type, then the data is truncated.\n\nFor csid, specify the character set ID of the BFILE or BLOB data. If the\ncharacter set of the BFILE or BLOB data is the database character set, then you\ncan specify a value of 0 for csid, or omit csid altogether.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_CHAR-bfile-blob.html
[TO_CHAR4]
name=TO_CHAR
declaration={ datetime | interval } [, fmt [, 'nlsparam' ] ]
category=Datetime Functions
description=TO_CHAR (datetime) converts a datetime or interval value of DATE, TIMESTAMP,\nTIMESTAMP WITH TIME ZONE, TIMESTAMP WITH LOCAL TIME ZONE, INTERVAL DAY TO\nSECOND, or INTERVAL YEAR TO MONTH data type to a value of VARCHAR2 data type in\nthe format specified by the date format fmt. If you omit fmt, then date is\nconverted to a VARCHAR2 value as follows:\n\n- DATE values are converted to values in the default date format.\n\n- TIMESTAMP and TIMESTAMP WITH LOCAL TIME ZONE values are converted to values in\nthe default timestamp format.\n\n- TIMESTAMP WITH TIME ZONE values are converted to values in the default\ntimestamp with time zone format.\n\n- Interval values are converted to the numeric representation of the interval\nliteral.\n\nRefer to "Format Models" for information on datetime formats.\n\nThe 'nlsparam' argument specifies the language in which month and day names and\nabbreviations are returned. This argument can have this form:\n\nIf you omit 'nlsparam', then this function uses the default date language for\nyour session.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_CHAR-datetime.html
[TO_CLOB1]
name=TO_CLOB
declaration=lob_column | char
category=Conversion Functions
description=TO_CLOB (character) converts NCLOB values in a LOB column or other character\nstrings to CLOB values. char can be any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. Oracle Database executes this function by converting\nthe underlying LOB data from the national character set to the database\ncharacter set.\n\nFrom within a PL/SQL package, you can use the TO_CLOB (character) function to\nconvert RAW, CHAR, VARCHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or NCLOB values to\nCLOB or NCLOB values.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_CLOB-character.html
[TO_CLOB2]
name=TO_CLOB
declaration={ bfile | blob } [, csid] [, mime_type]
category=Conversion Functions
description=TO_CLOB (bfile|blob) converts BFILE or BLOB data to the database character set\nand returns the data as a CLOB value.\n\nFor csid, specify the character set ID of the BFILE or BLOB data. If the\ncharacter set of the BFILE or BLOB data is the database character set, then you\ncan specify a value of 0 for csid, or omit csid altogether.\n\nFor mime_type, specify the MIME type to be set on the CLOB value returned by\nthis function. If you omit mime_type, then a MIME type will not be set on the\nCLOB value.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_CLOB-bfile-blob.html
[TO_DATE]
declaration=char [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_DATE converts char to a value of DATE data type.\n\nFor char, you can specify any expression that evaluates to a character string of\nCHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type.\n\nThe optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value this function returns if an error occurs while converting char\nto DATE. This clause has no effect if an error occurs while evaluating char. The\nreturn_value can be an expression or a bind variable, and it must evaluate to a\ncharacter string of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type, or null. The\nfunction converts return_value to DATE using the same method it uses to convert\nchar to DATE. If return_value cannot be converted to DATE, then the function\nreturns an error.\n\nThe fmt is a datetime model format specifying the format of char. If you omit\nfmt, then char must be in the default date format. The default date format is\ndetermined implicitly by the NLS_TERRITORY initialization parameter or can be\nset explicitly by the NLS_DATE_FORMAT parameter. If fmt is J, for Julian, then\nchar must be an integer.\n\nThe 'nlsparam' argument specifies the language of the text string that is being\nconverted to a date. This argument can have this form:\n\nDo not use the TO_DATE function with a DATE value for the char argument. The\nfirst two digits of the returned DATE value can differ from the original char,\ndepending on fmt or the default date format.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_DATE.html
[TO_DSINTERVAL]
declaration=' { sql_format | ds_iso_format } ' [ DEFAULT return_value ON CONVERSION ERROR ]
category=Datetime Functions
description=TO_DSINTERVAL converts its argument to a value of INTERVAL DAY TO SECOND data\ntype.\n\nFor the argument, you can specify any expression that evaluates to a character\nstring of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type.\n\nTO_DSINTERVAL accepts argument in one of the two formats:\n\n- SQL interval format compatible with the SQL standard (ISO/IEC 9075)\n\n- ISO duration format compatible with the ISO 8601:2004 standard\n\nIn the SQL format, days is an integer between 0 and 999999999, hours is an\ninteger between 0 and 23, and minutes and seconds are integers between 0 and 59.\nfrac_secs is the fractional part of seconds between .0 and .999999999. One or\nmore blanks separate days from hours. Additional blanks are allowed between\nformat elements.\n\nIn the ISO format, days, hours, minutes and seconds are integers between 0 and\n999999999. frac_secs is the fractional part of seconds between .0 and\n.999999999. No blanks are allowed in the value. If you specify T, then you must\nspecify at least one of the hours, minutes, or seconds values.\n\nThe optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value this function returns if an error occurs while converting the\nargument to an INTERVAL DAY TO SECOND type. This clause has no effect if an\nerror occurs while evaluating the argument. The return_value can be an\nexpression or a bind variable, and it must evaluate to a character string of\nCHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type. It can be in either the SQL\nformat or ISO format, and need not be in the same format as the function\nargument. If return_value cannot be converted to an INTERVAL DAY TO SECOND type,\nthen the function returns an error.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_DSINTERVAL.html
[TO_LOB]
declaration=long_column
category=Conversion Functions
description=TO_LOB converts LONG or LONG RAW values in the column long_column to LOB values.\nYou can apply this function only to a LONG or LONG RAW column, and only in the\nselect list of a subquery in an INSERT statement.\n\nBefore using this function, you must create a LOB column to receive the\nconverted LONG values. To convert LONG values, create a CLOB column. To convert\nLONG RAW values, create a BLOB column.\n\nYou cannot use the TO_LOB function to convert a LONG column to a LOB column in\nthe subquery of a CREATE TABLE ... AS SELECT statement if you are creating an\nindex-organized table. Instead, create the index-organized table without the\nLONG column, and then use the TO_LOB function in an INSERT ... AS SELECT\nstatement.\n\nYou cannot use this function within a PL/SQL package. Instead use the TO_CLOB\n(character) or TO_BLOB (raw) functions.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_LOB.html
[TO_MULTI_BYTE]
declaration=char
category=Conversion Functions
description=TO_MULTI_BYTE returns char with all of its single-byte characters converted to\ntheir corresponding multibyte characters. char can be of data type CHAR,\nVARCHAR2, NCHAR, or NVARCHAR2. The value returned is in the same data type as\nchar.\n\nAny single-byte characters in char that have no multibyte equivalents appear in\nthe output string as single-byte characters. This function is useful only if\nyour database character set contains both single-byte and multibyte characters.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_MULTI_BYTE.html
[TO_NCHAR1]
name=TO_NCHAR
declaration=n [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_NCHAR (number) converts n to a string in the national character set. The\nvalue n can be of type NUMBER, BINARY_FLOAT, or BINARY_DOUBLE. The function\nreturns a value of the same type as the argument. The optional fmt and\n'nlsparam' corresponding to n can be of DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE, INTERVAL MONTH TO YEAR, or INTERVAL DAY TO\nSECOND data type.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_NCHAR-number.html
[TO_NCHAR2]
name=TO_NCHAR
declaration={ datetime | interval } [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_NCHAR (datetime) converts a datetime or interval value of DATE, TIMESTAMP,\nTIMESTAMP WITH TIME ZONE, TIMESTAMP WITH LOCAL TIME ZONE, INTERVAL MONTH TO\nYEAR, or INTERVAL DAY TO SECOND data type from the database character set to the\nnational character set.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_NCHAR-datetime.html
[TO_NCHAR3]
name=TO_NCHAR
declaration={char | clob | nclob}
category=Conversion Functions
description=TO_NCHAR (character) converts a character string, CHAR, VARCHAR2, CLOB, or NCLOB\nvalue to the national character set. The value returned is always NVARCHAR2.\nThis function is equivalent to the TRANSLATE ... USING function with a USING\nclause in the national character set.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_NCHAR-character.html
[TO_NCLOB]
declaration=lob_column | char
category=Conversion Functions
description=TO_NCLOB converts CLOB values in a LOB column or other character strings to\nNCLOB values. char can be any of the data types CHAR, VARCHAR2, NCHAR,\nNVARCHAR2, CLOB, or NCLOB. Oracle Database implements this function by\nconverting the character set of char from the database character set to the\nnational character set.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_NCLOB.html
[TO_NUMBER]
declaration=expr [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=TO_NUMBER converts expr to a value of NUMBER data type.\n\nexpr can be any expression that evaluates to a character string of type CHAR,\nVARCHAR2, NCHAR, or NVARCHAR2, a numeric value of type NUMBER, BINARY_FLOAT, or\nBINARY_DOUBLE, BOOLEAN, or null. If expr is NUMBER, then the function returns\nexpr. If expr evaluates to null, then the function returns null. Otherwise, the\nfunction converts expr to a NUMBER value.\n\n- If you specify an expr of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type, then\nyou can optionally specify the format model fmt.\n\n- If you specify an expr of BINARY_FLOAT or BINARY_DOUBLE data type, then you\ncannot specify a format model because a float can be interpreted only by its\ninternal representation.\n\nIf you specify an expr of type BOOLEAN, then TRUE will be converted to 1 and\nFALSE will be converted to 0. You cannot specify a format model with inputs of\ntype BOOLEAN.\n\nRefer to "Format Models" for information on number formats.\n\nThe 'nlsparam' argument in this function has the same purpose as it does in the\nTO_CHAR function for number conversions. Refer to TO_CHAR (number) for more\ninformation.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_NUMBER.html
[TO_SINGLE_BYTE]
declaration=char
category=Conversion Functions
description=TO_SINGLE_BYTE returns char with all of its multibyte characters converted to\ntheir corresponding single-byte characters. char can be of data type CHAR,\nVARCHAR2, NCHAR, or NVARCHAR2. The value returned is in the same data type as\nchar.\n\nAny multibyte characters in char that have no single-byte equivalents appear in\nthe output as multibyte characters. This function is useful only if your\ndatabase character set contains both single-byte and multibyte characters.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_SINGLE_BYTE.html
[TO_TIMESTAMP]
declaration=char [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Datetime Functions
description=TO_TIMESTAMP converts char to a value of TIMESTAMP data type.\n\nFor char, you can specify any expression that evaluates to a character string of\nCHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type.\n\nThe optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value this function returns if an error occurs while converting char\nto TIMESTAMP. This clause has no effect if an error occurs while evaluating\nchar. The return_value can be an expression or a bind variable, and it must\nevaluate to a character string of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type,\nor null. The function converts return_value to TIMESTAMP using the same method\nit uses to convert char to TIMESTAMP. If return_value cannot be converted to\nTIMESTAMP, then the function returns an error.\n\nThe optional fmt specifies the format of char. If you omit fmt, then char must\nbe in the default format of the TIMESTAMP data type, which is determined by the\nNLS_TIMESTAMP_FORMAT initialization parameter. The optional 'nlsparam' argument\nhas the same purpose in this function as in the TO_CHAR function for date\nconversion.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_TIMESTAMP.html
[TO_TIMESTAMP_TZ]
declaration=char [ DEFAULT return_value ON CONVERSION ERROR ] [, fmt [, 'nlsparam' ] ]
category=Datetime Functions
description=TO_TIMESTAMP_TZ converts char to a value of TIMESTAMP WITH TIME ZONE data type.\n\nFor char, you can specify any expression that evaluates to a character string of\nCHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type.\n\nThe optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value this function returns if an error occurs while converting char\nto TIMESTAMP WITH TIME ZONE. This clause has no effect if an error occurs while\nevaluating char. The return_value can be an expression or a bind variable, and\nit must evaluate to a character string of CHAR, VARCHAR2, NCHAR, or NVARCHAR2\ndata type, or null. The function converts return_value to TIMESTAMP WITH TIME\nZONE using the same method it uses to convert char to TIMESTAMP WITH TIME ZONE.\nIf return_value cannot be converted to TIMESTAMP WITH TIME ZONE, then the\nfunction returns an error.\n\nThe optional fmt specifies the format of char. If you omit fmt, then char must\nbe in the default format of the TIMESTAMP WITH TIME ZONE data type. The optional\n'nlsparam' has the same purpose in this function as in the TO_CHAR function for\ndate conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_TIMESTAMP_TZ.html
[TO_VECTOR]
declaration=expr [ , number_of_dimensions [ , format [ , storage_format ] ] ]
category=Vector Functions
since=23
description=TO_VECTOR is a constructor that takes a string of type VARCHAR2, CLOB, BLOB, or\nJSON as input, converts it to a vector, and returns a vector as output.\nTO_VECTOR also takes another vector as input, adjusts its format, and returns\nthe adjusted vector as output. TO_VECTOR is synonymous with VECTOR.\n\n- expr must evaluate to one of:\n\n- A string (of character types or CLOB) that represents a vector.\n\n- A VECTOR.\n\n- A BLOB. The BLOB must represent the vector's binary bytes.\n\n- A JSON array. All elements in the array must be numeric.\n\nIf expr is NULL, the result is NULL.\n\nThe string representation of the vector must be in the form of an array of\nnon-null numbers enclosed with a bracket and separated by commas, such as [1,\n3.4, -05.60, 3e+4]. TO_VECTOR converts a valid string representation of a vector\nto a vector in the format specified. If no format is specified the default\nformat is used.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/to_vector.html
[TO_YMINTERVAL]
declaration=' { [+|-] years - months | ym_iso_format } ' [ DEFAULT return_value ON CONVERSION ERROR ]
category=Datetime Functions
description=TO_YMINTERVAL converts its argument to a value of INTERVAL MONTH TO YEAR data\ntype.\n\nFor the argument, you can specify any expression that evaluates to a character\nstring of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type.\n\nTO_YMINTERVAL accepts argument in one of the two formats:\n\n- SQL interval format compatible with the SQL standard (ISO/IEC 9075)\n\n- ISO duration format compatible with the ISO 8601:2004 standard\n\nIn the SQL format, years is an integer between 0 and 999999999, and months is an\ninteger between 0 and 11. Additional blanks are allowed between format elements.\n\nIn the ISO format, years and months are integers between 0 and 999999999. Days,\nhours, minutes, seconds, and frac_secs are non-negative integers, and are\nignored, if specified. No blanks are allowed in the value. If you specify T,\nthen you must specify at least one of the hours, minutes, or seconds values.\n\nThe optional DEFAULT return_value ON CONVERSION ERROR clause allows you to\nspecify the value this function returns if an error occurs while converting the\nargument to an INTERVAL MONTH TO YEAR type. This clause has no effect if an\nerror occurs while evaluating the argument. The return_value can be an\nexpression or a bind variable, and it must evaluate to a character string of\nCHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type. It can be in either the SQL\nformat or ISO format, and need not be in the same format as the function\nargument. If return_value cannot be converted to an INTERVAL MONTH TO YEAR type,\nthen the function returns an error.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TO_YMINTERVAL.html
[TRANSLATE1]
name=TRANSLATE
declaration=char USING { CHAR_CS | NCHAR_CS }
category=Character Functions Returning Character Values
description=TRANSLATE ... USING converts char into the character set specified for\nconversions between the database character set and the national character set.\n\nThe char argument is the expression to be converted.\n\n- Specifying the USING CHAR_CS argument converts char into the database\ncharacter set. The output data type is VARCHAR2.\n\n- Specifying the USING NCHAR_CS argument converts char into the national\ncharacter set. The output data type is NVARCHAR2.\n\nThis function is similar to the Oracle CONVERT function, but must be used\ninstead of CONVERT if either the input or the output data type is being used as\nNCHAR or NVARCHAR2. If the input contains UCS2 code points or backslash\ncharacters (), then use the UNISTR function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TRANSLATE-USING.html
[TRANSLATE2]
name=TRANSLATE
declaration=expr, from_string, to_string
category=Character Functions Returning Character Values
description=TRANSLATE returns expr with all occurrences of each character in from_string\nreplaced by its corresponding character in to_string. Characters in expr that\nare not in from_string are not replaced. The argument from_string can contain\nmore characters than to_string. In this case, the extra characters at the end of\nfrom_string have no corresponding characters in to_string. If these extra\ncharacters appear in expr, then they are removed from the return value.\n\nIf a character appears multiple times in from_string, then the to_string mapping\ncorresponding to the first occurrence is used.\n\nYou cannot use an empty string for to_string to remove all characters in\nfrom_string from the return value. Oracle Database interprets the empty string\nas null, and if this function has a null argument, then it returns null. To\nremove all characters in from_string, concatenate another character to the\nbeginning of from_string and specify this character as the to_string. For\nexample, TRANSLATE(expr, 'x0123456789', 'x') removes all digits from expr.\n\nTRANSLATE provides functionality related to that provided by the REPLACE\nfunction. REPLACE lets you substitute a single string for another single string,\nas well as remove character strings. TRANSLATE lets you make several\nsingle-character, one-to-one substitutions in one operation.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TRANSLATE.html
[TREAT]
declaration=expr AS [ REF ] [ schema. ]type | JSON
category=Conversion Functions
description=You can use the TREAT function to change the declared type of an expression.\n\nUse the keywords AS JSON when you want the expression to return JSON data. This\nis useful when you want to force some text to be interpreted as JSON data. For\nexample, you can use it to interpret a VARCHAR2 value of {} as an empty JSON\nobject instead of a string.\n\nYou must have the EXECUTE object privilege on type to use this function.\n\n- In expr AS JSON ,expr is a SQL data type containing JSON, for example CLOB.\n\n- In expr AS type ,expr and type must be a user-defined object types, excluding\ntop-level collections.\n\n- type must be some supertype or subtype of the declared type of expr. If the\nmost specific type of expr is type (or some subtype of type), then TREAT returns\nexpr. If the most specific type of expr is not type (or some subtype of type),\nthen TREAT returns NULL.\n\n- You can specify REF only if the declared type of expr is a REF type.\n\n- If the declared type of expr is a REF to a source type of expr, then type must\nbe some subtype or supertype of the source type of expr. If the most specific\ntype of DEREF(expr) is type (or a subtype of type), then TREAT returns expr. If\nthe most specific type of DEREF(expr) is not type (or a subtype of type), then\nTREAT returns NULL.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TREAT.html
[TRIM]
declaration=[ { { LEADING | TRAILING | BOTH } [ trim_character ] | trim_character } FROM ] trim_source
category=Character Functions Returning Character Values
description=TRIM enables you to trim leading or trailing characters (or both) from a\ncharacter string. If trim_character or trim_source is a character literal, then\nyou must enclose it in single quotation marks.\n\n- If you specify LEADING, then Oracle Database removes any leading characters\nequal to trim_character.\n\n- If you specify TRAILING, then Oracle removes any trailing characters equal to\ntrim_character.\n\n- If you specify BOTH or none of the three, then Oracle removes leading and\ntrailing characters equal to trim_character.\n\n- If you do not specify trim_character, then the default value is a blank space.\n\n- If you specify only trim_source, then Oracle removes leading and trailing\nblank spaces.\n\n- The function returns a value with data type VARCHAR2. The maximum length of\nthe value is the length of trim_source.\n\n- If either trim_source or trim_character is null, then the TRIM function\nreturns null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TRIM.html
[TRUNC1]
name=TRUNC
declaration=datetime [, fmt ]
category=Datetime Functions
description=The TRUNC (datetime) function returns date with the time portion of the day\ntruncated to the unit specified by the format model fmt.\n\nThis function is not sensitive to the NLS_CALENDAR session parameter. It\noperates according to the rules of the Gregorian calendar. The value returned is\nalways of data type DATE, even if you specify a different datetime data type for\ndate. If you do not specify the second argument fmt, then the default format\nmodel 'DD' is used and the value returned is date truncated to the day with a\ntime of midnight.\n\nThe TRUNC and FLOOR functions are synonymous for dates and timestamps.\n\nRefer to "CEIL, FLOOR, ROUND, and TRUNC Date Functions" for the permitted format\nmodels to use in fmt.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TRUNC-date.html
[TRUNC2]
name=TRUNC
declaration=n1 [, n2 ]
category=Numeric Functions
description=The TRUNC (number) function returns n1 truncated to n2 decimal places. If n2 is\nomitted, then n1 is truncated to 0 places. n2 can be negative to truncate (make\nzero) n2 digits left of the decimal point.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. If you omit n2,\nthen the function returns the same data type as the numeric data type of the\nargument. If you include n2, then the function returns NUMBER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TRUNC-number.html
[TUMBLE]
declaration=([ schema . ] (table | view) | query_name), COLUMNS (datetime_column), size [, offset ]
category=Streaming Windowing Table Functions
since=23
description=The TUMBLE table function assigns rows to consecutive, non-overlapping time\nwindows of a fixed size. Each row is assigned to the window that contains the\nvalue in the specified datetime column.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TUMBLE.html
[TZ_OFFSET]
declaration={ 'time_zone_name' | '{ + | - } hh : mi' | SESSIONTIMEZONE | DBTIMEZONE }
category=Datetime Functions
description=TZ_OFFSET returns the time zone offset corresponding to the argument based on\nthe date the statement is executed. You can enter a valid time zone region name,\na time zone offset from UTC (which simply returns itself), or the keyword\nSESSIONTIMEZONE or DBTIMEZONE. For a listing of valid values for time_zone_name,\nquery the TZNAME column of the V$TIMEZONE_NAMES dynamic performance view.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/TZ_OFFSET.html
[UNISTR]
declaration=string
category=Conversion Functions
description=UNISTR takes as its argument a text literal or an expression that resolves to\ncharacter data and returns it in the national character set. The national\ncharacter set of the database can be either AL16UTF16 or UTF8. UNISTR provides\nsupport for Unicode string literals by letting you specify the Unicode encoding\nvalue of characters in the string. This is useful, for example, for inserting\ndata into NCHAR columns.\n\nThe Unicode encoding value has the form '\xxxx' where 'xxxx' is the hexadecimal\nvalue of a character in UCS-2 encoding format. Supplementary characters are\nencoded as two code units, the first from the high-surrogates range (U+D800 to\nU+DBFF), and the second from the low-surrogates range (U+DC00 to U+DFFF). To\ninclude the backslash in the string itself, precede it with another backslash\n().\n\nFor portability and data preservation, Oracle recommends that in the UNISTR\nstring argument you specify only ASCII characters and the Unicode encoding\nvalues.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/UNISTR.html
[UPPER]
declaration=char
category=Character Functions Returning Character Values
description=UPPER returns char, with all letters uppercase. char can be any of the data\ntypes CHAR, VARCHAR2, NCHAR, NVARCHAR2, CLOB, or NCLOB. The return value is the\nsame data type as char. The database sets the case of the characters based on\nthe binary mapping defined for the underlying character set. For\nlinguistic-sensitive uppercase, refer to NLS_UPPER.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/UPPER.html
[USERENV]
declaration='parameter'
category=Environment and Identifier Functions
description=USERENV returns information about the current session. This information can be\nuseful for writing an application-specific audit trail table or for determining\nthe language-specific characters currently used by your session. You cannot use\nUSERENV in the condition of a CHECK constraint. Table 7-19 describes the values\nfor the parameter argument.\n\nAll calls to USERENV return VARCHAR2 data except for calls with the SESSIONID,\nSID, and ENTRYID parameters, which return NUMBER.\n\nCLIENT_INFO returns up to 64 bytes of user session information that can be\nstored by an application using the DBMS_APPLICATION_INFO package.\n\nCaution: Some commercial applications may be using this context value. Refer to\nthe applicable documentation for those applications to determine what\nrestrictions they may impose on use of this context area.\n\nSee Also: Oracle Database Security Guide for more information on application\ncontext, CREATE CONTEXT, and SYS_CONTEXT\n\nLANGUAGE returns the language and territory used by the current session along\nwith the database character set in this form:\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/USERENV.html
[UUID]
declaration=[ version_specifier [, namespace, name ] ]
category=UUID Functions
since=23
description=UUID returns a Version 4, Version 5, or Version 7 UUID as a RAW(16) value. By\ndefault, it returns a Version 4, variant 1 UUID. You can call UUID() without an\nargument or specify the version number explicitly.\n\nUUID(0) and UUID(4) are equivalent to UUID().\n\nYou can optionally specify a version_specifier of NUMBER type. Oracle AI\nDatabase truncates a noninteger version_specifier to an integer.\n\nTo generate a Version 5 UUID, specify UUID(5, namespace, name). The namespace\ncan be any RFC 9562-compliant UUID, including a version that UUID does not\ngenerate. You can pass it as a RAW value or a UUID string. For a predefined\nnamespace, specify 'url', 'dns', 'oid', or 'x500' (case-insensitive) instead of\nits UUID value. The name must be a nonempty string.\n\nThe following statement generates a Version 5 UUID using the predefined DNS\nnamespace:\n\nUUID(7) generates a Version 7 UUID.\n\nFor example:\n\nOracle AI Database raises an error for an unsupported version, invalid Version 5\ninput, or UUID generation failure.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/uuid.html
[UUID_TO_RAW]
declaration=uuid_string
category=UUID Functions
since=23
description=UUID_TO_RAW converts the input argument uuid_string into internal format of\nRAW(16) if it passes the check of IS_UUID(uuid_string). If the validation fails,\nit returns an error.\n\nuuid_string must be in the ASCII character set. The string may optionally\nenclosed in '{' and '}'. It may also contain hyphens. If hyphens are present all\nfour of the must be present and they must in character positions 9, 14, 19, 24\nafter discarding any braces.\n\nIf the input is NULL, it returns NULL.\n\nExample 1\n\nThe output is:\n\nNote that RAW(16) is converted into printable form.\n\nExample 2\n\nThe output is:\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/uuid_to_raw.html
[VALIDATE_CONVERSION]
declaration=expr AS type_name [, fmt [, 'nlsparam' ] ]
category=Conversion Functions
description=VALIDATE_CONVERSION determines whether expr can be converted to the specified\ndata type. If expr can be successfully converted, then this function returns 1;\notherwise, this function returns 0. If expr evaluates to null, then this\nfunction returns 1. If an error occurs while evaluating expr, then this function\nreturns the error.\n\nFor expr, specify a SQL expression. The acceptable data types for expr, and the\npurpose of the optional fmt and nlsparam arguments, depend on the data type you\nspecify for type_name.\n\nFor type_name, specify the data type to which you want to convert expr. You can\nspecify the following data types:\n\n- BINARY_DOUBLE\n\nIf you specify BINARY_DOUBLE, then expr can be any expression that evaluates to\na character string of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type, or a\nnumeric value of type NUMBER, BINARY_FLOAT, or BINARY_DOUBLE. The optional fmt\nand nlsparam arguments serve the same purpose as for the TO_BINARY_DOUBLE\nfunction. Refer to TO_BINARY_DOUBLE for more information.\n\n- BINARY_FLOAT\n\nIf you specify BINARY_FLOAT, then expr can be any expression that evaluates to a\ncharacter string of CHAR, VARCHAR2, NCHAR, or NVARCHAR2 data type, or a numeric\nvalue of type NUMBER, BINARY_FLOAT, or BINARY_DOUBLE. The optional fmt and\nnlsparam arguments serve the same purpose as for the TO_BINARY_FLOAT function.\nRefer to TO_BINARY_FLOAT for more information.\n\n- DATE\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/VALIDATE_CONVERSION.html
[VALUE]
declaration=correlation_variable
category=Object Reference Functions
description=VALUE takes as its argument a correlation variable (table alias) associated with\na row of an object table and returns object instances stored in the object\ntable. The type of the object instances is the same type as the object table.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/VALUE.html
[VARIANCE]
declaration=[ DISTINCT | ALL ] expr
category=Aggregate Functions
description=VARIANCE returns the variance of expr. You can use it as an aggregate or\nanalytic function.\n\nOracle Database calculates the variance of expr as follows:\n\n- 0 if the number of rows in expr = 1\n\n- VAR_SAMP if the number of rows in expr > 1\n\nIf you specify DISTINCT, then you can specify only the query_partition_clause of\nthe analytic_clause. The order_by_clause and windowing_clause are not allowed.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/VARIANCE.html
[VAR_POP]
declaration=expr
category=Aggregate Functions
description=VAR_POP returns the population variance of a set of numbers after discarding the\nnulls in this set. You can use it as both an aggregate and analytic function.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nIf the function is applied to an empty set, then it returns null. The function\nmakes the following calculation:\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/VAR_POP.html
[VAR_SAMP]
declaration=expr
category=Aggregate Functions
description=VAR_SAMP returns the sample variance of a set of numbers after discarding the\nnulls in this set. You can use it as both an aggregate and analytic function.\n\nThis function takes as an argument any numeric data type or any nonnumeric data\ntype that can be implicitly converted to a numeric data type. The function\nreturns the same data type as the numeric data type of the argument.\n\nIf the function is applied to an empty set, then it returns null. The function\nmakes the following calculation:\n\nThis function is similar to VARIANCE, except that given an input set of one\nelement, VARIANCE returns 0 and VAR_SAMP returns null.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/VAR_SAMP.html
[VECTOR]
declaration=expr [ , number_of_dimensions [ , format ] ]
category=Vector Functions
since=23
description=VECTOR is synonymous with TO_VECTOR.\n\nSee TO_VECTOR for semantics and examples.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector.html
[VECTOR_DIMENSION_COUNT]
declaration=expr
category=Vector Functions
since=23
description=VECTOR_DIMENSION_COUNT returns the number of dimensions of a vector as a NUMBER.\n\nVECTOR_DIMENSION_COUNT is synonymous with VECTOR_DIMS.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_dimension_count.html
[VECTOR_DIMENSION_FORMAT]
declaration=expr
category=Vector Functions
since=23
description=VECTOR_DIMENSION_FORMAT returns the storage format of the vector. It returns a\nVARCHAR2, which can be one of the following values: INT8, FLOAT32, FLOAT64, or\nBINARY.\n\nexpr must evaluate to a vector.\n\nIf expr is NULL, NULL is returned.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_dimension_format.html
[VECTOR_DIMS]
declaration=expr
category=Vector Functions
since=23
description=VECTOR_DIMS returns the number of dimensions of a vector as a NUMBER.\nVECTOR_DIMS is synonymous with VECTOR_DIMENSION_COUNT.\n\nRefer to VECTOR_DIMENSION_COUNT for full semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_dims.html
[VECTOR_DISTANCE]
declaration=expr1 , expr2 [ , metric ]
category=Vector Functions
since=23
description=VECTOR_DISTANCE is the main function that you can use to calculate the distance\nbetween two vectors.\n\nVECTOR_DISTANCE takes two vectors as parameters. You can optionally specify a\ndistance metric to calculate the distance. If you do not specify a distance\nmetric, then the default distance metric is cosine. If the input vectors are\nBINARY vectors, the default metric is hamming.\n\nYou can optionally use the following shorthand vector distance functions:\n\n- L1_DISTANCE\n\n- L2_DISTANCE\n\n- COSINE_DISTANCE\n\n- INNER_PRODUCT\n\nHAMMING_DISTANCE\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_distance.html
[VECTOR_EMBEDDING]
declaration=[ schema.] model_name USING mining_attribute_clause
category=Oracle Machine Learning for SQL Functions
since=23
description=Use VECTOR_EMBEDDING to generate a single vector embedding for different data\ntypes using embedding or feature extraction machine learning models.\n\nThe function accepts the following types as input:\n\nVARCHAR2 for text embedding models. Oracle automatically converts any other type\nto VARCHAR2 except for NCLOB, which is automatically converted to NVARCHAR2.\nOracle does not expect values whose textual representation exceeds the maximum\nsize of a VARCHAR2, since embedding models support only text that translates to\na couple of thousand tokens. An attribute with a type that has no conversion to\nVARCHAR2 results in a SQL compilation error.\n\nFor feature extraction models Oracle Machine Learning for SQL supports standard\nOracle data types except DATE, TIMESTAMP, RAW, and LONG. Oracle Machine Learning\nsupports date type (datetime, date, timestamp) for case_id, CLOB/BLOB/FILE that\nare interpreted as text columns, and the following collection types as well:\n\n- DM_NESTED_CATEGORICALS\n\n- DM_NESTED_NUMERICALS\n\n- DM_NESTED_BINARY_DOUBLES\n\n- DM_NESTED_BINARY_FLOATS\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_embedding.html
[VECTOR_NORM]
declaration=expr
category=Vector Functions
since=23
description=VECTOR_NORM returns the Euclidean norm of a vector (SQRT(SUM((xi-yi)2))) as a\nBINARY_DOUBLE. This value is also called magnitude or size and represents the\nEuclidean distance between the vector and the origin.\n\nexpr must evaluate to a vector.\n\nIf expr is NULL, NULL is returned.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_norm.html
[VECTOR_SERIALIZE]
declaration=expr [ RETURNING (CLOB | VARCHAR2 [ (size [BYTE | CHAR]) ]) FORMAT (SPARSE | DENSE) ]
category=Vector Functions
since=23
description=VECTOR_SERIALIZE is synonymous with FROM_VECTOR.\n\nSee FROM_VECTOR for semantics and examples.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/vector_serialize.html
[VSIZE]
declaration=expr
category=Encoding and Decoding Functions
description=VSIZE returns the number of bytes in the internal representation of expr. If\nexpr is null, then this function returns null.\n\nThis function does not support CLOB data directly. However, CLOBs can be passed\nin as arguments through implicit data conversion.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/VSIZE.html
[WIDTH_BUCKET]
declaration=expr, min_value, max_value, num_buckets
category=Numeric Functions
description=WIDTH_BUCKET lets you construct equiwidth histograms, in which the histogram\nrange is divided into intervals that have identical size. (Compare this function\nwith NTILE, which creates equiheight histograms.) Ideally each bucket is a\nclosed-open interval of the real number line. For example, a bucket can be\nassigned to scores between 10.00 and 19.999 ... to indicate that 10 is included\nin the interval and 20 is excluded. This is sometimes denoted [10, 20).\n\nFor a given expression, WIDTH_BUCKET returns the bucket number into which the\nvalue of this expression would fall after being evaluated.\n\n- expr is the expression for which the histogram is being created. This\nexpression must evaluate to a numeric or datetime value or to a value that can\nbe implicitly converted to a numeric or datetime value. If expr evaluates to\nnull, then the expression returns null.\n\n- min_value and max_value are expressions that resolve to the end points of the\nacceptable range for expr. Both of these expressions must also evaluate to\nnumeric or datetime values, and neither can evaluate to null.\n\n- num_buckets is an expression that resolves to a constant indicating the number\nof buckets. This expression must evaluate to a positive integer.\n\nWhen needed, Oracle Database creates an underflow bucket numbered 0 and an\noverflow bucket numbered num_buckets+1. These buckets handle values less than\nmin_value and more than max_value and are helpful in checking the reasonableness\nof endpoints.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/WIDTH_BUCKET.html
[XMLAGG]
declaration=XMLType_instance [ order_by_clause ]
category=XML Functions
description=XMLAgg is an aggregate function. It takes a collection of XML fragments and\nreturns an aggregated XML document. Any arguments that return null are dropped\nfrom the result.\n\nXMLAgg is similar to SYS_XMLAgg except that XMLAgg returns a collection of nodes\nbut it does not accept formatting using the XMLFormat object. Also, XMLAgg does\nnot enclose the output in an element tag as does SYS_XMLAgg.\n\nWithin the order_by_clause, Oracle Database does not interpret number literals\nas column positions, as it does in other uses of this clause, but simply as\nnumber literals.\n\nFor the semantics of the FILTER clause, see FILTER Clause Semantics.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLAGG.html
[XMLCAST]
declaration=value_expression AS datatype
category=XML Functions
description=XMLCast casts value_expression to the scalar SQL data type specified by\ndatatype. The value_expression argument is a SQL expression that is evaluated.\n\ndatatype\n\nThe datatype argument can be of data type NUMBER, VARCHAR2, VARCHAR, CHAR, CLOB,\nBLOB, REF XMLTYPE, and any of the datetime data types.\n\nBLOB, or CLOB with options reference or value. The default is reference.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLCAST.html
[XMLCDATA]
declaration=value_expr
category=XML Functions
description=XMLCData generates a CDATA section by evaluating value_expr. The value_expr must\nresolve to a string. The value returned by the function takes the following\nform:\n\nIf the resulting value is not a valid XML CDATA section, then the function\nreturns an error.The following conditions apply to XMLCData:\n\n- The value_expr cannot contain the substring ]]>.\n\n- If value_expr evaluates to null, then the function returns null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLCDATA.html
[XMLCOLATTVAL]
declaration=value_expr [ AS { c_alias | EVALNAME value_expr } ] [, value_expr [ AS { c_alias | EVALNAME value_expr } ] ]...
category=XML Functions
description=XMLColAttVal creates an XML fragment and then expands the resulting XML so that\neach XML fragment has the name column with the attribute name.\n\nYou can use the AS clause to change the value of the name attribute to something\nother than the column name. You can do this by specifying c_alias, which is a\nstring literal, or by specifying EVALNAME value_expr. In the latter case, the\nvalue expression is evaluated and the result, which must be a string literal, is\nused as the alias. The alias can be up to 4000 characters if the initialization\nparameter MAX_STRING_SIZE = STANDARD, and 32767 characters if MAX_STRING_SIZE =\nEXTENDED. See "Extended Data Types" for more information.\n\nYou must specify a value for value_expr. If value_expr is null, then no element\nis returned.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLCOLATTVAL.html
[XMLCOMMENT]
declaration=value_expr
category=XML Functions
description=XMLComment generates an XML comment using an evaluated result of value_expr. The\nvalue_expr must resolve to a string. It cannot contain two consecutive dashes\n(hyphens). The value returned by the function takes the following form:\n\nIf value_expr resolves to null, then the function returns null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLCOMMENT.html
[XMLCONCAT]
declaration=XMLType_instance [, XMLType_instance ]...
category=XML Functions
description=XMLConcat takes as input a series of XMLType instances, concatenates the series\nof elements for each row, and returns the concatenated series. XMLConcat is the\ninverse of XMLSequence.\n\nNull expressions are dropped from the result. If all the value expressions are\nnull, then the function returns null.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLCONCAT.html
[XMLDIFF]
declaration=XMLType_document, XMLType_document [ , integer, string ]
category=XML Functions
description=The XMLDiff function is the SQL interface for the XmlDiff C API. This function\ncompares two XML documents and captures the differences in XML conforming to an\nXdiff schema. The diff document is returned as an XMLType document.\n\n- For the first two arguments, specify the names of two XMLType documents.\n\n- For the integer, specify a number representing the hashLevel for a C function\nXmlDiff. If you do not want hashing, set this argument to 0 or omit it entirely.\nIf you do not want hashing, but you want to specify flags, then you must set\nthis argument to 0.\n\n- For string, specify the flags that control the behavior of the function. These\nflags are specified by one or more names separated by semicolon. The names are\nthe same as the names of constants for XmlDiff function.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLDIFF.html
[XMLELEMENT]
declaration=[ ENTITYESCAPING | NOENTITYESCAPING ] { ([ NAME ] identifier) | (EVALNAME value_expr) } [ , XML_attributes_clause ] [ , value_expr [ [ AS ] c_alias ]]...
category=XML Functions
description=XMLElement takes an element name for identifier or evaluates an element name for\nEVALNAME value_expr, an optional collection of attributes for the element, and\narguments that make up the content of the element. It returns an instance of\ntype XMLType. XMLElement is similar to SYS_XMLGen except that XMLElement can\ninclude attributes in the XML returned, but it does not accept formatting using\nthe XMLFormat object.\n\nThe XMLElement function is typically nested to produce an XML document with a\nnested structure, as in the example in the following section.\n\nFor an explanation of the ENTITYESCAPING and NONENTITYESCAPING keywords, refer\nto Oracle XML DB Developer's Guide.\n\nYou must specify a value for Oracle Database to use an the enclosing tag. You\ncan do this by specifying identifier, which is a string literal, or by\nspecifying EVALNAME value_expr. In the latter case, the value expression is\nevaluated and the result, which must be a string literal, is used as the\nidentifier. The identifier does not have to be a column name or column\nreference. It cannot be an expression or null. It can be up to 4000 characters\nif the initialization parameter MAX_STRING_SIZE = STANDARD, and 32767 characters\nif MAX_STRING_SIZE = EXTENDED.\n\nThe objects that make up the element content follow the XMLATTRIBUTES keyword.\nIn the XML_attributes_clause, if the value_expr is null, then no attribute is\ncreated for that value expression. The type of value_expr cannot be an object\ntype or collection. If you specify an alias for value_expr using the AS clause,\nthen the c_alias or the evaluated value expression (EVALNAME value_expr) can be\nup to 4000 characters if the initialization parameter MAX_STRING_SIZE =\nSTANDARD, and 32767 characters if MAX_STRING_SIZE = EXTENDED.\n\nFor the optional value_expr that follows the XML_attributes_clause in the\ndiagram:\n\n- If value_expr is a scalar expression, then you can omit the AS clause, and\nOracle uses the column name as the element name.\n\n- If value_expr is an object type or collection, then the AS clause is\nmandatory, and Oracle uses the specified c_alias as the enclosing tag.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLELEMENT.html
[XMLEXISTS]
declaration=XQuery_string [ XML_passing_clause ]
category=XML Functions
description=XMLExists checks whether a given XQuery expression returns a nonempty XQuery\nsequence. If so, the function returns TRUE; otherwise, it returns FALSE. The\nargument XQuery_string is a literal string, but it can contain XQuery variables\nthat you bind using the XML_passing_clause.\n\nThe expr in the XML_passing_clause is an expression returning an XMLType or an\ninstance of a SQL scalar data type that is used as the context for evaluating\nthe XQuery expression. You can specify only one expr in the PASSING clause\nwithout an identifier. The result of evaluating each expr is bound to the\ncorresponding identifier in the XQuery_string. If any expr that is not followed\nby an AS clause, then the result of evaluating that expression is used as the\ncontext item for evaluating the XQuery_string. If expr is a relational column,\nthen its declared collation is ignored by Oracle XML DB.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLEXISTS.html
[XMLFOREST]
declaration=value_expr [ AS { c_alias | EVALNAME value_expr } ] [, value_expr [ AS { c_alias | EVALNAME value_expr } ] ]...
category=XML Functions
description=XMLForest converts each of its argument parameters to XML, and then returns an\nXML fragment that is the concatenation of these converted arguments.\n\n- If value_expr is a scalar expression, then you can omit the AS clause, and\nOracle Database uses the column name as the element name.\n\n- If value_expr is an object type or collection, then the AS clause is\nmandatory, and Oracle uses the specified expression as the enclosing tag.\n\nYou can do this by specifying c_alias, which is a string literal, or by\nspecifying EVALNAME value_expr. In the latter case, the value expression is\nevaluated and the result, which must be a string literal, is used as the\nidentifier. The identifier does not have to be a column name or column\nreference. It cannot be an expression or null. It can be up to 4000 characters\nif the initialization parameter MAX_STRING_SIZE = STANDARD, and 32767 characters\nif MAX_STRING_SIZE = EXTENDED. See "Extended Data Types" for more information.\n\n- If value_expr is null, then no element is created for that value_expr.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLFOREST.html
[XMLISVALID]
declaration=XMLType_instance [, XMLSchema_URL [, element ]]
category=XML Functions
description=XMLISVALID checks whether the input XMLType_instance conforms to the relevant\nXML schema. It does not change the validation status recorded for\nXMLType_instance.\n\nIf the input XML document is determined to be valid, then XMLISVALID returns 1;\notherwise, it returns 0. If you provide XMLSchema_URL as an argument, then that\nis used to check conformance. Otherwise, the XML schema specified by the XML\ndocument is used to check conformance.\n\n- XMLType_instance is the XMLType instance to be validated.\n\n- XMLSchema_URL is the URL of the XML schema against which to check conformance.\n\n- element is the element of the specified schema against which to check\nconformance. Use this if you have an XML schema that defines more than one top\nlevel element, and you want to check conformance against a specific one of those\nelements.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLISVALID.html
[XMLPARSE]
declaration={ DOCUMENT | CONTENT } value_expr [ WELLFORMED ]
category=XML Functions
description=XMLParse parses and generates an XML instance from the evaluated result of\nvalue_expr. The value_expr must resolve to a string. If value_expr resolves to\nnull, then the function returns null.\n\n- If you specify DOCUMENT, then value_expr must resolve to a singly rooted XML\ndocument.\n\n- If you specify CONTENT, then value_expr must resolve to a valid XML value.\n\n- When you specify WELLFORMED, you are guaranteeing that value_expr resolves to\na well-formed XML document, so the database does not perform validity checks to\nensure that the input is well formed.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLPARSE.html
[XMLPATCH]
declaration=XMLType_document, XMLType_document
category=XML Functions
description=The XMLPatch function is the SQL interface for the XmlPatch C API. This function\npatches an XML document with the changes specified. A patched XMLType document\nis returned.\n\n- For the first argument, specify the name of the input XMLType document.\n\n- For the second argument, specify the XMLType document containing the changes\nto be applied to the first document. The changes should conform to the Xdiff XML\nschema. You can supply the XML output from the Oracle XML Developer's Kit Java\nmethod diff().\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLPATCH.html
[XMLPI]
declaration={ ([ NAME ] identifier) | (EVALNAME value_expr) } [ , value_expr ]
category=XML Functions
description=XMLPI generates an XML processing instruction using identifier and optionally\nthe evaluated result of value_expr. A processing instruction is commonly used to\nprovide to an application information that is associated with all or part of an\nXML document. The application uses the processing instruction to determine how\nbest to process the XML document.\n\nYou must specify a value for Oracle Database to use an the enclosing tag. You\ncan do this by specifying identifier, which is a string literal, or by\nspecifying EVALNAME value_expr. In the latter case, the value expression is\nevaluated and the result, which must be a string literal, is used as the\nidentifier. The identifier does not have to be a column name or column\nreference. It cannot be an expression or null. It can be up to 4000 characters\nif the initialization parameter MAX_STRING_SIZE = STANDARD, and 32767 characters\nif MAX_STRING_SIZE = EXTENDED. See "Extended Data Types" for more information.\n\nThe optional value_expr must resolve to a string. If you omit the optional\nvalue_expr, then a zero-length string is the default. The value returned by the\nfunction takes this form:\n\nXMLPI is subject to the following restrictions:\n\n- The identifier must be a valid target for a processing instruction.\n\n- You cannot specify xml in any case combination for identifier.\n\n- The identifier cannot contain the consecutive characters ?>.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLPI.html
[XMLQUERY]
declaration=XQuery_string [ XML_passing_clause ] RETURNING CONTENT [NULL ON EMPTY]
category=XML Functions
description=XMLQUERY lets you query XML data in SQL statements. It takes an XQuery\nexpression as a string literal, an optional context item, and other bind\nvariables and returns the result of evaluating the XQuery expression using these\ninput values.\n\n- XQuery_string is a complete XQuery expression, including prolog.\n\n- The expr in the XML_passing_clause is an expression returning an XMLType or an\ninstance of a SQL scalar data type that is used as the context for evaluating\nthe XQuery expression. You can specify only one expr in the PASSING clause\nwithout an identifier. The result of evaluating each expr is bound to the\ncorresponding identifier in the XQuery_string. If any expr that is not followed\nby an AS clause, then the result of evaluating that expression is used as the\ncontext item for evaluating the XQuery_string. If expr is a relational column,\nthen its declared collation is ignored by Oracle XML DB.\n\n- RETURNING CONTENT indicates that the result from the XQuery evaluation is\neither an XML 1.0 document or a document fragment conforming to the XML 1.0\nsemantics.\n\n- If the result set is empty, then the function returns the SQL NULL value. The\nNULL ON EMPTY keywords are implemented by default and are shown for semantic\nclarity.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLQUERY.html
[XMLSEQUENCE]
declaration=XMLType_instance | sys_refcursor_instance [, fmt ]
category=XML Functions
description=XMLSequence has two forms:\n\n- The first form takes as input an XMLType instance and returns a varray of the\ntop-level nodes in the XMLType. This form is effectively superseded by the\nSQL/XML standard function XMLTable, which provides for more readable SQL code.\nPrior to Oracle Database 10g Release 2, XMLSequence was used with SQL function\nTABLE to do some of what can now be done better with the XMLTable function.\n\n- The second form takes as input a REFCURSOR instance, with an optional instance\nof the XMLFormat object, and returns as an XMLSequence type an XML document for\neach row of the cursor.\n\nBecause XMLSequence returns a collection of XMLType, you can use this function\nin a TABLE clause to unnest the collection values into multiple rows, which can\nin turn be further processed in the SQL query.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLSEQUENCE.html
[XMLSERIALIZE]
declaration={ DOCUMENT | CONTENT } value_expr [ AS datatype ] [ ENCODING xml_encoding_spec ] [ VERSION string_literal ] [ NO INDENT | { INDENT [SIZE = number] } ] [ { HIDE | SHOW } DEFAULTS ]
category=XML Functions
description=XMLSerialize creates a string or LOB containing the contents of value_expr.\n\nAny lob returned by XMLSERIALIZE will be read-only.\n\nIf you specify DOCUMENT, then the value_expr must be a valid XML document.\n\nIf you specify CONTENT, then the value_expr need not be a singly rooted XML\ndocument. However it must be valid XML content.\n\ndatatype\n\nThe datatype specified can be:\n\n- VARCHAR2 or VARCHAR, but not NVARCHAR2\n\n- BLOB, or CLOB with options reference or value. The default is reference.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLSERIALIZE.html
[XMLTABLE]
declaration=[ XMLnamespaces_clause , ] XQuery_string XMLTABLE_options
category=XML Functions
description=XMLTable maps the result of an XQuery evaluation into relational rows and\ncolumns. You can query the result returned by the function as a virtual\nrelational table using SQL.\n\n- The XMLNAMESPACES clause contains a set of XML namespace declarations. These\ndeclarations are referenced by the XQuery expression (the evaluated\nXQuery_string), which computes the row, and by the XPath expression in the PATH\nclause of XML_table_column, which computes the columns for the entire XMLTable\nfunction. If you want to use qualified names in the PATH expressions of the\nCOLUMNS clause, then you need to specify the XMLNAMESPACES clause.\n\n- XQuery_string is a literal string. It is a complete XQuery expression and can\ninclude prolog declarations. The value of XQuery_string serves as input to the\nXMLTable function; it is this XQuery result that is decomposed and stored as\nrelational data.\n\n- The expr in the XML_passing_clause is an expression returning an XMLType or an\ninstance of a SQL scalar data type that is used as the context for evaluating\nthe XQuery expression. You can specify only one expr in the PASSING clause\nwithout an identifier. The result of evaluating each expr is bound to the\ncorresponding identifier in the XQuery_string. If any expr that is not followed\nby an AS clause, then the result of evaluating that expression is used as the\ncontext item for evaluating the XQuery_string. This clause supports only passing\nby value, not passing by reference. Therefore, the BY VALUE keywords are\noptional and are provided for semantic clarity.\n\n- The optional RETURNING SEQUENCE BY REF clause causes the result of the XQuery\nevaluation to be returned by reference. This allows you to refer to any part of\nthe source data in the XML_table_column clause.\n\nIf you omit this clause, then the result of the XQuery evaluation is returned by\nvalue. That is, a copy of the targeted nodes is returned instead of a reference\nto the actual nodes. In this case, you cannot refer to any data that is not in\nthe returned copy in the XML_table_column clause. In particular, you cannot\nrefer to data that precedes the targeted nodes in the source data.\n\n- The optional COLUMNS clause defines the columns of the virtual table to be\ncreated by XMLTable.\n\n- If you omit the COLUMNS clause, then XMLTable returns a row with a single\n...\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLTABLE.html
[XMLTRANSFORM]
declaration=XMLType_instance, { XMLType_instance | string }
category=XML Functions
description=XMLTransform takes as arguments an XMLType instance and an XSL style sheet,\nwhich is itself a form of XMLType instance. It applies the style sheet to the\ninstance and returns an XMLType.\n\nThis function is useful for organizing data according to a style sheet as you\nare retrieving it from the database.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/XMLTRANSFORM.html
