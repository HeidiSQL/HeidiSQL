[CALENDAR_MONTH_END_DATE]
declaration=dtexpr [ , nlsparam ]
category=Calendar Functions
since=23
description=- dtexpr is a datetime expression with one of the following types (or any value\nthat can be implicitly converted to DATE): DATE, TIMESTAMP, TIMESTAMP WITH TIME\nZONE, TIMESTAMP WITH LOCAL TIME ZONE .\n\n- nlsparam is a text expression representing an NLS parameter setting. The only\ncurrently supported parameter is NLS_DATE_LANGUAGE, and is specified in the same\nmanner as for TO_CHAR and TO_DATE.\n\nCALENDAR_START_END, FISCAL_START_END, CALENDAR_X_OF_Y, FISCAL_X_OF_Y,\nCALENDAR_ADD_X_PERIODS, and FISCAL_ADD_PERIODS functions accept a nlsparam.\n\nAll functions that take an nlsparam allow the specification of NLS_CALENDAR,\nwith the exception of the retail functions.\n\nThe NLS_CALENDAR, either inherited from the session or explicitly specified in\nthe nlsparam, indicates which calendar is used for navigation and output. Only\nthe GREGORIAN calendar is supported.\n\nThe CALENDAR_START_END, FISCAL_START_END, and RETAIL_START_END functions return\na DATE (with hour/minute/second components set to midnight) representing the\nGregorian date of the start or end of the associated period (year, quarter,\nmonth, week) in the associated calendar (calendar, fiscal, retail). Note that\nthere are no functions for DAY because they would all just return the given date\nfor both start and end.\n\nURL: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/calendar_start_end.html
